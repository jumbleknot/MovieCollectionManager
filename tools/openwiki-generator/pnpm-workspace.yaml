# tools/openwiki-generator — the OpenWiki generator's LOCKED dependency tree (item #704).
#
# This file makes the directory its OWN pnpm workspace root. That is deliberate: inside the root
# workspace pnpm would apply the root's settings (which set no cooldown, see the root
# pnpm-workspace.yaml) and the root lockfile, and nothing below would take effect. The root's
# `packages` globs (frontend/*, packages/*) do not reach here; wiki-maintain.guard.test.mjs fails if
# one ever does.
#
# Installed by .forgejo/workflows/wiki-maintain.yml with
#   pnpm --dir tools/openwiki-generator install --frozen-lockfile
# run from the repository root, so corepack picks the root manifest's pnpm (packageManager is declared
# once, in the root — check-toolchain-consistency.mjs). How to bump: docs/runbooks/wiki-maintenance.md §4.

# openwiki's LangGraph checkpointer loads better-sqlite3's native binding at run time. Its install
# script also ran under the old `npm install -g`, so allowing it changes no posture. Every other
# package's build script stays denied (pnpm 11 fails an undecided one).
allowBuilds:
  better-sqlite3: true

# Three days, in minutes — renovate.json's catch-all `minimumReleaseAge`. pnpm applies it at RESOLVE
# time (a lockfile regeneration cannot pick a transitive younger than this — the item #271 gap that
# Renovate's cooldown does not cover) and at INSTALL time (a frozen install fails
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION rather than install a locked entry inside the window). Run 4950
# died on a transitive two minutes old.
minimumReleaseAge: 4320

# Exclusions (`minimumReleaseAgeExclude:`) are SECURITY-FLOOR exceptions only, and never for
# impatience: this code runs with the generator's model credential. An entry is ONE exact version that
# an `overrides:` floor below requires, so it admits nothing else; wiki-maintain.guard.test.mjs fails a
# name-only or ranged entry, or one with no matching floor. None is needed today: the last one,
# '@azure/identity@4.14.1' (2026-11-01), was removed once it cleared the window on 2026-11-01 22:16 UTC.

# Security floors. The root workspace's `overrides:` do not reach here (this is its own root), so a
# floor the generator's tree needs is repeated in this file.
overrides:
  # ADDED 2026-10-25 (item #840): GHSA-27r3-jxmh-p828 (DoS via trailing bytes after a compressed body),
  # fixed in 2.4.0. express 5 (via @modelcontextprotocol/sdk) depends on body-parser ^2; floor within the
  # major, the same entry as the root pnpm-workspace.yaml. Resolvable here only from 2026-10-25 11:39 UTC,
  # when 2.4.0 clears this workspace's minimumReleaseAge.
  body-parser@>=2.0.0 <2.4.0: '>=2.4.0 <3'
  # ADDED 2026-11-01: GHSA-xcx6-jx8p-x3h5 in @azure/msal-node <7.1.0. openwiki 0.7.1 asks for
  # @azure/identity ^4.13.3, and 4.14.1 is the first release that requires msal-node ^7.1.0. Floored
  # within the major.
  '@azure/identity@<4.14.1': '>=4.14.1 <5'
