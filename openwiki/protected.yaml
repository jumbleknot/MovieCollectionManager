    # Re-fingerprinted 2026-08-08, in the same change as the text, per the gate's instruction.
    # Two CI-pinning gotchas from PR #141: a version bump that misses a second pin (nx.json's
    # wrapper version vs package.json) is a silent no-op, and an unpinned CI tool (npx --yes
    # renovate) lets an upstream major change config semantics without notice.
    #
    # Re-fingerprinted 2026-08-13 (feature 058, items #186/#184), again in the same change as the
    # text. One existing sentence became FALSE and three gotchas were added:
    #   * a "docs/config/lockfile-only PR ... skips the ~23-minute E2E suite" — lockfile PRs no
    #     longer skip it, so the word was removed rather than left to mislead;
    #   * the two paths filters disagreed about lockfiles (push acknowledged the risk, pull_request
    #     denied it), which is item #186;
    #   * a `mobile` filter entry absent from `app` can NEVER fire, and two were — so a Maestro
    #     runner change ran no mobile flow while reading as covered;
    #   * lockFileMaintenance's own default schedule beats the inherited top-level one, so enabling
    #     it without repeating the window leaves it on and unable to ever fire.
    #
    # Re-fingerprinted 2026-08-22 (item #218), again in the same change as the text. Two gotchas
    # added, both about a channel that is enabled, in-window and still proposes nothing:
    #   * lockFileMaintenance is sorted LAST by Renovate and the hourly PR limit gates BRANCH
    #     creation as well as PR creation, so the weekly budget was spent before it was reached —
    #     it did not defer a week, it deferred for ever;
    #   * a dry run creates nothing by design and `dryRun` DEFAULTS to true, so a dispatched run
    #     that produces no PR reads as a gate blocking the work. That misreading is what recorded
    #     the wrong conclusion in item #184.
    #
    # Re-fingerprinted 2026-08-22 (second time today), in the same change as the text. Two gotchas
