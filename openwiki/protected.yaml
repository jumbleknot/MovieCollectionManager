# Protection manifest — feature 044 (FR-029, FR-029b, FR-041).
#
# A SIDECAR, deliberately: the generator writes markdown, and the OKF gate reads markdown, so a
# .yaml file beside the bundle is invisible to both. Protection that lived inside the concept it
# guards could be stripped by the refresh it exists to constrain, and a stripped marker reads as
# "not protected" rather than as a failure.
#
# Enforced by scripts/check-openwiki-governance.mjs (G5-G7, G11, G12) on every change, offline and
# keyless. THE MANIFEST IS THE AUTHORITY: a listed passage that no longer appears in its concept
# fails as a REMOVAL, not as nothing-to-compare.
#
# To change a protected passage legitimately, update the text AND its fingerprint in the same
# change — that is the reviewable escape hatch, and without it the gate would permanently block
# correcting the very content it protects:
#
#   node scripts/check-openwiki-governance.mjs --fingerprint openwiki/<area>/<page>.md "<heading>"

version: 1

