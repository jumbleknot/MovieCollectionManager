  # ── excluded: never analyzed, never written ───────────────────────────────────
  - glob: "docs/proposals/**"
    policy: excluded
    rationale: "Pre-specification ideation, superseded the moment a specification exists. Documenting it would fill metadata-driven retrieval with dead ideas"

  - glob: "docs/test-data/**"
    policy: excluded
    rationale: "A binary unit-test fixture, not documentation — nothing to summarize. Declared explicitly (FR-026g) rather than left to the general binary-asset rule, and the file stays where it is: its path is baked into a unit test and into feature 014's spec, tasks and quickstart"

  - glob: "scripts/__tests__/fixtures/**"
    policy: excluded
    rationale: "Test fixtures. Several are deliberately malformed documents whose whole purpose is to fail a gate"

  - glob: ".github/**"
    policy: excluded
    rationale: "A push-mirror that runs no Actions (feature 023). Its prompt/skill/agent files are vendor-managed copies of the .agents equivalents"

  - glob: ".specify/**"
    policy: excluded
    rationale: "Spec Kit tool state and templates — owned by the Specify CLI"

  # ── analyzable, but not a coverage target ─────────────────────────────────────
  - glob: "specs/**"
    policy: analyzable-not-covered
    exceptions: ["specs/*/HANDOFF*.md"]
    rationale: "Historical feature records, superseded by the code they produced; enumerating them fills retrieval with dead work-units. Read for context — the measured facts in them are often the only record. HANDOFF.md is the exception (see its own entry): it carries live measured knowledge"

  - glob: ".claude/**"
    policy: analyzable-not-covered
    rationale: "Assistant skill definitions and settings — read to understand the available workflows, not summarized as repository documentation"

  - glob: ".agents/**"
    policy: analyzable-not-covered
    rationale: "Same, for the vendor-neutral skill tree"

  - glob: ".opencode/**"
    policy: analyzable-not-covered
    rationale: "Same, for OpenCode"

  - glob: "assets/**"
    policy: analyzable-not-covered
    rationale: "Asset-generation notes beside the binaries they describe"

  - glob: "security/**"
    policy: analyzable-not-covered
    exceptions: ["security/*/README.md"]
    rationale: "Scanner configuration, allowlists and reports. The allowlist IS the baseline and is gate-read, not prose; each tree's README is documentation and is covered by the **/README.md entry"

  - glob: "mcp-servers/**"
    policy: analyzable-not-covered
    exceptions: ["mcp-servers/*/README.md"]
    rationale: "Server source; the READMEs are the documentation surface"

  - glob: "agents/**"
    policy: analyzable-not-covered
    exceptions: ["agents/*/README.md"]
    rationale: "Agent source; the README is the documentation surface"

  - glob: "infrastructure-as-code/**"
    policy: analyzable-not-covered
    exceptions: ["infrastructure-as-code/**/README.md"]
    rationale: "Compose stacks, Komodo config and project.json; the READMEs are the documentation surface"

  - glob: "frontend/**"
    policy: analyzable-not-covered
    exceptions: ["frontend/*/README.md"]
    rationale: "Application source; the README is the documentation surface"

  - glob: "backend/**"
    policy: analyzable-not-covered
    rationale: "Application source"

  - glob: "packages/**"
    policy: analyzable-not-covered
    exceptions: ["packages/DESIGN-SYSTEM.md", "packages/*/README.md"]
    rationale: "Library source; the design-system document and the READMEs are the documentation surfaces"

  - glob: "scripts/**"
    policy: analyzable-not-covered
    rationale: "Gate and orchestration scripts — their contracts are documented in the runbooks that cite them"

  - glob: ".forgejo/**"
    policy: analyzable-not-covered
    rationale: "CI workflow definitions — summarized by the ci-cd-pipeline concept, never restated"

  - glob: ".devcontainer/**"
    policy: analyzable-not-covered
    rationale: "Dev-container definition — summarized by the devcontainer runbook concept"
