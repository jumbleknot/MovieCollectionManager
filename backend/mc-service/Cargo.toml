[package]
name = "mc-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mc-service"
path = "src/main.rs"

[lib]
name = "mc_service"
path = "src/lib.rs"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }

# Authentication
axum-keycloak-auth = "0.8"

# Database
# bson 3 (081 US9 PR 9a): mongodb 3.x defaults to `compat-3-0-0` = `compat-3-3-0` + `bson-2`, so the
# default feature set would keep bson 2 in the graph beside ours. Opting out of defaults and naming
# `bson-3` makes mongodb's re-exported `mongodb::bson` and this crate's `bson` the same crate; the
# remaining two features are mongodb's other defaults, restated. bson 3 makes `serde` an optional
# feature (mongodb enables it too — named here so this crate does not depend on that).
mongodb = { version = "3", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver"] }
bson = { version = "3", features = ["serde", "chrono-0_4", "uuid-1"] }

# Serialization
serde = { version = "1", features = ["derive"] }
# `preserve_order` was enabled implicitly by bson 2 (its serde_json dependency names it); bson 3
# does not, which would silently re-order every `json!` object this service emits — e.g. RFC 9457
# problem bodies from type,title,status,detail to alphabetical. Named here so the wire bytes stay
# what they were (081 US9 PR 9a).
serde_json = { version = "1", features = ["preserve_order"] }

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
anyhow = "1.0.102"
futures = "0.3.32"

# Observability — Prometheus metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

# Vendored OpenSSL: only for musl (Alpine Docker builds).
# Alpine openssl-dev ships only .so files; static musl linking requires vendored .a libs.
# The vendored build requires perl — available in the Dockerfile but NOT on Windows dev machines.
# Non-musl builds (Windows, Linux gnu) use the system or native-tls TLS stack; no perl needed.
[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
# Mocking for unit tests
mockall = "0.15"
tokio-test = "0.4"
cargo-tarpaulin = "0.37"
# Integration test helpers
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# ROPC token minting against Keycloak (tests only — the service under test is always
# driven in-process via tower::ServiceExt::oneshot, never over a socket).
#
# `json` only, and no default features, is deliberate: reqwest 0.12.28 is ALREADY in
# Cargo.lock transitively (via axum-keycloak-auth), so this declaration must not add a
# new [[package]] block. Naming a TLS feature here would: `rustls-tls` pulls webpki-roots
# + web-time, which are not in the lock. None is needed — feature unification means the
# graph already compiles reqwest with `default-tls`/`__tls` enabled by other crates, so
# the client is TLS-capable regardless, and Keycloak is reached over plain http in both
# environments anyway (KEYCLOAK_URL=http://localhost:8099 locally and in app-ci.yml).
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# Integration test binaries — explicit paths so Cargo picks up subdirectory tests
[[test]]
name = "health_test"
path = "tests/integration/health_test.rs"

[[test]]
name = "collections_test"
path = "tests/integration/collections_test.rs"

[[test]]
name = "movies_test"
path = "tests/integration/movies_test.rs"

[[test]]
# Item #470: the leased test-database pool's own behaviour — properties a passing suite cannot
# show, because leased and minted databases look identical from a green run.
name = "pool_test"
path = "tests/integration/pool_test.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
