# ── SAST: feature 073 backups — auth enforced by the route layer, not per function ───────────────
#
# `mcm-auth-before-authz` flags `createMcServiceClient(...)` without a textually preceding
# requireAuth/requireMcUser in the SAME function. Both modules below are service-layer functions
# that receive an ALREADY-AUTHENTICATED jwt; the guard runs one layer up, in `withBackupRoute`
# (frontend/mcm-app/src/bff-server/backup-route-support.ts), which performs requireAuth →
# requireMcUser and only then invokes a handler body — passing it `{ userId, jwt }` and nothing
# else. A handler that skipped authorization is not expressible there.
#
# This is the exact limitation the rule documents ("Auth performed in a wrapper/HOF ... is not
# recognized — triage such patterns into security/sast/allowlist.yaml"), and pushing a
# requireMcUser call down into these functions would CONTRADICT the constitution's
# role-enforcement-is-a-layer rule (openwiki/gotchas/role-enforcement-is-a-layer.md) by
# reintroducing the per-call-site check that rule exists to prevent.
#
# RESIDUAL RISK, stated rather than implied: a future caller could invoke either function with a
# jwt obtained some other way. That is bounded by the fact that a jwt has to come from somewhere —
# today, only the authenticated route layer — and the entries are pinned to these two files, so a
# new unguarded upstream client anywhere else still fails the gate.
- scanner: "semgrep"
  id: "security.sast.rules.mcm-auth-before-authz"
  locationPattern: "frontend/mcm-app/src/bff-server/backup-snapshot-reader\\.ts:.*"
  justification: "Service-layer reader that takes an already-authenticated jwt. requireAuth + requireMcUser run in withBackupRoute before any handler body executes; the reader is never reachable without them. Pushing the check into this function would duplicate the enforcement layer the constitution mandates."
  addedBy: "steve"
- scanner: "semgrep"
  id: "security.sast.rules.mcm-auth-before-authz"
  locationPattern: "frontend/mcm-app/src/bff-server/backup-restore-writer\\.ts:.*"
  justification: "Service-layer writer that takes an already-authenticated jwt, and writes AS THE USER so mc-service applies its own DAC and validation. requireAuth + requireMcUser run in withBackupRoute before any handler body executes. Same layer argument as backup-snapshot-reader."
  addedBy: "steve"

# ── Feature 076: the account-deletion pipeline ───────────────────────────────────────────────────
# Same shape as the two backup service-layer entries above, and stronger. `account-deletion.ts`
# is not a route handler: its only two production callers are the account-deletion routes, and
# BOTH run requireAuth → requireMcUser before the pipeline is entered, and then additionally
# require a verified step-up proof — a FRESH authentication at the identity provider, which the
# ordinary routes do not demand. The token it hands to createMcServiceClient is the step-up
# token, minted seconds earlier for that same user, so mc-service applies its own DAC to it.
#
# The rule's own documentation names this case: "Auth performed in a wrapper/HOF … is not
# recognized — triage such patterns into security/sast/allowlist.yaml."
#
# RESIDUAL RISK, stated rather than implied: a future caller could invoke runAccountDeletion with
# a token obtained some other way. Bounded by the entry being pinned to this one file — a new
# unguarded upstream client anywhere else still fails the gate — and by
# `account-deletion-routes.integration.test.ts`, which asserts that every route-level path
# skipping the step-up refuses.
- scanner: "semgrep"
  id: "security.sast.rules.mcm-auth-before-authz"
  locationPattern: "frontend/mcm-app/src/bff-server/account-deletion\\.ts:.*"
  justification: "Pipeline step that takes an already-authenticated step-up access token. requireAuth + requireMcUser run in both account-deletion route handlers before runAccountDeletion is called, followed by verifyStepUpProof requiring a fresh authentication at the identity provider; the step is not reachable without all three. Deletes are performed AS THE USER so mc-service applies its own DAC."
  addedBy: "steve"

