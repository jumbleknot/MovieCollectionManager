# ── SCA: newly-published advisory WAVE, time-boxed acceptance (2026-08-03) ───────────────────────
#
# Six blocking runtime advisories appeared within ~2 hours, all published AFTER the scans that ran
# earlier the same day. Evidence they are a feed event rather than anything a branch introduced:
# PR #135's gate saw exactly ONE blocking finding (brace-expansion, since remediated by bumping its
# override to >=5.0.9); PR #136 an hour later — a two-file branch touching only pnpm-workspace.yaml
# and pnpm-lock.yaml — saw these SIX with that one cleared. aiohttp and cryptography are resolved by
# `uv`, and no Python dependency file was modified at all.
#
# These entries are an ACCEPTED RISK to unblock, NOT a not-exploitable determination — none of the
# six has been analysed for reachability in this codebase, and the justifications say so plainly
# rather than implying an assessment that was never done. Every one carries a SHORT expiry so it
# re-blocks if the proper remediation has not landed.
#
# REMEDIATION (tracked, not optional):
#   * fast-uri and ip-address are npm transitives — bump via a pnpm-workspace override, the same
#     one-line pattern used for brace-expansion. fast-uri ALREADY has a `<3.1.4: '>=3.1.4 <4'`
#     override, so 3.1.4 was the previous fix and this advisory bypasses it — expect the same
#     shape of change.
#   * aiohttp and cryptography are DONE (2026-08-06) — entries deleted, not renewed, so a
#     regression re-blocks. `uv lock --upgrade-package` in agents/movie-assistant took aiohttp to
#     3.14.3 and cryptography to 50.0.0 (a MAJOR bump). cryptography sits in the RFC 8693
#     token-exchange path, so it was verified against real Keycloak rather than nudged: the
#     token-reexchange and authz-parity integration tests pass on 50.0.0. Only
#     agents/movie-assistant needed it — at the time, pip-audit audited that venv alone, so the
#     mcp-servers' own locks were deliberately left untouched.
#
#     NO LONGER TRUE as of feature 068 (2026-09-08): pip-audit now audits ALL FOUR Python surfaces
#     (agents/movie-assistant plus the three mcp-servers), and a finding's location names the surface
#     it came from — so a suppression can, and normally should, be anchored to one project. See
#     PYTHON_SURFACES in scripts/sast-scan.mjs.
#
#     They re-blocked EARLY, before their 2026-08-31 expiry, for a reason worth knowing: the
#     entries were keyed on CVE ids and pip-audit began reporting the same advisories under their
#     PYSEC aliases (CVE-2026-69244 -> PYSEC-2026-3545, and so on). An allowlist keyed on an exact
#     advisory id silently stops suppressing when the scanner switches identifier namespace — the
#     entry does not expire, it just quietly matches nothing.

#     * fast-uri (GHSA-7p8r-x3mc-p8w7) and ip-address (GHSA-mwp4-54f8-5fhr) are DONE (2026-08-13,
#       feature 057) — entries DELETED, not re-dated, so a regression re-blocks. The floors were
#       raised in pnpm-workspace.yaml rather than the acceptances renewed: deleting an expiry date
#       is how a time-box becomes permanent, and these two were 18 days from turning every branch
#       red. Both halves of each override moved together, per the invariant
#       check-override-consistency.mjs now enforces.


# ── 2026-08-08 advisory wave — image-size — REMEDIATED 2026-08-28, ENTRIES DELETED (item #303) ───
# GHSA-w3rx-r6r6-pgpr and GHSA-5p2g-fcmc-qvqq are gone, and not because the advisories were fixed:
# `image-size` LEFT THE DEPENDENCY TREE ENTIRELY. `dc4ca787` (chore(deps): lock file maintenance,
# on main 2026-08-28) bumped metro 0.84.4 → 0.84.5, which no longer depends on it. Verified
# 2026-08-30: ZERO occurrences of `image-size` in pnpm-lock.yaml, `pnpm why` finds nothing, and a
# fresh pnpm-audit scan reports neither advisory.
#
# The old acceptance predicted the wrong remediation and said so precisely enough to be checked:
# "re-evaluate when image-size publishes 2.0.3 AND metro widens its range". npm's latest is STILL
# 2.0.2 — 2.0.3 never shipped. The dependency was dropped instead. Worth remembering that a
# time-boxed acceptance can be discharged by a route its own justification did not anticipate, which
# is why the entries were re-checked rather than renewed at the 2026-09-07 expiry.
#
# This is `lockFileMaintenance` (feature 058 / item #184) doing exactly what it was enabled for —
# refreshing WITHIN existing ranges so a transitive fix arrives with no config change and no human
# in the loop. It worked silently and went unremarked for two days.
#
# Entries DELETED rather than left to expire, per this file's convention: a suppression that matches
# nothing only shows as UNMATCHED in a normal gate run's report-only output (the weekly
