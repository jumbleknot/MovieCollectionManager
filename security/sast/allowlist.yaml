# SAST/SCA finding allowlist — feature 033 (see specs/033-sast-semgrep/data-model.md).
#
# Consumed ONLY by the gate (scripts/check-sast-findings.mjs). Suppresses a matching finding from the
# blocking gate while it stays VISIBLE in security/sast/reports/findings.json (FR-010). The gate fails
# only on `blocking` findings (High/Critical that are SAST, or runtime-scope SCA); Medium/Low and
# dev-scope findings are warnings and need no entry here.
#
# Match key (all four required; a blank justification/addedBy or invalid regex is a GATE ERROR):
#   - scanner:         semgrep | cargo-audit | pnpm-audit | pip-audit
#     id:              exact rule id (Semgrep check_id) or advisory id (RUSTSEC-*/GHSA-*/CVE-*/PYSEC-*)
#     locationPattern: regex vs Finding.location ('path:line' with FORWARD slashes, or 'package@version')
#     justification:   why accepted (false positive or accepted risk)
#     addedBy:         who triaged
#     expiry:          optional ISO YYYY-MM-DD — once past, the entry stops suppressing (finding re-blocks)
#
# ═════════════════════════════════════════════════════════════════════════════════════════════════
# BASELINE (FR-012 / SC-006): every entry below suppresses a finding that was ALREADY PRESENT when
# feature 033 landed. Seeding them makes the protected `main` green on day one, so the gate blocks
# only findings introduced AFTER this baseline. None of these were introduced by this feature.
# ═════════════════════════════════════════════════════════════════════════════════════════════════

# ── SAST: custom-rule findings in unit-test code (false positives) ───────────────────────────────
# The mcm-* rules fire on test files that deliberately construct the flagged pattern to test it —
# token-shaped fixtures that verify the logger's redaction, and mc-service client construction in
# isolation. Test code, not production server code. Scoped to the unit-tests dir.
- scanner: "semgrep"
  id: "security.sast.rules.mcm-no-token-logging"
  locationPattern: "frontend/mcm-app/src/bff-server/unit-tests/.*"
  justification: "False positive: unit-test files pass token/session/email-shaped fixtures to the logger specifically to assert redaction (logger.test.ts, audit-sink.test.ts). Not production logging."
  addedBy: "steve"
- scanner: "semgrep"
  id: "security.sast.rules.mcm-auth-before-authz"
  locationPattern: "frontend/mcm-app/src/bff-server/unit-tests/.*"
  justification: "False positive: mc-service-client.test.ts constructs createMcServiceClient directly to unit-test the client in isolation; auth ordering is exercised at the route/integration layer, not in these unit tests."
  addedBy: "steve"

# ── SAST: community-pack findings (pre-existing) ─────────────────────────────────────────────────
- scanner: "semgrep"
  id: "javascript.node-crypto.security.gcm-no-tag-length.gcm-no-tag-length"
  locationPattern: "frontend/mcm-app/src/bff-server/agent-config-crypto\\.ts:.*"
  justification: "False positive: AES-256-GCM auth tag is a fixed 16 bytes (TAG_BYTES) — sliced explicitly from the blob and verified via setAuthTag() before decipher.final(). Node's default GCM tag length is already 128-bit; there is no short-tag exposure."
  addedBy: "steve"
# dockerfile.security.missing-user — REMEDIATED in feature 034 (US2): all five app-tier images
# (frontend/mcm-app, agents/movie-assistant, the three mcp-servers) now drop to a non-root USER
# before CMD, matching backend/mc-service. Entry deleted so a regression re-blocks.
- scanner: "semgrep"
  id: "yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell"
  locationPattern: "\\.forgejo/workflows/.*\\.yml:.*"
  justification: "Accepted CI bootstrap: pipes the pinned astral.sh uv installer to sh — the same fixed, non-attacker-controlled installer URL already used by the agent-gates guardrails job. Pre-existing at baseline."
  addedBy: "steve"
# run-shell-injection — REMEDIATED in feature 034 (US3): all six flagged workflow run-steps were
# refactored to pass the interpolated ${{ … }} value through a step `env:` block and reference it as a
# quoted shell variable (the GitHub-documented mitigation). Zero findings remain; entry deleted.

# ── SCA: runtime dependency advisories — REMEDIATED in feature 034 (US1) ─────────────────────────
# All 18 pre-existing runtime SCA advisories (Rust crossbeam-epoch, JS form-data/hono/undici,
# Python aiohttp×8/langchain/pydantic-settings/langsmith/cryptography/starlette×2) were fixed by
# lockfile version bumps and their allowlist entries DELETED, so a regression re-blocks. A fresh
# full scan confirms zero blocking SCA findings remain (undici's residual hits are now dev-scope on
# the 7.x copy — non-blocking, tracked under P4). See docs/proposals/sast-sca-hardening-backlog.md.

# ── SCA: not-exploitable runtime advisory (post-034, expiring) ───────────────────────────────────
# click PYSEC-2026-2132 is a command injection in click.edit() (it shells out to $EDITOR). The agent
# and MCP servers NEVER call click.edit() — click is a transitive-only dependency (no `import click`
# anywhere under agents/ or mcp-servers/), pulled by CLI/server tooling. It is pinned at 8.2.0 by a
# deep transitive cap that currently blocks the click>=8.3.3 fix (bumping typer/uvicorn did not free
# it). Accepted as not-exploitable with an expiry so it re-blocks if the cap frees (bump then) or the
# risk profile changes. pillow's advisories (PYSEC-2026-2253..2257) were REMEDIATED (→12.3.0), not
# allowlisted — this is the one advisory that cannot be bumped today.
- scanner: "pip-audit"
  id: "PYSEC-2026-2132"
  locationPattern: "click@.*"
  justification: "Not exploitable: the vuln is in click.edit() (spawns $EDITOR), never called by the agent/MCP runtime; click is transitive-only (no import in our source) and pinned at 8.2.0 by a transitive cap blocking the click>=8.3.3 fix. Re-evaluate at expiry or when the cap frees."
  addedBy: "steve"
  expiry: "2026-10-12"

# ── SCA: newly-published advisory WAVE, time-boxed acceptance (2026-08-03) ───────────────────────
#
# Six blocking runtime advisories appeared within ~2 hours, all published AFTER the scans that ran
# earlier the same day. Evidence they are a feed event rather than anything a branch introduced:
# PR #135's gate saw exactly ONE blocking finding (brace-expansion, since remediated by bumping its
# override to >=5.0.9); PR #136 an hour later — a two-file branch touching only pnpm-workspace.yaml
# and pnpm-lock.yaml — saw these SIX with that one cleared. aiohttp and cryptography are resolved by
# `uv`, and no Python dependency file was modified at all.
#
# These entries are an ACCEPTED RISK to unblock, NOT a not-exploitable determination — none of the
# six has been analysed for reachability in this codebase, and the justifications say so plainly
# rather than implying an assessment that was never done. Every one carries a SHORT expiry so it
# re-blocks if the proper remediation has not landed.
#
# REMEDIATION (tracked, not optional):
#   * fast-uri and ip-address are npm transitives — bump via a pnpm-workspace override, the same
#     one-line pattern used for brace-expansion. fast-uri ALREADY has a `<3.1.4: '>=3.1.4 <4'`
#     override, so 3.1.4 was the previous fix and this advisory bypasses it — expect the same
#     shape of change.
#   * aiohttp and cryptography are DONE (2026-08-06) — entries deleted, not renewed, so a
#     regression re-blocks. `uv lock --upgrade-package` in agents/movie-assistant took aiohttp to
#     3.14.3 and cryptography to 50.0.0 (a MAJOR bump). cryptography sits in the RFC 8693
#     token-exchange path, so it was verified against real Keycloak rather than nudged: the
#     token-reexchange and authz-parity integration tests pass on 50.0.0. Only
#     agents/movie-assistant needed it — pip-audit audits that venv alone (sast-scan.mjs), so the
#     mcp-servers' own locks were deliberately left untouched.
#
#     They re-blocked EARLY, before their 2026-08-31 expiry, for a reason worth knowing: the
#     entries were keyed on CVE ids and pip-audit began reporting the same advisories under their
#     PYSEC aliases (CVE-2026-69244 -> PYSEC-2026-3545, and so on). An allowlist keyed on an exact
#     advisory id silently stops suppressing when the scanner switches identifier namespace — the
#     entry does not expire, it just quietly matches nothing.

#     * fast-uri (GHSA-7p8r-x3mc-p8w7) and ip-address (GHSA-mwp4-54f8-5fhr) are DONE (2026-08-13,
#       feature 057) — entries DELETED, not re-dated, so a regression re-blocks. The floors were
#       raised in pnpm-workspace.yaml rather than the acceptances renewed: deleting an expiry date
#       is how a time-box becomes permanent, and these two were 18 days from turning every branch
#       red. Both halves of each override moved together, per the invariant
#       check-override-consistency.mjs now enforces.


# ── 2026-08-08 advisory wave — image-size (NO PUBLISHED FIX) ─────────────────────────────────────
# A second wave landed on the feed overnight. Seven blocking runtime findings appeared on a clean
# checkout of `main`, where PR #141's run hours earlier had seen only two — the feed moved, no branch
# introduced anything. Five were remediated properly rather than accepted, by bumping the
# pnpm-workspace overrides (js-yaml 3.15.0→3.15.1 and 4.3.0→4.3.1, nanoid 3.3.12/3.3.16→3.3.17).
#
# These last two cannot be remediated at all right now, which is why they are here and the other five
# are not:
#
#   1. THERE IS NO FIXED RELEASE. The advisories name `fixAvailable: >=2.0.3`. The latest version
#      published to npm is 2.0.2 — 2.0.3 does not exist yet. An override cannot point at it.
#   2. EVEN WHEN IT SHIPS, AN OVERRIDE WOULD BREAK THE BUILD. image-size@1.2.1 reaches us solely
#      through metro@0.84.4, which declares `image-size: ^1.0.2` — a caret range that excludes 2.x —
#      and consumes it as a DEFAULT export (`metro/src/Assets.js`:
#      `_interopRequireDefault(require("image-size"))`). image-size 2.x restructured its entry points
#      and moved file-path reading to a `./fromFile` subpath export, so forcing 2.x would leave
#      metro's asset sizing calling `undefined` and break the bundler — and with it the app build,
#      the web E2E and the APK. This is not a lockfile nudge; it is a metro/Expo upgrade.
#
# REMEDIATION (tracked, not optional): re-evaluate when image-size publishes 2.0.3 AND metro widens
# its range to accept it — realistically an Expo SDK bump, which wants its own branch and a real
# build + E2E verification. Both entries are pinned to `image-size@1.2.1`, so the moment the resolved
# version changes at all, they stop matching and the findings re-block for a fresh decision.
#
# Scope note, NOT a dismissal: both are denial-of-service parsers (ICNS, JXL/HEIF) inside the BUILD-
# TIME bundler, not a request path — metro sizes local asset files that are already in the repo.
# Neither has been assessed for exploitability, and the classification stands as `runtime` because
# that is what the scanner reports; the expiry is what forces the question to be re-asked.
- scanner: "pnpm-audit"
  id: "GHSA-w3rx-r6r6-pgpr"
  locationPattern: "image-size@1\\.2\\.1"
  justification: "Accepted risk, time-boxed: 2026-08-08 advisory wave affecting main equally; not introduced by any feature branch. NO PUBLISHED FIX EXISTS — the advisory names >=2.0.3 and npm's latest is 2.0.2. Reached only via metro@0.84.4, which pins ^1.0.2 and imports the default export that image-size 2.x moved to a ./fromFile subpath, so an override would break the Metro bundler. Remediation is a metro/Expo upgrade once 2.0.3 ships. NOT assessed for exploitability. Pinned to 1.2.1 so any version change re-evaluates."
  addedBy: "steve"
  expiry: "2026-09-07"
- scanner: "pnpm-audit"
  id: "GHSA-5p2g-fcmc-qvqq"
  locationPattern: "image-size@1\\.2\\.1"
  justification: "Accepted risk, time-boxed: 2026-08-08 advisory wave affecting main equally; not introduced by any feature branch. NO PUBLISHED FIX EXISTS — the advisory names >=2.0.3 and npm's latest is 2.0.2. Reached only via metro@0.84.4, which pins ^1.0.2 and imports the default export that image-size 2.x moved to a ./fromFile subpath, so an override would break the Metro bundler. Remediation is a metro/Expo upgrade once 2.0.3 ships. NOT assessed for exploitability. Pinned to 1.2.1 so any version change re-evaluates."
  addedBy: "steve"
  expiry: "2026-09-07"
