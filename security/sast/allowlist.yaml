  justification: "Memory exhaustion while validating oversized constrained collections. Fixed ONLY in zod 4.6.6+ (OSV: introduced 0, fixed 4.6.6); no 3.x release carries the fix. zod 3.25.76/3.25.75 are pinned by the BFF agent stack, not first-party code: @ag-ui/core/client/proto 1.0.2, @a2ui/web_core 0.10.4, @ai-sdk/* 2.x/3.x (anthropic, gateway, google, google-vertex, mcp, openai-compatible) and @microsoft/agents-activity/-hosting 1.9.1 (lockfile re-measured 2026-10-23); the app itself is on zod 4.6.7. Forcing zod 4 onto libraries written against the zod 3 API would break the agent runtime, so remediation is upstream (CopilotKit / ag-ui / ai-sdk moving to zod 4). The agent endpoints sit behind BFF session auth. RENEWED 2026-11-01 to 2026-12-01 after re-measuring: the lockfile still resolves zod 3.25.76 under the same agent-stack dependents, and upstream still hard-requires zod 3 at its newest releases — @ag-ui/client 1.0.3 (zod ^3.25.76), @a2ui/web_core 0.14.0 (^3.25.76), @copilotkit/runtime 1.83.0 (^3.25.18) and @copilotkit/shared 1.83.0 (^3.23.3). (ai 7, @ai-sdk/* and @modelcontextprotocol/sdk now accept zod 4, so CopilotKit/ag-ui are the remaining blockers.) Re-check those three by the expiry."
  addedBy: "claude (operator-approved, steve; renewed 2026-11-01 on re-measurement)"
  expiry: "2026-12-01"

# ── graphql-scalars GHSA-x8rm-f576-gq67 (published 2026-10-28, operator-approved 2026-10-29) ───────
# NOT REACHABLE, measured 2026-10-29 in the shipped dist of the exact versions the lockfile pins. The ReDoS
# is in GraphQLPhoneNumber's regex, which graphql-js runs only for a value of THAT scalar type. Nothing in
# our schema has one. @copilotkit/runtime@1.79.1 (npm pack, grep of package/dist) imports only GraphQLJSON
# and GraphQLJSONObject, and type-graphql@2.0.0-rc.1 re-exports only GraphQLTimestamp and
# GraphQLDateTimeISO. The fix exists ONLY in 2.0.1 (OSV: introduced 0, fixed 2.0.1). copilotkit declares
# `graphql-scalars ^1.23.0` and type-graphql's peer range is ^1.22.4, so neither a lockfile refresh nor
# Renovate can reach it. Forcing 2.x past both ranges would be a bigger risk than an unreachable regex.
# Remediation is upstream (copilotkit moving to graphql-scalars 2).
- scanner: "pnpm-audit"
  id: "GHSA-x8rm-f576-gq67"
  locationPattern: "^graphql-scalars@1\\.26\\.0$"
  justification: "ReDoS in the GraphQLPhoneNumber regex only. Not reachable: @copilotkit/runtime@1.79.1 imports only GraphQLJSON/GraphQLJSONObject, and type-graphql@2.0.0-rc.1 only GraphQLTimestamp/GraphQLDateTimeISO (shipped dist grepped 2026-10-29), so no PhoneNumber type exists in our schema for graphql-js to parse. Fixed only in 2.0.1, outside both dependents' ^1 ranges. Version-keyed, so a different graphql-scalars version re-blocks. RENEWED 2026-11-01 to 2026-12-01 after re-measuring: lockfile still graphql-scalars 1.26.0 / @copilotkit/runtime 1.79.1 / type-graphql 2.0.0-rc.1, so the dist measurement stands; the newest @copilotkit/runtime (1.83.0) still declares graphql-scalars ^1.23.0, so a CopilotKit bump does not discharge this. Re-check the copilotkit range by the expiry."
  addedBy: "claude (operator-approved, steve; renewed 2026-11-01 on re-measurement)"
  expiry: "2026-12-01"

# ── decode-uri-component GHSA-qr28-fpjm-wq7f (published 2026-10-29 16:41Z, operator-approved the same day) ──
# A quadratic-time DoS on malformed percent-encoded input. The only path to it is expo-router@57.0.29 >
# query-string@7.1.3 > decode-uri-component@0.2.2. In the packed expo-router 57.0.29, query-string is
# required only by the navigation linking code (fork/getStateFromPath*, fork/getPathFromState*,
# react-navigation/core/getStateFromPath + getPathFromState), which turns a URL into navigation state.
# That runs in the CLIENT (browser or device). Our app.json has `web.output: "server"` and no
# server-rendering option, and nothing first-party imports query-string. So no BFF request reaches it,
# by reading the code, not by a test: a crafted link can at worst stall the tab of whoever opens it.
# The fix is 0.5.1 (2026-10-23). It is ESM-only ("type": "module"), and query-string@7 require()s it
# and calls the export as a function. Even with Node 24's require(esm), that returns the module
# namespace, not the function, so an override would break URL parsing in every client. Remediation is
# upstream: Expo moving to a newer query-string. Renovate does not bump RN/Expo here.
- scanner: "pnpm-audit"
  id: "GHSA-qr28-fpjm-wq7f"
  locationPattern: "^decode-uri-component@0\\.2\\.2$"
  justification: "Quadratic-time DoS on malformed percent-encoded input. Only path: expo-router@57.0.29 > query-string@7.1.3, used solely by the client-side URL-to-navigation-state linking code. web.output is server with no server rendering, so no BFF request reaches it (by reading the packed expo-router 2026-10-29). Fix 0.5.1 is ESM-only and query-string@7 calls a CommonJS function export, so an override breaks client URL parsing. Version-keyed, so another version re-blocks. RENEWED 2026-11-01 to 2026-12-01 after re-measuring: lockfile still expo-router 57.0.29 > query-string 7.1.3 > decode-uri-component 0.2.2, and 57.0.29 is the newest expo-router 57. expo-router 58 no longer depends on query-string at all, so the remediation route is the Expo SDK 58 upgrade, not an override. Re-check by the expiry."
  addedBy: "claude (operator-approved, steve; renewed 2026-11-01 on re-measurement)"
  expiry: "2026-12-01"

