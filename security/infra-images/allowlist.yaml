#
# EXPIRY 2026-10-01 is deliberate: these are time-boxed to force re-triage, not accepted permanently.
# The 14-day warning window starts reporting them 2026-09-17. Per item #303, DELETE each entry when
# its image is remediated rather than letting the date pass — an entry that matches nothing keeps
# failing under UNMATCHED ENTRIES instead of ageing out quietly.
# ── ALL FIVE REMAINING CVE-2026-56854 ENTRIES REMOVED 2026-09-14 (item #329, re-triage) ───────────
# caddy:2.11.4-alpine · grafana/otel-lgtm:0.32.1 · hashicorp/vault:1.18 ·
# mongodb/mongodb-community-server:8.0.8-ubi9 · ollama/ollama:0.32.1 — gone, and NOT for the reason
# the block above predicted.
#
# THE ADVISORY WAS RE-RATED, NOT REMEDIATED. This block was written on 2026-09-01 when Trivy scored
# CVE-2026-56854 CRITICAL, which is the only tier this gate blocks on. Trivy's DB now scores it
# HIGH — measured 2026-09-14 against a DB stamped that morning (UpdatedAt 07:14 UTC), full local
# sweep of all 19 pulled images. Fixable High is a report-only warning here (same Critical-only
# policy as cd-deploy), so every one of these five suppressed nothing: of the sweep's 21 blocking
# findings, ZERO are CVE-2026-56854. An entry that suppresses nothing is the thing item #303 exists
# to delete.
#
# SAY PLAINLY WHAT DID NOT HAPPEN: upstream has NOT shipped the fix. caddy:2.11.4-alpine still
# reports golang.org/x/crypto v0.52.0 against a fix of 0.55.0 — the package is exactly where it was.
# The accepted risk is unchanged; only its rating moved, and with it the tier that gates on it. The
# finding stays VISIBLE in reports/findings.json as a warning, which is where a re-rating this
# direction belongs.
#
# WHY DELETE RATHER THAN RENEW. Renewing would time-box a suppression that suppresses nothing, and
# would have kept all five in the expiry report — measured: at 2026-09-17 the check reports exactly
# 7 entries EXPIRING, so Friday's 07:00 UTC cron goes red on entries no longer doing any work.
# Deleting is also the direction that RESTORES blocking: if the score returns to Critical, or if a
# genuinely Critical x/crypto advisory lands on any of these images, the gate blocks and the entry
# comes back with fresh evidence. That is the outcome to want.
#
# A SEVERITY RE-RATING IS A THIRD WAY AN ENTRY GOES STALE, alongside "upstream rebuilt it" and "the
# ref left the pulled set". It looks identical to remediation in the gate's output and is NOT one —
# so check the package version before writing "remediated", as was done here.
#
# ollama/ollama, the one open question item #329 carried and could not answer: it asked whether the
# newer v0.33.2 — which POSTDATES the x/crypto fix — already ships 0.55.0, and said to bump the pin
# and delete the entry if so. ANSWERED 2026-09-14 by scanning the newest tag, 0.34.0, directly: NO,
# and the intuition behind the question is backwards. 0.34.0 ships golang.org/x/crypto **v0.43.0**,
# which is OLDER than the v0.52.0 on our pinned 0.32.1 — it carries CVE-2026-56854 plus nine further
# High x/crypto advisories that 0.32.1 does not. A publication date AFTER a fix says nothing about
# whether the image picked the fix up; only reading the shipped version does. Upgrading ollama on
# CVE grounds would have moved x/crypto backwards, so no bump of this pin is owed and none should be
# filed on this advisory's account. (0.34.0 has no fixable Critical either, so nothing here blocks.)
# openpolicyagent/opa CVE-2026-56854 (x/crypto <0.55.0): entry REMOVED 2026-09-10 (item #406) —
# the bump WAS the remediation. PR #362 moved both refs to 1.20.2/1.20.2-debug and its sweep (run
# 3027) produced no blocking opa finding at all, so upstream picked the fix up between 1.20.1 and
# 1.20.2. Deleted rather than left to expire on 2026-10-01, per item #303: an entry that matches
# nothing does not age out quietly, it fails under UNMATCHED ENTRIES and reddens the weekly
# allowlist-expiry run. Deleting is also the direction that restores blocking — if the advisory
# returns on a later opa, it re-blocks.

