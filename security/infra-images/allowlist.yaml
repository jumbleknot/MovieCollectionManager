  justification: 'New advisory published 2026-09-16 (github.com/rabbitmq/amqp091-go below 1.13.0 — protocol desynchronization and frame injection via an integer overflow in readLongstr) in our from-source MinIO image (feature 069, item #420). THE SAME THREE ADVISORIES already carry entries here for grafana/otel-lgtm from the 2026-09-18 window, so this continues a triaged accepted risk reaching a second image by a different route. NO UPSTREAM RELEASE CLEARS IT, measured at the source 2026-09-26 rather than inferred: amqp091-go is v1.10.0 in the go.mod of our pin RELEASE.2025-09-07T16-13-09Z, of the NEWEST release RELEASE.2025-10-15T17-29-55Z, and of master. Structurally unfixable by waiting: MinIO''s last community release is 2025-10-15, ELEVEN MONTHS before these advisories were published, and community edition has stopped releasing — there is no upstream cadence left to deliver a fix. Reachable only through MinIO''s AMQP event-notification target: no MINIO_NOTIFY_* variable is set anywhere in the tree, no AMQP broker exists in any stack, and all four instances run a bare `server /data` with only root credentials, so the client is never constructed. Not internet-facing — the backup instance binds 127.0.0.1:9100/9101 and prod''s langfuse-minio declares no ports at all. Version-keyed to the MINIO_TAG-derived tag so a MinIO bump — the only thing that could ever clear it — re-blocks and forces a fresh scan. Time-boxed; delete on upstream remediation, do not renew.'
  addedBy: 'item-560'
  expiry: '2026-12-01'
- image: 'jumbleknot/minio:'
  id: 'CVE-2026-33186'
  justification: 'Our from-source MinIO image (feature 069, item #420). google.golang.org/grpc v1.72.0 (fix 1.79.3) is an INDIRECT dependency pinned in upstream MinIO''s own go.mod, so our choice of Go toolchain cannot move it — verified 2026-09-11 that the newest upstream release RELEASE.2025-10-15T17-29-55Z pins v1.72.0 too, so no bump clears it. Rejected forcing it with a go.mod replace: rewriting upstream''s dependency graph eight minor versions forward, unilaterally, on a service holding production object data is a larger change than the advisory warrants. The deleted upstream images carried a seed entry for this same advisory, so this continues an accepted risk rather than adding one. Internal-only. Keyed to the repository prefix WITHOUT the registry host, because the host is topology-sensitive and injected at runtime — the matcher is an unanchored regex, so this matches `<forge>/jumbleknot/minio:<tag>@<digest>`. Time-boxed; delete when a MinIO release ships grpc >= 1.79.3.'
  addedBy: 'item-420'
  expiry: '2026-12-01'

# ── NEW advisories on unchanged images, triaged 2026-09-10, RE-TRIAGED 2026-09-14 (item #406) ─────
# As triaged: TWO advisories, 11 blocking findings, four pulled images — every one of them on a
# reference `main` ALREADY carries, so these block `main` itself and every infra-touching PR,
# unrelated to any diff. Found on PR #362's sweep (run 2962, 2026-09-09); the previous full sweep,
# PR #360's on 2026-09-08, was clean, so both advisories entered Trivy's DB between those dates.
# Nothing had re-swept since — every infra-image-scan run after 2026-09-09 03:53 lasted 10-14 s, i.e.
# Trivy was skipped on a non-infra PR — so the Friday 07:00 UTC cron is where `main` would have gone
# red. The sweep recorded below is that re-sweep, run locally rather than waiting for the cron.
#
# WHY ENTRIES AND NOT A BUMP — the rule this file states for itself ("an entry would only be right if
# no fix existed"), checked per image against upstream on 2026-09-10:
#   opensearchproject/opensearch:2 .. `:2` already floats to 2.19.6 (2026-07-15) and resolves to the
#                                     exact digest pinned here; there is no newer 2.x. The remediation
#                                     upstream offers is OpenSearch 3 — a MAJOR, already proposed
#                                     separately under `docker base images (major)`, and a deliberate
#                                     decision rather than a CVE reflex.
#   quay.io/keycloak/keycloak ....... 26.7.3 (2026-08-31) is the newest release and IS `latest`, and
#                                     it is the version that scanned dirty. See the entry for how
#                                     26.7.2 was established to be equally affected.
#   langfuse/langfuse:3 + -worker:3 .. `:3` already floats to the newest 3.x build (2026-09-02). A `:4`
#                                     tag exists (2026-09-09) but that is a MAJOR with data migrations,
#                                     likewise already proposed separately.
# Remediation for all four is an upstream rebuild, or a major upgrade taken deliberately.
#
# RE-TRIAGED 2026-09-14 (the sitting the 2026-10-01 expiry was set to force). Full local Trivy sweep,
# 19 pulled images, DB stamped 07:14 UTC that morning. What changed since 2026-09-10:
#
#   langfuse/langfuse:3 + -worker:3 .. GONE. The major landed (item #433) and both refs are now `:4`.
#                                      CVE-2026-75604 / GHSA-2xp9-vwfh-vxw4 does not appear on either
#                                      v4 image — 3 and 5 findings respectively, 0 blocking — so the
#                                      upgrade WAS the remediation and the two entries were deleted
#                                      rather than re-keyed. Deliberately not re-keyed before being
#                                      observed: whether a new major carries the same advisory is an
#                                      empirical question (same rule feature 069 applied to MinIO).
#   opensearchproject/opensearch .... re-keyed 2.x -> 3.x digest by feature 071 / item #439; the major
#                                     did NOT discharge it. Still 6 Critical findings. Entry RENEWED.
#   quay.io/keycloak/keycloak ....... still 1 Critical finding on 26.7.3. Entry RENEWED and its key
#                                     narrowed to 26.7.3, 26.7.2 having left the repository with #362.
#
# So of item #406's four images, two discharged themselves via majors taken for other reasons and two
# are unchanged. Both survivors were re-measured, not re-dated: an expiry renewed without a fresh scan
# is the thing the time-box exists to prevent.
#
# EXPIRY 2026-12-01 now matches the jumbleknot/minio entry above, so the next re-triage is again one
# sitting rather than a dribble — the same grouping trick, re-aimed after the 2026-10-01 cohort emptied.
# Per item #303, DELETE each entry when its image is remediated rather than letting the date pass — an
# entry that matches nothing keeps failing under UNMATCHED ENTRIES instead of ageing out quietly.
- image: 'opensearchproject/opensearch:3@sha256:bcc1797519726ceb6d651d4a3e60b7c30da91793914a8dfe75fd441d4f641509'
  id: 'CVE-2026-75595'
  justification: 'New advisory (io.netty:netty-handler below 4.1.137.Final / 4.2.17.Final) on an image we pull; 6 findings. RE-VERIFIED 2026-09-14 by a full local Trivy sweep (aquasec/trivy:0.74.0, DB stamped 07:14 UTC that morning): STILL PRESENT and still CRITICAL, all six findings, on both netty copies feature 071 measured — netty-handler 4.2.16.Final in lib and 4.1.133.Final bundled inside security-analytics-commons-1.0.0.jar. No bump clears it: the pinned digest IS what `3`, `3.8.0` and `latest` all resolve to (Docker Hub checked 2026-09-14, newest 3.x is 3.8.0 of 2026-08-04), so the remediation is an upstream rebuild. RE-KEYED 2026-09-13 from the 2.x digest to the 3.x one by feature 071 / item #439, because the OpenSearch 3 upgrade DID NOT discharge it — netty is present on BOTH majors and 3.x introduces nothing new. Deleting it would un-suppress a live finding and leaving it on the 2.x digest key would report it UNMATCHED, so re-keying was the only correct move. Keyed to the DIGEST, not to `opensearch:3`, so an upstream rebuild discharges it (feature 063 / item #297). Its sibling CVE-2025-14813 (bcprov-jdk15to18 1.79) WAS discharged and its seed entry deleted in the same change — 3.x ships bc-fips-*.jar and the old provider jar is gone. Internal-only (audit stack). Time-boxed; delete on rebuild, do not renew.'
  addedBy: 'item-406'
  expiry: '2026-12-01'
