#                                     tag exists (2026-09-09) but that is a MAJOR with data migrations,
#                                     likewise already proposed separately.
# Remediation for all four is an upstream rebuild, or a major upgrade taken deliberately.
#
# EXPIRY 2026-10-01 matches the item-329 block above so the whole set re-triages in one sitting rather
# than dribbling. Per item #303, DELETE each entry when its image is remediated rather than letting the
