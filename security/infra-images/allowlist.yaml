# CVE-2025-14813 (bcprov-jdk18on 1.82→1.84) remediated by bumping Keycloak 26.5.5→26.7.0 (feature 036).
# Entry removed: the 26.5.5 ref no longer exists.
#
# AND AGAIN, 2026-08-29: Critical CVE-2026-18963 (org.keycloak:keycloak-services) appeared on 26.7.0,
# un-allowlisted and therefore blocking, remediated the same way — 26.7.0→26.7.2, which Trivy itself
# named as a fix version (26.4.15, 26.6.6, 26.7.2). No allowlist entry is added for it: bumping the tag
# is the remediation, and an entry would only be right if no fix existed.
#
# WORTH KNOWING FOR THE NEXT ONE. This did not surface on `main` — the push trigger is path-filtered to
# infra paths, so a non-infra merge never re-scans, and the weekly cron is the safety net. It surfaced
# because Renovate pushed a branch and the non-PR full sweep ran there, which then BLOCKED two unrelated
# dependency PRs: branch protection requires `infra-image-scan / infra-image-scan*`, a glob matching the
# push-event context as well as the pull_request one. So an infra CVE with no relation to a PR's diff
# can make that PR unmergeable.
#
# FIXED 2026-09-01 (item #281): `ci-status` used to report such a PR mergeable, because it read
# pull_request contexts only, and the advice here was to re-run it with `--event push`. That
# workaround is no longer needed — the verdict now evaluates every event (branch protection's globs
# all end in `*`, so they match the push-suffixed context too) and the report names the off-view
# context under ALSO GATING. `--event` still narrows the view when you want one.

# ── NEW advisory on unchanged pinned images, triaged 2026-09-01 (item #329) ───────────────────────
# CVE-2026-56854 — golang.org/x/crypto below 0.55.0 (fix published 2026-08-11). ONE advisory, 28
# blocking findings, nine pulled images. Every entry below is that single CVE; none of these images
# is one we build.
#
# WHY ENTRIES AND NOT A BUMP — the rule this file states for itself ("an entry would only be right if
# no fix existed"), checked per image against upstream release dates on 2026-09-01:
#   caddy 2.11.4-alpine ......... v2.11.4 is latest (2026-06-03) — predates the fix, no newer tag
#   openpolicyagent/opa 1.20.1 .. v1.20.1 is latest (2026-08-28) — postdates the fix yet still ships
#                                 x/crypto 0.54.0, so upstream has not picked it up
#   grafana/otel-lgtm 0.32.0 .... v0.32.0 is latest (2026-08-28) — same
#   minio/mc .................... already on the latest RELEASE tag
#   minio/minio ................. a newer tag exists (RELEASE.2025-10-15) but STILL predates the fix
#   hashicorp/vault 1.18 ........ deliberately pinned (feature 036); already carries three entries
#   mongodb-community-server .... deliberately pinned on 8.0.8 (feature 036)
# Remediation for all of the above is an UPSTREAM REBUILD against x/crypto 0.55.0, which is already
# happening: axllent/mailpit:v1.31.0 reports x/crypto v0.55.0 in its own warnings.
#
# Our six BUILT images are Node/Python/Rust/Alpine — no Go — so cd-deploy's Trivy gate is unaffected.
#
# EXPIRY 2026-10-01 is deliberate: these are time-boxed to force re-triage, not accepted permanently.
# The 14-day warning window starts reporting them 2026-09-17. Per item #303, DELETE each entry when
# its image is remediated rather than letting the date pass — an entry that matches nothing keeps
# failing under UNMATCHED ENTRIES instead of ageing out quietly.
