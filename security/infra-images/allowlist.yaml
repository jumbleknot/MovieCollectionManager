  justification: 'New advisory published 2026-09-16 (github.com/rabbitmq/amqp091-go below 1.13.0 — missing explicit TLS minimum version in the URI parser) in our from-source MinIO image (feature 069, item #420). THE SAME THREE ADVISORIES already carry entries here for grafana/otel-lgtm from the 2026-09-18 window, so this continues a triaged accepted risk reaching a second image by a different route. NO UPSTREAM RELEASE CLEARS IT, measured at the source 2026-09-26 rather than inferred: amqp091-go is v1.10.0 in the go.mod of our pin RELEASE.2025-09-07T16-13-09Z, of the NEWEST release RELEASE.2025-10-15T17-29-55Z, and of master. Structurally unfixable by waiting: MinIO''s last community release is 2025-10-15, ELEVEN MONTHS before these advisories were published, and community edition has stopped releasing — there is no upstream cadence left to deliver a fix. Reachable only through MinIO''s AMQP event-notification target: no MINIO_NOTIFY_* variable is set anywhere in the tree, no AMQP broker exists in any stack, and all four instances run a bare `server /data` with only root credentials, so the client is never constructed. Not internet-facing — the backup instance binds 127.0.0.1:9100/9101 and prod''s langfuse-minio declares no ports at all. Version-keyed to the MINIO_TAG-derived tag so a MinIO bump — the only thing that could ever clear it — re-blocks and forces a fresh scan. Time-boxed; delete on upstream remediation, do not renew.'
  addedBy: 'item-560'
  expiry: '2026-12-01'
