# ── proxy-addr IP spoofing CVE-2026-90711 / GHSA-jqcg-44mw-7w3h (triaged 2026-10-09) ────────────────
# Published against proxy-addr 1.1.0-2.0.7 (fix 2.0.8, released 2026-09-15) on two UNCHANGED pins, so it
# reddened `infra-image-scan` on the 2026-10-09 window's base-image PR (#697) and the weekly sweep.
# THE BUG: an IPv4-mapped IPv6 trust SUBNET with a short prefix (`::ffff:10.0.0.0/8`) compiles to "trust
# every IPv4 peer", so a client can choose req.ip via X-Forwarded-For. It is reachable ONLY through a
# subnet list passed to proxy-addr's compile(), i.e. an Express `trust proxy` set to an address/CIDR list.
# MEASURED in each exact digest 2026-10-09 (grep of the shipped dist, not the source tree):
#   - unleash-server: dist/lib/app.js sets `app.set('trust proxy', true)` — the boolean, which Express
#     handles without compiling any subnet, so the defective path is never entered. (`true` already
#     trusts X-Forwarded-For by design; the CVE does not change that, and the prod UI is tailnet-only.)
#   - langfuse-worker: never sets `trust proxy` (Express default false) and never reads req.ip/req.ips;
#     proxy-addr is an unused transitive of the worker's health endpoint.
# WHY NOT THE BUMP: unleash 8.2.0 is the newest release upstream (no fixed image exists); langfuse 4.55.0
# exists but the 4.35.0 -> 4.5x move is item #642, the same deliberate upgrade the entries above wait on.
# Keyed to version AND digest so any image change re-blocks; expiry matches the langfuse entries above.
- image: '^langfuse/langfuse-worker:4\.35\.0@sha256:5e35e625a214'
  id: 'CVE-2026-90711'
  justification: 'proxy-addr 2.0.7 trust-subnet IP spoofing. NOT REACHABLE, measured in this exact image 2026-10-09: /app/worker/dist never sets Express `trust proxy` (default false, no subnet compiled) and never reads req.ip/req.ips. Upgrade is item #642; delete on that upgrade, do not renew.'
  addedBy: 'renovate-window-2026-10-09'
  expiry: '2026-10-23'
- image: '^unleashorg/unleash-server:8\.2\.0@sha256:5020013b7a9a'
  id: 'CVE-2026-90711'
  justification: 'proxy-addr 2.0.7 trust-subnet IP spoofing. NOT REACHABLE, measured in this exact image 2026-10-09: dist/lib/app.js sets `trust proxy` to the boolean true, which Express handles without proxy-addr compiling any subnet. 8.2.0 is the newest upstream release, so no fixed image exists yet; delete when Renovate proposes one, do not renew without re-measuring.'
  addedBy: 'renovate-window-2026-10-09'
  expiry: '2026-10-23'


