# criterion (aquasec/trivy:0.74.0 --severity CRITICAL --ignore-unfixed, ghcr DB + Java DB mirrors):
# ZERO fixable Criticals on either image — the web image ships next 16.3.8 (past the 16.3.6 fix), and
# the 4.49.0 piscina CVE-2026-102992 regression described below is gone too. Both entries were deleted
# rather than re-keyed (item #303): they would match nothing and fail --check-expiring. The comment
# below is kept as the record of why they existed.
#
# Published 2026-09-22 against next 16.2.0-16.3.5 (fix 16.3.6) on the UNCHANGED 4.35.0 pins, so it
# reddened `infra-image-scan` for every PR it ran on (including wiki-only #635) and the 2026-10-02 window.
# WHY NOT THE BUMP: Renovate never proposed one — `:4` was repushed 2026-09-23/24/25/29/30 and 10-01,
# so the global 3-day minimumReleaseAge never expired at a Friday window (the floating-tag cooldown
# treadmill, same shape as node:24-bookworm on #360). And the bump does NOT go green by itself:
# 4.49.0 (web a9d1951e, worker 40df08a1) scanned locally 2026-10-02 under the gate criterion
# (aquasec/trivy:0.74.0 --severity CRITICAL --ignore-unfixed, ghcr DB mirrors) clears THIS advisory
# but adds a new fixable Critical, CVE-2026-102992 (piscina 5.3.0, fix 5.3.2), in the web image.
# 14 minors with Postgres/ClickHouse migrations on a prod stack is a deliberate upgrade (ADR-0002),
# not a window side-effect — item #642 — and these entries buy the time for it.
# Keyed to version AND digest. The pin moved from the floating `:4` to `4.35.0` (same digests,
# verified against Docker Hub 2026-10-02) so Renovate can age each release on its own tag; any
# version or digest change re-blocks and forces a fresh scan.

# ── proxy-addr IP spoofing CVE-2026-90711 / GHSA-jqcg-44mw-7w3h (triaged 2026-10-09) ────────────────
# Published against proxy-addr 1.1.0-2.0.7 (fix 2.0.8, released 2026-09-15) on two UNCHANGED pins, so it
# reddened `infra-image-scan` on the 2026-10-09 window's base-image PR (#697) and the weekly sweep.
# THE BUG: an IPv4-mapped IPv6 trust SUBNET with a short prefix (`::ffff:10.0.0.0/8`) compiles to "trust
# every IPv4 peer", so a client can choose req.ip via X-Forwarded-For. It is reachable ONLY through a
# subnet list passed to proxy-addr's compile(), i.e. an Express `trust proxy` set to an address/CIDR list.
# MEASURED in each exact digest 2026-10-09 (grep of the shipped dist, not the source tree):
#   - unleash-server: dist/lib/app.js sets `app.set('trust proxy', true)` — the boolean, which Express
#     handles without compiling any subnet, so the defective path is never entered. (`true` already
#     trusts X-Forwarded-For by design; the CVE does not change that, and the prod UI is tailnet-only.)
#   - langfuse-worker 4.35.0: never set `trust proxy` (Express default false) and never read req.ip/req.ips;
#     proxy-addr was an unused transitive of the worker's health endpoint. ITS ENTRY WAS DELETED 2026-10-10:
#     item #642 moved the worker to 4.56.0 (sha256:3f7571ff3a72), which scans with ZERO fixable Criticals
#     under the gate criterion, so the entry would only have matched nothing (item #303).
# WHY NOT THE BUMP (unleash): 8.2.0 is the newest release upstream, so no fixed image exists (item #711).
# Keyed to version AND digest so any image change re-blocks. The unleash entry was RENEWED 2026-10-10
# (item #711) after re-measuring the same digest: still no fixed release upstream, still the boolean
# `trust proxy`. Its expiry moved to 2026-12-01, the same date as the other open cohorts, so they are
# re-triaged together.
- image: '^unleashorg/unleash-server:8\.2\.0@sha256:5020013b7a9a'
  id: 'CVE-2026-90711'
  justification: 'proxy-addr 2.0.7 trust-subnet IP spoofing. NOT REACHABLE, measured in this exact image 2026-10-09 and RE-MEASURED 2026-10-10 (item #711): dist/lib/app.js line 43 sets `trust proxy` to the boolean true, unconditionally, and it is the only `trust proxy` in /unleash/dist, so Express never has proxy-addr compile a subnet. proxy-addr is 2.0.7 everywhere in the image. 8.2.0 (2026-09-08) is still the newest upstream release, so no fixed image exists; delete when Renovate proposes one, do not renew without re-measuring.'
  addedBy: 'renovate-window-2026-10-09; renewed 2026-10-10 (item #711)'
  expiry: '2026-12-01'


