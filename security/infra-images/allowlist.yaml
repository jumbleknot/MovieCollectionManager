# Infra-image CVE finding allowlist — feature 035 (see specs/035-infra-image-cve-scan/data-model.md).
#
# Consumed ONLY by the gate (scripts/check-infra-image-findings.mjs). Suppresses a matching finding
# from the blocking gate while it stays VISIBLE in security/infra-images/reports/findings.json. The
# gate fails only on `blocking` findings (FIXABLE Critical — matching the cd-deploy Trivy gate);
# fixable High and everything else (unfixable, Medium, Low) are non-blocking warnings.
#
# Match key (all four required; a blank field or invalid regex is a GATE ERROR):
#   - image:           regex vs Finding.image (the scanned repo:tag)
#     id:              regex vs advisory id (CVE-*/GHSA-*)
#     justification:   why accepted — usually "awaiting Renovate base-image bump to <fixed tag>"
#     addedBy:         who triaged
#     expiry:          optional ISO YYYY-MM-DD — once past, the entry stops suppressing (re-blocks)
#
# ═════════════════════════════════════════════════════════════════════════════════════════════════
# BASELINE (seeded 2026-07-11 from the first Linux/CI Trivy scan — Trivy is not on the Windows dev
# box). Every entry below is a pre-existing FIXABLE Critical present at seeding; `main` is green on
# day one and the gate thereafter blocks only NEW fixable-Critical findings. Remediation is a Renovate
# base-image bump; delete the entry after the bump so a regression re-blocks. Fixable HIGH CVEs (851 at
# seeding) are report-only warnings (base OS images carry hundreds — gating on those is noise; same
# CRITICAL-only policy as cd-deploy). See security/infra-images/reports/findings.json for the full set.
# ═════════════════════════════════════════════════════════════════════════════════════════════════

# caddy: all 5 fixable Criticals (CVE-2025-44005, CVE-2025-68121, CVE-2026-30836, CVE-2026-31789,
# CVE-2026-33186) remediated by bumping 2.10-alpine→2.11.4-alpine (feature 036). Locally Trivy-verified
# clean (smallstep 0.30.2, grpc 1.81.0, Go 1.26.3, libcrypto3 3.5.7-r0). Entries removed; PR re-scans.
# otel-lgtm pgx CVE-2026-33815 / CVE-2026-33816: entries REMOVED 2026-07-26. Grafana rebuilt
# `latest` with pgx/v5 >= 5.9.0, so neither advisory appears on the current image. Deliberately
# removed WITHOUT a local re-scan: on 2026-07-26 the DinD daemon was down, so nothing could be pulled
# or scanned here that day. (The wording was "Trivy is not available in the dev container", which read
# as a permanent property and is NOT one — corrected 2026-09-14, when a full local sweep of all 19
# pulled images re-triaged both expiring cohorts. Trivy runs here from its own image; see the runbook
# §"In the dev container". A daemon that is down is a fact about that morning, not a capability.)
# Removal was still the fail-SAFE direction — if CI's own pull still carries either CVE, the
# infra-image-scan job on this PR re-blocks the gate and the entries come back with CI evidence
# attached. That PR-side scan IS the CI-side confirmation the follow-up asked for; `security/
# infra-images/**` is in the workflow's path filter, so touching this file triggers a full sweep.
# ── NEW advisories on unchanged pinned images (triaged 2026-07-26) — ALL THREE REMEDIATED UPSTREAM,
#    ENTRIES DELETED 2026-08-30 (item #303) ─────────────────────────────────────────────────────────
# The three entries that stood here — grafana/otel-lgtm GHSA-r277-6w6q-xmqw (kin-openapi) and
# langfuse/langfuse:3 + langfuse/langfuse-worker:3 GHSA-7rqj-j65f-68wh (next-auth) — are gone.
#
# Their reasoning was "a floating/major-only tag already resolves to newest, so there is no bump to
# make; remediation is upstream rebuilding the image with the fixed dep". Upstream did exactly that.
# Verified 2026-08-30 by a full local Trivy sweep of all 21 infra images (aquasec/trivy:0.74.0,
# ghcr.io DB mirrors): NEITHER advisory appears on ANY image, and all three images report zero
# blocking findings (otel-lgtm 354 findings / 0 blocking; each langfuse image 17 / 0).
#
# WHY DELETED RATHER THAN LEFT TO EXPIRE ON 2026-10-24. An entry that matches nothing does not sit
# harmlessly until its date — the gate reports it under UNMATCHED ENTRIES, and `--check-expiring`
# fails on it. These three (with two more in the SAST allowlist) had kept the weekly allowlist-expiry
# run red for three consecutive weeks, which is how they were found. The signal that exists to catch
# ONE stale suppression cannot do that while saturated by five, and expiry would not have cleared
# them — an expired entry that matches nothing keeps failing, it just changes which list it fails in.
# Deleting is also the direction that restores blocking: if either advisory returns, it re-blocks.
