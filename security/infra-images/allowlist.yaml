# CVE-2025-14813 (bcprov-jdk18on 1.82→1.84) remediated by bumping Keycloak 26.5.5→26.7.0 (feature 036).
# Entry removed: the 26.5.5 ref no longer exists.
#
# AND AGAIN, 2026-08-29: Critical CVE-2026-18963 (org.keycloak:keycloak-services) appeared on 26.7.0,
# un-allowlisted and therefore blocking, remediated the same way — 26.7.0→26.7.2, which Trivy itself
# named as a fix version (26.4.15, 26.6.6, 26.7.2). No allowlist entry is added for it: bumping the tag
# is the remediation, and an entry would only be right if no fix existed.
#
# WORTH KNOWING FOR THE NEXT ONE. This did not surface on `main` — the push trigger is path-filtered to
# infra paths, so a non-infra merge never re-scans, and the weekly cron is the safety net. It surfaced
# because Renovate pushed a branch and the non-PR full sweep ran there, which then BLOCKED two unrelated
# dependency PRs: branch protection requires `infra-image-scan / infra-image-scan*`, a glob matching the
# push-event context as well as the pull_request one. So an infra CVE with no relation to a PR's diff
# can make that PR unmergeable.
#
# FIXED 2026-09-01 (item #281): `ci-status` used to report such a PR mergeable, because it read
# pull_request contexts only, and the advice here was to re-run it with `--event push`. That
# workaround is no longer needed — the verdict now evaluates every event (branch protection's globs
# all end in `*`, so they match the push-suffixed context too) and the report names the off-view
# context under ALSO GATING. `--event` still narrows the view when you want one.

# ── NEW advisory on unchanged pinned images, triaged 2026-09-01 (item #329) — FULLY DISCHARGED ────
# HISTORY ONLY: no CVE-2026-56854 entry survives in this file. The reasoning is kept because the
# removal block below is only readable against it; see that block for what actually discharged it.
#
# CVE-2026-56854 — golang.org/x/crypto below 0.55.0 (fix published 2026-08-11). ONE advisory, 28
# blocking findings, nine pulled images, none of them an image we build.
#
# WHY ENTRIES AND NOT A BUMP — the rule this file states for itself ("an entry would only be right if
# no fix existed"), checked per image against upstream release dates on 2026-09-01:
#   caddy 2.11.4-alpine ......... v2.11.4 is latest (2026-06-03) — predates the fix, no newer tag
#   openpolicyagent/opa 1.20.1 .. v1.20.1 is latest (2026-08-28) — postdates the fix yet still ships
#                                 x/crypto 0.54.0, so upstream has not picked it up
#   grafana/otel-lgtm 0.32.0 .... v0.32.0 is latest (2026-08-28) — same
#   minio/mc .................... already on the latest RELEASE tag
#   minio/minio ................. a newer tag exists (RELEASE.2025-10-15) but STILL predates the fix
#   hashicorp/vault 1.18 ........ deliberately pinned (feature 036); already carries three entries
#   mongodb-community-server .... deliberately pinned on 8.0.8 (feature 036)
# Remediation for all of the above is an UPSTREAM REBUILD against x/crypto 0.55.0, which is already
# happening: axllent/mailpit:v1.31.0 reports x/crypto v0.55.0 in its own warnings.
#
# Our six BUILT images are Node/Python/Rust/Alpine — no Go — so cd-deploy's Trivy gate is unaffected.
#
# EXPIRY 2026-10-01 is deliberate: these are time-boxed to force re-triage, not accepted permanently.
# The 14-day warning window starts reporting them 2026-09-17. Per item #303, DELETE each entry when
# its image is remediated rather than letting the date pass — an entry that matches nothing keeps
# failing under UNMATCHED ENTRIES instead of ageing out quietly.
# ── ALL FIVE REMAINING CVE-2026-56854 ENTRIES REMOVED 2026-09-14 (item #329, re-triage) ───────────
# caddy:2.11.4-alpine · grafana/otel-lgtm:0.32.1 · hashicorp/vault:1.18 ·
# mongodb/mongodb-community-server:8.0.8-ubi9 · ollama/ollama:0.32.1 — gone, and NOT for the reason
# the block above predicted.
#
# THE ADVISORY WAS RE-RATED, NOT REMEDIATED. This block was written on 2026-09-01 when Trivy scored
# CVE-2026-56854 CRITICAL, which is the only tier this gate blocks on. Trivy's DB now scores it
# HIGH — measured 2026-09-14 against a DB stamped that morning (UpdatedAt 07:14 UTC), full local
# sweep of all 19 pulled images. Fixable High is a report-only warning here (same Critical-only
# policy as cd-deploy), so every one of these five suppressed nothing: of the sweep's 21 blocking
# findings, ZERO are CVE-2026-56854. An entry that suppresses nothing is the thing item #303 exists
# to delete.
#
# SAY PLAINLY WHAT DID NOT HAPPEN: upstream has NOT shipped the fix. caddy:2.11.4-alpine still
# reports golang.org/x/crypto v0.52.0 against a fix of 0.55.0 — the package is exactly where it was.
# The accepted risk is unchanged; only its rating moved, and with it the tier that gates on it. The
# finding stays VISIBLE in reports/findings.json as a warning, which is where a re-rating this
# direction belongs.
#
# WHY DELETE RATHER THAN RENEW. Renewing would time-box a suppression that suppresses nothing, and
# would have kept all five in the expiry report — measured: at 2026-09-17 the check reports exactly
# 7 entries EXPIRING, so Friday's 07:00 UTC cron goes red on entries no longer doing any work.
# Deleting is also the direction that RESTORES blocking: if the score returns to Critical, or if a
# genuinely Critical x/crypto advisory lands on any of these images, the gate blocks and the entry
# comes back with fresh evidence. That is the outcome to want.
#
# A SEVERITY RE-RATING IS A THIRD WAY AN ENTRY GOES STALE, alongside "upstream rebuilt it" and "the
# ref left the pulled set". It looks identical to remediation in the gate's output and is NOT one —
# so check the package version before writing "remediated", as was done here.
#
# ollama/ollama, the one open question item #329 carried and could not answer: it asked whether the
# newer v0.33.2 — which POSTDATES the x/crypto fix — already ships 0.55.0, and said to bump the pin
# and delete the entry if so. ANSWERED 2026-09-14 by scanning the newest tag, 0.34.0, directly: NO,
# and the intuition behind the question is backwards. 0.34.0 ships golang.org/x/crypto **v0.43.0**,
# which is OLDER than the v0.52.0 on our pinned 0.32.1 — it carries CVE-2026-56854 plus nine further
# High x/crypto advisories that 0.32.1 does not. A publication date AFTER a fix says nothing about
# whether the image picked the fix up; only reading the shipped version does. Upgrading ollama on
# CVE grounds would have moved x/crypto backwards, so no bump of this pin is owed and none should be
# filed on this advisory's account. (0.34.0 has no fixable Critical either, so nothing here blocks.)
# openpolicyagent/opa CVE-2026-56854 (x/crypto <0.55.0): entry REMOVED 2026-09-10 (item #406) —
# the bump WAS the remediation. PR #362 moved both refs to 1.20.2/1.20.2-debug and its sweep (run
# 3027) produced no blocking opa finding at all, so upstream picked the fix up between 1.20.1 and
# 1.20.2. Deleted rather than left to expire on 2026-10-01, per item #303: an entry that matches
# nothing does not age out quietly, it fails under UNMATCHED ENTRIES and reddens the weekly
# allowlist-expiry run. Deleting is also the direction that restores blocking — if the advisory
# returns on a later opa, it re-blocks.

# ── minio/minio and minio/mc: ALL SIX ENTRIES REMOVED 2026-09-11 (feature 069, item #420) ─────────
# Four seed entries (CVE-2025-68121 and CVE-2026-33186 on each image) and two item-329 entries
# (CVE-2026-56854 on each) are gone, because the images they key on left the pulled set entirely.
#
# MinIO deleted both repositories from Docker Hub on 2026-09-11 and had already moved the community
# edition to source-only distribution in October 2025, so no registry receives updates any more. We
# now build our own image from source (infrastructure-as-code/docker/minio/Dockerfile) and reference
# it as ${REGISTRY_HOST}/jumbleknot/minio. These keys can never match again.
#
# NOT RE-KEYED TO THE NEW IMAGE, DELIBERATELY. Whether the from-source build still carries these
# advisories is an empirical question the first real sweep answers — and it plausibly does not:
# CVE-2025-68121 is a Go STDLIB finding that exists because upstream shipped an old toolchain, and we
# now choose our own (golang:1.25-alpine). Writing a suppression before observing the finding would
# suppress something never seen, and would hide exactly the improvement this feature was built for.
# If a Critical does appear on our image, triage it then, on its merits, with evidence attached.
#
# Deletion rather than expiry, per item #303: an entry matching nothing does not age out quietly — it
# fails under UNMATCHED ENTRIES and reddens the weekly allowlist-expiry run.

# ── OUR OWN from-source MinIO image, triaged 2026-09-11 (feature 069, item #420) ──────────────────
# Written only AFTER observing the finding, never before. The entries for the deleted upstream images
# were deliberately not re-keyed to this one, because whether a from-source build carries the same
# advisories is an empirical question — and the answer turned out to be "one of them, not both".
#
# WHAT THE FIRST SCAN OF OUR IMAGE ACTUALLY FOUND (minio-image run 3123):
#
#   CVE-2025-68121  Go stdlib     — ABSENT. Present on the upstream image, and on postgres, mongodb
#                                   and vault, because those ship an old Go. We choose our builder
#                                   (golang:1.25-alpine), so this one is a build input, not a
#                                   suppression. This is the feature's central claim, confirmed.
#   CVE-2026-33186  grpc v1.72.0  — PRESENT, and not fixable by anything under our control.
#
# WHY AN ENTRY AND NOT A BUMP, checked rather than assumed (2026-09-11):
#   minio RELEASE.2025-09-07T16-13-09Z  go.mod pins google.golang.org/grpc v1.72.0 (indirect)
#   minio RELEASE.2025-10-15T17-29-55Z  go.mod pins google.golang.org/grpc v1.72.0 (indirect)  <- newest
#   mc    RELEASE.2025-08-13T08-35-41Z  go.mod pins google.golang.org/grpc v1.71.0 (indirect)
#   fix requires >= 1.79.3
# So even the newest upstream release — the one titled "Security/CVE" — does not clear it. It is an
# INDIRECT dependency of upstream's module graph; choosing our Go toolchain cannot move it.
#
# CONSIDERED AND REJECTED: forcing it with `go mod edit -replace google.golang.org/grpc@v1.79.3`. That
# rewrites upstream's dependency graph on our own initiative, eight minor versions forward, on a
# service holding production object data — a much larger change than the advisory warrants, and one
# needing its own verification. Revisit if the advisory's exploitability against MinIO's actual use of
# grpc is established, or if upstream bumps it.
#
# Same advisory the deleted upstream images carried as seed entries, so this is continuity of an
# existing accepted risk, not a new one. Internal-only (Langfuse object store, not internet-facing).
# Time-boxed; DELETE when a MinIO release ships grpc >= 1.79.3 rather than renewing the date.
# ── The 2026-09-16 amqp091-go cohort, on OUR from-source MinIO image (item #560) ──────────────────
# Three CRITICALs in github.com/rabbitmq/amqp091-go v1.10.0 (fix 1.13.0), all published 2026-09-16:
#   CVE-2026-77405  missing explicit TLS minimum version in the URI parser
#   CVE-2026-77408  silent data truncation / state corruption via a shortstr integer overflow
#   CVE-2026-77411  protocol desynchronization and frame injection via an integer overflow in readLongstr
#
# THE SAME THREE ADVISORIES already carry entries above for grafana/otel-lgtm, added by the 2026-09-18
# Renovate window. This is the same cohort reaching a second image by a different route — otel-lgtm
# through otelcol-contrib's rabbitmq receiver, MinIO through its AMQP event-notification target — so
# this continues an already-triaged accepted risk rather than opening a new question.
#
# HOW IT SURFACED, and how long it went unseen. `minio-image.yml` gates its own publish on this scan,
# and its weekly cron went red on 2026-09-18 (run 3518) and every run since — 3947, 3960, 3979, and
# the post-merge run on `main`. Nothing reported it: the scheduled run posts NO commit status, the
# health digest does not read this workflow, and on a pull request `minio-image / build-publish` is
# ADVISORY, so a red never blocks and nothing summarises it. Two weeks of a red gate on `main`, in
# silence. That visibility gap is item #560's other half and is NOT fixed by this entry.
#
# NO UPSTREAM RELEASE CLEARS IT — measured at the source, not inferred (2026-09-26):
#   RELEASE.2025-09-07T16-13-09Z  go.mod: amqp091-go v1.10.0   <- our pin
#   RELEASE.2025-10-15T17-29-55Z  go.mod: amqp091-go v1.10.0   <- the NEWEST release
#   master                        go.mod: amqp091-go v1.10.0
# `curl raw.githubusercontent.com/minio/minio/<ref>/go.mod | grep amqp091-go`, three refs, one answer.
#
# AND THE STRUCTURAL REASON IT WILL NOT CHANGE BY WAITING: MinIO's last community release is
# 2025-10-15, **eleven months BEFORE these advisories were published**. Community edition moved to
# source-only and then stopped releasing; there is no upstream cadence left to deliver a fix. This is
# criterion 1 of the `docs/runbooks/renovate.md` §4 rule in its strongest form — not "the wait is
# long", but "no wait can ever satisfy it".
#
# WHY THE RISK IS ACCEPTED. All three defects are in the AMQP **client**, reachable only once MinIO
# instantiates an AMQP notification target and connects to a broker. Checked across the whole tree
# (2026-09-26), not assumed:
#   • NO `MINIO_NOTIFY_*` variable is set anywhere — zero matches under infrastructure-as-code/,
#     scripts/ and the BFF server;
#   • NO AMQP broker exists in any stack — zero matches for rabbitmq or :5672;
#   • all four MinIO instances run the same bare `server /data --console-address :9001` with only
#     root credentials in `environment:`, so no target is configured at startup either.
# With no target configured the client is never constructed, and the vulnerable readers and URI
# parser are never reached.
#
# NOT INTERNET-FACING, on either instance:
#   • `mcm-bff-backup-minio` publishes 127.0.0.1:9100/9101 — LOOPBACK only;
#   • prod `langfuse-minio` declares NO `ports:` at all — internal compose network only.
#
# KEYED TO THE VERSION, DELIBERATELY DIVERGING FROM THE SIBLING ENTRY BELOW. The grpc entry keys on
# the bare `jumbleknot/minio:` prefix, which matches every tag this image will ever carry; that was
# accepted for it, but a floating key is exactly what feature 063 / item #297 forbids, and here it
# would be actively wrong. Our tag is DERIVED from `MINIO_TAG` (`2025.09.07-161309` from
# `RELEASE.2025-09-07T16-13-09Z`), so the version key makes a MinIO bump discharge these entries
# mechanically: the moment the tag moves they stop matching, the gate re-blocks, and they come back
# only with a scan of whatever release actually landed. Since a MinIO bump is the ONLY thing that
# could ever clear these advisories, that is precisely the event this entry must not survive.
# The registry host is still omitted — it is topology-sensitive and injected at runtime, and the
# matcher is an unanchored regex, so this matches `<forge>/jumbleknot/minio:2025.09.07-161309@<digest>`.
#
# EXPIRY 2026-12-01 joins the existing cohort so the next re-triage stays one sitting. Per item #303,
# DELETE these when upstream is remediated rather than letting the date pass.
- image: 'jumbleknot/minio:2025\.09\.07-161309'
