# ── otel-lgtm amqp091-go CVE-2026-77405 / -77408 / -77411: ALL THREE ENTRIES DELETED 2026-10-02 ────────
# Discharged by the 2026-10-02 `docker base images` bump (PR #639) to 0.34.0@sha256:b966ea10, exactly
# as the version key was designed to force. That digest was scanned directly the same day under the
# gate criterion (aquasec/trivy:0.74.0 --severity CRITICAL --ignore-unfixed, ghcr DB mirrors, 25
# targets): ZERO fixable Criticals, so upstream's otelcol-contrib rebuild landed and nothing is left to
# suppress. Deleted rather than re-keyed (item #303): a re-keyed entry would match nothing and fail
# --check-expiring, and deleting is the direction that restores blocking if the advisories return.
# The rationale that stood here — how it surfaced on run 3521, why the risk was accepted, why it was
# version-keyed — is in git history at this file's 2026-09-25 revision.

# ── NEW advisory on an unchanged pinned image, triaged 2026-09-19 (item #486) ────────────────────
# WHY IT APPEARED ON A PIN NOBODY TOUCHED. CVE-2026-8763 was published to NVD on 2026-08-03 but was
# only reviewed into the GitHub advisory database at 2026-09-18T17:35:38Z, so Trivy's DB began
# carrying it overnight. Runs of infra-image-scan hours apart therefore disagreed on identical code:
# run 3619 (01:38Z) green, run 3632 (02:2xZ) blocking. That is the sweep working exactly as intended
# — "a newly-published advisory can render an UNCHANGED pinned image vulnerable" — and it is the
# second such event in two days, after the otel-lgtm cohort immediately above.

# ── NEW advisory on an unchanged pinned image, triaged 2026-09-25 (surfaced by PR #553) ──────────
# CVE-2026-84939 — org.freemarker:freemarker 2.3.32 (fix 2.3.35), GHSA-27j2-h3m2-8237.
#
# HOW IT SURFACED, and why it had not been seen before. Nothing in the repository changed: the
# keycloak pin has been 26.7.3@sha256:29be7252 throughout. `infra-image-scan` is PATH-FILTERED on
# the push trigger, so `main` does not run it on an ordinary merge — PR #553 touched
# infrastructure-as-code/ (realm redirect URIs for account deletion, nothing to do with images) and
# that is what made the gate run and the finding block. Same shape as the 2026-08-29 keycloak case
# and the 2026-09-18 otel-lgtm cohort recorded above: an advisory lands, and the next PR to trip the
# path filter wears it.
#
# NO UPSTREAM TAG CLEARS IT, measured rather than inferred. Both 26.7.3 (the pin) and 26.7.4 (the
# newest release, 2026-09-16, and what Renovate offers) were scanned on 2026-09-25 with
# aquasec/trivy:0.74.0 using the gate's own criterion (--severity CRITICAL --ignore-unfixed). 26.7.4
# reports THREE fixable Criticals and freemarker 2.3.32 is one of them:
#     CVE-2026-75595  io.netty:netty-handler 4.1.136.Final  (fix 4.2.17.Final / 4.1.137.Final)
#     CVE-2026-84939  org.freemarker:freemarker 2.3.32      (fix 2.3.35)
#     CVE-2026-8763   org.bouncycastle:bcprov-jdk18on 1.84  (fix 1.85)
# The first and third already have entries above, both established the same way. So the bump moves
# the tag and leaves the vulnerable jar in place; remediation is an upstream Keycloak rebuild.
#
# EXPLOITABILITY HERE. FreeMarker is Keycloak's server-side template engine for the login, account
# and email themes. Template content is operator-supplied, not user-supplied: this deployment
# configures NO custom theme (loginTheme/accountTheme/emailTheme/adminTheme are all unset in both
# dev-realm.json and ci-realm.json — checked, zero theme keys) and mounts no theme directory or
# provider jar into either compose file. The templates rendered are the ones shipped inside the
# image. Keycloak is also not internet-facing: prod publishes 19099 on the tailnet behind the host
# ufw default-deny (features 028/029) and dev binds 127.0.0.1:8099.
#
# Version-keyed on purpose, so the pending `docker base images` bump re-blocks and forces a fresh
# scan rather than inheriting this suppression. Time-boxed; delete on upstream rebuild, do not renew.

