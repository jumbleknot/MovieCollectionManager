# Feature 023 (US3) — Continuous Deployment. main-only: build 6 images via their Nx targets →
# Trivy scan (critical ⇒ block) → push by tag+digest → DIGEST-BY-GIT promotion (write the immutable
# …@sha256: digest into the tracked .env.deploy, commit+push) → fire the SIGNED Komodo webhook (git-
# style redeploy) → post-deploy health probe → rollback (git-revert the promotion + re-fire) on
# failure. Promote by digest, never rebuild for prod (FR-012..FR-017). Also builds the prod APK with
# the public BFF host baked (T018a).
#
# Why digest-by-git (NOT a posted digest body): Komodo's webhook is a git-style redeploy — it
# validates the branch in a GitHub-shaped payload + `X-Hub-Signature-256` (HMAC with the global
# KOMODO_WEBHOOK_SECRET, == the CI secret KOMODO_WEBHOOK_AUTH) and re-clones the branch. It will NOT
# consume a posted image digest, and Stack env vars set in the Komodo UI aren't reliably injected on
# webhook deploys (#1209). So CI carries the BARE digest in git via .env.deploy (host-free, R10) and
# Komodo's compose assembles ${REGISTRY_HOST}/jumbleknot/<svc>@${<SVC>_DIGEST} — REGISTRY_HOST from the
# gitignored .env.prod, the digest from git. There is no rollback endpoint → rollback = redeploy the
# prior digest (git-revert the promotion commit, re-fire). See Server-Setup-Runbook §9/§15 +
# specs/023-forgejo-cicd/contracts/{komodo-deploy-and-rollback,image-and-digest-promotion}.md.
#
# Trigger + ordering (FR-020, FR-025; CD hardening Option 2, 2026-07-03): this workflow is
# workflow_dispatch ONLY — it has no `push:` trigger and no polling ci-gate. Automatic deploys are
# initiated by app-ci's `trigger-cd` job, which `needs:` its own CI jobs and dispatches this workflow
# with deploy=true once guardrails+app-ci are green on `main`. Ordering is therefore a dependency edge,
# not an 80-min status poll that could time out while app-e2e sits queued on the single kvm runner.
# Branch protection on `main` (T021) remains the authoritative merge gate.
#
# workflow_dispatch inputs:
#   deploy=false (default): build + Trivy + push + promote-to-git ONLY — no webhook, no probe (a mint).
#   deploy=true           : full deploy — build → promote → signed webhook → health probe → rollback.
#   build_apk=true        : prod APK only.
# The promote/rollback push uses secrets.CD_PUSH_TOKEN (a whitelisted-user PAT) so it lands on protected
# `main`; the auto GITHUB_TOKEN is not a push-whitelisted user and is declined by the pre-receive hook.
#
# No committed infra-topology literal: registry host/namespace, the Komodo webhook, and the public
# BASE_DOMAIN are Forgejo Actions vars/secrets, never hardcoded (contracts/secrets-and-variables.md).
name: cd-deploy

on:
  # NOTE (CD hardening, step 1): the automatic `push: [main]` trigger is intentionally removed here.
  # The old push→ci-gate path polled for guardrails+app-ci with an 80-min wall clock while app-e2e could
  # sit queued on the single kvm runner → ci-gate timed out waiting for a job that hadn't started. Step 2
  # moves the deploy into app-ci as a `needs`-gated job (ordering by dependency edge, no polling/timeout).
  # Until then, main deploys are triggered explicitly via workflow_dispatch (deploy=true).
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Fire the Komodo webhook + health probe (true), or build+publish+promote only (false)'
        type: boolean
        default: false
      build_apk:
        description: 'Build ONLY the prod APK (public host baked) — skips image build/promote/deploy'
        type: boolean
        default: false

concurrency:
  group: cd-deploy-main
  cancel-in-progress: false   # never cancel an in-flight production deploy

env:
  REGISTRY: ${{ vars.REGISTRY }}
  NS: ${{ vars.NS }}
  REGISTRY_USER: ${{ vars.REGISTRY_USER }}
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ vars.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}
  # Tracked digest-by-git promotion files (un-ignored in .gitignore; see header). The SAME host-free
  # digest block is written into each prod stack's run_directory so every Komodo Stack uses a LOCAL
  # `Additional Env Files = .env.deploy` (no fragile ../ paths). bff→MCM_BFF_DIGEST, mc-service→
  # MC_SERVICE_DIGEST, agents→AGENT_GATEWAY/MOVIE_MCP/WEB_API_MCP/SPREADSHEET_MCP digests.
  ENV_DEPLOY_PATHS: "infrastructure-as-code/docker/bff/.env.deploy infrastructure-as-code/docker/mc-service/.env.deploy infrastructure-as-code/docker/agents/.env.deploy"

jobs:
  # ── Ordering note (CD hardening, Option 2) ────────────────────────────────────────────────────
  # There is deliberately NO `ci-gate` job here anymore. The old ci-gate POLLED the commit's guardrails
  # + app-ci statuses with an 80-min wall clock; on the single kvm runner app-e2e could sit QUEUED past
  # that window, so ci-gate timed out waiting for a job that hadn't even started (2026-07-03). Ordering
  # is now a dependency EDGE, not a poll: app-ci's `trigger-cd` job `needs:` its own CI jobs and only
  # dispatches this workflow (deploy=true) once they succeed on main — so cd-deploy comes into existence
  # only AFTER CI is green, and there is nothing to time out. Manual `workflow_dispatch` runs vouch for
  # state directly. Branch protection on `main` (T021) remains the authoritative merge gate.

  # ── Build → Trivy scan → push (tag+digest) → digest-by-git promote → signed redeploy → probe → rollback ──
  #     ONE job (FR-012..FR-017). The digest never leaves the job, so there is NO cross-job artifact —
  #     Forgejo's act_runner does not support upload/download-artifact@v4 (GHESNotSupportedError), and a
  #     v3 artifact handoff would be pointless churn here. Runs on the kvm/HOST runner because every
  #     `nx build` is a Docker IMAGE build and we docker push to the registry — neither works from the
  #     default `ubuntu-latest` node:22-bookworm container (no Docker CLI/daemon).
  build-deploy:
    # Skip the image build/scan/push/promote when the dispatch only wants the prod APK (build_apk=true).
    # (cd-deploy is dispatch-only now — app-ci's trigger-cd fires deploy=true on green main.)
    if: ${{ inputs.build_apk != true }}
    runs-on: kvm
    timeout-minutes: 120
    env:
      # Reach the ci user's rootless Docker daemon (adjust 1001 if `id -u ci` differs).
      DOCKER_HOST: unix:///run/user/1001/docker.sock
      # Drive Komodo this run? Opt-in via deploy=true (else build+scan+promote only, e.g. a pre-merge mint).
      DO_DEPLOY: ${{ inputs.deploy == true }}
    steps:
      # Full clone of the target branch WITH push creds — needed to build AND to commit/revert the digest.
      # ref_name = main on push; the dispatched branch otherwise.
      #
      # token = CD_PUSH_TOKEN (a write:repository PAT owned by a user on main's push whitelist), NOT the
      # auto GITHUB_TOKEN. The digest-by-git promote step pushes a `[skip ci]` commit straight to the
      # deployed branch; when that branch is protected (T021, required status checks), the auto Actions
      # token — which is NOT a whitelisted user — is rejected by the pre-receive hook ("Internal Server
      # Error … pre-receive hook declined"). A whitelisted-user PAT bypasses the check for its own direct
      # push while PR merges stay gated. persist-credentials makes the promote + rollback pushes use it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.CD_PUSH_TOKEN }}
          persist-credentials: true

      # Mirror app-e2e: install the Docker CLI if the job image lacks it, then confirm the daemon is
      # reachable over the mounted socket. Fail LOUD if not — the build can't proceed without Docker.
      - name: Set up Docker CLI (talk to the runner's daemon socket)
        run: |
          bash scripts/ci-log-step.sh build-deploy-set-up-docker-cli bash -e /dev/stdin <<'CI_LOG_STEP'
          if ! command -v docker >/dev/null 2>&1; then
            curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz \
              | tar xz -C /usr/local/bin --strip-components=1 docker/docker
          fi
          docker version --format 'client {{.Client.Version}}' || true
          if docker info >/dev/null 2>&1; then
            echo "docker daemon reachable"
          else
            echo "::error::Docker CLI present but daemon unreachable — mount /run/user/1001/docker.sock into the kvm job (runner config.yaml container.options), then restart the runner."
            exit 1
          fi
          CI_LOG_STEP
      - name: Free daemon disk space
        run: bash scripts/ci-log-step.sh build-deploy-free-daemon-disk-space docker image prune -af || true

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # Node >= 22.13 (package.json `engines.node`) — pnpm 11 refuses to run below it. This job was
      # left on Node 20 by the pnpm 11 bump: app-ci's four sites and prod-apk were fixed, this one
      # was MISSED, and it is the job that builds, pushes and deploys all six production images — so
      # the next deploy would have died at `pnpm install`. Found by check-toolchain-consistency.mjs
      # on its first run, before it fired. 24.14.1 matches the BFF runtime image and prod-apk.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0, cache: pnpm }
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # uv's VERSION, item #307. The action is digest-pinned; without this input the uv it
          # installs is whatever is newest at run time — and uv is the generator for the uv.lock
          # files the weekly lockFileMaintenance channel merges. One version across every site.
          version: '0.12.7' # uv-version
          # Authenticate the GitHub API call that resolves uv "latest" — the Forgejo runner has no GitHub
          # token, so the anonymous call hits the 60/hr rate limit and fails ("Set up uv", 2026-07-06).
          # RENOVATE_GITHUB_COM_TOKEN is the repo's read-only github.com PAT (also used by renovate.yml).
          github-token: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
      - name: Install dependencies
        run: bash scripts/ci-log-step.sh build-deploy-install-dependencies pnpm install --frozen-lockfile

      # ── 048 US2 — the LIVE pre-deploy model gate (FR-006) ───────────────────────────────────────
      # The strategy doc (§5.6), the constitution and test_golden_pairs.py's own docstring all
      # asserted that a live-model pre-deploy gate existed. It did not: guardrails runs the golden
      # suite in cassette REPLAY (keyless, deterministic — a regression check), and cd-deploy had no
      # live-model gate at any point. The `off`-mode branch was implemented and simply never invoked.
      # 048 US1 moved the FR-005 topic-confinement assertions onto the same replay gate, which is
      # correct for merge but removes the last live model signal — this step is what restores it at
      # the deploy boundary. US1 and US2 therefore ship together; US1 alone is a downgrade.
      #
      # `nx test:golden-live` = the golden-marked tests with LLM_CASSETTE_MODE unset, against the
      # REAL provider (MODEL_PROVIDER=anthropic, matching agents/compose.prod.yaml), with
      # MCM_REQUIRE_LIVE_MODEL=1 so an absent credential or an unreachable provider FAILS instead of
      # skipping (FR-007). Measured 2026-08-07: before that flag, a credential-less run of this gate
      # reported `1 passed, 50 skipped`, exit 0 — it would have waved every deploy through.
      #
      # An IN-JOB STEP, not a `needs:` job, for three reasons: build-deploy is deliberately one job
      # because the digest never leaves it (see the job header), so the promotion cannot be gated
      # from outside without an artifact handoff act_runner does not support; the toolchain this
      # needs (pnpm, uv, node) is already installed three steps up, where a separate job would
      # reinstall it on the repo's single runner; and a new job would incur its own feature-042
      # failure-digest obligation for no benefit (the same call guardrails.yml documents).
      #
      # Placed HERE — before "Build images", and so before "Scan, push", "Promote digest to git" and
      # "Fire signed Komodo redeploy webhook(s)" — which satisfies US2-AC1 ("before any image is
      # promoted or any Komodo webhook fires") at the earliest and cheapest point: a blocked deploy
      # costs ~1 minute rather than a full six-image build against a 120-minute timeout.
      #
      # NOT scheduled, and it must never become so (FR-008, product-owner constraint): quality gates
      # run at merge or at deploy. A timed run can only ever report damage already shipped.
      - name: Live-model golden gate (off mode — real provider, blocks promotion)
        env:
          # Per-surface credential (048 US4 / FR-016): deploy-gate spend must stay separately
          # attributable from app-e2e spend, so this is ANTHROPIC_API_CD_GOLDEN and NOT
          # ANTHROPIC_API_CI_E2E — pointing it at the latter would re-conflate two of the very
          # surfaces US4 exists to separate. The VARIABLE name stays ANTHROPIC_API_KEY: every
          # consumer keys on the name, only the secret behind it differs (FR-015).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_CD_GOLDEN }}
        run: bash scripts/ci-log-step.sh cd-golden-live pnpm nx test:golden-live movie-assistant

      # The kvm runner executes on the host as the unprivileged `ci` user — no sudo, no write to
      # /usr/local/bin. Install Trivy to a user-writable dir and put it on PATH for the scan step.
      - name: Install Trivy
        run: |
          bash scripts/ci-log-step.sh build-deploy-install-trivy bash -e /dev/stdin <<'CI_LOG_STEP'
          mkdir -p "$HOME/.local/bin"
          # PINNED — item #303. Both the install SCRIPT and the VERSION it installs were floating:
          # the script came from the moving branch `main` and was piped straight into sh, and no tag
          # was passed, so `install.sh [-b] bindir [-c] client [-d] [tag]` installed "the latest".
          # Two floating references in the tool that decides whether a Critical blocks a deploy, and
          # with no digest pin underneath — strictly worse than the infra images item #297 fixed.
          # Renovate keeps this current (customManagers in renovate.json, datasource github-releases);
          # renovate-workflow.guard.test.mjs asserts both files stay pinned and agree.
          TRIVY_VERSION=v0.74.0
          curl -fsSL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" \
            | sh -s -- -b "$HOME/.local/bin" "${TRIVY_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trivy" --version
          CI_LOG_STEP

      # Build all 6 images THROUGH their Nx targets (constitution — never a parallel raw docker build).
      - name: Build images (Nx targets)
        env:
          # Bake the PUBLIC Keycloak host into the mcm-bff WEB bundle — the browser performs the OAuth
          # authorize redirect, so it must target https://auth.<domain>, not the localhost:8099 default.
          # Same source as the prod APK's EXPO_PUBLIC_KEYCLOAK_NATIVE_URL (the Forgejo BASE_DOMAIN var,
          # never a committed literal); docker-build forwards it via `--build-arg EXPO_PUBLIC_KEYCLOAK_URL`.
          EXPO_PUBLIC_KEYCLOAK_URL: https://auth.${{ vars.BASE_DOMAIN }}
        # Through ci-log-step.sh so the build output + failing-step marker feed the failure digest
        # (feature 042). Body lives in scripts/cd/build-images.sh.
        run: bash scripts/ci-log-step.sh build-images bash scripts/cd/build-images.sh

      # Retag → scan (critical blocks) → login → push → capture digest into the run manifest AND the
      # digest-by-git promotion file (.env.deploy body). repo→VAR: uppercase, '-'→'_', suffix _IMAGE
      # (mcm-bff → MCM_BFF_IMAGE). Only MCM_BFF_IMAGE is consumed by a prod stack today; the rest are
      # emitted forward-compatibly for the mc-service/agent stacks when they land.
      - name: Scan, push (by tag + digest), build manifest + promotion file
        id: publish
        env:
          # Forgejo reserves the FORGEJO_/GITEA_/GITHUB_ secret-name prefixes, so this is REGISTRY_TOKEN.
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        # Through ci-log-step.sh so the Trivy CRITICAL table + push output + failing-step marker feed
        # the failure digest (feature 042) — this is the step the tar-CVE blocked. Body lives in
        # scripts/cd/scan-push.sh (keeps id: publish → still writes `manifest=` to $GITHUB_OUTPUT).
        run: bash scripts/ci-log-step.sh scan-push bash scripts/cd/scan-push.sh

      # Write the immutable digest(s) into the tracked .env.deploy and commit+push (`[skip ci]` so this
      # commit does NOT re-trigger cd-deploy). The promotion commit IS the deploy record; reverting it
      # is the rollback. Runs on every CD path (push + dispatch) so the operator always gets the digest
      # in git even on a build-only manual run.
      - name: Promote digest to git (.env.deploy)
        id: promote
        env:
          REF_NAME: ${{ github.ref_name }}
        # Through ci-log-step.sh for failure-digest coverage (feature 042). Body: scripts/cd/promote-digest.sh
        # (keeps id: promote → still writes changed=/commit= to $GITHUB_OUTPUT).
        run: bash scripts/ci-log-step.sh promote-digest bash scripts/cd/promote-digest.sh

      # Fire the SIGNED Komodo webhook: a GitHub-shaped push payload + X-Hub-Signature-256 (HMAC-SHA256
      # of the exact body bytes with KOMODO_WEBHOOK_AUTH). Komodo validates the branch + signature, then
      # re-clones and redeploys, interpolating the just-committed digest. KOMODO_WEBHOOK_URL may list
      # several stack webhooks (whitespace-separated) — all signed identically for this branch.
      - name: Fire signed Komodo redeploy webhook(s)
        if: ${{ env.DO_DEPLOY == 'true' }}
        env:
          KOMODO_WEBHOOK_URL: ${{ vars.KOMODO_WEBHOOK_URL }}
          KOMODO_WEBHOOK_AUTH: ${{ secrets.KOMODO_WEBHOOK_AUTH }}
          GH_REF: ${{ github.ref }}
        # Through ci-log-step.sh for failure-digest coverage (feature 042). Body: scripts/cd/komodo-redeploy.sh
        run: bash scripts/ci-log-step.sh komodo-redeploy bash scripts/cd/komodo-redeploy.sh

      # Post-deploy health probe (komodo-deploy-and-rollback.md step 5). BASE_DOMAIN is a Forgejo
      # variable (public host/topology, kept out of git — same rule as REGISTRY/KOMODO_WEBHOOK_URL).
      - name: Post-deploy health probe (issuer + app health)
        id: probe
        if: ${{ env.DO_DEPLOY == 'true' }}
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
        # Through ci-log-step.sh for failure-digest coverage (feature 042). Body: scripts/cd/health-probe.sh
        # (its exit code is preserved, so steps.probe.outcome still drives the rollback condition below).
        run: bash scripts/ci-log-step.sh health-probe bash scripts/cd/health-probe.sh

      # Rollback = redeploy the PRIOR digest. git-revert the promotion commit (restores the previous
      # .env.deploy), push, and re-fire the signed webhook so Komodo redeploys the last-good digest.
      # There is no Komodo rollback endpoint (FR-016). If the promotion was the first-ever (prior digest
      # empty), the revert restores the fail-fast empty value — prod refuses the bogus image rather than
      # serving it, and this step fails the run for operator attention.
      - name: Rollback to prior digest on probe failure
        if: ${{ failure() && steps.probe.outcome == 'failure' && steps.promote.outputs.changed == 'true' }}
        env:
          KOMODO_WEBHOOK_URL: ${{ vars.KOMODO_WEBHOOK_URL }}
          KOMODO_WEBHOOK_AUTH: ${{ secrets.KOMODO_WEBHOOK_AUTH }}
          PROMOTE_COMMIT: ${{ steps.promote.outputs.commit }}
          REF_NAME: ${{ github.ref_name }}
          GH_REF: ${{ github.ref }}
        # Through ci-log-step.sh for failure-digest coverage (feature 042). Body: scripts/cd/rollback.sh
        # (ends in exit 1 to fail the run for operator attention — ci-log-step.sh re-raises it).
        run: bash scripts/ci-log-step.sh rollback bash scripts/cd/rollback.sh
      # Feature 042 — publish an agent-readable failure digest. The forge API exposes no log or
      # artifact endpoint, so each job PUSHES a distilled, redacted digest into a channel the API can
      # already read (a PR comment, or a commit status on push).
      # `always()` + `continue-on-error` + an unconditional exit 0 inside the script: a broken digest
      # must NEVER mask, replace or delay the real job result (FR-009). `job.status` carries
      # `cancelled` for a superseded run, which the script suppresses rather than publishing as a
      # failure for a commit that was never broken (FR-001a).
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          # US4 fallback: when the secret above is empty (an AGit-headed run has NO secrets), the
          # digest publishes a commit status with this run-provisioned token instead. Without this
          # line the fallback is DEAD CODE — it reads GITHUB_TOKEN from the step env, and nothing
          # else puts it there. Proven live in guardrails run #1628.
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs

  # ── Prod APK with the PUBLIC BFF host baked (T018a, FR-026) ───────────────────────────────────
  # Ports .github/workflows/android-apk.yml. The release APK's BFF/Keycloak URLs are the public hosts
  # from Forgejo vars — NOT the CI emulator 10.0.2.2:8082 (T010) and not a committed literal/IP.
  prod-apk:
    # Runs on the real deploy path (deploy=true) OR on an explicit build_apk dispatch. Skipped on a
    # plain mint dispatch (deploy=false) so that stays fast. No job `needs` prod-apk, so skipping it
    # cascades to nothing.
    if: ${{ inputs.deploy == true || inputs.build_apk == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_BFF_NATIVE_URL: https://mcm.${{ vars.BASE_DOMAIN }}
      EXPO_PUBLIC_KEYCLOAK_NATIVE_URL: https://auth.${{ vars.BASE_DOMAIN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        run: |
          bash scripts/ci-log-step.sh prod-apk-free-disk-space bash -e /dev/stdin <<'CI_LOG_STEP'
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules || true
          df -h /
          CI_LOG_STEP
      # No `version:` — resolve pnpm from package.json `packageManager`, exactly like every other
      # pnpm/action-setup in this repo (cd-deploy:131, app-ci ×4, infra-image-scan). This job used to
      # pin `version: 10.33.0` explicitly, which made the pin DUAL-sourced: a `packageManager` bump
      # would leave this job installing the old pnpm against a new-format lockfile, so
      # `pnpm install --frozen-lockfile` fails — and because `prod-apk` is non-blocking, it would
      # fail with nothing gating on it. Keep it version-free so the pin cannot drift again.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.19.0, cache: pnpm }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install dependencies
        run: bash scripts/ci-log-step.sh prod-apk-install-dependencies pnpm install --frozen-lockfile
      - name: Build release APK (public BFF host baked)
        env:
          APK_VARIANT: release
        # The guard is INSIDE the wrapper (item #177 variant 4). It used to sit above it, so an unset
        # BASE_DOMAIN failed the step with the `::error::` annotation in the job log only — no capture
        # and no `_failed-step` marker, leaving the digest to report "_not reported_" for the one
        # failure mode this step exists to produce.
        run: |
          bash scripts/ci-log-step.sh prod-apk-build bash -e /dev/stdin <<'CI_LOG_STEP'
          # An unset BASE_DOMAIN var expands to the literal "https://mcm." / "https://auth." — non-empty,
          # so a `:?` guard misses it and the APK bakes a dead URL. Fail loudly on those exact forms.
          if [ "$EXPO_PUBLIC_BFF_NATIVE_URL" = "https://mcm." ] || [ "$EXPO_PUBLIC_KEYCLOAK_NATIVE_URL" = "https://auth." ]; then
            echo "::error::BASE_DOMAIN Forgejo variable is unset — APK would bake a broken host ($EXPO_PUBLIC_BFF_NATIVE_URL). Set vars.BASE_DOMAIN and re-run."
            exit 1
          fi
          echo "Baking BFF URL: $EXPO_PUBLIC_BFF_NATIVE_URL  |  Keycloak: $EXPO_PUBLIC_KEYCLOAK_NATIVE_URL"
          pnpm nx run mcm-app:build-apk
          CI_LOG_STEP
      # Item #161 — publish the APK to the GENERIC package registry, the only scriptable channel this
      # forge has. `GET /repos/{owner}/{repo}/actions/artifacts` answers 404 "404 page not found" here
      # (a MISSING ROUTE, not an empty result), so the upload-artifact step below is reachable ONLY by
      # a human clicking through the run page, and only until the artifact expires. Placed BEFORE that
      # step so a hiccup in the convenience path cannot cost us the scriptable one.
      #
      # continue-on-error AND an unconditional exit 0 inside the script (AC4): `prod-apk` is
      # deliberately non-blocking — nothing `needs:` it — and a registry hiccup must not change that.
      # Every failure path still prints `::error::`, so it is visible in the job log.
      #
      # REGISTRY_TOKEN is the SAME `actions-ci-push` secret (`write:package`) the container push
      # already uses — the generic registry takes that scope, so this adds no token and widens none.
      - name: Publish prod APK to the package registry
        continue-on-error: true
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: bash scripts/ci-log-step.sh prod-apk-publish node scripts/cd/publish-apk.mjs
      - name: Upload prod APK artifact
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          # build-apk.mjs emits MovieCollectionManager-<version>-release-<sha7>.apk; upload only that
          # (not Gradle's generic app-release.apk) so the artifact carries the descriptive filename.
          name: MovieCollectionManager-release-${{ github.sha }}
          path: frontend/mcm-app/android/app/build/outputs/apk/release/MovieCollectionManager-*.apk
          if-no-files-found: error
      # Feature 042 — publish an agent-readable failure digest. The forge API exposes no log or
      # artifact endpoint, so each job PUSHES a distilled, redacted digest into a channel the API can
      # already read (a PR comment, or a commit status on push).
      # `always()` + `continue-on-error` + an unconditional exit 0 inside the script: a broken digest
      # must NEVER mask, replace or delay the real job result (FR-009). `job.status` carries
      # `cancelled` for a superseded run, which the script suppresses rather than publishing as a
      # failure for a commit that was never broken (FR-001a).
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          # US4 fallback: when the secret above is empty (an AGit-headed run has NO secrets), the
          # digest publishes a commit status with this run-provisioned token instead. Without this
          # line the fallback is DEAD CODE — it reads GITHUB_TOKEN from the step env, and nothing
          # else puts it there. Proven live in guardrails run #1628.
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs
