# Infra-image CVE scanning (feature 035; always-post required context — feature 039 Workstream C).
# Keyless, fail-closed Trivy sweep over the THIRD-PARTY images we pull but do not build (Keycloak,
# Postgres, Redis, Mongo, Vault, OpenSearch, ClickHouse, LangFuse, Grafana, OPA, Unleash, MinIO,
# Caddy, Mailpit) — the six jumbleknot/* built images are already Trivy-scanned in cd-deploy, so they
# are excluded here (disjoint sets).
#
# The FULL sweep runs WEEKLY (Friday) regardless of what changed — a newly-published advisory can
# render an UNCHANGED pinned image vulnerable, so it cannot be path-gated (same rule as the 033 SCA
# scan). A lighter check also runs on PRs/pushes that touch the infra image references, for fast
# feedback, so weekly is a comfortable safety-net cadence.
#
# feature 039 (Gap 3): `main` branch protection requires the context `infra-image-scan /
# infra-image-scan*`. Previously this workflow triggered ONLY on infra paths, so a PR outside those
# paths (docs/.devcontainer/specs) posted NO status → Forgejo treated the required pattern as
# unsatisfied → the PR was unmergeable via API (405) even fully green, needing an admin override (bit
# PR #67). Fix mirrors app-ci: trigger on EVERY PR (no `pull_request` `paths:`), add an always-running
# `changes` (dorny/paths-filter) job, and keep the required-named `infra-image-scan` job ALWAYS running
# while gating the Trivy STEPS on the filter. So the required context posts `success` on a non-infra PR
# (Trivy steps skipped) and is the real gate when an infra image ref changed. The required-named job
# MUST be the always-run job — a job-level `if:` skip posts nothing in this Forgejo and re-creates Gap 3.
name: infra-image-scan

on:
  schedule:
    # Friday 04:00 UTC ≈ 00:00 America/New_York (EDT, UTC-4) / 23:00 Thursday (EST, UTC-5).
    # GitHub/Forgejo Actions cron is UTC-only and does NOT observe DST, so this drifts ±1h across the
    # DST boundary.
    #
    # ── 04:00 IS AN ORDERING CONSTRAINT, NOT A FREE SLOT. DO NOT "TIDY THE CRONS TOGETHER". ───────
    #
    # This sweep decides whether an infra-touching PR *can* merge. `renovate.yml`'s window run —
    # the one that CREATES those PRs — fires at 07:00 UTC. While both sat at 07:00 the sweep's
    # verdict on `main` was unknown until after the PRs it would block already existed, and the two
    # long jobs contended for the capacity-1 runner. Measured on 2026-09-18 (item #487):
    #
    #   07:01:45  PR #475 created        07:02:16  PR #478 created
    #   07:02:22  run 3521 starts        — this sweep, on main
    #   07:46     RED — three amqp091-go CRITICALs on grafana/otel-lgtm:0.32.1, published 09-16
    #
    # `main` had been failing its weekly CVE gate for 44 minutes before anyone could know, and #478
    # (node/rust/keycloak digest pins, no bearing on otel-lgtm) was unmergeable from the moment it
    # was created, on someone else's CVE. Running FIRST makes Friday deterministic: `main`'s posture
    # is known before Renovate opens a branch, so an infra PR that then goes red is red for its own
    # reasons.
    #
    # WHY 04:00 SPECIFICALLY, and why the 3h gap is the real figure:
    #   * This job takes ~3 minutes, but the runner may be inside a ~35-minute `app-e2e`, so the gap
    #     budgets for QUEUE DEPTH, not for the job.
    #   * No other Friday cron fires at 04:00. 05:00 is `minio-image` and 06:00 is
    #     `devcontainer-image` — two heavy builds (timeout-minutes: 60 each) that used to sit
    #     directly in front of this sweep on the single runner. 04:00 puts it ahead of both.
    #   * Both crons are UTC, so the 3h gap is FIXED. DST moves `renovate.json`'s local-time window,
    #     never the distance between these two UTC crons.
    #   * Ordering ahead of `minio-image` is safe: compose pins `jumbleknot/minio` by immutable
    #     digest, and `infra-image-scan.mjs` excludes it from this sweep anyway (BUILT_IMAGE_NAMES —
    #     it is scanned by `minio-image.yml`, which gates its own publish). So this sweep's result
    #     does not depend on that morning's rebuild.
    #
    # `renovate-workflow.guard.test.mjs` asserts this cron is strictly earlier than every
    # `renovate.yml` window cron, so the ordering cannot be undone silently.
    - cron: '0 4 * * 5'
  push:
    # push keeps its paths filter — a non-infra merge to main need not re-scan (the PR already did,
    # and the weekly cron is the safety net). Only the PR trigger must be un-path-gated (branch
    # protection evaluates PR head statuses).
    paths:
      - 'infrastructure-as-code/**'
      - 'scripts/infra-image-scan.mjs'
      - 'scripts/check-infra-image-findings.mjs'
      - 'security/infra-images/**'
      - '.forgejo/workflows/infra-image-scan.yml'
  # NO `paths:` filter — runs on EVERY PR so the required `infra-image-scan / infra-image-scan` context
  # is always posted (success when no infra image ref changed; the real gate when one did). The heavy
  # Trivy work is still gated — by the `changes` job below — so a non-infra PR posts success cheaply.
  pull_request:

concurrency:
  group: infra-image-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Change detection (always runs; gates the Trivy steps below) ────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    # ci-log-step-exempt: dorny/paths-filter only — no `run:` step, so no command output to capture.
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # PULL REQUESTS ONLY. dorny derives its diff base from the PR event; on any other event it
      # falls back to `github.event.repository.default_branch`, which this Forgejo does NOT put in
      # the payload → the action hard-errors ("requires 'base' input to be configured"). That killed
      # the `changes` job on the WEEKLY CRON, and since infra-image-scan `needs: [changes]` the
      # required job was skipped — i.e. the full weekly sweep, the whole point of the un-path-gated
      # safety net (a new advisory makes an UNCHANGED pinned image vulnerable), silently never ran.
      # (`push` is unaffected — dorny diffs against `event.before` there — but it is filtered out
      # here anyway, and loses nothing: RUN_SCAN already forces every non-PR event through the full
      # sweep.) Skipped → `steps.filter.outputs.infra` is '' → RUN_SCAN falls through to its
      # `github.event_name != 'pull_request'` clause → the sweep runs. Do not drop this `if:`.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        with:
          filters: |
            infra:
              - 'infrastructure-as-code/**'
              - 'scripts/infra-image-scan.mjs'
              - 'scripts/check-infra-image-findings.mjs'
              - 'security/infra-images/**'
              - '.forgejo/workflows/infra-image-scan.yml'
      # Feature 042 — publish an agent-readable failure digest. The forge API exposes no log or
      # artifact endpoint, so each job PUSHES a distilled, redacted digest into a channel the API can
      # already read (a PR comment, or a commit status on push).
      # `always()` + `continue-on-error` + an unconditional exit 0 inside the script: a broken digest
      # must NEVER mask, replace or delay the real job result (FR-009). `job.status` carries
      # `cancelled` for a superseded run, which the script suppresses rather than publishing as a
      # failure for a commit that was never broken (FR-001a).
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          # US4 fallback: when the secret above is empty (an AGit-headed run has NO secrets), the
          # digest publishes a commit status with this run-provisioned token instead. Without this
          # line the fallback is DEAD CODE — it reads GITHUB_TOKEN from the step env, and nothing
          # else puts it there. Proven live in guardrails run #1628.
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs

  # ── The required context. ALWAYS runs (no job-level `if:`) so it posts a status on every PR. The
  # Trivy steps are gated on: an infra image ref changed (the PR-only filter) OR any non-PR event
  # (weekly cron + push ALWAYS run the full sweep, un-path-gated, via the
  # `github.event_name != 'pull_request'` clause — dorny's filter is only meaningful for a PR diff and
  # is skipped otherwise). On a non-infra PR every Trivy step skips → the job succeeds → the required
  # context is `success`.
  infra-image-scan:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # True when Trivy must actually run: an infra image ref changed on a PR/push, OR this is the
      # weekly cron / a push (any non-pull_request event runs the full sweep, un-path-gated).
      RUN_SCAN: ${{ needs.changes.outputs.infra == 'true' || github.event_name != 'pull_request' }}
      # Needed since feature 069 (item #420). The observability stack now pulls `jumbleknot/minio` —
      # an image this project builds from source, because MinIO deleted its published images — and
      # check-topology-scrub forbids the real forge host in a committed file, so compose can only
      # reference it as `${REGISTRY_HOST}/…`. Without this value the scanner cannot resolve the ref,
      # and the sweep would pass having never looked at our own image: a green that is a claim about
      # images nobody scanned. infra-image-scan.mjs now EXITS 2 rather than skipping quietly, so a
      # missing value fails the job instead of silently shrinking what it covers.
      REGISTRY_HOST: ${{ vars.REGISTRY }}
    steps:
      - name: Checkout
        if: ${{ env.RUN_SCAN == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        if: ${{ env.RUN_SCAN == 'true' }}
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        if: ${{ env.RUN_SCAN == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install JS dependencies (the scanner + gate use the `yaml` package)
        if: ${{ env.RUN_SCAN == 'true' }}
        run: bash scripts/ci-log-step.sh infra-image-scan-install-js-dependencies pnpm install --frozen-lockfile

      # The kvm runner executes as the unprivileged `ci` user — no sudo / no write to /usr/local/bin.
      # Install Trivy to a user-writable dir and put it on PATH (same as cd-deploy's Trivy step).
      - name: Install Trivy
        if: ${{ env.RUN_SCAN == 'true' }}
        run: |
          bash scripts/ci-log-step.sh infra-image-scan-install-trivy bash -e /dev/stdin <<'CI_LOG_STEP'
          mkdir -p "$HOME/.local/bin"
          # PINNED — item #303. Both the install SCRIPT and the VERSION it installs were floating:
          # the script came from the moving branch `main` and was piped straight into sh, and no tag
          # was passed, so `install.sh [-b] bindir [-c] client [-d] [tag]` installed "the latest".
          # Two floating references in the tool that decides whether a Critical blocks a deploy, and
          # with no digest pin underneath — strictly worse than the infra images item #297 fixed.
          # Renovate keeps this current (customManagers in renovate.json, datasource github-releases);
          # renovate-workflow.guard.test.mjs asserts both files stay pinned and agree.
          TRIVY_VERSION=v0.74.0
          curl -fsSL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" \
            | sh -s -- -b "$HOME/.local/bin" "${TRIVY_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trivy" --version
          CI_LOG_STEP

      - name: Gate selftest (prove fail/suppress/expiry before the real scan)
        if: ${{ env.RUN_SCAN == 'true' }}
        run: bash scripts/ci-log-step.sh infra-image-scan-gate-selftest node scripts/check-infra-image-findings.mjs --selftest

      # Enumerate the third-party infra images → Trivy each → normalized findings.json. Fail-closed:
      # a Trivy/pull/parse failure exits non-zero and fails the job (never a clean report on failure).
      #
      # Both this and the gate below run through ci-log-step.sh so their output reaches the feature-042
      # failure digest. Without it the digest publishes an empty shell ("no log output was captured for
      # this job") — check-ci-digest-coverage.mjs only asserts the job HAS a digest step, not that any
      # step is instrumented, so the gap passed CI while making a real failure undiagnosable over the
      # API. Measured on run 1162 (2026-07-26): the gate blocked on two new fixable Criticals and the
      # digest named neither, forcing a full local Trivy re-scan to find out which.
      # `id: scan` — item #485. The weekly-verdict status below must tell "the sweep found blocking
      # CVEs" apart from "the sweep could not run at all"; a fail-closed Trivy/pull/parse error is a
      # red job that has found NOTHING, and reporting it as a CVE verdict would be a claim about
      # images nobody scanned.
      - name: Scan infra images (Trivy)
        id: scan
        if: ${{ env.RUN_SCAN == 'true' }}
        run: bash scripts/ci-log-step.sh infra-image-scan node scripts/infra-image-scan.mjs --emit-allowlist

      # The gate prints the "Blocking (un-allowlisted)" table — the single most useful thing to have in
      # the digest, since it names image + advisory id and is exactly what an allowlist entry needs.
      # `id: gate` is load-bearing, not tidiness (item #484). `steps.<id>.outcome` on a LATER step is
      # the only thing that distinguishes "the expiry step's `if:` evaluated false" from "an earlier
      # step failed" — `outcome == 'skipped'` conflates the two by construction, and the expiry
      # recorder below had to infer which it was on its very first live schedule run.
      - name: Gate — fail on any un-allowlisted fixable High/Critical
        id: gate
        if: ${{ env.RUN_SCAN == 'true' }}
        run: bash scripts/ci-log-step.sh infra-image-gate node scripts/check-infra-image-findings.mjs

      # Feature 057 (item #154) — the allowlist expiry warning tier, over BOTH allowlists.
      #
      # Expiry used to be binary: full suppression until the date, then a hard fail the next morning
      # on whichever unrelated branch happened to run first, with no signal in between. This step is
      # that signal. It fails when any entry is within 14 days of expiry, already expired, or matched
      # nothing this run — 14 days being a deliberate choice for QUIETNESS, since a check that is
      # usually green is one whose red still gets read.
      #
      # THE `if:` IS LOAD-BEARING, not tidiness. This job also serves `pull_request` (un-path-gated,
      # so it posts the required context on every PR — see the header). Without the guard, a red
      # expiry check would block every pull request the moment an entry entered the window, which is
      # exactly what FR-021/SC-007 forbid. Verify it by reading a real PR run's STEP LIST rather than
      # by trusting this expression: a wrong `if:` that still evaluates true looks identical today
      # and blocks everything a fortnight later.
      #
      # `--check-expiring` is report-only — it does not evaluate blocking findings, so this step
      # cannot fail for a reason the gate above is already responsible for. The SAST report is not
      # produced in this job; in this mode its absence correctly means "no scanner produced findings"
      # (zero unmatched) rather than an error, and the script says so in the log.
      #
      # Failure needs no new plumbing: this job already publishes a digest on failure (below).
      #
      # Prediction, recorded so it is falsifiable: green on 2026-08-14 and 08-21, first RED on
      # Friday 2026-08-28 naming the image-size pair (expiry 2026-09-07).
      #
      # OUTCOME, settled 2026-09-12 (item #418). FALSIFIED IN TIMING, CONFIRMED IN MECHANISM. The
      # step ran, and went RED one Friday EARLIER than predicted and for the sibling reason: not the
      # 14-day expiry window but the UNMATCHED tier — five suppressions that had stopped matching
      # anything. Measured run history, weekly cron only:
      #
      #     07-31 green · 08-07 green · 08-14 RED · 08-21 RED · 08-28 RED · 09-04 green · 09-11 green
      #
      # 08-13 is when this step was added (a0f62e18); the next three Fridays are red; f7fea0f6
      # (08-30) deleted the five stale entries and green resumes. That commit names the same three
      # dates as the expiry check's own red streak. `--check-expiring` has exactly ONE call site —
      # this step — and an unmatched entry fails in no other mode, so the `if:` evaluated TRUE.
      #
      # THE TRAP THAT MADE THIS LOOK BROKEN, recorded because it will be read again: the runs API
      # reports `event` = "push" on every scheduled run. It is NOT the trigger. The same payload
      # carries `trigger_event` = "schedule", and `github.event_name` follows THAT. Measured over
      # all 68 scheduled runs since 2026-07-31: trigger_event "schedule" for every one, event
      # "push" for every one. Do not "fix" the expression below from the `event` field.
      #
      # ── `always()` — ITEM #484. THE WEEK THE GATE IS RED IS THE WEEK THIS MATTERS MOST. ─────────
      #
      # This step used to carry a bare `if: github.event_name == 'schedule'`, sitting immediately
      # after the gate above. A failed step skips every later step that is not `always()`-guarded,
      # so on any week the CVE gate went red the weekly expiry warning did not run at all.
      #
      # Measured, not reasoned about. The `infra-image-scan/expiry` status added by item #418 caught
      # it on its first live schedule run — run 3521, the 2026-09-18 weekly cron, which failed the
      # gate on three amqp091-go CRITICALs:
      #
      #   GET /repos/jumbleknot/mcm/commits/3cbe637e/statuses
      #     infra-image-scan/expiry  success  description: "event_name=schedule expiry_step=skipped"
      #
      # `event_name=schedule` proves the `if:` evaluated TRUE, so the skip can only have come from
      # the upstream failure. Nothing was actually missed that week (both checks exit 0 when run by
      # hand against the 2026-09-14 sweep report) — the defect is that nothing would have said so
      # either way.
      #
      # THE SCHEDULE GUARD IS STILL LOAD-BEARING and is preserved inside the `always()`. This job
      # also serves `pull_request` (un-path-gated, so it posts the required context on every PR);
      # without the guard a red expiry check would block every pull request the moment an entry
      # entered the 14-day window, which is exactly what FR-021/SC-007 forbid. `always() &&
      # github.event_name == 'schedule'` keeps that protection intact.
      #
      # THE CANCELLED-RUN DECISION, MADE DELIBERATELY RATHER THAN BY REFLEX (item #484 says to).
      # `always()` also runs on a CANCELLED run, and this job is `cancel-in-progress: true` — so a
      # scheduled sweep superseded before `Checkout` completed would reach this step with an empty
      # workspace, fail on the missing scripts, and turn a `cancelled` conclusion into a `failure`
      # for a commit that was never broken. That is the same fault FR-001a made the failure digest
      # suppress, and it is suppressed here THE SAME WAY: from `job.status` inside the step body,
      # not in the `if:`.
      #
      # Why not `!cancelled()` in the `if:`, which is the obvious expression? Because it has never
      # once been used on this Forgejo — `always()` and `failure()` are the only status functions
      # this repository has proven here (cd-deploy.yml's post-deploy rollback uses `failure()`), and
      # the comment above this step already records what trusting an unverified expression cost.
      # `job.status` in `env:` IS proven — nine workflows carry it into the failure digest.
      #
      # `--check-expiring` remains report-only: it does not evaluate blocking findings, so this step
      # cannot fail for a reason the gate above is already responsible for, and a failure here after
      # a red gate leaves the job's conclusion exactly as red as it already was. It cannot mask the
      # gate and it cannot turn a red gate green.
      - name: Allowlist expiry check — both allowlists (weekly schedule only, never on a pull request)
        id: expiry
        if: ${{ always() && github.event_name == 'schedule' }}
        env:
          EXPIRY_JOB_STATUS: ${{ job.status }}
        # The WHOLE block goes through ci-log-step.sh, including the cancellation guard — a command
        # outside it reaches the feature-042 digest with no output and no failing-step marker, and
        # `check-ci-digest-coverage.mjs` fails the build for exactly that. (It caught this step in
        # its first draft, where the guard sat outside the wrapper.)
        run: |
          bash scripts/ci-log-step.sh allowlist-expiry-check bash -e /dev/stdin <<'CI_LOG_STEP'
          if [ "$EXPIRY_JOB_STATUS" = "cancelled" ]; then
            echo "job.status=cancelled — superseded run, not a broken one. Skipping the expiry check."
            exit 0
          fi
          node scripts/check-sast-findings.mjs --check-expiring
          node scripts/check-infra-image-findings.mjs --check-expiring
          CI_LOG_STEP

      # Item #418 — the residual allowlist-expiry-wiring.guard.test.mjs names but cannot close: that
      # guard pins the `if:` EXPRESSION, never the runner's EVALUATION of it. This step is the
      # missing measurement. It records, per run and readable without logs, what `github.event_name`
      # ACTUALLY was and whether the step above ACTUALLY ran — so the next person to ask does not
      # have to reconstruct it from three weeks of run conclusions and a commit message, which is
      # what item #418 cost.
      #
      # Both values are carried through RAW. The status states a measurement; it never restates a
      # belief about one. Read it back with:
      #   GET /repos/{owner}/{repo}/commits/{sha}/status  → context `infra-image-scan/expiry`
      # Same channel and same shape as `renovate/mode` (item #268), for the same reason: this forge
      # exposes no log endpoint and `/actions/runs/{id}/jobs` is 404, so a step that ran and a step
      # that skipped are otherwise indistinguishable after the fact.
      #
      # NOT gated on `event_name == 'schedule'`: a recorder gated on the expression it measures
      # records nothing on precisely the run you need the record for. `always()` so a failed sweep
      # still leaves the record — that is when it matters most. Off pull requests, where a status
      # per PR would be noise and the cron is what is under measurement.
      #
      # `state` is always `success` and the finding lives in the description, deliberately: this is
      # observability, never a gate, and a red status on main's tip is a signal this step has no
      # standing to raise. `continue-on-error` for the same reason — plus, if the POST itself fails,
      # the ABSENCE of the status is its own tell rather than a job failure for a bookkeeping call.
      - name: 'Publish expiry-step execution (item #418)'
        if: ${{ always() && github.event_name != 'pull_request' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MEASURED_EVENT_NAME: ${{ github.event_name }}
          MEASURED_EXPIRY_OUTCOME: ${{ steps.expiry.outcome }}
          # Item #484. `steps.expiry.outcome == 'skipped'` CONFLATES two different faults: the `if:`
          # evaluated false, and an earlier step failed so every non-`always()` step after it was
          # skipped. `outcome` alone cannot tell them apart, and on run 3521 the status was readable
          # only because it happened to carry `event_name` beside it — luck of composition, not
          # design, on an instrument built specifically to stop inferring this step's execution.
          # The gate's OWN outcome is the second measured field that closes it:
          #   expiry_step=skipped gate=success  → the `if:` was false
          #   expiry_step=skipped gate=failure  → an earlier step failed (the #484 fault itself)
          # Both are MEASUREMENTS carried through raw. The status never restates a belief about one.
          MEASURED_GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          bash scripts/ci-log-step.sh infra-image-scan-publish-expiry-execution bash -e /dev/stdin <<'CI_LOG_STEP'
          # `<unset>` is a real answer, not a formatting fallback: it says the runner returned no
          # value for that context, which is a different fault from returning the wrong one.
          desc="event_name=${MEASURED_EVENT_NAME:-<unset>} gate=${MEASURED_GATE_OUTCOME:-<unset>} expiry_step=${MEASURED_EXPIRY_OUTCOME:-<unset>}"
          echo "measured: $desc"
          curl -fsS -X POST -H "Authorization: token $GITHUB_TOKEN" -H 'Content-Type: application/json' \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"context\":\"infra-image-scan/expiry\",\"state\":\"success\",\"description\":\"$desc\"}" >/dev/null
          CI_LOG_STEP

      # ── Item #485 — make a RED WEEKLY SWEEP visible on the commit. ────────────────────────────
      #
      # A `schedule`-triggered run of this workflow posts NO `infra-image-scan / infra-image-scan`
      # commit status. Its red is visible only in the runs listing, the job log and the evidence
      # bundle — nothing attached to the commit says `main` is failing its weekly CVE sweep.
      # Measured over three scheduled runs whose API status is `failure`:
      #
      #   run 1948  2026-08-21  7a9ff92c  → no infra contexts on that sha
      #   run 2132  2026-08-28  b3c77867  → no infra contexts on that sha
      #   run 3521  2026-09-18  3cbe637e  → only infra-image-scan/expiry, posted by curl above
      #
      # The endpoint is not the problem: 3cbe637e carries 40 statuses from the previous day's push.
      # Nothing from run 3521 is among them.
      #
      # Two consequences, both already paid for. `ci-status.mjs failure --run 3521` answered "No
      # failed jobs on 3cbe637e — checked every event's contexts" — true about what it read, and the
      # opposite of the truth. And a red `main` stayed silent for ~41 minutes until Renovate's PR
      # #478 opened, ran the same sweep on its own head, and became unmergeable over three CVEs with
      # no bearing on its diff. The first signal that `main` was failing a required gate was an
      # unrelated pull request failing it.
      #
      # WHY NOT REVIVE THE DIGEST'S COMMIT-STATUS BRANCH. `ci-failure-digest.mjs` routes everything
      # that is not a `pull_request` to the evidence bundle only; its status branch was removed
      # deliberately (FR-008, amended by T040) because it needs `write:repository`, measured as a 403
      # on smoke run 986. That decision stands. The `expiry` recorder above proves a NARROW status
      # posts fine with `github.token`, and this reuses exactly that shape.
      #
      # THIS ONE CARRIES A REAL `state`, unlike the `expiry` recorder — that is the whole point. It
      # is safe because it CANNOT GATE ANYTHING: branch protection requires the glob
      # `infra-image-scan / infra-image-scan*`, and `infra-image-scan/weekly` has no ` / ` separator,
      # so it does not match — the same reason `infra-image-scan/expiry` has never blocked a merge.
      # Protection is evaluated on PR HEADS, and this posts only on the scheduled run's commit.
      #
      # `continue-on-error` + `-f` on curl: this is a REPORT on the sweep, never a second gate. If
      # the POST itself fails, the job's own conclusion is already the truth, and the ABSENCE of the
      # status is its own tell.
      - name: 'Publish weekly sweep verdict (item #485)'
        if: ${{ always() && github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The GATE's outcome, not the job's: the job can also be red for an install or Trivy
          # failure, and "the sweep could not run" is a different message from "the sweep found
          # blocking CVEs". Both are reported, distinguishably, below.
          MEASURED_GATE_OUTCOME: ${{ steps.gate.outcome }}
          MEASURED_SCAN_OUTCOME: ${{ steps.scan.outcome }}
          MEASURED_JOB_STATUS: ${{ job.status }}
        run: bash scripts/ci-log-step.sh infra-image-scan-publish-weekly-verdict node scripts/publish-sweep-verdict.mjs

      - name: Upload scan report (findings.json + summary + proposed allowlist + raw Trivy)
        if: ${{ env.RUN_SCAN == 'true' && always() }}
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: infra-image-scan-report
          path: security/infra-images/reports/

      # When no infra image ref changed on a PR, every step above skips and the job succeeds → the
      # required `infra-image-scan / infra-image-scan` context is posted as success, so the PR merges
      # without an admin override (feature 039 AC6). This line makes the skip explicit in the log.
      - name: No infra image ref changed — required context satisfied (scan skipped)
        if: ${{ env.RUN_SCAN != 'true' }}
        # ci-log-step-exempt: this step runs on the RUN_SCAN != true path, where `Checkout` is
        # deliberately skipped — so scripts/ci-log-step.sh is NOT on disk and wrapping it made the
        # job die in 2s. Measured: it broke every docs-only PR (#172, #174, #175) while PRs that
        # touch infra files passed, because those take the real-scan path where checkout DOES run.
        run: echo "No infra image reference changed on this PR; Trivy scan skipped, required context = success."
      # Feature 042 — publish an agent-readable failure digest. The forge API exposes no log or
      # artifact endpoint, so each job PUSHES a distilled, redacted digest into a channel the API can
      # already read (a PR comment, or a commit status on push).
      # `always()` + `continue-on-error` + an unconditional exit 0 inside the script: a broken digest
      # must NEVER mask, replace or delay the real job result (FR-009). `job.status` carries
      # `cancelled` for a superseded run, which the script suppresses rather than publishing as a
      # failure for a commit that was never broken (FR-001a).
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          # US4 fallback: when the secret above is empty (an AGit-headed run has NO secrets), the
          # digest publishes a commit status with this run-provisioned token instead. Without this
          # line the fallback is DEAD CODE — it reads GITHUB_TOKEN from the step env, and nothing
          # else puts it there. Proven live in guardrails run #1628.
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs
