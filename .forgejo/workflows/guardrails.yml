# Feature 023 (US1, MVP) — homelab port of the three GitHub guardrail workflows:
#   .github/workflows/naming-gate.yml + secret-scan.yml + agent-gates.yml  →  three jobs here.
# These are the cheap, KEYLESS gates that run on every push/PR and gate the commit, identical to
# GitHub Actions today (FR-001, FR-002, FR-003).
#
# ACTION-LIGHT by design: the only `uses:` is `actions/checkout` (mirrored on the instance's default
# action registry), so this workflow runs on the homelab runner WITHOUT pointing action resolution at
# github. Toolchain setup is plain shell on the `node:22-bookworm` runner image: pnpm via corepack
# (pinned by package.json `packageManager`), uv via its installer. Path scoping from the original
# separate workflows is intentionally dropped — all three gate jobs run over the whole tree on every
# PR and every push to `main` (they are cheap and keyless; running unconditionally is strictly safer
# than path-scoping). The `push:` trigger is branch-scoped to `main` — see the note on `on:` below;
# that is de-duplication, not path scoping, and no gate's coverage narrows.
#
# No credential LITERAL appears in this file, and every gate job remains keyless in the sense that
# matters — the agent golden gate runs in replay mode against cassettes, with no model key, no
# network and no provider credential. That is the property FR-004 / SC-009 of feature 023 actually
# require: credentials must come from the forge's CI secret store, never from a committed literal.
#
# Feature 042 adds ONE referenced secret, `CI_DIGEST_TOKEN`, to publish failure digests. It is
# compliant with FR-004 by construction (it IS a secret-store reference) and is purpose-scoped to
# write:issue + write:package — it cannot push code and cannot touch protected `main`. An earlier
# revision of this comment claimed no `${{ secrets }}` was referenced at all; that was a description
# of how the file happened to look, not a requirement, and it is no longer true.
#
# The file passes the gates it itself runs.
name: guardrails

on:
  workflow_dispatch: {}
  # `push` is scoped to `main`; `pull_request` stays unscoped. WHY: with a bare `push:`, pushing a
  # branch that has an open PR fired BOTH events, so guardrails ran TWICE per push (measured
  # 2026-07-26 on one SHA: guardrails×2 — one push, one pull_request — vs app-ci/infra-image-scan
  # ×1, which do not duplicate because their own `push:` triggers are branch/path-filtered). The
  # two runs do not even cancel each other: `concurrency` keys on `github.ref`, which differs
  # between the events. Duplicate runs are pure contention on the capacity-1 runner, and they are
  # the mechanism behind the "same context, two events, disagreeing outcomes" trap documented in
  # CLAUDE.md.
  #
  # This is BRANCH scoping, NOT the path scoping deliberately rejected above — every gate still
  # runs over the WHOLE tree, on every PR, and on every push to `main`. Branch protection is
  # unaffected: a PR's required `guardrails*` contexts come from the `pull_request` event.
  #
  # Accepted trade-off: a push to a branch with NO open PR is no longer scanned. It cannot reach
  # `main` without a PR (protected), and opening one runs every gate before merge — so the gate
  # still blocks, it just reports at PR time instead of push time.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ported from secret-scan.yml — whole-tree (FR-002). Pure node built-ins; no install needed.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate the scanner detects planted keys (and clean tree passes)
        run: bash scripts/ci-log-step.sh secret-scan-validate-scanner-detects node scripts/secret-scan.mjs --selftest
      - name: Scan committed files for credential-shaped strings
        run: bash scripts/ci-log-step.sh secret-scan node scripts/secret-scan.mjs
      # Feature 042 — publish an agent-readable failure digest. The forge API exposes no log or
      # artifact endpoint, so each job PUSHES a distilled, redacted digest into a channel the API can
      # already read (a PR comment, or a commit status on push).
      # `always()` + `continue-on-error` + an unconditional exit 0 inside the script: a broken digest
      # must NEVER mask, replace or delay the real job result (FR-009). `job.status` carries
      # `cancelled` for a superseded run, which the script suppresses rather than publishing as a
      # failure for a commit that was never broken (FR-001a).
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          # US4 fallback: when the secret above is empty (an AGit-headed run has NO secrets), the
          # digest publishes a commit status with this run-provisioned token instead. Without this
          # line the fallback is DEAD CODE — it reads GITHUB_TOKEN from the step env, and nothing
          # else puts it there. Proven live in guardrails run #1628.
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs

  # Ported from naming-gate.yml — resource-naming + inline-secret gates (FR-001). Needs `yaml` →
  # pnpm install.
  naming:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable pnpm (corepack, version from package.json packageManager)
        run: bash scripts/ci-log-step.sh naming-enable-pnpm corepack enable
      - name: Install JS dependencies
        run: bash scripts/ci-log-step.sh naming-install-js-dependencies pnpm install --frozen-lockfile
      - name: Resource-naming gate (all sections)
        run: bash scripts/ci-log-step.sh naming-resource-naming-gate node scripts/check-resource-naming.mjs --section=all
      - name: Inline-secret gate (selftest + scan)
        run: |
          bash scripts/ci-log-step.sh naming-inline-secret-gate node scripts/check-no-inline-secrets.mjs --selftest
          bash scripts/ci-log-step.sh naming-inline-secret-gate node scripts/check-no-inline-secrets.mjs
      - name: Komodo-sync topology gate (selftest + scan — no host/domain/IP literal in komodo/*.toml)
        run: |
          bash scripts/ci-log-step.sh naming-komodo-sync-topology-gate node scripts/check-komodo-sync.mjs --selftest
          bash scripts/ci-log-step.sh naming-komodo-sync-topology-gate node scripts/check-komodo-sync.mjs
      - name: Topology-scrub gate (selftest + scan — no real tailnet *.ts.net host tree-wide)
        run: |
          bash scripts/ci-log-step.sh naming-topology-scrub-gate node scripts/check-topology-scrub.mjs --selftest
          bash scripts/ci-log-step.sh naming-topology-scrub-gate node scripts/check-topology-scrub.mjs
      - name: Argv-secret gate (selftest + scan — no --env <credential>= to the Maestro test runner)
        run: |
          bash scripts/ci-log-step.sh naming-argv-secret-gate node scripts/check-no-argv-secrets.mjs --selftest
          bash scripts/ci-log-step.sh naming-argv-secret-gate node scripts/check-no-argv-secrets.mjs
      - name: Prod↔CI port-collision gate (selftest + scan — no prod published port overlaps a CI/dev one)
        run: |
          bash scripts/ci-log-step.sh naming-prod-ci-port-collision-gate node scripts/check-prod-ci-port-collision.mjs --selftest
          bash scripts/ci-log-step.sh naming-prod-ci-port-collision-gate node scripts/check-prod-ci-port-collision.mjs
      - name: Prod restart-policy gate (selftest + scan — every prod service uses restart always, feature 030)
        run: |
          bash scripts/ci-log-step.sh naming-prod-restart-policy-gate node scripts/check-prod-restart-policy.mjs --selftest
          bash scripts/ci-log-step.sh naming-prod-restart-policy-gate node scripts/check-prod-restart-policy.mjs
      - name: CI-digest coverage gate (selftest + scan — every job publishes a failure digest, feature 042)
        run: |
          bash scripts/ci-log-step.sh naming-ci-digest-coverage-gate node scripts/check-ci-digest-coverage.mjs --selftest
          bash scripts/ci-log-step.sh naming-ci-digest-coverage-gate node scripts/check-ci-digest-coverage.mjs
      - name: Toolchain-consistency gate (selftest + scan — every Node/pnpm pin agrees)
        # Catches, in ~1 s, the class that cost two CI cycles on the pnpm 11 bump: a Node pin below
        # the package manager's `engines` floor, and a pnpm version pinned in more than one place.
        run: |
          bash scripts/ci-log-step.sh naming-toolchain-consistency-gate node scripts/check-toolchain-consistency.mjs --selftest
          bash scripts/ci-log-step.sh naming-toolchain-consistency-gate node scripts/check-toolchain-consistency.mjs
      - name: Override-consistency gate (selftest + scan — both halves of every security override floor agree)
        # The same lockstep problem as the gate above, for the other pair. Each keyed entry in
        # pnpm-workspace.yaml's `overrides:` map stores the vulnerable range in its KEY and the
        # patched floor in its VALUE; move one without the other and the override reads as
        # remediated while no longer excluding the version its own key names.
        #
        # This one runs on PULL REQUESTS deliberately (unlike the allowlist expiry check, which is
        # schedule-only): Renovate's built-in npm manager reads the key as an opaque depName, so
        # every floor RAISE it proposes is a half-bump by construction. Blocking that before merge
        # is the whole point — a half-remediation is the failure mode that still looks correct.
        run: |
          bash scripts/ci-log-step.sh naming-override-consistency-gate node scripts/check-override-consistency.mjs --selftest
          bash scripts/ci-log-step.sh naming-override-consistency-gate node scripts/check-override-consistency.mjs
      - name: DAST gate selftest (feature 031 — check-dast-findings fail/suppress/clean paths proven each push)
        run: bash scripts/ci-log-step.sh naming-dast-gate-selftest node scripts/check-dast-findings.mjs --selftest
      - name: Realm-consistency gate (feature 039 — dev-realm.json ⟷ ci-realm.json client/user contract stays in lockstep)
        run: |
          bash scripts/ci-log-step.sh naming-realm-consistency-gate node scripts/check-realm-consistency.mjs --selftest
          bash scripts/ci-log-step.sh naming-realm-consistency-gate node scripts/check-realm-consistency.mjs
      # Feature 041: scripts/__tests__ ran in NO workflow, so the unit tests behind the gate scripts
      # rotted unnoticed — sast-scan.guard.test.mjs could not even import (`ajv` was never a root dep),
      # i.e. a guard test that was silently 0%-executed. Same false-green class this feature removes.
      # Unquoted glob on purpose: bash expands it, so this does not depend on the runner's Node having
      # `--test` glob support (and `node --test <dir>` does not discover `__tests__/`).
      - name: Script unit tests (scripts/__tests__ — the gate scripts' own guards)
        run: bash scripts/ci-log-step.sh naming-script-tests node --test scripts/__tests__/*.test.mjs
      # 048 US5: the DAST leak check's own guard. The step above globs `*.test.mjs`, so a SHELL
      # harness would be picked up by nothing — and shipping an unrun test harness is the exact
      # defect 048 removes elsewhere, so it is enrolled here rather than left to rot the way
      # scripts/__tests__ itself did before 041.
      #
      # `--all` runs three modes: each guarded secret blank in turn must FAIL (the check was
      # fail-open — 3 of 3 exited 0 having scanned nothing); a planted canary matching each guarded
      # secret must be DETECTED (a fail-closed assertion nobody has watched fire is the same
      # unverified control in a new shape); and a missing/empty reports dir must fail rather than
      # pass by grep-missing. Keyless, offline, ~1 s — the same posture as every gate in this job.
      - name: DAST leak-scan guard (048 — fail-closed + canary, keyless)
        run: bash scripts/ci-log-step.sh naming-dast-leak-scan-tests bash scripts/__tests__/dast-leak-scan.test.sh --all
      # Feature 042 — publish an agent-readable failure digest. The forge API exposes no log or
      # artifact endpoint, so each job PUSHES a distilled, redacted digest into a channel the API can
      # already read (a PR comment, or a commit status on push).
      # `always()` + `continue-on-error` + an unconditional exit 0 inside the script: a broken digest
      # must NEVER mask, replace or delay the real job result (FR-009). `job.status` carries
      # `cancelled` for a superseded run, which the script suppresses rather than publishing as a
      # failure for a commit that was never broken (FR-001a).
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          # US4 fallback: when the secret above is empty (an AGit-headed run has NO secrets), the
          # digest publishes a commit status with this run-provisioned token instead. Without this
          # line the fallback is DEAD CODE — it reads GITHUB_TOKEN from the step env, and nothing
          # else puts it there. Proven live in guardrails run #1628.
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs

  # Feature 043 — OKF conformance of the generated knowledge bundle at openwiki/.
  # KEYLESS and OFFLINE by construction: external `resource` links are shape-checked, never fetched,
  # so this job cannot fail because a third-party host is down (FR-013a). It needs no secret.
  # FAIL-CLOSED: an absent, empty, or partially-written bundle is a violation, not a vacuous pass —
  # there is deliberately no skip flag (FR-014a).
  # The gate's own unit tests are NOT run here: the `naming` job's shell-expanded
  # `node --test scripts/__tests__/*.test.mjs` glob already picks them up automatically.
  okf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The gate imports `yaml` (a root dependency, as several other check-* gates do), so this job
      # needs the workspace installed exactly like `naming` does. Without it the gate dies on
      # ERR_MODULE_NOT_FOUND before running a single check — a job that fails for its own missing
      # dependency rather than for anything about the bundle.
      - name: Enable pnpm (corepack, version from package.json packageManager)
        run: bash scripts/ci-log-step.sh okf-enable-pnpm corepack enable
      - name: Install JS dependencies
        run: bash scripts/ci-log-step.sh okf-install-js-dependencies pnpm install --frozen-lockfile
      - name: OKF conformance gate (selftest + scan — openwiki/ bundle structure and links)
        run: |
          bash scripts/ci-log-step.sh okf-gate-selftest node scripts/check-openwiki-okf.mjs --selftest
          bash scripts/ci-log-step.sh okf-gate node scripts/check-openwiki-okf.mjs
      # Feature 044 — governance: the regeneration policy classifies every documentation path, the
      # generator's write scope stays inside the bundle, relocated load-bearing passages still match
      # their fingerprints, and CLAUDE.md has not re-grown past its index. Deliberately STEPS IN THIS
      # JOB rather than a new job: a new job would incur its own failure-digest obligation for no
      # benefit, and this gate has exactly the same posture as the one above — offline, keyless,
      # fail-closed, no skip flag.
      - name: OpenWiki governance gate (selftest + scan — policy, passage protection, index)
        run: |
          bash scripts/ci-log-step.sh okf-governance-selftest node scripts/check-openwiki-governance.mjs --selftest
          bash scripts/ci-log-step.sh okf-governance node scripts/check-openwiki-governance.mjs
      # Feature 042 — every job must publish an agent-readable failure digest, or
      # check-ci-digest-coverage.mjs (run by the `naming` job) fails the build.
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          # US4 fallback: when the secret above is empty (an AGit-headed run has NO secrets), the
          # digest publishes a commit status with this run-provisioned token instead. Without this
          # line the fallback is DEAD CODE — it reads GITHUB_TOKEN from the step env, and nothing
          # else puts it there. Proven live in guardrails run #1628.
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs

  # Ported from agent-gates.yml — KEYLESS agent quality gates (FR-003). The golden-pair gate runs in
  # REPLAY mode (cassettes, no ANTHROPIC_API_KEY, no network, no model). Needs pnpm + uv.
  agent-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable pnpm (corepack)
        run: bash scripts/ci-log-step.sh agent-gates-enable-pnpm corepack enable
      - name: Install uv
        run: |
          bash scripts/ci-log-step.sh agent-gates-install-uv bash -e /dev/stdin <<'CI_LOG_STEP'
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          CI_LOG_STEP
      - name: Install JS dependencies
        run: bash scripts/ci-log-step.sh agent-gates-install-js-dependencies pnpm install --frozen-lockfile
      - name: Lint (ruff + mypy)
        run: bash scripts/ci-log-step.sh agent-gates-lint pnpm nx lint movie-assistant
      - name: Unit tests (incl. SC-004 token-leak scan)
        run: bash scripts/ci-log-step.sh agent-gates-test pnpm nx test movie-assistant
      - name: Golden-pair gate (cassette replay — keyless, drift-proof)
        env:
          LLM_CASSETTE_MODE: replay
        run: bash scripts/ci-log-step.sh agent-gates-golden pnpm nx test:golden movie-assistant
      # Feature 042 — publish an agent-readable failure digest. The forge API exposes no log or
      # artifact endpoint, so each job PUSHES a distilled, redacted digest into a channel the API can
      # already read (a PR comment, or a commit status on push).
      # `always()` + `continue-on-error` + an unconditional exit 0 inside the script: a broken digest
      # must NEVER mask, replace or delay the real job result (FR-009). `job.status` carries
      # `cancelled` for a superseded run, which the script suppresses rather than publishing as a
      # failure for a commit that was never broken (FR-001a).
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          # US4 fallback: when the secret above is empty (an AGit-headed run has NO secrets), the
          # digest publishes a commit status with this run-provisioned token instead. Without this
          # line the fallback is DEAD CODE — it reads GITHUB_TOKEN from the step env, and nothing
          # else puts it there. Proven live in guardrails run #1628.
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs

  # Feature 033 — blocking SAST + SCA static scan (KEYLESS; no ${{ secrets }}). Semgrep code-SAST over
  # the TS/JS + Python surfaces, plus cargo/pnpm/pip dependency audits, normalized to one Critical/High/
  # Medium/Low scale and gated against security/sast/allowlist.yaml (the baseline). Fails on any
  # un-allowlisted High/Critical *blocking* finding (SAST, or runtime-scope SCA). SCA runs FULL every
  # time — a newly-published advisory can hit an unchanged dep, so it is deliberately NOT path-gated
  # (FR-013). Semgrep is full-tree on push (baseline) and changed-files on PRs (FR-014). Rust is the one
  # toolchain the runner image lacks, so cargo-audit is installed fresh (actions/cache is not mirrored
  # on this runner — a monthly binary+advisory-db cache is a future optimization).
  sast:
    runs-on: ubuntu-latest
    # Stays at 25. An intermediate revision of this PR raised it to 40 because pnpm 11.5.3's
    # `pnpm audit` took 550 s (9 m 10 s) where 10.33.0 took ~0 s — a real regression in that release.
    # pnpm 11.17.0 FIXES it (audit back to ~0 s; the whole SCA scan runs in 2 s), so the headroom is
    # no longer warranted and keeping it would be exactly the "timeout bump that quietly hides a slow
    # or hung step" that the raise was careful not to be. If a future pnpm regresses audit again,
    # raise it deliberately — do not treat a large budget as normal.
    timeout-minutes: 25
    steps:
      - name: Checkout (full history so the PR-base diff for changed-scope resolves)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Ensure the PR base ref is available for the changed-files diff
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/ci-log-step.sh sast-ensure-pr-base-ref-available git fetch --no-tags --depth=200 origin "$BASE_REF" || true
      - name: Enable pnpm (corepack)
        run: bash scripts/ci-log-step.sh sast-enable-pnpm corepack enable
      - name: Install native build deps (cargo-audit compiles native code)
        run: |
          bash scripts/ci-log-step.sh sast-install-native-build-deps apt-get update
          bash scripts/ci-log-step.sh sast-install-native-build-deps apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev
      - name: Install uv (Semgrep via uvx + pip-audit)
        run: |
          bash scripts/ci-log-step.sh sast-install-uv bash -e /dev/stdin <<'CI_LOG_STEP'
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          CI_LOG_STEP
      - name: Install Rust + cargo-audit
        run: |
          bash scripts/ci-log-step.sh sast-install-rust-cargo-audit bash -e /dev/stdin <<'CI_LOG_STEP'
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" install cargo-audit --locked
          CI_LOG_STEP
      - name: Install JS dependencies
        run: bash scripts/ci-log-step.sh sast-install-js-dependencies pnpm install --frozen-lockfile
      - name: Sync the Python agent env (pip-audit audits the installed venv, not a requirements file)
        run: bash "$GITHUB_WORKSPACE/scripts/ci-log-step.sh" sast-sync-python-agent-env uv sync --frozen
        working-directory: agents/movie-assistant
      - name: Gate selftest (prove fail/suppress/expiry paths before the real scan)
        run: bash scripts/ci-log-step.sh sast-gate-selftest node scripts/check-sast-findings.mjs --selftest
      - name: Static scan (Semgrep changed-scope on PRs / full on push; SCA always full)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          bash scripts/ci-log-step.sh sast-static-scan bash -e /dev/stdin <<'CI_LOG_STEP'
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/sast-scan.mjs --scope changed --base "origin/$BASE_REF"
          else
            node scripts/sast-scan.mjs --scope full
          fi
          CI_LOG_STEP
      - name: Gate — fail on any un-allowlisted High/Critical blocking finding
        run: bash scripts/ci-log-step.sh sast-gate node scripts/check-sast-findings.mjs
      - name: Upload scan reports (findings.json + SARIF + summary + native)
        if: ${{ always() }}
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: sast-report
          path: security/sast/reports/
      # Feature 042 — publish an agent-readable failure digest. The forge API exposes no log or
      # artifact endpoint, so each job PUSHES a distilled, redacted digest into a channel the API can
      # already read (a PR comment, or a commit status on push).
      # `always()` + `continue-on-error` + an unconditional exit 0 inside the script: a broken digest
      # must NEVER mask, replace or delay the real job result (FR-009). `job.status` carries
      # `cancelled` for a superseded run, which the script suppresses rather than publishing as a
      # failure for a commit that was never broken (FR-001a).
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          # US4 fallback: when the secret above is empty (an AGit-headed run has NO secrets), the
          # digest publishes a commit status with this run-provisioned token instead. Without this
          # line the fallback is DEAD CODE — it reads GITHUB_TOKEN from the step env, and nothing
          # else puts it there. Proven live in guardrails run #1628.
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs
