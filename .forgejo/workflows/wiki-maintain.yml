# Feature 044 (US2) — merge-triggered OpenWiki knowledge-bundle maintenance.
#
# Freshness without a human remembering: after a merge to `main` settles, plan the documentation work
# that landed, generate it in bounded slices, verify each slice by what actually appeared in the
# working tree, and open ONE always-current proposal for review. Never auto-merged (FR-013).
#
# ── Four properties in this file are load-bearing and easy to break by accident ──────────────────
#
# 1. THE DEBOUNCE IS `concurrency` + `cancel-in-progress` + AN INITIAL SLEEP. A new push cancels the
#    sleeping run and a fresh one starts, so a burst of merges produces exactly ONE run covering all
#    of them (SC-008a). Removing cancel-in-progress does not "make it safer" — it makes every push in
#    a burst eventually run, which is the opposite of a debounce.
#
# 2. THE MAXIMUM DEFERRAL IS GIT-DERIVED, and it has to be: the waiting run gets CANCELLED, and any
#    timer it held dies with it. `--should-wait` computes the age of the oldest commit the run record
#    has not covered, so a merge stream that never goes quiet still triggers a run at the ceiling
#    (SC-008b) rather than starving maintenance exactly when drift is fastest.
#
# 3. THIS RUN MUST NOT TRIGGER ITSELF (FR-009a). It pushes a `[skip ci]` marker commit to `main`, and
#    its own proposal is bundle-only; both are recognised and skipped below. SC-005a requires a merged
#    proposal to produce no further run.
#
# 4. IT IS NEVER A REQUIRED CONTEXT (FR-019). This job is paid and occasionally slow; it must never
#    gate an unrelated merge. Do not add it to branch protection.
#
# ── Credentials ─────────────────────────────────────────────────────────────────────────────────
# Two, both ALREADY in the Actions store and already consumed by existing jobs — this feature adds
# ZERO entries (FR-023):
#   * ANTHROPIC_API_KEY — the model credential, used by the generation step only.
#   * CD_PUSH_TOKEN     — the write-scoped repository credential (the cd-deploy digest-promote
#                         precedent), used to push the proposal branch and the marker commit.
# They stay distinct (FR-025) and neither ever appears on a command line (FR-024). Residual, recorded
# in the plan's Constitution Check: CD_PUSH_TOKEN can push directly to protected `main`, which opening
# a proposal does not need. FR-023a permits a narrower substitute provided it REDUCES privilege.
#
# Exit codes from `--execute` (contract C1): 0 done · 1 a slice failed verification · 2 bad usage or a
# missing credential · **3 stopped at the run budget with work outstanding, which is NOT a failure**.
# Reporting a budget stop as broken is the same mistake as reporting runner starvation as a red build.
name: wiki-maintain

on:
  push:
    branches: [main]
  # An operator run bypasses the quiet period entirely (FR-009c).
  workflow_dispatch:
    inputs:
      max-slices:
        description: Cap the number of slices this invocation attempts
        required: false
        default: ''
      since:
        description: Override the run-record marker (a git ref) — diagnostics and one-off sweeps
        required: false
        default: ''

# The debounce. Keyed per branch so a dispatch and a push do not fight, and cancelling is the whole
# mechanism: the newest trigger wins and restarts the quiet period.
concurrency:
  group: wiki-maintain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintain:
    runs-on: ubuntu-latest
    # Above the declared effective ceiling (<=24 pages / ~37 min) plus checkout and install overhead.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: the run record's marker is a commit, and the maximum deferral is the age of
          # the oldest commit past it. A shallow clone cannot answer either question.
          fetch-depth: 0
          token: ${{ secrets.CD_PUSH_TOKEN }}

      # ── property 3: do not trigger yourself ─────────────────────────────────────
      - name: Decide whether this push is our own work
        id: self
        run: |
          bash scripts/ci-log-step.sh maintain-decide-whether-this-push-our bash -e /dev/stdin <<'CI_LOG_STEP'
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "manual dispatch — proceeding"
            exit 0
          fi
          MESSAGE="$(git log -1 --pretty=%B)"
          CHANGED="$(git diff --name-only HEAD~1..HEAD || true)"
          # The marker commit this job pushes.
          if printf '%s' "$MESSAGE" | grep -qF '[skip ci]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SKIP: this is the run-record marker commit"
            exit 0
          fi
          # Our own proposal, merged: bundle-only. Nothing outside openwiki/ changed, so there is no
          # new documentation impact to cover, and covering it would loop forever.
          if [ -n "$CHANGED" ] && ! printf '%s\n' "$CHANGED" | grep -qv '^openwiki/'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SKIP: bundle-only change — this is our own proposal landing"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          CI_LOG_STEP

      - name: Enable pnpm (corepack, version from package.json packageManager)
        if: steps.self.outputs.skip != 'true'
        run: bash scripts/ci-log-step.sh maintain-enable-pnpm corepack enable

      - name: Install JS dependencies
        if: steps.self.outputs.skip != 'true'
        # The orchestrator imports `yaml`, a root dependency. Without this the run dies on
        # ERR_MODULE_NOT_FOUND before planning anything — 043's okf job failed its first CI run on
        # exactly this.
        run: bash scripts/ci-log-step.sh maintain-install-js-dependencies pnpm install --frozen-lockfile

      # The generator is a GLOBAL npm binary, not a workspace dependency: the dev container bakes it
      # into its toolchain image (`npm install -g openwiki@0.2.3`), so it is simply absent on the CI
      # runner. The first real run on `main` died with `/bin/sh: 1: openwiki: not found` — the
      # orchestrator did everything right, planned two slices, and then had nothing to invoke.
      #
      # Pinned, and kept in step with .devcontainer/toolchain.Dockerfile: an unpinned generator would
      # mean CI and local silently running different versions of the thing whose output we gate on.
      - name: Install the OpenWiki generator (pinned to match the dev container)
        if: steps.self.outputs.skip != 'true'
        run: bash scripts/ci-log-step.sh maintain-install-openwiki-generator npm install -g openwiki@0.2.3

      # ── property 1 + 2: debounce, with a git-derived ceiling ────────────────────
      - name: Wait out the quiet period unless the maximum deferral is reached
        if: steps.self.outputs.skip != 'true'
        run: |
          bash scripts/ci-log-step.sh maintain-wait-out-quiet-period-unless bash -e /dev/stdin <<'CI_LOG_STEP'
          set -euo pipefail
          DISPATCH=""
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && DISPATCH="--dispatched"
          WAIT="$(node scripts/wiki-maintain.mjs --should-wait $DISPATCH)"
          if [ "$WAIT" = "wait=true" ]; then
            echo "Waiting 15 minutes for main to go quiet. A newer push cancels this run and restarts the wait."
            sleep 900
          else
            echo "Not waiting — either dispatched manually, or the oldest uncovered commit has reached the maximum deferral."
          fi
          CI_LOG_STEP

      # Free, offline, and always safe: this is what makes a paid run reviewable before it happens.
      - name: Plan (offline, no credential, no model)
        if: steps.self.outputs.skip != 'true'
        run: bash scripts/ci-log-step.sh wiki-maintain-plan node scripts/wiki-maintain.mjs --plan

      - name: Configure git identity for the proposal and marker commits
        if: steps.self.outputs.skip != 'true'
        run: |
          bash scripts/ci-log-step.sh maintain-configure-git-identity git config user.name 'openwiki-maintenance'
          bash scripts/ci-log-step.sh maintain-configure-git-identity git config user.email 'openwiki-maintenance@users.noreply.local'

      - name: Maintain the bundle and propose the result
        id: run
        if: steps.self.outputs.skip != 'true'
        env:
          # The model credential. Used ONLY by generation, and never passed as an argument (FR-024).
          # Per-surface secret (048 US4): wiki-maintenance spend must be separable from CI spend in
          # the Anthropic console. Variable name unchanged (FR-015) — wiki-maintain.mjs keys on it.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_WIKI_MAINTAIN }}
          # The write credential, kept distinct from the model credential (FR-025).
          FORGE_TOKEN: ${{ secrets.CD_PUSH_TOKEN }}
          FORGE_API_BASE: ${{ github.server_url }}/api/v1
          FORGE_OWNER: ${{ github.repository_owner }}
          FORGE_REPO: ${{ github.event.repository.name }}
          FORGE_BASE_BRANCH: main
          FORGE_REMOTE: origin
          # Dispatch inputs arrive as ENVIRONMENT VARIABLES, never interpolated into the script below.
          # `${{ … }}` is substituted into the shell source before the shell ever runs, so an input
          # containing `;` or `$(…)` executes as code — flagged by semgrep's run-shell-injection rule on
          # the first CI run of this workflow, and correctly so.
          INPUT_MAX_SLICES: ${{ github.event.inputs.max-slices }}
          INPUT_SINCE: ${{ github.event.inputs.since }}
        run: |
          set -uo pipefail
          # Validated as well as quoted: an operator-supplied value should be rejected for being
          # malformed, not merely rendered harmless.
          ARGS=()
          if [ -n "${INPUT_MAX_SLICES:-}" ]; then
            case "$INPUT_MAX_SLICES" in ''|*[!0-9]*) echo "::error::max-slices must be a positive integer"; exit 2;; esac
            ARGS+=(--max-slices "$INPUT_MAX_SLICES")
          fi
          if [ -n "${INPUT_SINCE:-}" ]; then
            case "$INPUT_SINCE" in *[!A-Za-z0-9./_~^-]*) echo "::error::since must be a git ref"; exit 2;; esac
            ARGS+=(--since "$INPUT_SINCE")
          fi

          # Wrapped so the generator's own account of what it did reaches the feature-042 digest.
          # Without this the failing step reports "_not reported_" and a run that wrote nothing leaves
          # no evidence of WHY — which is exactly the gap that made the 50% failure rate unexplainable.
          bash scripts/ci-log-step.sh wiki-maintain-execute \
            node scripts/wiki-maintain.mjs --execute --propose ${ARGS[@]+"${ARGS[@]}"}
          CODE=$?
          echo "exit-code=$CODE" >> "$GITHUB_OUTPUT"

          # FR-017: the three outcomes are distinguishable, and a budget stop is NOT a failure.
          case "$CODE" in
            0) echo "outcome=completed-or-nothing-to-do" >> "$GITHUB_OUTPUT" ;;
            3) echo "outcome=stopped-at-budget" >> "$GITHUB_OUTPUT"
               echo '::notice::Stopped at the run budget with work outstanding (exit 3). Not a failure — the remainder is in the backlog and the next run picks it up.' ;;
            1) echo "outcome=failed" >> "$GITHUB_OUTPUT" ;;
            2) echo "outcome=failed" >> "$GITHUB_OUTPUT" ;;
          esac
          # 0 and 3 both mean "nothing is broken".
          [ "$CODE" = "0" ] || [ "$CODE" = "3" ]

      # The run record must be COMMITTED: runners are ephemeral, and the marker has to advance even on
      # a run that created no proposal (FR-012). `[skip ci]` keeps it from triggering this job again
      # (FR-009a) — the same mechanism cd-deploy's digest-promote commit uses.
      - name: Commit the run record
        if: always() && steps.self.outputs.skip != 'true'
        run: |
          bash scripts/ci-log-step.sh maintain-commit-run-record bash -e /dev/stdin <<'CI_LOG_STEP'
          set -uo pipefail
          git checkout main || git checkout -B main
          if git diff --quiet -- openwiki/.maintenance-state.json; then
            echo "the run record did not change — nothing to commit"
            exit 0
          fi

          # THIS JOB SLEEPS FOR THE DEBOUNCE, so `main` routinely moves under it — another merge, or
          # the previous run's own marker commit. The first attempt to push then fails
          # non-fast-forward, and a marker that cannot land means the NEXT run re-covers a range this
          # one already examined: paid work repeated, silently.
          #
          # So: rebuild the commit on top of the current remote tip and retry. The record is a single
          # file whose content this run owns outright, so replaying it is exact — there is nothing to
          # merge.
          RECORD="$(cat openwiki/.maintenance-state.json)"
          for attempt in 1 2 3; do
            git fetch --quiet origin main || true
            git reset --quiet --hard origin/main
            printf '%s' "$RECORD" > openwiki/.maintenance-state.json
            git add openwiki/.maintenance-state.json
            if git diff --cached --quiet; then
              echo "the record already matches origin/main — nothing to commit"
              exit 0
            fi
            git commit -q -m "chore(openwiki): advance the maintenance marker [skip ci]"
            if git push origin main; then
              echo "marker committed and pushed (attempt $attempt)"
              exit 0
            fi
            echo "push rejected — main moved during the run; rebuilding on the new tip ($attempt/3)"
          done
          echo "::error::could not push the run record after 3 attempts — the next run will re-cover this range"
          exit 1
          CI_LOG_STEP

      - name: Report the outcome
        if: always() && steps.self.outputs.skip != 'true'
        run: |
          bash scripts/ci-log-step.sh maintain-report-outcome echo "outcome=${{ steps.run.outputs.outcome }} (exit ${{ steps.run.outputs.exit-code }})"
          bash scripts/ci-log-step.sh maintain-report-outcome echo "A 'nothing-to-do' outcome means the marker advanced at no cost. It is NOT a failure, and"
          bash scripts/ci-log-step.sh maintain-report-outcome echo "a credential or generator failure is never reported as nothing-to-do."

      # Feature 042 — every job must publish an agent-readable failure digest, or
      # check-ci-digest-coverage.mjs (run by the `naming` job) fails the build.
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs
