# Feature 044 (US2) — OpenWiki knowledge-bundle maintenance, run once `main` has gone quiet.
#
# Freshness without a human remembering: after merges to `main` settle, plan the documentation work
# that landed, generate it in bounded slices, verify each slice by what actually appeared in the
# working tree, and open ONE always-current proposal for review. Never auto-merged (FR-013).
#
# ── Four properties in this file are load-bearing and easy to break by accident ──────────────────
#
# 1. THE DEBOUNCE IS THE SCHEDULE, NOT A SLEEP (item #613, 078 research R19). Until 2026-11 a push
#    started a run that slept 15 minutes inside the job — a quarter of its 60-minute window, leaving
#    ~37 for generation. Now a fire every 30 minutes runs scripts/wiki-quiet.mjs FIRST, before any
#    install: it generates only when main's newest uncovered commit is ≥ 15 min old, and otherwise
#    ends in about a minute so the next fire can look again. A `push` trigger would be pointless — a
#    push is by definition not quiet. cancel-in-progress is FALSE for the same reason it used to be
#    true: cancelling was the old debounce, and under a schedule it would kill a generation mid-run.
#
# 2. THE MAXIMUM DEFERRAL IS GIT-DERIVED. wiki-quiet.mjs runs anyway once the OLDEST uncovered commit
#    is 6 h old, so a merge stream that never goes quiet still triggers a run (SC-008b) rather than
#    starving maintenance exactly when drift is fastest. Nothing is held in run state between fires.
#
# 3. THIS RUN MUST NOT TRIGGER ITSELF (FR-009a). It pushes a `[skip ci]` marker commit to `main`, and
#    its own proposal is bundle-only; wiki-quiet.mjs does not count either as activity. SC-005a
#    requires a merged proposal to produce no further run.
#
# 4. IT IS NEVER A REQUIRED CONTEXT (FR-019). This job is paid and occasionally slow; it must never
#    gate an unrelated merge. Do not add it to branch protection.
#
# ── Credentials ─────────────────────────────────────────────────────────────────────────────────
# Two, both ALREADY in the Actions store and already consumed by existing jobs — this feature adds
# ZERO entries (FR-023):
#   * ANTHROPIC_API_KEY — the model credential, used by the generation step only.
#   * CD_PUSH_TOKEN     — the write-scoped repository credential (the cd-deploy digest-promote
#                         precedent), used to push the proposal branch and the marker commit.
# They stay distinct (FR-025) and neither ever appears on a command line (FR-024). Residual, recorded
# in the plan's Constitution Check: CD_PUSH_TOKEN can push directly to protected `main`, which opening
# a proposal does not need. FR-023a permits a narrower substitute provided it REDUCES privilege.
#
# Exit codes from `--execute` (contract C1): 0 done · 1 a slice failed verification · 2 bad usage or a
# missing credential · **3 stopped at the run budget with work outstanding, which is NOT a failure**.
# Reporting a budget stop as broken is the same mistake as reporting runner starvation as a red build.
name: wiki-maintain

on:
  # Every 30 minutes (R19): each fire is a queued job on the one shared runner, so 15 would double them
  # for half the lag. Nearly every fire ends after the checkout and one git query.
  schedule:
    - cron: '*/30 * * * *'
  # An operator run bypasses the quiet period entirely (FR-009c).
  workflow_dispatch:
    inputs:
      max-slices:
        description: Cap the number of slices this invocation attempts
        required: false
        default: ''
      since:
        description: Override the run-record marker (a git ref) — diagnostics and one-off sweeps
        required: false
        default: ''
      reasoning-effort:
        description: "Fireworks reasoning_effort for THIS run only (none, low, high, max); empty = the model default. Validated before any paid work."
        required: false
        default: ''

# Runs never overlap. NOT cancel-in-progress (property 1): a fire that arrives during a generation
# queues behind it, then finds the record covered and ends — it must never kill the run in progress.
concurrency:
  group: wiki-maintain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    # Derived, not remembered (078 research R9; wiki-maintain.guard.test.mjs recomputes it): setup and
    # the quiet check (no wait inside the job since item #613), then the generator's 4-min start deadline plus one
    # worst-case invocation (65 min since item #613 re-derived it from measured runs), then publishing.
    # 60 was the operator-approved hold on the one shared runner. RAISED TO 120 on 2026-10-02 (operator
    # decision, items #525/#613): at the measured 70-80 tok/s one uncovered page can need 60-75 min.
    # 120 is the HARD CEILING and only a dispatched run may use it — the deadline step below still holds
    # a scheduled run to 60, so raising this cannot lengthen the runs the schedule starts.
    timeout-minutes: 120
    steps:
      # FIRST, before the checkout and setup that count against the same timeout (item #613).
      # wiki-maintain runs the generator under this deadline (minus a reserve for verify, publish and
      # the record commit), so a hung model request ends as a failed slice WITH a committed run
      # record — instead of the platform killing the job with nothing recorded (runs 4385/4386).
      # The window is PER EVENT: a dispatched run may use the whole job (DISPATCH_MINUTES must equal
      # timeout-minutes); a scheduled run keeps the 60-minute shared-runner hold. The guard test
      # wiki-maintain.guard.test.mjs asserts both.
      # ci-log-step-exempt: this step runs BEFORE Checkout, so scripts/ci-log-step.sh does not exist
      # yet; it is a single arithmetic echo into $GITHUB_ENV with no output to capture.
      - name: Record the job deadline
        run: |
          SCHEDULE_MINUTES=60
          DISPATCH_MINUTES=120
          MINUTES=$SCHEDULE_MINUTES
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MINUTES=$DISPATCH_MINUTES; fi
          echo "WIKI_JOB_DEADLINE=$(( $(date +%s) + MINUTES * 60 ))" >> "$GITHUB_ENV"
          echo "job deadline: ${MINUTES} min (${{ github.event_name }})"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the run record's marker is a commit, and the maximum deferral is the age of
          # the oldest commit past it. A shallow clone cannot answer either question.
          fetch-depth: 0
          token: ${{ secrets.CD_PUSH_TOKEN }}

      # #748: run from the CURRENT tip, not the event commit. A run the forge queued rather than cancelled
      # (two merges in the same second, measured 2026-10-13) starts after an earlier run has committed
      # its record; planning from the event commit's older record repaid four pages (~$1.35) that could
      # not be published. `start` is the record's base for the three-way merge in the record-commit step.
      #
      # BEFORE the quiet check, and on every fire (item #613). A scheduled fire checks out the commit the
      # schedule was registered at, which stays put while main moves: read there, the run record is
      # stale, and the check said run=true on every fire (runs 6576-6583), each one installing, finding
      # nothing, and pushing a marker commit. Git only, so a "not yet" still installs nothing.
      - name: Move to the current tip of main
        id: tip
        run: |
          bash scripts/ci-log-step.sh maintain-move-to-current-tip bash -e /dev/stdin <<'CI_LOG_STEP'
          set -euo pipefail
          git fetch --quiet origin main
          git checkout -q -B main origin/main
          echo "start=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "running from origin/main at $(git rev-parse --short HEAD) (event commit ${GITHUB_SHA:0:8})"
          CI_LOG_STEP

      # ── properties 1, 2 and 3: has main gone quiet? ───────────────────────────────
      # BEFORE any install: node built-ins only, so a "not yet" costs this checkout and one node process.
      # It ignores the job's own commits ([skip ci] markers, bundle-only proposals), runs at the 6-hour
      # maximum deferral, and exits 1 on a git failure rather than reading it as "nothing to do".
      - name: Has main gone quiet? (decides before any install)
        id: quiet
        run: |
          bash scripts/ci-log-step.sh maintain-has-main-gone-quiet bash -e /dev/stdin <<'CI_LOG_STEP'
          set -euo pipefail
          DISPATCH=""
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && DISPATCH="--dispatched"
          node scripts/wiki-quiet.mjs $DISPATCH >> "$GITHUB_OUTPUT"
          CI_LOG_STEP

      - name: Enable pnpm (corepack, version from package.json packageManager)
        if: steps.quiet.outputs.run == 'true'
        run: bash scripts/ci-log-step.sh maintain-enable-pnpm corepack enable

      - name: Install JS dependencies
        if: steps.quiet.outputs.run == 'true'
        # The orchestrator imports `yaml`, a root dependency. Without this the run dies on
        # ERR_MODULE_NOT_FOUND before planning anything — 043's okf job failed its first CI run on
        # exactly this.
        run: bash scripts/ci-log-step.sh maintain-install-js-dependencies pnpm install --frozen-lockfile

      # The generator is not a workspace dependency, and the CI runner has none baked in: the first
      # real run on `main` died with `/bin/sh: 1: openwiki: not found` — the orchestrator planned two
      # slices and then had nothing to invoke. So this job installs it, and HOW is load-bearing.
      #
      # FROM A COMMITTED LOCKFILE, NEVER RESOLVED FRESH (item #704). This step used to be
      # `npm install -g openwiki@0.7.1 mermaid jsdom`: only `openwiki` was pinned, and its whole
      # transitive tree (openai, deepagents, langsmith, …) plus mermaid/jsdom resolved to whatever was
      # newest at run time — no lockfile, no cooldown. Run 4950 died 404-ing on openai 7.32.0 two
      # minutes after it was published; the same gap let a minutes-old package run with the
      # generator's model credential in its environment.
      #
      # tools/openwiki-generator/ is a STANDALONE pnpm workspace (its own pnpm-workspace.yaml, outside
      # the root workspace's globs) holding exact pins and pnpm-lock.yaml. `--frozen-lockfile` installs
      # exactly that tree or fails, and its `minimumReleaseAge` makes pnpm reject any locked entry
      # younger than three days at install time (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION) — as well as
      # at resolve time, which is what stops a lockfile REGENERATION dragging a fresh transitive in.
      #
      # `mermaid` + `jsdom` are the generator's optional peer deps and are locked in the same manifest:
      # without the real parser a diagram that fails only the strict check is rewritten in place into a
      # plain `text` fence, the run still exits 0, and every gate still passes. Kept at the version the
      # dev container's .devcontainer/toolchain.Dockerfile installs; the guard test fails a mismatch.
      - name: Install the OpenWiki generator from its committed lockfile
        if: steps.quiet.outputs.run == 'true'
        run: |
          bash scripts/ci-log-step.sh maintain-install-openwiki-generator bash -e /dev/stdin <<'CI_LOG_STEP'
          set -euo pipefail
          pnpm --dir tools/openwiki-generator install --frozen-lockfile
          echo "$GITHUB_WORKSPACE/tools/openwiki-generator/node_modules/.bin" >> "$GITHUB_PATH"
          CI_LOG_STEP

      # The checks that describe the PINNED generator (its managed AGENTS.md/CLAUDE.md block, its
      # concurrency range, its output-cap resolver) skip wherever it is not installed — every guardrail
      # job. This is the one job where it IS installed, so they run here, before any paid call, and a
      # SKIP fails the step: a skipped check reads as a pass, and a mismatched AGENTS.md block would fail
      # every slice of the run that follows (078 research R12).
      - name: Verify the installed generator matches what this repository expects
        if: steps.quiet.outputs.run == 'true'
        run: |
          bash scripts/ci-log-step.sh maintain-verify-installed-generator bash -e /dev/stdin <<'CI_LOG_STEP'
          set -euo pipefail
          # The `openwiki` every later step starts must be the LOCKED one — never a global that
          # happens to be on the runner's PATH.
          case "$(command -v openwiki)" in
            "$GITHUB_WORKSPACE/tools/openwiki-generator/node_modules/.bin/openwiki") ;;
            *) echo "::error::openwiki resolves to '$(command -v openwiki)', not the locked install"; exit 1 ;;
          esac
          OPENWIKI_ROOT="$GITHUB_WORKSPACE/tools/openwiki-generator/node_modules/openwiki" node --test --test-reporter=tap scripts/__tests__/wiki-maintain.guard.test.mjs > /tmp/generator-guard.tap 2>&1 || { cat /tmp/generator-guard.tap; exit 1; }
          grep -E '^# (tests|pass|fail|skipped)' /tmp/generator-guard.tap
          grep -qE '^# skipped 0$' /tmp/generator-guard.tap || { echo "::error::a generator check SKIPPED — a skip is not a pass here"; grep -B2 '# SKIP' /tmp/generator-guard.tap; exit 1; }
          CI_LOG_STEP

      # Free, offline, and always safe: this is what makes a paid run reviewable before it happens.
      - name: Plan (offline, no credential, no model)
        if: steps.quiet.outputs.run == 'true'
        run: bash scripts/ci-log-step.sh wiki-maintain-plan node scripts/wiki-maintain.mjs --plan

      - name: Configure git identity for the proposal and marker commits
        if: steps.quiet.outputs.run == 'true'
        run: |
          bash scripts/ci-log-step.sh maintain-configure-git-identity git config user.name 'openwiki-maintenance'
          bash scripts/ci-log-step.sh maintain-configure-git-identity git config user.email 'openwiki-maintenance@users.noreply.local'

      - name: Maintain the bundle and propose the result
        id: run
        if: steps.quiet.outputs.run == 'true'
        env:
          # The model credential. Used ONLY by generation, and never passed as an argument (FR-024).
          # Per-surface secret (048 US4): wiki-maintenance spend must be separable from CI spend in
          # the Anthropic console. Variable name unchanged (FR-015) — wiki-maintain.mjs keys on it.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_WIKI_MAINTAIN }}
          # Feature 078: the second model credential, for the Fireworks provider. Per-surface like the
          # Anthropic one, so wiki spend is separable on the Fireworks console. The launcher hands the
          # generator ONLY the credential of the provider it resolved (wiki-provider.mjs).
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_WIKI_MAINTAIN }}
          # Which model writes the bundle, and how. Repository variables, so switching provider is a
          # settings change, not a commit (078 SC-006); unset means the defaults in wiki-provider.mjs.
          # A malformed value FAILS the preflight before any paid work — it is never read as a default.
          #
          # 078 FR-002: CI writes with DeepSeek V4.1 Flash on Fireworks at page concurrency 4 — ~85–91%
          # cheaper per page than Sonnet 5, measured (research R9). Set the repository variable
          # MCM_WIKI_PROVIDER=anthropic to switch back without a commit (SC-006). The code default stays
          # Anthropic for LOCAL runs, which carry that key.
          MCM_WIKI_PROVIDER: ${{ vars.MCM_WIKI_PROVIDER || 'fireworks' }}
          MCM_WIKI_SERVICE_TIER: ${{ vars.MCM_WIKI_SERVICE_TIER }}
          MCM_WIKI_PAGE_CONCURRENCY: ${{ vars.MCM_WIKI_PAGE_CONCURRENCY || '4' }}
          # Item #525 trial (operator 2026-10-05): a per-dispatch reasoning effort, so a trial run never
          # changes what a scheduled run sends. A scheduled run has no inputs, so it falls through to the
          # repository variable, which is unset — the model default. wiki-provider.mjs rejects any value
          # Fireworks does not document, and the preflight sends it, so a bad value fails before paid work.
          MCM_WIKI_REASONING_EFFORT: ${{ github.event.inputs.reasoning-effort || vars.MCM_WIKI_REASONING_EFFORT }}
          # The write credential, kept distinct from the model credential (FR-025).
          FORGE_TOKEN: ${{ secrets.CD_PUSH_TOKEN }}
          FORGE_API_BASE: ${{ github.server_url }}/api/v1
          # Owner and repo are NOT set here: wiki-maintain.mjs reads GITHUB_REPOSITORY, which the runner sets
          # for every event. `github.event.repository.name` was empty on a scheduled fire (item #613).
          FORGE_BASE_BRANCH: main
          FORGE_REMOTE: origin
          # Dispatch inputs arrive as ENVIRONMENT VARIABLES, never interpolated into the script below.
          # `${{ … }}` is substituted into the shell source before the shell ever runs, so an input
          # containing `;` or `$(…)` executes as code — flagged by semgrep's run-shell-injection rule on
          # the first CI run of this workflow, and correctly so.
          INPUT_MAX_SLICES: ${{ github.event.inputs.max-slices }}
          INPUT_SINCE: ${{ github.event.inputs.since }}
        # Wrapped so the generator's own account of what it did reaches the feature-042 digest.
        # Without this the failing step reports "_not reported_" and a run that wrote nothing leaves
        # no evidence of WHY — which is exactly the gap that made the 50% failure rate unexplainable.
        #
        # The WHOLE block is inside the wrapper (item #177 variant 4). Only the generator call used to
        # be, so the two dispatch-input validation failures below (`exit 2`) failed the step from
        # OUTSIDE it — no capture, no `_failed-step` marker, and a digest that named nothing for the
        # one failure an operator can actually cause by hand.
        #
        # `bash /dev/stdin`, NOT `bash -e /dev/stdin`: this block reads the generator's exit code and
        # dispatches on it (0 and 3 are both success — FR-017). Under `-e` the shell would abort at
        # the generator's non-zero exit before `CODE=$?` ever ran, turning a budget stop into a
        # failure and losing the outputs the later steps read.
        run: |
          bash scripts/ci-log-step.sh wiki-maintain-execute bash /dev/stdin <<'CI_LOG_STEP'
          set -uo pipefail
          # Validated as well as quoted: an operator-supplied value should be rejected for being
          # malformed, not merely rendered harmless.
          ARGS=()
          if [ -n "${INPUT_MAX_SLICES:-}" ]; then
            case "$INPUT_MAX_SLICES" in ''|*[!0-9]*) echo "::error::max-slices must be a positive integer"; exit 2;; esac
            ARGS+=(--max-slices "$INPUT_MAX_SLICES")
          fi
          if [ -n "${INPUT_SINCE:-}" ]; then
            case "$INPUT_SINCE" in *[!A-Za-z0-9./_~^-]*) echo "::error::since must be a git ref"; exit 2;; esac
            ARGS+=(--since "$INPUT_SINCE")
          fi

          node scripts/wiki-maintain.mjs --execute --propose ${ARGS[@]+"${ARGS[@]}"}
          CODE=$?
          echo "exit-code=$CODE" >> "$GITHUB_OUTPUT"

          # FR-017: the three outcomes are distinguishable, and a budget stop is NOT a failure.
          case "$CODE" in
            0) echo "outcome=completed-or-nothing-to-do" >> "$GITHUB_OUTPUT" ;;
            3) echo "outcome=stopped-at-budget" >> "$GITHUB_OUTPUT"
               echo '::notice::Stopped at the run budget with work outstanding (exit 3). Not a failure — the remainder is in the backlog and the next run picks it up.' ;;
            1) echo "outcome=failed" >> "$GITHUB_OUTPUT" ;;
            2) echo "outcome=failed" >> "$GITHUB_OUTPUT" ;;
          esac
          # 0 and 3 both mean "nothing is broken".
          [ "$CODE" = "0" ] || [ "$CODE" = "3" ]
          CI_LOG_STEP

      # The run record must be COMMITTED: runners are ephemeral, and the marker has to advance even on
      # a run that created no proposal (FR-012). `[skip ci]` keeps it from triggering this job again
      # (FR-009a) — the same mechanism cd-deploy's digest-promote commit uses.
      - name: Commit the run record
        if: always() && steps.quiet.outputs.run == 'true'
        env:
          # The commit the run started from (the `tip` step), as the record merge's base. Passed as an
          # environment variable, never interpolated into the script.
          START: ${{ steps.tip.outputs.start }}
        run: |
          bash scripts/ci-log-step.sh maintain-commit-run-record bash -e /dev/stdin <<'CI_LOG_STEP'
          set -uo pipefail
          git checkout main || git checkout -B main
          if git diff --quiet -- openwiki/.maintenance-state.json; then
            echo "the run record did not change — nothing to commit"
            exit 0
          fi

          # THIS JOB SLEEPS FOR THE DEBOUNCE, so `main` routinely moves under it — another merge, or
          # the previous run's own marker commit. The first attempt to push then fails
          # non-fast-forward, and a marker that cannot land means the NEXT run re-covers a range this
          # one already examined: paid work repeated, silently.
          #
          # So: rebuild the commit on top of the current remote tip and retry. NOT by replaying this
          # run's whole record: a run does not own the record outright once runs overlap (#748). Run
          # 5229's replay erased an open proposal's pointer and two deadline tags another run had
          # committed. The tip's record is MERGED three-way against the record this run started from
          # (the `tip` step's commit); a genuine conflict — two different proposal pointers — fails
          # the step with nothing committed, rather than guessing.
          WORK="$(mktemp -d)"
          cp openwiki/.maintenance-state.json "$WORK/ours.json"
          START="${START:-}"
          if [ -z "$START" ] || ! git show "$START:openwiki/.maintenance-state.json" > "$WORK/base.json" 2>/dev/null; then
            # No known start (the tip step did not run): treat the tip as the base — this run's record wins, as before.
            rm -f "$WORK/base.json"
          fi
          for attempt in 1 2 3; do
            git fetch --quiet origin main || true
            git reset --quiet --hard origin/main
            cp openwiki/.maintenance-state.json "$WORK/theirs.json"
            [ -f "$WORK/base.json" ] || cp "$WORK/theirs.json" "$WORK/base.json"
            if ! node scripts/wiki-maintain.mjs --merge-record --base "$WORK/base.json" --ours "$WORK/ours.json" --theirs "$WORK/theirs.json" > "$WORK/merged.json"; then
              echo "::error::the run record conflicts with main's newer record — nothing committed (#748); see the conflict above"
              exit 1
            fi
            cp "$WORK/merged.json" openwiki/.maintenance-state.json
            git add openwiki/.maintenance-state.json
            if git diff --cached --quiet; then
              echo "the record already matches origin/main — nothing to commit"
              exit 0
            fi
            git commit -q -m "chore(openwiki): advance the maintenance marker [skip ci]"
            if git push origin main; then
              echo "marker committed and pushed (attempt $attempt)"
              exit 0
            fi
            echo "push rejected — main moved during the run; rebuilding on the new tip ($attempt/3)"
          done
          echo "::error::could not push the run record after 3 attempts — the next run will re-cover this range"
          exit 1
          CI_LOG_STEP

      - name: Report the outcome
        if: always() && steps.quiet.outputs.run == 'true'
        run: |
          bash scripts/ci-log-step.sh maintain-report-outcome echo "outcome=${{ steps.run.outputs.outcome }} (exit ${{ steps.run.outputs.exit-code }})"
          bash scripts/ci-log-step.sh maintain-report-outcome echo "A 'nothing-to-do' outcome means the marker advanced at no cost. It is NOT a failure, and"
          bash scripts/ci-log-step.sh maintain-report-outcome echo "a credential or generator failure is never reported as nothing-to-do."

      # Feature 042 — every job must publish an agent-readable failure digest, or
      # check-ci-digest-coverage.mjs (run by the `naming` job) fails the build.
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          # US4 fallback: when the secret above is empty (an AGit-headed run has NO secrets), the
          # digest publishes a commit status with this run-provisioned token instead. Without this
          # line the fallback is DEAD CODE — it reads GITHUB_TOKEN from the step env, and nothing
          # else puts it there. Proven live in guardrails run #1628.
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs
