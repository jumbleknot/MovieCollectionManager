# OpenWiki MANUAL REBUILD of operator-named pages — features 044, 078, 098. Dispatch only.
#
# Routine freshness is not this workflow's job. Since feature 098 (ADR-0004) the coding session that
# changes a page's source refreshes the page in the same PR, and the required `okf` check (V17) blocks
# a stale one. This workflow is the operator's tool for regenerating specific derived pages with the
# generator — say, after a large rewrite of a source — and nothing else: it rebuilds exactly the pages
# named in its `pages` input, verifies each by what actually appeared in the working tree, and opens
# or updates ONE proposal for review. Never auto-merged (FR-013).
#
# ── Three properties in this file are load-bearing and easy to break by accident ─────────────────
#
# 1. NO UNATTENDED SPEND. No schedule and no push trigger: until 2026-11-10 a daily fire ran a quiet
#    check against a committed run record and paid ~$1.50/day for ~1 landed page (run 5104). The quiet
#    check, the run record, its marker commit, the backlog and the cooldowns are all retired; the guard
#    test fails if any comes back.
#
# 2. THE PAGES ARE THE SCOPE. `pages` is required and validated twice: by a character class here,
#    before any install, and by wiki-maintain.mjs, which refuses a canonical, unknown or missing-source
#    page with exit 2 before any credential is read. cancel-in-progress stays FALSE: a second dispatch
#    queues behind a rebuild rather than killing it half-way.
#
# 3. IT IS NEVER A REQUIRED CONTEXT (FR-019). This job is paid and occasionally slow; it must never
#    gate an unrelated merge. Do not add it to branch protection.
#
# ── Credentials ─────────────────────────────────────────────────────────────────────────────────
# Both ALREADY in the Actions store — this workflow adds ZERO entries (FR-023):
#   * the model credential (ANTHROPIC_API_WIKI_MAINTAIN / FIREWORKS_API_WIKI_MAINTAIN), used by the
#     rebuild step only;
#   * CD_PUSH_TOKEN — the write-scoped repository credential, used to push the proposal branch.
# They stay distinct (FR-025) and neither ever appears on a command line (FR-024). Residual, recorded
# in 044's Constitution Check: CD_PUSH_TOKEN can push directly to protected `main`, which opening a
# proposal does not need. FR-023a permits a narrower substitute provided it REDUCES privilege.
#
# Exit codes from `--pages` (scripts/wiki-maintain.mjs): 0 every named page landed · 1 a named page
# did not land, or the proposal could not be published · 2 a refused page list, bad usage, a missing
# credential or a failed preflight — all before any paid call.
name: wiki-maintain

on:
  # NO SCHEDULE since 2026-11-10 (property 1). The daily fire (078 US7) was paused after run 5104:
  # openwiki forced 30 stale-Claims pages into every run and starved the requested ones (~$1.50/day
  # for ~1 landed page). Summaries are refreshed by coding sessions (ADR-0004); this workflow is a
  # manual rebuild only. The guard test fails if a schedule reappears.
  workflow_dispatch:
    inputs:
      pages:
        description: "Comma-separated derived pages to rebuild, as area/page.md (e.g. runbooks/backlog.md,projects/bff.md). Canonical pages are refused."
        required: true
      reasoning-effort:
        description: "Fireworks reasoning_effort for THIS run only (none, low, high, max); empty = the model default. Validated before any paid work."
        required: false
        default: ''

# Runs never overlap. NOT cancel-in-progress (property 2): a dispatch that arrives during a rebuild
# queues behind it — it must never kill the run in progress.
concurrency:
  group: wiki-maintain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    # Derived, not remembered (078 research R9; wiki-maintain.guard.test.mjs recomputes it): setup,
    # then one worst-case invocation (65 min since item #613 re-derived it from measured runs), then
    # publishing. RAISED TO 120 on 2026-10-02 (operator decision, items #525/#613): at the measured
    # 70-80 tok/s one page can need 60-75 min. 120 is the HARD CEILING; the deadline step below gives a
    # dispatched run all of it (the 60-minute branch is for any other event, of which there are none).
    timeout-minutes: 120
    steps:
      # FIRST, before the checkout and setup that count against the same timeout (item #613).
      # wiki-maintain runs the generator under this deadline (minus a reserve for verify and publish),
      # so a hung model request ends as a page that did not land, reported — instead of the platform
      # killing the job with nothing reported (runs 4385/4386).
      # The window is PER EVENT: a dispatched run may use the whole job (DISPATCH_MINUTES must equal
      # timeout-minutes); a scheduled run keeps the 60-minute shared-runner hold. The guard test
      # wiki-maintain.guard.test.mjs asserts both.
      # ci-log-step-exempt: this step runs BEFORE Checkout, so scripts/ci-log-step.sh does not exist
      # yet; it is a single arithmetic echo into $GITHUB_ENV with no output to capture.
      - name: Record the job deadline
        run: |
          SCHEDULE_MINUTES=60
          DISPATCH_MINUTES=120
          MINUTES=$SCHEDULE_MINUTES
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MINUTES=$DISPATCH_MINUTES; fi
          echo "WIKI_JOB_DEADLINE=$(( $(date +%s) + MINUTES * 60 ))" >> "$GITHUB_ENV"
          echo "job deadline: ${MINUTES} min (${{ github.event_name }})"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the proposal branch is rebased onto main and checked with `git cherry`
          # before it is pushed, which needs the commits it shares with main.
          fetch-depth: 0
          token: ${{ secrets.CD_PUSH_TOKEN }}

      # Rebuild from the CURRENT tip of main, whatever ref the dispatch named: the proposal is rebased
      # onto main, and generating from an older tree would propose pages main has already moved past.
      - name: Move to the current tip of main
        run: |
          bash scripts/ci-log-step.sh maintain-move-to-current-tip bash -e /dev/stdin <<'CI_LOG_STEP'
          set -euo pipefail
          git fetch --quiet origin main
          git checkout -q -B main origin/main
          echo "running from origin/main at $(git rev-parse --short HEAD) (event commit ${GITHUB_SHA:0:8})"
          CI_LOG_STEP

      # Property 2, the first half: the pages input is held to a character class BEFORE any install, so
      # a malformed dispatch costs a checkout. Arrives as an environment variable, never interpolated.
      - name: Validate the pages input
        env:
          INPUT_PAGES: ${{ github.event.inputs.pages }}
        run: |
          bash scripts/ci-log-step.sh maintain-validate-pages bash -e /dev/stdin <<'CI_LOG_STEP'
          set -euo pipefail
          case "${INPUT_PAGES:-}" in
            ''|*[!A-Za-z0-9./_,-]*) echo "::error::pages must be a comma-separated list of area/page.md"; exit 2;; esac
          echo "pages: $INPUT_PAGES"
          CI_LOG_STEP

      - name: Enable pnpm (corepack, version from package.json packageManager)
        run: bash scripts/ci-log-step.sh maintain-enable-pnpm corepack enable

      - name: Install JS dependencies
        # The orchestrator imports `yaml`, a root dependency. Without this the run dies on
        # ERR_MODULE_NOT_FOUND before planning anything — 043's okf job failed its first CI run on
        # exactly this.
        run: bash scripts/ci-log-step.sh maintain-install-js-dependencies pnpm install --frozen-lockfile

      # The generator is not a workspace dependency, and the CI runner has none baked in: the first
      # real run on `main` died with `/bin/sh: 1: openwiki: not found` — the orchestrator planned two
      # slices and then had nothing to invoke. So this job installs it, and HOW is load-bearing.
      #
      # FROM A COMMITTED LOCKFILE, NEVER RESOLVED FRESH (item #704). This step used to be
      # `npm install -g openwiki@0.7.1 mermaid jsdom`: only `openwiki` was pinned, and its whole
      # transitive tree (openai, deepagents, langsmith, …) plus mermaid/jsdom resolved to whatever was
      # newest at run time — no lockfile, no cooldown. Run 4950 died 404-ing on openai 7.32.0 two
      # minutes after it was published; the same gap let a minutes-old package run with the
      # generator's model credential in its environment.
      #
      # tools/openwiki-generator/ is a STANDALONE pnpm workspace (its own pnpm-workspace.yaml, outside
      # the root workspace's globs) holding exact pins and pnpm-lock.yaml. `--frozen-lockfile` installs
      # exactly that tree or fails, and its `minimumReleaseAge` makes pnpm reject any locked entry
      # younger than three days at install time (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION) — as well as
      # at resolve time, which is what stops a lockfile REGENERATION dragging a fresh transitive in.
      #
      # `mermaid` + `jsdom` are the generator's optional peer deps and are locked in the same manifest:
      # without the real parser a diagram that fails only the strict check is rewritten in place into a
      # plain `text` fence, the run still exits 0, and every gate still passes. Kept at the version the
      # dev container's .devcontainer/toolchain.Dockerfile installs; the guard test fails a mismatch.
      - name: Install the OpenWiki generator from its committed lockfile
        run: |
          bash scripts/ci-log-step.sh maintain-install-openwiki-generator bash -e /dev/stdin <<'CI_LOG_STEP'
          set -euo pipefail
          pnpm --dir tools/openwiki-generator install --frozen-lockfile
          echo "$GITHUB_WORKSPACE/tools/openwiki-generator/node_modules/.bin" >> "$GITHUB_PATH"
          CI_LOG_STEP

      # The checks that describe the PINNED generator (its managed AGENTS.md/CLAUDE.md block, its
      # concurrency range, its output-cap resolver) skip wherever it is not installed — every guardrail
      # job. This is the one job where it IS installed, so they run here, before any paid call, and a
      # SKIP fails the step: a skipped check reads as a pass, and a mismatched AGENTS.md block would fail
      # every slice of the run that follows (078 research R12).
      - name: Verify the installed generator matches what this repository expects
        run: |
          bash scripts/ci-log-step.sh maintain-verify-installed-generator bash -e /dev/stdin <<'CI_LOG_STEP'
          set -euo pipefail
          # The `openwiki` every later step starts must be the LOCKED one — never a global that
          # happens to be on the runner's PATH.
          case "$(command -v openwiki)" in
            "$GITHUB_WORKSPACE/tools/openwiki-generator/node_modules/.bin/openwiki") ;;
            *) echo "::error::openwiki resolves to '$(command -v openwiki)', not the locked install"; exit 1 ;;
          esac
          OPENWIKI_ROOT="$GITHUB_WORKSPACE/tools/openwiki-generator/node_modules/openwiki" node --test --test-reporter=tap scripts/__tests__/wiki-maintain.guard.test.mjs > /tmp/generator-guard.tap 2>&1 || { cat /tmp/generator-guard.tap; exit 1; }
          grep -E '^# (tests|pass|fail|skipped)' /tmp/generator-guard.tap
          grep -qE '^# skipped 0$' /tmp/generator-guard.tap || { echo "::error::a generator check SKIPPED — a skip is not a pass here"; grep -B2 '# SKIP' /tmp/generator-guard.tap; exit 1; }
          CI_LOG_STEP

      # Free, offline, and always safe: the run messages the generator will be given, and the second
      # half of property 2 — a canonical, unknown or missing-source page is refused here (exit 2).
      - name: Preview the rebuild (offline, no credential, no model)
        env:
          INPUT_PAGES: ${{ github.event.inputs.pages }}
        run: bash scripts/ci-log-step.sh wiki-maintain-preview node scripts/wiki-maintain.mjs --pages "$INPUT_PAGES" --dry-run

      - name: Configure git identity for the proposal commit
        run: |
          bash scripts/ci-log-step.sh maintain-configure-git-identity git config user.name 'openwiki-maintenance'
          bash scripts/ci-log-step.sh maintain-configure-git-identity git config user.email 'openwiki-maintenance@users.noreply.local'

      - name: Rebuild the named pages and propose the result
        id: run
        env:
          # The model credential. Used ONLY by generation, and never passed as an argument (FR-024).
          # Per-surface secret (048 US4): wiki-maintenance spend must be separable from CI spend in
          # the Anthropic console. Variable name unchanged (FR-015) — wiki-maintain.mjs keys on it.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_WIKI_MAINTAIN }}
          # Feature 078: the second model credential, for the Fireworks provider. Per-surface like the
          # Anthropic one, so wiki spend is separable on the Fireworks console. The launcher hands the
          # generator ONLY the credential of the provider it resolved (wiki-provider.mjs).
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_WIKI_MAINTAIN }}
          # Which model writes the bundle, and how. Repository variables, so switching provider is a
          # settings change, not a commit (078 SC-006); unset means the defaults in wiki-provider.mjs.
          # A malformed value FAILS the preflight before any paid work — it is never read as a default.
          #
          # 078 FR-002: CI writes with DeepSeek V4.1 Flash on Fireworks at page concurrency 4 — ~85–91%
          # cheaper per page than Sonnet 5, measured (research R9). Set the repository variable
          # MCM_WIKI_PROVIDER=anthropic to switch back without a commit (SC-006). The code default stays
          # Anthropic for LOCAL runs, which carry that key.
          MCM_WIKI_PROVIDER: ${{ vars.MCM_WIKI_PROVIDER || 'fireworks' }}
          MCM_WIKI_SERVICE_TIER: ${{ vars.MCM_WIKI_SERVICE_TIER }}
          MCM_WIKI_PAGE_CONCURRENCY: ${{ vars.MCM_WIKI_PAGE_CONCURRENCY || '4' }}
          # Item #525 trial (operator 2026-10-05): a per-dispatch reasoning effort. Unset, it falls through
          # to the repository variable, and when that is unset to `low` (078 FR-028, amendment 2026-11-09:
          # about half of a month's spend was failed runs at the model default). wiki-provider.mjs rejects
          # any value Fireworks does not document, and the preflight sends it, so a bad value fails before
          # paid work. The generator reads it from this environment for every invocation.
          MCM_WIKI_REASONING_EFFORT: ${{ github.event.inputs.reasoning-effort || vars.MCM_WIKI_REASONING_EFFORT || 'low' }}
          # The write credential, kept distinct from the model credential (FR-025).
          FORGE_TOKEN: ${{ secrets.CD_PUSH_TOKEN }}
          FORGE_API_BASE: ${{ github.server_url }}/api/v1
          # Owner and repo are NOT set here: wiki-maintain.mjs reads GITHUB_REPOSITORY, which the runner sets
          # for every event. `github.event.repository.name` was empty on a scheduled fire (item #613).
          FORGE_BASE_BRANCH: main
          FORGE_REMOTE: origin
          # Dispatch inputs arrive as ENVIRONMENT VARIABLES, never interpolated into the script below.
          # `${{ … }}` is substituted into the shell source before the shell ever runs, so an input
          # containing `;` or `$(…)` executes as code — flagged by semgrep's run-shell-injection rule on
          # the first CI run of this workflow, and correctly so.
          INPUT_PAGES: ${{ github.event.inputs.pages }}
        # Wrapped so the generator's own account of what it did reaches the feature-042 digest.
        # Without this the failing step reports "_not reported_" and a run that wrote nothing leaves
        # no evidence of WHY — which is exactly the gap that made the 50% failure rate unexplainable.
        #
        # The WHOLE block is inside the wrapper (item #177 variant 4), so a validation failure below is
        # captured and named by the digest too.
        #
        # `bash /dev/stdin`, NOT `bash -e /dev/stdin`: this block reads the rebuild's exit code and
        # reports it. Under `-e` the shell would abort at a non-zero exit before `CODE=$?` ever ran.
        run: |
          bash scripts/ci-log-step.sh wiki-maintain-execute bash /dev/stdin <<'CI_LOG_STEP'
          set -uo pipefail
          # Validated as well as quoted (property 2): rejected for being malformed, not merely rendered
          # harmless.
          case "${INPUT_PAGES:-}" in
            ''|*[!A-Za-z0-9./_,-]*) echo "::error::pages must be a comma-separated list of area/page.md"; exit 2;; esac

          node scripts/wiki-maintain.mjs --pages "$INPUT_PAGES" --propose
          CODE=$?
          echo "exit-code=$CODE" >> "$GITHUB_OUTPUT"
          case "$CODE" in
            0) echo "outcome=all-landed" >> "$GITHUB_OUTPUT" ;;
            1) echo "outcome=not-all-landed" >> "$GITHUB_OUTPUT"
               echo '::warning::Not every named page landed — the log lists them under "not landed:". Re-dispatch them, or refresh them in a session (wiki-refresh skill).' ;;
            *) echo "outcome=refused-or-failed-before-generation" >> "$GITHUB_OUTPUT" ;;
          esac
          [ "$CODE" = "0" ]
          CI_LOG_STEP

      - name: Report the outcome
        if: always()
        run: |
          bash scripts/ci-log-step.sh maintain-report-outcome echo "outcome=${{ steps.run.outputs.outcome }} (exit ${{ steps.run.outputs.exit-code }})"
          bash scripts/ci-log-step.sh maintain-report-outcome echo "all-landed: every named page is on the proposal. not-all-landed: see the not-landed lines in the rebuild step."

      # Feature 042 — every job must publish an agent-readable failure digest, or
      # check-ci-digest-coverage.mjs (run by the `naming` job) fails the build.
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          # US4 fallback: when the secret above is empty (an AGit-headed run has NO secrets), the
          # digest publishes a commit status with this run-provisioned token instead. Without this
          # line the fallback is DEAD CODE — it reads GITHUB_TOKEN from the step env, and nothing
          # else puts it there. Proven live in guardrails run #1628.
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs
