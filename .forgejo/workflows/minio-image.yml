# MinIO image publish (feature 069, item #420). Builds `minio` + `mc` FROM SOURCE and pushes the
# result (tag + immutable @sha256: digest) to the forge registry as `minio`.
#
# WHY WE BUILD THIS AT ALL. MinIO deleted minio/minio and minio/mc from Docker Hub on 2026-09-11 and
# moved the community edition to source-only distribution in October 2025, so no registry receives
# updates any more — the newest SOURCE tag (RELEASE.2025-10-15T17-29-55Z, "Security/CVE") reached none
# of them. Switching registry relocates the problem; building from source ends it.
#
# DISJOINT from cd-deploy, like devcontainer-image: it builds no app image and no prod artifact, never
# deploys, never touches Komodo, and carries no app secret. Unlike devcontainer-image, the image it
# publishes IS scanned — `scripts/infra-image-scan.mjs` enumerates it, because feature 069 changed that
# scanner's exclusion from the `jumbleknot/` prefix to cd-deploy's actual built set. See
# specs/069-minio-from-source/contracts/scanner-scope.md.
#
# ── THE TWO AUTOMATIC TRIGGERS DO DIFFERENT JOBS. Do not collapse them. ───────────────────────────
#
#   push (Dockerfile changed)  THE PATCH PATH. A Go-toolchain or Alpine CVE reaches this image when
#                              RENOVATE BUMPS THE PINNED DIGEST in the Dockerfile, which edits the
#                              file and fires this trigger. Both base images are digest-pinned, so
#                              this is the only way a base patch arrives.
#
#   schedule (weekly)          MOSTLY a canary, plus ONE narrow patch path. It proves the build still
#                              WORKS — upstream source still fetchable, pinned toolchain still
#                              compiling this source — which matters because upstream has already
#                              deleted its images and could delete its source. It ALSO picks up
#                              Alpine package updates, because `apk add ca-certificates` resolves
#                              against the live index at build time. It does NOT pick up base-image
#                              or Go-toolchain patches; those are digest-pinned and arrive above.
#
# THE DIGEST CHANGES BETWEEN IDENTICAL BUILDS. Measured, not assumed: runs 3115 and 3117 built the
# same source and produced sha256:7038b9e9… and sha256:1e981fa1…. The apk installs float, so this
# image is NOT bit-reproducible. A changed digest on a scheduled run is therefore expected and is not
# evidence of anything having moved upstream.
#
# This comment has been wrong twice — first calling the cron the patch path, then calling the rebuild
# reproducible. Two real digests settled it. specs/069-minio-from-source/research.md §R8 has both
# corrections and the per-input table.
name: minio-image

on:
  workflow_dispatch:
  push:
    paths:
      # THE DOCKERFILE ONLY — this workflow file is deliberately NOT in its own filter.
      #
      # It was, and that produced a feedback loop worth avoiding: editing a COMMENT here rebuilt the
      # image (run 3119), and because the build is not bit-reproducible (see the note below), the new
      # image got a new digest, which invalidated the digest the compose files pin. A documentation fix
      # silently broke the stack's image references.
      #
      # A change to this workflow does not change what the image CONTAINS. Where it genuinely would —
      # different build args or flags — dispatch it by hand; that is what workflow_dispatch is for.
      - 'infrastructure-as-code/docker/minio/Dockerfile'
  schedule:
    # Friday 05:00 UTC — an hour before devcontainer-image's weekly, so the two heavy builds do not
    # contend on the capacity-1 runner. Cron is UTC-only and does not observe DST (drifts ±1h across
    # the boundary — same caveat as infra-image-scan and devcontainer-image).
    - cron: '0 5 * * 5'

concurrency:
  group: minio-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-publish:
    # kvm runner — the same Docker-capable self-hosted runner cd-deploy and devcontainer-image use.
    runs-on: kvm
    timeout-minutes: 60
    env:
      # Reach the ci user's rootless Docker daemon (same as cd-deploy).
      DOCKER_HOST: unix:///run/user/1001/docker.sock
      # Host-free registry coordinates (Forgejo Actions vars — never a git literal, topology-scrub).
      REGISTRY: ${{ vars.REGISTRY }}
      NS: ${{ vars.NS }}
      REGISTRY_USER: ${{ vars.REGISTRY_USER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker CLI (talk to the runner's daemon socket)
        run: |
          bash scripts/ci-log-step.sh minio-image-set-up-docker-cli bash -e /dev/stdin <<'CI_LOG_STEP'
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::docker CLI not found on the runner"; exit 1
          fi
          docker version >/dev/null || { echo "::error::cannot reach the Docker daemon at $DOCKER_HOST"; exit 1; }
          CI_LOG_STEP

      # The Dockerfile reads its own pinned release tag, so the published TAG is derived from the
      # source rather than from the commit — an image tagged with a git sha would tell a reader
      # nothing about which MinIO it contains, and the compose refs are what people read.
      - name: Build MinIO from source
        # The `:?` var guard is INSIDE the wrapper (item #177 variant 4): above it, an unset REGISTRY
        # fails the step before the wrapper runs — no capture, no marker, and a digest naming nothing.
        run: |
          bash scripts/ci-log-step.sh minio-image-build bash -e /dev/stdin <<'CI_LOG_STEP'
          : "${REGISTRY:?set the REGISTRY Forgejo var}" "${NS:?set the NS Forgejo var}"
          DOCKERFILE=infrastructure-as-code/docker/minio/Dockerfile
          RELEASE="$(awk -F= '/^ARG MINIO_TAG=/{print $2}' "$DOCKERFILE")"
          : "${RELEASE:?could not read MINIO_TAG from $DOCKERFILE}"
          # OUR IMAGE GETS AN ORDERABLE TAG. Upstream's RELEASE.2025-09-07T16-13-09Z cannot be ordered
          # by a generic classifier — it does not start with a digit — which is precisely why the two
          # upstream MinIO images were the repository's only DECLARED floating-tag exceptions
          # (feature 063 / item #297). This is our artifact, so we choose its tag, and mirroring an
          # unorderable format would import a problem we do not have to have. Transformed to
          # 2025.09.07-161309: same information, sorts correctly, and needs no exception at all.
          IMAGE_TAG="$(printf '%s' "$RELEASE" | sed -E 's/^RELEASE\.([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2})-([0-9]{2})-([0-9]{2})Z$/\1.\2.\3-\4\5\6/')"
          case "$IMAGE_TAG" in
            [0-9]*) ;;
            *) echo "::error::tag transform produced '$IMAGE_TAG' from '$RELEASE' — an unorderable tag"
               echo "::error::would reintroduce a floating-tag exception. Fix the transform."; exit 1 ;;
          esac
          # EVERY BUILD ALSO GETS AN IMMUTABLE TAG, and that is load-bearing rather than tidy.
          #
          # This registry DROPS a manifest the moment nothing tags it. Measured 2026-09-12: rebuilding
          # and re-pushing `:2025.09.07-161309` left the previous digest returning 404 — not merely
          # superseded, GONE, so every compose ref pinned to it stopped resolving. With the release
          # tag alone, the weekly canary cron would therefore have broken the observability stack in
          # dev AND prod every Friday: the build is not bit-reproducible (the apk installs float), so
          # a rebuild always mints a new digest and always orphans the old one.
          #
          # A per-run tag keeps each manifest referenced forever, so a digest pinned in compose stays
          # pullable and updating it becomes a deliberate act rather than a weekly breakage. This is
          # the pattern cd-deploy and devcontainer-image already use (they tag by GITHUB_SHA); tagging
          # by the upstream release alone was the mistake, because that is stable across rebuilds.
          BUILD_TAG="${IMAGE_TAG}-r${GITHUB_RUN_ID:?GITHUB_RUN_ID is unset — the immutable tag would collide}"
          TAG="${REGISTRY}/${NS}/minio:${IMAGE_TAG}"
          BUILD_REF="${REGISTRY}/${NS}/minio:${BUILD_TAG}"
          echo "BUILD_REF=$BUILD_REF" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build -f "$DOCKERFILE" -t "$TAG" -t "$BUILD_REF" "$(dirname "$DOCKERFILE")"
          CI_LOG_STEP

      # Contract acceptance BEFORE publishing. specs/069-minio-from-source/contracts/image-contract.md
      # C1 (both binaries), C2 (a shell exists), C3 (honest version), C5 (runs as root). C3 is the one
      # that needs asserting: a lost ldflags stamp still produces working binaries and a zero exit, so
      # nothing else would catch it — the image would just misreport what it is, for ever.
      - name: Verify the image contract
        run: |
          bash scripts/ci-log-step.sh minio-image-verify-contract bash -e /dev/stdin <<'CI_LOG_STEP'
          DOCKERFILE=infrastructure-as-code/docker/minio/Dockerfile
          WANT_MINIO="$(awk -F= '/^ARG MINIO_TAG=/{print $2}' "$DOCKERFILE")"
          WANT_MC="$(awk -F= '/^ARG MC_TAG=/{print $2}' "$DOCKERFILE")"
          got_minio="$(docker run --rm --entrypoint minio "$TAG" --version)"
          got_mc="$(docker run --rm --entrypoint mc "$TAG" --version)"
          got_uid="$(docker run --rm --entrypoint id "$TAG" -u)"
          echo "minio --version: $got_minio"
          echo "mc --version   : $got_mc"
          echo "uid            : $got_uid"
          case "$got_minio" in *"$WANT_MINIO"*) ;; *)
            echo "::error::C3 violated — minio reports '$got_minio', expected to contain '$WANT_MINIO'."
            echo "::error::The ldflags version stamp was lost. The binary works; it lies about itself."
            exit 1 ;;
          esac
          case "$got_mc" in *"$WANT_MC"*) ;; *)
            echo "::error::C3 violated — mc reports '$got_mc', expected to contain '$WANT_MC'."
            exit 1 ;;
          esac
          [ "$got_uid" = "0" ] || {
            echo "::error::C5 violated — image runs as uid $got_uid, not root."
            echo "::error::The live langfuse-minio-data volume is root-owned; a non-root uid cannot write to it."
            exit 1; }
          CI_LOG_STEP

      # SCAN BEFORE PUBLISHING — the image is scanned by its BUILDER, exactly as cd-deploy scans the
      # six images it builds. That is the repository's existing partition, and this feature initially
      # got it wrong: it routed this image to infra-image-scan instead, which then could not pull it.
      # infra-image-scan is KEYLESS by design ("no ${{ secrets }}"), and this image lives in a private
      # registry — so covering it there would have meant giving the keyless scanner credentials, and
      # scanning only AFTER publishing. Scanning here needs no new credential at all (the image is
      # already in the local daemon, just built) and gates the push instead of auditing it afterwards.
      #
      # Criteria mirror the infra gate's: --severity CRITICAL --ignore-unfixed. Fixable Criticals block;
      # fixable Highs and unfixable findings are report-only, the same CRITICAL-only policy cd-deploy
      # and infra-image-scan both use. A divergence here would mean two standards for "blocking".
      # The scan goes through scripts/infra-image-scan.mjs, which imports `yaml` — so this job needs a
      # Node toolchain and the workspace deps, exactly as infra-image-scan.yml does. Omitted on the
      # first attempt, and the failure was ERR_MODULE_NOT_FOUND on the kvm runner's default Node 20
      # (run 3125) — which reads like a code fault rather than a missing setup step.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install JS dependencies (the scanner + gate use the `yaml` package)
        run: bash scripts/ci-log-step.sh minio-image-install-js-dependencies pnpm install --frozen-lockfile

      - name: Install Trivy
        run: |
          bash scripts/ci-log-step.sh minio-image-install-trivy bash -e /dev/stdin <<'CI_LOG_STEP'
          mkdir -p "$HOME/.local/bin"
          # PINNED, and kept current by Renovate — same reasoning as item #303: an unpinned scanner is
          # a floating reference inside the tool that decides whether a Critical blocks a publish.
          TRIVY_VERSION=v0.74.0
          curl -fsSL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" \
            | sh -s -- -b "$HOME/.local/bin" "${TRIVY_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trivy" --version
          CI_LOG_STEP

      - name: Scan the built image (fixable Criticals block the publish)
        run: |
          bash scripts/ci-log-step.sh minio-image-scan bash -e /dev/stdin <<'CI_LOG_STEP'
          # Goes through the SHARED pipeline — same Trivy invocation, same severity map, and above all
          # the same security/infra-images/allowlist.yaml — rather than a bare `trivy --exit-code 1`.
          #
          # The bare form is what this step first shipped, and it works right up to the moment a
          # finding has to be ACCEPTED. Then the acceptance has nowhere to live but a second
          # suppression mechanism the weekly expiry check does not read and nobody thinks to look in.
          # One allowlist, one policy, one place to look — and one review cycle that can expire it.
          #
          # Proven necessary on this step's very first run (3123): the from-source image cleared
          # CVE-2025-68121 (the Go stdlib finding — that is the toolchain choice paying off) but
          # carries CVE-2026-33186 in google.golang.org/grpc, pinned at v1.72.0 in MinIO's own go.mod.
          # No upstream release fixes it: RELEASE.2025-10-15 pins v1.72.0 too, against a 1.79.3 fix.
          node scripts/infra-image-scan.mjs --image "$TAG"
          node scripts/check-infra-image-findings.mjs
          CI_LOG_STEP

      - name: Push (tag + digest) and surface the digest
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          bash scripts/ci-log-step.sh minio-image-push bash -e /dev/stdin <<'CI_LOG_STEP'
          : "${REGISTRY_USER:?set the REGISTRY_USER Forgejo var}"
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          # BOTH tags. The moving release tag is what a human reads; the per-run tag is what keeps
          # this manifest alive after the next rebuild re-points the release tag (see the note in the
          # build step — an untagged manifest is dropped by this registry and a pinned digest 404s).
          docker push "$TAG"
          docker push "$BUILD_REF"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$TAG" | cut -d'@' -f2)"
          echo "Published MinIO image:"
          echo "  moving tag   : $TAG"
          echo "  immutable tag: $BUILD_REF"
          echo "  digest       : $DIGEST"
          {
            echo "## MinIO image published"
            echo ""
            echo "Pin this in the observability compose files (both dev and prod):"
            echo ""
            echo '```'
            echo "\${REGISTRY_HOST}/\${NS}/minio:$(echo "$TAG" | sed 's/.*://')@$DIGEST"
            echo '```'
            echo ""
            echo "A CHANGED digest on a scheduled run is expected: the apk installs resolve against"
            echo "Alpine's live index, so this image is not bit-reproducible. It does NOT mean anything"
            echo "moved upstream. See the trigger note at the top of .forgejo/workflows/minio-image.yml."
            echo ""
            echo "If you are updating the compose refs, use the digest printed above — not a remembered"
            echo "one. Two builds of identical source produced different digests (runs 3115, 3117)."
            echo ""
            echo "You do NOT have to update them on every rebuild: the per-run tag keeps each manifest"
            echo "alive, so a previously-pinned digest stays pullable. That was not true before"
            echo "2026-09-12 — the release tag alone left orphaned manifests, which this registry drops."
          } >> "$GITHUB_STEP_SUMMARY"
          CI_LOG_STEP

      # Feature 042 — publish an agent-readable failure digest. The forge API exposes no log or
      # artifact endpoint, so each job PUSHES a distilled, redacted digest into a channel the API can
      # already read (a PR comment, or a commit status on push).
      # `always()` + `continue-on-error` + an unconditional exit 0 inside the script: a broken digest
      # must NEVER mask, replace or delay the real job result (FR-009 of feature 042). `job.status`
      # carries `cancelled` for a superseded run, which the script suppresses rather than publishing as
      # a failure for a commit that was never broken.
      #
      # This job needs it more than most: it is the only place a build failure would surface, and the
      # two most likely failures — upstream source withdrawn, or a moved tag tripping the commit
      # assertion — are exactly the ones a reader must be able to diagnose without shell access.
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs
