# Package-registry retention (spec 084 US5, item #863). Weekly REPORT of what
# infrastructure-as-code/forgejo/registry-retention.yaml keeps and deletes in the forge's package
# registry; deletes only on a dispatch with `apply: true` AND `mode: apply` in that file.
#
# The schedule NEVER deletes: `--apply` is passed only by a workflow_dispatch whose `apply` input is
# true (a guard in scripts/__tests__/registry-retention.test.mjs fails otherwise), and the script
# refuses it while the config says `mode: report`. Two independent keys, held in two places.
#
# fetch-depth: 0 because the protected set is read from git history: the digests pinned in every
# .env.deploy at the newest promotion and the five before it (the rollback targets). The script
# refuses a shallow clone rather than protecting only HEAD.
#
# Token: REGISTRY_CLEANUP_TOKEN, a forge token scoped `write:package` ONLY (Server-Setup-Runbook §6.5).
name: registry-retention

on:
  schedule:
    # Sundays 06:00 UTC: after the Friday Renovate window has settled, outside the nightly backup.
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete the `delete` rows (also requires `mode: apply` in the committed config)'
        type: boolean
        default: false

concurrency:
  group: registry-retention
  cancel-in-progress: false

jobs:
  registry-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full history — the rollback targets are read from it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24.19.0, cache: pnpm }

      - name: Install JS dependencies (the script reads its config with the `yaml` package)
        run: bash scripts/ci-log-step.sh registry-retention-install-js-dependencies pnpm install --frozen-lockfile

      - name: Report (and, on an apply dispatch, delete)
        env:
          MCM_FORGE_URL: ${{ github.server_url }}
          REGISTRY_CLEANUP_TOKEN: ${{ secrets.REGISTRY_CLEANUP_TOKEN }}
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
        run: |
          bash scripts/ci-log-step.sh registry-retention bash -e /dev/stdin <<'CI_LOG_STEP'
          set -o pipefail
          node scripts/registry-retention.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.apply == true) && '--apply' || '' }} \
            | tee registry-retention-report.txt
          CI_LOG_STEP

      # The delete rows and the totals only: the full report has a row per version (~3,700).
      - name: Write the report to the job summary
        if: always()
        run: |
          bash scripts/ci-log-step.sh registry-retention-summary bash -e /dev/stdin <<'CI_LOG_STEP'
          [ -f registry-retention-report.txt ] || { echo "no report was written"; exit 0; }
          {
            echo "## Registry retention"
            echo ""
            echo '```'
            grep -v '  keep:' registry-retention-report.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          CI_LOG_STEP

      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          # An AGit-headed run has NO secrets; the digest then falls back to a commit status with
          # this run-provisioned token. Without this line that fallback is dead code.
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs
