# Feature 023 (US2) — full application CI on the homelab forge. Ports .github/workflows/android-e2e.yml
# (Metro-less mobile agent E2E against the containerized stack) and folds in an nx-affected
# lint/build/unit stage that consumes the self-hosted Nx remote cache (T004/T011).
#
# What runs (FR-005..FR-010):
#   job `affected` : nx affected lint/build/test (remote-cache-backed; unaffected projects skipped)
#   job `app-e2e`  : provision env (gen-dev-secrets + gen-ci-env + ci-realm import) → bring up
#                    auth→mcm stacks → dev BFF (:8082) → containerized agent gateway+MCP → full web
#                    Playwright E2E (dev-container) → build release APK → 8 Maestro agent flows
#                    per-file on a KVM emulator → upload diagnostics on failure.
#
# Provisioning closes the original android-e2e "BLOCKED (ci-provisioning)" gap: gen-ci-env.mjs writes
# the gitignored env/secret files from Forgejo secrets, and ci-realm.json is imported on Keycloak boot
# (compose.ci.yaml) — no manual host prep (FR-006).
name: app-ci

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Agent model provider (anthropic recommended in CI; ollama needs a model pull)'
        type: choice
        options: [anthropic, ollama]
        default: anthropic
  # push only on main (merges) — feature branches are gated via `pull_request`, so a branch push with an
  # open PR no longer runs app-ci twice. A main push also drives trigger-cd → cd-deploy.
  #
  # NO `paths:` filter, since item #230 (2026-08-31). It used to carry one, with the explicit rationale
  # "`push:` (main) keeps its paths filter — a docs/config merge to main should NOT trigger cd-deploy".
  # That was the right goal answered in the wrong place, and it cost a production deploy.
  #
  # MEASURED 2026-08-22: PR #217 (app dependency changes) merged and app-ci went green. PR #228 merged
  # seconds later and CANCELLED #217's still-running guardrails — a cancelled run reports its contexts
  # as `failure`, so all five `guardrails / *` statuses on #217 read failure for a commit that was never
  # broken, and trigger-cd refused to dispatch. #228 was config-only, so THIS FILTER kept app-ci off its
  # merge entirely: no app-ci contexts, therefore no trigger-cd job, therefore no replacement trigger.
  # #217's changes reached `main` and were never deployed, and nothing said so.
  #
  # "The newer commit carries the deploy" is only true if the newer commit RUNS. So app-ci now runs on
  # every push to main, and the question this filter was really asking — is there anything to deploy —
  # is answered by DEPLOYABLE_PATHS in scripts/cd-dispatch-gate.mjs, evaluated over the range since the
  # last deploy rather than over one commit's diff. A docs/config merge still does not deploy; it now
  # declines VISIBLY (a `cd-dispatch / trigger-cd` commit status) instead of by never existing.
  #
  # The cost is bounded and accepted: a docs/config merge to main now runs the light `affected` +
  # `mc-service-checks` jobs. The ~23-min `app-e2e` and `dast` are still gated by the `changes` job,
  # exactly as on a pull request. Pinned by scripts/__tests__/app-ci-trigger-cd.guard.test.mjs.
  push:
    branches: [main]
  # NO `paths:` filter — app-ci runs on EVERY PR (branch-protection Option 2, 2026-07-07). Rationale:
  # branch protection requires the `app-ci*` checks, but a path-filtered app-ci left non-app PRs (docs,
  # config, lockfiles) with ZERO `app-ci/*` status → the required glob was unmet → unmergeable without an
  # admin override (this bit #30/#31 config, #36/#37 lockfiles, #39 docs — whack-a-mole per class). Running
  # app-ci on every PR makes the required contexts always PRESENT so any PR is mergeable by check. The
  # heavy `app-e2e` (~23 min) is STILL gated — by the `changes` dorny paths-filter job below — so a docs/
  # config PR runs only the light `affected` + `mc-service-checks` jobs, not the E2E suite.
  #
  # LOCKFILE PRs ARE NO LONGER IN THAT CLASS (feature 058 / item #186, 2026-08-13). This comment used to
  # end "docs/config/lockfile PR", and that was a considered decision — it is reversed here rather than
  # quietly edited, because two of its premises stopped holding:
  #   1. Feature 057's FR-013 established that the E2E tier is the ONLY tier that catches a bad transitive
  #      floor. These are JS-toolchain transitives, so breakage surfaces at BUILD time — `nx test` passes
  #      straight over a broken floor. The light jobs a lockfile PR did run are exactly the blind ones.
  #   2. Feature 057 fixed #153, so Renovate proposes again, and feature 058 enables `lockFileMaintenance`
  #      — which makes a lockfile-only PR a WEEKLY event rather than a rare hand-written one. The volume
  #      of the untested class went from ~zero to weekly.
  # Measured before the change: app-e2e reported `skipped` on both PR #185 and PR #187, and PR #185's only
  # evidence that its two raised floors did not break the app was a LOCAL run someone remembered to do.
  # The accepted cost is the ~23-min web+integration half only — `mobile` deliberately does NOT select
  # these files, so a dependency PR does not pay for the ~35-min emulator half (label `mobile-e2e` to
  # opt one in). Pinned by scripts/__tests__/app-ci-lockfile-filter.guard.test.mjs, because this forge
  # exposes no jobs/steps endpoint and a green tick cannot show which filter matched.
  # PAIRED with a branch-protection change: required checks must list the app-ci jobs EXCEPT `trigger-cd`
  # (a push-only job that leaves an orphaned `pending` on PRs) — see
  # docs/proposals/homelab-setup/branch-protection-required-checks-cleanup.md. Do the BP change FIRST.
  # `push:` (main) no longer has a paths filter either (item #230, above): whether a merge deploys is
  # decided by scripts/cd-dispatch-gate.mjs, not by whether the workflow ran at all.
  pull_request:

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

# Self-hosted Nx remote cache (T004, research R2). Driven entirely by env — no nx.json literal; with
# the vars/secret unset (e.g. a local run) Nx silently falls back to the local cache.
env:
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ vars.NX_SELF_HOSTED_REMOTE_CACHE_SERVER }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}

jobs:
  # Cargo.lock is DELIBERATELY absent from the `changes` job's `app` filter below, unlike the
  # two pnpm files (feature 058 / item #186, whose third acceptance criterion allows a difference the
  # file records). The 057 FR-013 argument — "only the E2E tier catches a bad floor" — is specific to
  # JS transitives, where breakage is a build-time failure `nx test` passes over. Rust is not in that
  # position: `mc-service-checks` runs clippy and the unit tier on EVERY pull request and both COMPILE
  # the crate, so a bad Cargo floor already reds a tier that runs. Adding it to `app` would buy an
  # extra ~23-min E2E for a class already covered.
  #
  # THAT SENTENCE WAS FALSE UNTIL ITEM #229 (2026-08-31) and is load-bearing, so read it precisely:
  # the gate compiles the crate, and until #229 it did NOT compile the crate's TEST targets — clippy
  # ran without `--all-targets` and `cargo test` with `--lib`. On a Cargo-only PR nothing in CI built
  # `backend/mc-service/tests/**`, because `app-e2e` (the only job that does) is path-gated away by
  # this very exclusion. Measured on PR #216 at c6defc2e, 2026-08-23: every required context green,
  # `app-e2e` `skipped (path-gated -> satisfied)`, on a reqwest 0.12->0.13 bump whose earlier
  # revision had broken all three integration test binaries — caught then only because it also
  # carried unrelated JS lockfile changes from a `main` merge. The mc-service `lint` target now
  # passes `--all-targets`, which compiles lib, bins and tests without running anything and without a
  # database, so the sentence above is true by construction rather than by hope. It is what keeps
  # this exclusion honest: pinned by scripts/__tests__/mc-service-lint-all-targets.guard.test.mjs,
  # because a never-attempted compile and a clean one look identical from a green tick.
  # ── Change detection (CI efficiency, 2026-07-03) ──────────────────────────────────────────────
  # The expensive app-e2e suite (~23 min: APK + emulator + web Playwright) used to run on EVERY app-ci
  # trigger — including infrastructure-as-code/komodo/*.toml and compose-comment changes that can't
  # affect the app. This filter gates app-e2e to paths that actually change app RUNTIME behaviour, so a
  # Komodo/deploy-config change runs only the cheap nx-affected job. The cheap `affected` + guardrails
  # still run on everything; only the heavy suite is scoped.
  changes:
    runs-on: ubuntu-latest
    # ci-log-step-exempt: dorny/paths-filter only — the job has no `run:` step, so there is no command
    # output a digest could carry. It still PUBLISHES a digest (the failure would be the action itself).
    outputs:
      app: ${{ steps.filter.outputs.app }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            app:
              - 'frontend/**'
              - 'agents/**'
              - 'mcp-servers/**'
              - 'backend/**'
              - 'packages/**'
              - 'infrastructure-as-code/docker/**'   # compose/Docker configs the E2E stacks bring up
              - '.forgejo/workflows/app-ci.yml'       # changes to app-ci itself must re-run the full suite
              - 'security/zap/**'                      # feature 031: DAST scan config re-runs the dast job
              - 'scripts/zap-scan.mjs'                 # feature 031: the scan runner
              - 'scripts/check-dast-findings.mjs'      # feature 031: the gate script
              # Feature 058 / item #186. A lockfile bump changes transitive deps, and 057's FR-013 says
              # the E2E tier is the only one that sees a bad floor (`nx test` passes over it). The `push:`
              # filter above already said so; this one did not, and app-e2e reported `skipped` on PR #185
              # and PR #187 as a result. Renovate now opens these WEEKLY, so the two filters must agree.
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              # Feature 058: these two were in `mobile` and NOT here, which made them INERT — `mobile`
              # gates only STEPS INSIDE app-e2e, and app-e2e itself requires `app == 'true'`, so a PR
              # touching just the Maestro runner set mobile=true, app=false, skipped the whole job and
              # ran no mobile flow at all. `mobile` must stay a strict subset of `app` for it to mean
              # anything; the guard test now enforces that rather than a comment claiming it.
              - 'scripts/ci-mobile-agent-flows.sh'
              - 'scripts/maestro-run.sh'
            # `mobile` gates ONLY the emulator half of app-e2e (APK build + Maestro agent flows,
            # ~35 min of the run). It is a STRICT SUBSET of `app`: everything that can change what
            # the app renders or how the agent behaves, minus the pieces that can only affect the
            # web/DAST paths. A PR that touches none of this still runs the web E2E and integration
            # tiers — it just does not pay for the emulator.
            #
            # THE SUBSET PROPERTY IS LOAD-BEARING, and it was VIOLATED until feature 058 — this text
            # asserted it while two entries broke it. `mobile` gates only STEPS INSIDE app-e2e, and
            # app-e2e itself runs only when `app` is true, so a path here but not in `app` can NEVER
            # fire: the PR sets mobile=true, app=false, and the whole job skips. That is what
            # scripts/ci-mobile-agent-flows.sh and scripts/maestro-run.sh did — changing the Maestro
            # runner ran no mobile flow, while reading as covered. Both are now in `app` too, and
            # app-ci-lockfile-filter.guard.test.mjs enforces the subset instead of this comment
            # claiming it. Add to `mobile` only in the same edit that adds to `app`.
            #
            # Deliberately still IN, despite being tempting to drop:
            #   .forgejo/workflows/app-ci.yml — a change to the suite must re-prove the whole suite.
            #   backend/**                     — mc-service supplies the movie data the flows assert.
            # Deliberately OUT (vs `app`): infrastructure-as-code/docker/**, security/zap/** and the
            # zap scripts — compose/DAST config the mobile flows do not exercise beyond bring-up,
            # which the web E2E already covers in the same job. And, from feature 058, pnpm-lock.yaml
            # + pnpm-workspace.yaml — a dependency bump is a web/bundle risk, so it buys the ~23-min
            # web+integration half and not the ~35-min emulator half. Label `mobile-e2e` opts one in.
            mobile:
              - 'frontend/**'
              - 'agents/**'
              - 'mcp-servers/**'
              - 'backend/**'
              - 'packages/**'
              - '.forgejo/workflows/app-ci.yml'
              - 'scripts/ci-mobile-agent-flows.sh'
              - 'scripts/maestro-run.sh'
      # Feature 042 — publish an agent-readable failure digest. The forge API exposes no log or
      # artifact endpoint, so each job PUSHES a distilled, redacted digest into a channel the API can
      # already read (a PR comment, or a commit status on push).
      # `always()` + `continue-on-error` + an unconditional exit 0 inside the script: a broken digest
      # must NEVER mask, replace or delay the real job result (FR-009). `job.status` carries
      # `cancelled` for a superseded run, which the script suppresses rather than publishing as a
      # failure for a commit that was never broken (FR-001a).
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          # US4 fallback: when the secret above is empty (an AGit-headed run has NO secrets), the
          # digest publishes a commit status with this run-provisioned token instead. Without this
          # line the fallback is DEAD CODE — it reads GITHUB_TOKEN from the step env, and nothing
          # else puts it there. Proven live in guardrails run #1628.
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs
              # NOTE: infrastructure-as-code/komodo/** deliberately excluded — Komodo deploy config does
              # not affect what app-e2e exercises (it's reconciled by the ResourceSync webhook, not E2E).

  # ── nx-affected lint/build/unit (FR-005) ──────────────────────────────────────────────────────
  # Compares against origin/main so only projects changed on this branch are linted/built/tested;
  # the remote cache makes a no-op re-run a cache hit (RED→GREEN, T004). The self-hosted runner
  # provides the polyglot toolchains (Rust/cargo, Java) per Server-Setup-Runbook §2; node/pnpm/uv
  # are set up here.
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Ensure origin/main is available as the affected base
        run: bash scripts/ci-log-step.sh affected-ensure-origin-main-available git fetch --no-tags --depth=200 origin main || true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      # Node 24.14.1, NOT 20. pnpm 11 (package.json `packageManager`) declares engines
      # node >= 22.13, so Node 20 fails `pnpm install` outright — this is what broke `affected` and
      # `mc-service-checks` on the pnpm 11 bump. 24.14.1 also matches what the app actually runs on
      # (frontend/mcm-app/Dockerfile `node:24.14.1-alpine3.23`) and what cd-deploy's prod-apk uses, so
      # CI now tests the runtime Node instead of a stale one. `pnpm/action-setup` must stay BEFORE this
      # step — setup-node's `cache: pnpm` needs pnpm on PATH already.
        with: { node-version: 24.19.0, cache: pnpm }
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # uv's VERSION, item #307. The action is digest-pinned; without this input the uv it
          # installs is whatever is newest at run time — and uv is the generator for the uv.lock
          # files the weekly lockFileMaintenance channel merges. One version across every site.
          version: '0.12.10' # uv-version
          # Authenticate the GitHub API call that resolves uv "latest" — the Forgejo runner has no GitHub
          # token, so the anonymous call hits the 60/hr rate limit and fails ("Set up uv", cd-deploy 2026-07-06).
          # RENOVATE_GITHUB_COM_TOKEN is the repo's read-only github.com PAT (also used by renovate.yml).
          github-token: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
      - name: Install dependencies
        run: bash scripts/ci-log-step.sh affected-install pnpm install --frozen-lockfile
      # `build` is a docker IMAGE build for every project (that's cd-deploy's job + needs Docker-in-
      # job) — excluded from this fast gate. mc-service is excluded too: its lint/test need the Rust
      # toolchain + a replica-set Mongo (integration tests) this lightweight container has no business
      # standing up; its image is compiled + validated in cd-deploy. JS/Python projects (mcm-app,
      # movie-assistant, the MCP servers) run lint + unit here on node + uv (matches the old CI scope).
      # `typecheck` (tsc --noEmit) closes an uncovered-check gap: no CI job ran it, so a type error
      # could land on main unnoticed (it had — a cross-copy @ag-ui/client AbstractAgent mismatch).
      # Only projects that define the target (mcm-app today) run it; the rest are skipped.
      - name: nx affected — lint + typecheck + unit (remote-cache-backed)
        run: bash scripts/ci-log-step.sh affected-nx pnpm nx affected --target=lint,test,typecheck --base=origin/main --head=HEAD --exclude=mc-service
      # Feature 042 — publish an agent-readable failure digest. The forge API exposes no log or
      # artifact endpoint, so each job PUSHES a distilled, redacted digest into a channel the API can
      # already read (a PR comment, or a commit status on push).
      # `always()` + `continue-on-error` + an unconditional exit 0 inside the script: a broken digest
      # must NEVER mask, replace or delay the real job result (FR-009). `job.status` carries
      # `cancelled` for a superseded run, which the script suppresses rather than publishing as a
      # failure for a commit that was never broken (FR-001a).
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          # US4 fallback: when the secret above is empty (an AGit-headed run has NO secrets), the
          # digest publishes a commit status with this run-provisioned token instead. Without this
          # line the fallback is DEAD CODE — it reads GITHUB_TOKEN from the step env, and nothing
          # else puts it there. Proven live in guardrails run #1628.
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs

  # ── mc-service Rust checks (clippy + unit tests) ──────────────────────────────────────────────
  # Runs in the container runner. clippy (-D warnings, --all-targets) + `cargo test --lib` (unit only —
  # the integration tests need a replica-set Mongo and are NOT RUN here, but since item #229 they are
  # COMPILED here: `--all-targets` builds lib, bins and tests without executing anything and without a
  # database, so a change that breaks only backend/mc-service/tests/** reds THIS job in minutes instead
  # of app-e2e ~35 minutes later — or, on a Cargo-only PR that path-gates app-e2e away, nothing at all).
  # Routed through Nx (constitution). This is Rust coverage the old GitHub CI did not have.
  mc-service-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install native build deps (openssl for native-tls)
        run: |
          bash scripts/ci-log-step.sh mc-service-checks-install-native-build-deps apt-get update
          bash scripts/ci-log-step.sh mc-service-checks-install-native-build-deps apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev
      - name: Install Rust (stable + clippy)
        run: |
          bash scripts/ci-log-step.sh mc-service-checks-install-rust bash -e /dev/stdin <<'CI_LOG_STEP'
          # `--default-toolchain none` + rust-toolchain.toml (item #307): the channel AND its
          # components both come from that file, which is why clippy is no longer named here.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          CI_LOG_STEP
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      # Node >= 22.13 required by pnpm 11; matches the BFF runtime image + cd-deploy (see `affected`).
        with: { node-version: 24.19.0, cache: pnpm }
      - name: Install dependencies
        run: bash scripts/ci-log-step.sh mc-service-install pnpm install --frozen-lockfile
      # `--all-targets` lives in the Nx target, not here — see backend/mc-service/project.json and
      # scripts/__tests__/mc-service-lint-all-targets.guard.test.mjs (item #229). Without it this step
      # is green on a crate whose every integration test binary fails to compile (measured, PR #216).
      - name: clippy (deny warnings, all targets — compiles tests/** too)
        run: bash scripts/ci-log-step.sh mc-service-clippy pnpm nx lint mc-service
      - name: Unit tests (--lib; no Mongo)
        run: bash scripts/ci-log-step.sh mc-service-unit pnpm nx test:unit mc-service
      # Feature 042 — publish an agent-readable failure digest. The forge API exposes no log or
      # artifact endpoint, so each job PUSHES a distilled, redacted digest into a channel the API can
      # already read (a PR comment, or a commit status on push).
      # `always()` + `continue-on-error` + an unconditional exit 0 inside the script: a broken digest
      # must NEVER mask, replace or delay the real job result (FR-009). `job.status` carries
      # `cancelled` for a superseded run, which the script suppresses rather than publishing as a
      # failure for a commit that was never broken (FR-001a).
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          # US4 fallback: when the secret above is empty (an AGit-headed run has NO secrets), the
          # digest publishes a commit status with this run-provisioned token instead. Without this
          # line the fallback is DEAD CODE — it reads GITHUB_TOKEN from the step env, and nothing
          # else puts it there. Proven live in guardrails run #1628.
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs

  # ── Containerized web + mobile agent E2E (FR-006..FR-010) ─────────────────────────────────────
  app-e2e:
    needs: [affected, changes]
    # Skip the ~23-min suite when no app-runtime path changed (e.g. a Komodo/deploy-config-only change).
    # trigger-cd tolerates a SKIPPED app-e2e (it gates on result != failure), so deploys still proceed.
    if: ${{ needs.changes.outputs.app == 'true' }}
    # HOST execution (not a container): the android-e2e port relies on localhost:8082 (web E2E → dev
    # BFF) and 10.0.2.2:8082 (emulator → host) resolving like a single host, plus KVM + the ci docker
    # daemon — none of which work from a rootless job container. A host-type runner label (defined as
    # `kvm:host`; `runs-on` uses the label NAME `kvm`) runs the job directly on the ci host, the way
    # GitHub's VM did (Server-Setup-Runbook Phase 7 anticipated this).
    runs-on: kvm
    timeout-minutes: 75
    env:
      # PER-STEP CEILING, BELOW THE JOB'S (item #326). `always()` does not survive a job kill: when
      # the runner enforces `timeout-minutes: 75` above, the "Publish failure digest" step never
      # runs, so a HANG — the one failure class with no other evidence trail — yields no digest at
      # all. Measured on PR #322, task 8317: 75.1 min against that 75 min ceiling, versus a ~29 min
      # healthy baseline, and `ci-status failure` could say only "the job may have died before the
      # digest step ran".
      #
      # ci-log-step.sh enforces this per wrapped step, so a hang fails the STEP instead: the job
      # survives, the step is named in `_failed-step`, and the digest runs and reports it as a
      # TIMEOUT rather than as an assertion failure that never happened.
      #
      # THE VALUE IS PROVISIONAL, AND ITS ORIGINAL JUSTIFICATION WAS WRONG (corrected 2026-09-02).
      # This comment used to read "sits above the slowest legitimate step (`web-e2e`, measured at
      # 28 m 40 s)". That conflated two different measurements: 28 m 40 s is an app-e2e **JOB**
      # duration; `web-e2e` as a **STEP** takes ~5.2 min (run 2453's bundle, "156 passed (5.2m)").
      # So the ceiling was calibrated against a number describing something else, and 2700 s is
      # roughly 5x looser than the evidence supports.
      #
      # It is nonetheless left at 2700 s for now, deliberately. The mechanism is validated — on
      # 2026-09-02 it fired on a hung `maestro-agent-flows` and the digest named it,
      # "⏱ timeout after 2700s", which is exactly the evidence a job kill used to destroy. But
      # tightening it needs per-step durations this repository does not yet collect: run 2530 on
      # `main` took 41 min and PASSED, so maestro plausibly uses ~25 min legitimately when flows
      # retry, and a 1500 s ceiling could fail runs that would have succeeded. Trading a slow true
      # failure for a fast false one is the worse direction.
      #
      # What the bound must satisfy, and all it currently guarantees: a hung step must fail while
      # enough of the 75 min job ceiling remains for teardown and the digest step to publish.
      # Raising it past ~60 min puts a hung step back into job-kill territory and silently restores
      # the defect. Per-step calibration is item #338.
      CI_STEP_TIMEOUT_SECONDS: '2700'
      # Reach the ci user's rootless Docker daemon (adjust 1001 if `id -u ci` differs).
      DOCKER_HOST: unix:///run/user/1001/docker.sock
      # EXPO_PUBLIC_* are inlined into the JS bundle at build time. Keycloak pins its issuer to
      # localhost:8099 (KC_HOSTNAME), so the app must reach Keycloak AND the BFF at localhost — not
      # 10.0.2.2 — or the token issuer mismatches and login never completes (CLAUDE.md mobile issuer
      # note; android-e2e's 10.0.2.2 was never green). The emulator step `adb reverse`s 8082/8099.
      EXPO_PUBLIC_BFF_NATIVE_URL: http://localhost:8082
      EXPO_PUBLIC_KEYCLOAK_NATIVE_URL: http://localhost:8099
      E2E_BFF_TARGET: dev-container
      E2E_AGENT_PRODUCTION: '1'
      MODEL_PROVIDER: ${{ github.event.inputs.provider || vars.MODEL_PROVIDER || 'anthropic' }}
      # Per-surface model credential (048 US4). One shared secret backed three unrelated surfaces —
      # this job, the dast job, and wiki generation — so the Anthropic console conflated all three
      # and no one could say what a CI run costs versus a wiki run. The VARIABLE name is unchanged
      # and must stay unchanged (FR-015): every consumer keys on `ANTHROPIC_API_KEY`, including the
      # `-e ANTHROPIC_API_KEY` docker passthrough below and the DAST leak check. Only the secret it
      # is assigned from differs per surface.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_CI_E2E }}
      E2E_TEST_USER: ${{ secrets.E2E_TEST_USER }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      # web-api-mcp .env.local + the agent flows' per-user config (TMDB enrichment). Optional: the
      # per-user config supplies it per-request, but a real key lets the enrich/add flows return data.
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      # admin-settings-access.spec.ts / admin-registration.spec.ts seed their admin user through the Keycloak
      # Admin API and `test.skip(!keycloakAdminEnabled(), …)` when this is unset. It was absent from
      # this job entirely — so both specs skipped silently on every run, and the `-e` pass-through
      # added below would have forwarded nothing without this line. Feature 051 (item #158, fourth
      # acceptance criterion).
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${{ secrets.KEYCLOAK_SERVICE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Agent images + Android SDK/NDK + Gradle caches exhaust the default runner disk. Free first.
      # Jobs run in a node:22-bookworm container on the ci rootless daemon — install the Docker CLI
      # (the image has none) and confirm it can reach the daemon socket the runner mounts.
      - name: Set up Docker CLI (job container talks to the runner's daemon socket)
        run: |
          bash scripts/ci-log-step.sh app-e2e-set-up-docker-cli bash -e /dev/stdin <<'CI_LOG_STEP'
          if ! command -v docker >/dev/null 2>&1; then
            curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz \
              | tar xz -C /usr/local/bin --strip-components=1 docker/docker
          fi
          docker version --format 'client {{.Client.Version}}' || true
          if docker info >/dev/null 2>&1; then
            echo "docker daemon reachable from job container"
          else
            echo "::error::Docker CLI installed but the daemon is not reachable from the job container. Mount the ci rootless socket into job containers: in the runner config.yaml set container.options to include  -v /run/user/1001/docker.sock:/var/run/docker.sock  (alongside --device /dev/kvm), then restart the runner."
            exit 1
          fi
          CI_LOG_STEP

      - name: Free daemon disk space
        run: |
          bash scripts/ci-log-step.sh app-e2e-free-daemon-disk-space bash -e /dev/stdin <<'CI_LOG_STEP'
          docker image prune -af || true
          df -h || true
          CI_LOG_STEP

      # On the homelab runner the job runs inside a node:22-bookworm container on the ci rootless
      # daemon, so /dev/kvm is provided by the runner config (`container.options: --device /dev/kvm`),
      # NOT by a udev rule (that GitHub-host-VM approach doesn't apply in a container). Fail LOUD if
      # KVM is missing — never silently skip the mobile suite (spec Edge Cases, research R1).
      - name: Verify KVM is available
        run: |
          bash scripts/ci-log-step.sh app-e2e-verify-kvm-available bash -e /dev/stdin <<'CI_LOG_STEP'
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
          else
            echo "::error::/dev/kvm not present in the job container — add 'container.options: --device /dev/kvm' to the runner config (Server-Setup-Runbook Phase 7) and ensure the ci user is in the kvm group"
            exit 1
          fi
          CI_LOG_STEP

      # The per-stack aggregators override `include:`d services to attach profiles; that needs a
      # recent Docker Compose (the bundled one rejects it). Install the latest plugin.
      - name: Install latest Docker Compose plugin
        run: |
          bash scripts/ci-log-step.sh app-e2e-install-latest-docker bash -e /dev/stdin <<'CI_LOG_STEP'
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
            -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version
          CI_LOG_STEP

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      # Node >= 22.13 required by pnpm 11; matches the BFF runtime image + cd-deploy (see `affected`).
        with: { node-version: 24.19.0, cache: pnpm }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      # up-agents-prod (agent-stack.mjs) shells out to `uv` to fetch the gateway client secret from
      # Keycloak — needed on the host PATH (container jobs get it from the astral action; host doesn't).
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # uv's VERSION, item #307. The action is digest-pinned; without this input the uv it
          # installs is whatever is newest at run time — and uv is the generator for the uv.lock
          # files the weekly lockFileMaintenance channel merges. One version across every site.
          version: '0.12.10' # uv-version
          # Authenticate the GitHub API call that resolves uv "latest" — the Forgejo runner has no GitHub
          # token, so the anonymous call hits the 60/hr rate limit and fails ("Set up uv", cd-deploy 2026-07-06).
          # RENOVATE_GITHUB_COM_TOKEN is the repo's read-only github.com PAT (also used by renovate.yml).
          github-token: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}

      - name: Install dependencies
        run: bash scripts/ci-log-step.sh app-e2e-install-dependencies pnpm install --frozen-lockfile

      # ── Provision the CI environment (FR-006, closes the android-e2e ci-provisioning gap) ────────
      # The runner is PERSISTENT (not an ephemeral VM), so Keycloak's realm DB + Mongo test data
      # survive across runs. Keycloak's --import-realm uses IGNORE_EXISTING, so a stale realm would
      # never pick up ci-realm.json changes, and stale Mongo data breaks E2E idempotency. Remove prior
      # app containers + the stateful data volumes each run (image build caches are preserved, so
      # rebuilds stay fast) → every run imports the current realm and seeds fixtures clean.
      - name: Reset stateful CI data (fresh realm + test data each run)
        run: |
          bash scripts/ci-log-step.sh app-e2e-reset-stateful-ci-data bash -e /dev/stdin <<'CI_LOG_STEP'
          docker rm -f keycloak-service keycloak-store-postgres keycloak-mailpit \
            mc-service mc-service-store-mongo mc-service-store-mongo-rs-init \
            mcm-bff-service-nonsecure mcm-bff-cache-redis mcm-bff-store-mongo \
            movie-assistant-gateway movie-assistant-mcp-movie movie-assistant-mcp-webapi \
            movie-assistant-mcp-spreadsheet movie-assistant-store-postgres 2>/dev/null || true
          docker volume rm keycloak-store-postgres-data mc-service-store-mongo-data \
            mcm-bff-store-mongo-data movie-assistant-store-postgres-data 2>/dev/null || true
          CI_LOG_STEP

      - name: First-time docker setup (networks + volumes)
        run: |
          bash scripts/ci-log-step.sh app-e2e-first-time-docker-setup bash -e /dev/stdin <<'CI_LOG_STEP'
          for n in backend-network keycloak-network movie-assistant-mcp-network; do docker network create "$n" || true; done
          # All external volumes the auth + mcm(app) + agents stacks declare by name (must pre-exist).
          for v in mc-service-store-mongo-data keycloak-store-postgres-data mcm-bff-cache-redis-data \
                   mcm-bff-store-mongo-data movie-assistant-store-postgres-data; do docker volume create "$v" || true; done
          CI_LOG_STEP

      - name: Mint per-stack secrets (stacks/*.env)
        run: bash scripts/ci-log-step.sh app-e2e-mint-per-stack-secrets node scripts/gen-dev-secrets.mjs

      # KC_DB_PASSWORD is no longer written here — feature 022 made it a single ${KC_DB_PASSWORD}
      # minted by gen-dev-secrets into stacks/auth.env (postgres + Keycloak both interpolate it; the
      # CI DB volume is wiped each run so a fresh value is fine). The Forgejo KC_DB_PASSWORD secret is
      # now unused and can be deleted from the Actions store.
      - name: Write CI env/secret files (.env.docker + web-api-mcp/.env.local)
        env:
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          KEYCLOAK_SERVICE_CLIENT_SECRET: ${{ secrets.KEYCLOAK_SERVICE_CLIENT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          AGENT_SUBJECT_TOKEN_CLIENT_SECRET: ${{ secrets.AGENT_SUBJECT_TOKEN_CLIENT_SECRET }}
          AGENT_CONFIG_ENC_KEY: ${{ secrets.AGENT_CONFIG_ENC_KEY }}
        run: bash scripts/ci-log-step.sh app-e2e-write-ci-env-secret-files node scripts/gen-ci-env.mjs

      # ── Backend + agent stack (auth BEFORE mcm app profile — manual ordering, FR-006) ───────────
      - name: Bring up Keycloak (auth stack, ci-realm imported) + Redis + Mongo + mc-service
        env:
          # Feature 027 US5: ci-realm.json commits only ${ENV_VAR} placeholders; Keycloak resolves them
          # from the keycloak-service container env at import (compose.ci.yaml passes these through). The
          # 3 real client secrets come from Forgejo (same values .env.docker uses → realm==BFF by
          # construction); E2E_TEST_PASSWORD is already the job env. The 3 below are minted in the script.
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          KEYCLOAK_SERVICE_CLIENT_SECRET: ${{ secrets.KEYCLOAK_SERVICE_CLIENT_SECRET }}
          AGENT_SUBJECT_TOKEN_CLIENT_SECRET: ${{ secrets.AGENT_SUBJECT_TOKEN_CLIENT_SECRET }}
        run: |
          bash scripts/ci-log-step.sh app-e2e-bring-up-keycloak bash -e /dev/stdin <<'CI_LOG_STEP'
          # Throwaway per-run secrets for the CI-realm clients whose secret is ARBITRARY in app-e2e:
          # agent-gateway is refetched from Keycloak at runtime (agent-stack.mjs) and mc-service is
          # bearer-only. Random each run, never committed; they only need to be non-empty + internally
          # consistent within this realm.
          export AGENT_GATEWAY_CLIENT_SECRET="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          export MC_SERVICE_CLIENT_SECRET="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          # mcm-bff-test (ROPC) IS used now — the agent integration suite logs in through it (kc_admin
          # reads E2E_ROPC_CLIENT_SECRET). It is minted here and pinned into the realm import, so it must
          # be re-exported to later steps via $GITHUB_ENV or they would use a secret the realm never saw
          # (same as the dast job). Do NOT read it from stacks/auth.env — the realm imported THIS value.
          export E2E_ROPC_CLIENT_SECRET="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "E2E_ROPC_CLIENT_SECRET=$E2E_ROPC_CLIENT_SECRET" >> "$GITHUB_ENV"
          # Absolute path so Compose mounts the FILE (a relative source resolves against the project
          # dir = stacks/, where the file isn't, and Docker would create an empty dir — see compose.ci.yaml).
          export CI_REALM_FILE="$PWD/infrastructure-as-code/docker/keycloak/ci-realm.json"
          test -f "$CI_REALM_FILE" || { echo "::error::ci-realm.json missing at $CI_REALM_FILE"; exit 1; }
          docker compose -p auth \
            -f infrastructure-as-code/docker/stacks/auth.compose.yaml \
            -f infrastructure-as-code/docker/keycloak/compose.ci.yaml up -d --wait
          # Neither mc-service nor mcm-bff has a build: in its compose (both are `image: …:latest`), so
          # build them locally BEFORE the up. Build the BFF too here: on this runner the `app` profile
          # pulls in the bff-nonsecure service, so mcm-bff:latest must already exist or --wait hangs.
          pnpm nx build mc-service
          pnpm nx docker-build mcm-app
          # Bring up app infra + mc-service + the dev BFF (:8082) together, images now present.
          docker compose -p mcm -f infrastructure-as-code/docker/stacks/mcm.compose.yaml \
            --profile app --profile bff-nonsecure up -d --wait
          CI_LOG_STEP

      - name: Bring up containerized agent gateway + MCP (production nodes)
        # agent-stack.mjs fetches the agent-gateway client secret via the mcm-bff-service service
        # account (client_credentials) — kc_admin reads KEYCLOAK_SERVICE_CLIENT_SECRET from env.
        #
        # It also REBUILDS the 4 agent/MCP images from this checkout (feature 041). It used to skip the
        # build when the tag already existed, so on this PERSISTENT runner — whose reset step drops
        # containers + volumes but NOT images — every run silently tested leftover images instead of the
        # agent source under review. That false-green hid a committed TMDB-key redaction fix. Building is
        # now the default (mirroring the unconditional `nx build mc-service` / `docker-build mcm-app`
        # above) and `--no-build` is refused under CI; docker layer cache keeps it cheap when nothing
        # in agents/ or mcp-servers/ changed.
        env:
          KEYCLOAK_SERVICE_CLIENT_SECRET: ${{ secrets.KEYCLOAK_SERVICE_CLIENT_SECRET }}
        run: bash scripts/ci-log-step.sh app-e2e-bring-up-containerized-agent env MODEL_PROVIDER="$MODEL_PROVIDER" pnpm nx up-agents-prod infrastructure-as-code

      # ── Agent LIVE integration suite (the layer no workflow ran until now) ───────────────────────
      # Until this step, NO project's `test:integration` executed anywhere in CI — only the `-m golden`
      # subset (keyless replay, guardrails). So tests/integration/ (organizer → movie-mcp → mc-service
      # with real Keycloak token-exchange) never ran, and silently rotted: `test_reimport_real_sample`
      # asserted against its own fixture's intentional bad rows for a month before anyone noticed.
      # This job already stands up EVERYTHING the suite needs (Keycloak + realm, mc-service, the 3 MCP
      # servers, gateway), so running it here is a few minutes on an already-warm stack.
      #
      # Placed BEFORE the web E2E / APK / emulator legs deliberately: a failure here costs ~2 min
      # instead of burning 15+ min of emulator time first.
      #
      # MCM_REQUIRE_LIVE_STACK=1 is load-bearing: the suite skips-clean when the stack/creds are absent
      # (right for a credential-less checkout, useless as a gate), so the conftest hook escalates any
      # non-allowlisted skip to a FAILURE here — otherwise a misconfigured run would skip everything and
      # still report green. `-m "not golden"` deselects the golden pairs: guardrails already runs them
      # keyless in replay, and here (with a real ANTHROPIC_API_KEY) they would make live Claude calls.
      # The MCP URLs need no plumbing — up-agents-prod publishes 127.0.0.1:8765/8766/8767, which are
      # exactly the tests' defaults.
      # E2E_ROPC_CLIENT_SECRET is NOT set here: the bring-up step minted it, pinned it into the realm
      # import, and re-exported it via $GITHUB_ENV — so it is already in this step's environment with
      # the value the realm actually holds. E2E_TEST_USER / E2E_TEST_PASSWORD / ANTHROPIC_API_KEY /
      # TMDB_API_KEY come from the job-level env.
      - name: Agent integration tests (live stack; skips escalate to failures)
        env:
          MCM_REQUIRE_LIVE_STACK: '1'
          KEYCLOAK_URL: http://localhost:8099
          MC_SERVICE_URL: http://localhost:3001
          KEYCLOAK_SERVICE_CLIENT_SECRET: ${{ secrets.KEYCLOAK_SERVICE_CLIENT_SECRET }}
          E2E_ROPC_CLIENT_ID: mcm-bff-test
        # `not golden`: guardrails covers golden keyless; a real ANTHROPIC_API_KEY here would make live
        # Claude calls. The `not ci_quarantine` deselect is GONE (041 US1): all 9 quarantined tests were
        # fixed or retired and the marker itself was deleted from pyproject.toml, so this step now gates
        # on the WHOLE live-integration suite. Do not reintroduce a deselect to get past a red test —
        # every one of those 9 turned out to be a real defect or a stale contract, not a flake.
        run: bash scripts/ci-log-step.sh agent-integration pnpm nx test:integration movie-assistant -- -m "not golden"

      # ── MCP server integration suites (048 US3) ─────────────────────────────────────────────────
      # NO MCP server's test:integration ran anywhere in CI before this: app-ci covered
      # movie-assistant, mc-service and mcm-app only. The cost was not hypothetical — two
      # spreadsheet-mcp tests had NEVER passed. The test, the parser and the fixture all landed in one
      # commit (33eba4c, 2026-06-14), so nothing regressed; they were simply never run, and sat broken
      # for ~7 weeks. Fixing them without enrolling them was explicitly rejected: it restores exactly
      # the illusion that produced this.
      #
      # This job already stands up everything both suites need — Keycloak + realm, mc-service, Mongo
      # and Redis — so this is seconds on an already-warm stack (measured locally: 2 + 20 tests in
      # <1 s). Placed with the other fast Python gates and well before the emulator/APK legs.
      #
      # MCM_REQUIRE_LIVE_STACK=1 is load-bearing, exactly as it is for the agent suite above: both
      # conftests skip-clean when their backing service is absent, which is right for a local
      # checkout and useless as a gate. Verified by result on 2026-08-07, all four states — with the
      # dependency pointed at a dead port, the flag UNSET gives `2 skipped` / `20 skipped` and exit 0,
      # while the flag SET gives exit 1; with the stack up and the flag set, 2 passed and 20 passed
      # with a SKIP COUNT of 0.
      #
      # Redis db 9 keeps the single-use upload handles clear of the BFF integration suite's db 1 and
      # of db 0; the suite deletes its own keys in a finally block regardless.
      #
      # web-api-mcp WAS deliberately not enrolled (048 FR-013), for two reasons recorded as
      # unresolved rather than merely unexamined:
      #
      #   > its integration tests reach TMDB, and outbound egress from this runner to
      #   > api.themoviedb.org is unconfirmed; and the credential question is unsettled — TMDB
      #   > keys are per-user in this design, so which key a CI run should spend has no answer yet.
      #   > Enrolling it on an unconfirmed egress path would produce exactly the kind of
      #   > skips-or-fails-for-environmental-reasons gate this feature exists to remove.
      #
      # 059 enrolls it, because both reasons now have answers (059 research R4a/R4b):
      #
      #   * The credential question is answered by inspection, not by a new decision: TMDB_API_KEY
      #     is ALREADY a job-level env on this job (see the env block above) and is already passed
      #     into the E2E container further down. A CI run spends the CI key; no per-user key is
      #     involved, because the per-user design governs the RUNTIME request path, not this suite.
      #   * The egress question is answered by running it. That is deliberate: an unconfirmed
      #     egress path that fails loudly on its first run is strictly better than one that stays
      #     unexamined forever. 048's real objection was to a gate that skips-or-fails for
      #     environmental reasons WITHOUT SAYING SO — which is why T003 added skip-escalation to
      #     this suite's conftest BEFORE this enrollment, not after. Measured locally: with the key
      #     absent from both the environment and .env.local, the flag unset gives `5 skipped` and
      #     exit 0, the flag set gives exit 1 with the escalation message.
      #
      # What this buys: the certification extraction 059 adds is checked against TMDB's real
      # response shape on every PR. The unit tier stubs the transport (permitted there, and it
      # covers shapes no real film exhibits) — but a stub passes forever against a contract TMDB
      # has changed underneath it. This step is the only thing that notices.
      #
      # Unlike the two suites beside it, web-api-mcp needs nothing from the local stack — only
      # egress and the key. TMDB_API_KEY is inherited from this job's env block rather than
      # re-declared here: one binding, and if it ever goes missing the escalation above turns the
      # resulting skip into a failure instead of a green run over an unexecuted suite.
      - name: MCP integration suites (movie-mcp + spreadsheet-mcp + web-api-mcp; skips escalate to failures)
        env:
          MCM_REQUIRE_LIVE_STACK: '1'
          KEYCLOAK_URL: http://localhost:8099
          MC_SERVICE_URL: http://localhost:3001
          E2E_ROPC_CLIENT_ID: mcm-bff-test
          REDIS_URL: redis://localhost:6379/9
        run: |
          bash scripts/ci-log-step.sh mcp-integration-movie pnpm nx test:integration movie-mcp
          bash scripts/ci-log-step.sh mcp-integration-spreadsheet pnpm nx test:integration spreadsheet-mcp
          bash scripts/ci-log-step.sh mcp-integration-web-api pnpm nx test:integration web-api-mcp

      # ── mc-service integration suite (feature 041 US2) ───────────────────────────────────────────
      # Until this feature NO project's test:integration except the agent suite ran anywhere in CI.
      # mc-service's Rust service-to-DB integration tests run here against the SAME replica-set Mongo
      # the stack already brought up (published 27017; the rs member is initiated as localhost:27017,
      # so directConnection=true lets a host-run test connect) + the live Keycloak (health_test builds
      # the app, which fetches JWKS on startup). Same fast-fail placement as the agent step — a failure
      # costs ~2 min, not the full emulator run.
      #
      # The Nx target runs scripts/mc-service-integration-guard.mjs (the cargo arm of the shared
      # skip-escalation convention): it runs the Cargo [[test]] binaries and FAILS a zero-executed /
      # all-ignored run, so a misconfigured run can't skip-to-green. A down Mongo/Keycloak already
      # FAILS via the tests' own .unwrap()/.expect() (Rust has no skip).
      #
      # As of PRD-McServiceHttpAuthzIntegration the suite has ZERO #[ignore]s: the HTTP auth-negative
      # tests now run here in-process against this live Keycloak. They depend on it being reachable —
      # common::build_test_app waits for OIDC discovery to SUCCEED before issuing a request, and
      # asserts if it does not. That gate is deliberate: discovery that ends in Err still marks the
      # auth layer ready, so without it every 401 test would pass against a dead Keycloak.
      #
      # As of feature 046 the suite also performs a real ROPC LOGIN: tests/integration/common/auth.rs
      # mints a bearer token for E2E_TEST_USER through the mcm-bff-test client, and the authenticated
      # authorization tests drive the router with it. So this step needs those four credentials, and a
      # realm-import regression (a missing client, mapper or user) now fails HERE with a named
      # variable or the token endpoint's status code — not later in the E2E legs.
      # E2E_ROPC_CLIENT_SECRET comes from $GITHUB_ENV (minted at bring-up, pinned into the realm
      # import); E2E_TEST_USER/E2E_TEST_PASSWORD come from the job env. All three are passed in the
      # BARE `-e NAME` form so no secret value is restated in this file.
      # Run cargo IN A CONTAINER, not on the host: the `ci` host user has no sudo, so the host GNU
      # openssl-sys build can't get pkg-config/libssl-dev. `rust:1-bookworm` (buildpack-deps base)
      # already ships those + a C toolchain, and — like the Web E2E Playwright step below — runs with
      # `--network host` so it reaches the published `localhost:27017` (rs member, directConnection) +
      # `:8099` on the rootless daemon's loopback. It only needs Node added (to run the guard). Cargo
      # writes to a container-internal target dir so no root-owned files land in the host checkout.
      - name: mc-service integration tests (rust container → live replica-set Mongo + Keycloak)
        run: |
          bash scripts/ci-log-step.sh mc-service-integration \
            docker run --rm --network host \
            -v "$PWD":/work -w /work \
            -e MC_DB_URL='mongodb://localhost:27017/mc_db?replicaSet=rs0&directConnection=true' \
            -e KEYCLOAK_URL='http://localhost:8099' \
            -e KEYCLOAK_REALM=grumpyrobot \
            -e KEYCLOAK_CLIENT_ID=movie-collection-manager \
            -e MC_SERVICE_PORT=3001 \
            -e MCM_REQUIRE_LIVE_STACK=1 \
            -e E2E_ROPC_CLIENT_ID=mcm-bff-test \
            -e E2E_ROPC_CLIENT_SECRET \
            -e E2E_TEST_USER \
            -e E2E_TEST_PASSWORD \
            -e CARGO_TARGET_DIR=/tmp/mc-int-target \
            rust:1-bookworm \
            bash -c "set -e; apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs >/dev/null; node --version; node scripts/mc-service-integration-guard.mjs"

      # ── BFF integration suite (feature 041 US3) ──────────────────────────────────────────────────
      # mcm-app's BFF integration tests drive the live containerized dev BFF (:8082) over HTTP against
      # real Keycloak + Redis (db 1) + BFF Mongo (:27018) — the auth/session/rate-limit/agent-config
      # server modules the E2E legs exercise only indirectly. The jest globalSetup preflight (the jest
      # arm of the skip-escalation convention) throws if any required dep is down, so a misconfigured
      # run fails loudly instead of skipping-to-green. The suite is serialized (maxWorkers:1) and
      # self-cleans by test-prefixed userId in afterAll (SC-005). tests/integration/setup/env.ts loads
      # gen-ci-env's .env.docker for the BFF client secrets; this step overrides the host-reachable
      # URLs (the .env.docker values are Docker-internal). E2E_ROPC_CLIENT_SECRET is already in
      # $GITHUB_ENV (minted at bring-up, pinned into the realm import); E2E_TEST_USER/PASSWORD come
      # from the job env.
      - name: BFF integration tests (live BFF + Keycloak + Redis + Mongo)
        env:
          MCM_REQUIRE_LIVE_STACK: '1'
          BFF_BASE_URL: http://localhost:8082
          KEYCLOAK_URL: http://localhost:8099
          KEYCLOAK_REALM: grumpyrobot
          KEYCLOAK_CLIENT_ID: movie-collection-manager
          MC_SERVICE_URL: http://localhost:3001
          E2E_ROPC_CLIENT_ID: mcm-bff-test
          KEYCLOAK_SERVICE_CLIENT_SECRET: ${{ secrets.KEYCLOAK_SERVICE_CLIENT_SECRET }}
          REDIS_TEST_URL: redis://localhost:6379/1
          MONGO_URL: mongodb://localhost:27018
        run: bash scripts/ci-log-step.sh app-e2e-bff-integration-tests pnpm nx test:integration mcm-app

      # ── TWO TIERS (feature 056, item #170) ──────────────────────────────────────────────────────
      # 41 of these tests assert on a live LLM and live TMDB. MEASURED on two runs of IDENTICAL code
      # (sha 1fada7a): #1684 gave `failed=0 flaky=0 passed=177`, #1685 gave `failed=1 flaky=7
      # passed=166`. Every other explanation was excluded by a measured counter — verdict=healthy (not
      # the #173 collapse), refresh_429=0/session_evicted=0 (not contention), 8 worker identities (not
      # #169's shared user), #179's livelock fixed. All eight affected entries were model-decision
      # assertions.
      #
      # A required gate that fails on identical code roughly half the time is not gating: it taxes
      # every PR with a coin flip and teaches people to re-run — the habit that hid five stale specs
      # for three weeks. So the suite is split by whether the VERDICT is determined by code we control.
      # The rule is in openwiki/invariants/testing-tiers.md.
      #
      # The selection is E2E_TIER, read by playwright.config.ts — NOT `--grep-invert`. Measured on
      # Playwright 1.60: that flag is accepted and does nothing here (`--grep CORS` lists 1 test,
      # `--grep-invert CORS` lists all 177), so a CLI-based split would have run everything in the
      # "gate" selection and been a silent no-op that looked correct.
      # ── Web Playwright E2E against the dev-container BFF (FR-008, SC-003) ────────────────────────
      # Its global-setup logs in once and seeds BROWSE/MUTATION/DEFAULT + FIXTURE_MOVIES for the same
      # E2E_TEST_USER the mobile flows use — so this single run is both the web regression AND the seed.
      # The host is Ubuntu 26.04, which Playwright 1.60 refuses to install/run a chromium build for
      # (its OS allow-list, no override). Run the web E2E inside the official Playwright container
      # (browser + deps preinstalled, supported OS) with --network host so it reaches the dev BFF
      # (:8082) and Keycloak (:8099) on the host loopback — the same dev-container E2E path. The host
      # workspace (incl. node_modules from the earlier pnpm install) is mounted in.
      #
      # ⚠️ `docker run` forwards ONLY what `-e` names. A variable set in this job's `env:` block and
      # not named here is invisible inside the container — and every gate the web E2E suite applies
      # is driven by one. So an omission is not an error; it is a SILENT SKIP behind a green required
      # gate. Two were live here for the lifetime of this job (feature 051, item #158):
      # `E2E_AGENT_PRODUCTION` (every agent-*.spec.ts skipped) and `KEYCLOAK_SERVICE_CLIENT_SECRET`
      # (admin-settings-access + admin-registration skipped). Before changing this list, read
      # specs/051-ci-diagnostics-closure/contracts/e2e-env-forwarding.md, and note that
      # scripts/__tests__/app-e2e-env.guard.test.mjs asserts it.
      #
      # DELIBERATELY NOT FORWARDED — enumerated against every `process.env` read under
      # frontend/mcm-app/tests/e2e/, so this is the complete remainder, not a sample:
      #   KEYCLOAK_URL, KEYCLOAK_REALM, KEYCLOAK_CLIENT_ID, KEYCLOAK_SERVICE_CLIENT_ID
      #       — the defaults in tests/e2e/web/setup/keycloak-admin.ts already match the CI topology
      #         (http://localhost:8099, realm grumpyrobot) and `--network host` makes localhost
      #         resolve identically inside and out.
      #   E2E_AGENT_OLLAMA_URL — the CI provider is anthropic; this is the dev/test provider's URL.
      #   E2E_LARGE_LIBRARY, E2E_LARGE_LIBRARY_SIZE — opt-in performance scenario, deliberately off
      #         in the merge gate.
      # Do not add these speculatively: each one changes what the merge gate actually tests.
      #
      # Secrets use the pass-through form `-e NAME`, never `-e NAME=$NAME` — the latter expands the
      # value into argv, where it reaches process listings and step logs.
      - name: Web E2E (Playwright container; host network → dev BFF) — GATE tier, blocking
        run: |
          bash scripts/ci-log-step.sh web-e2e \
            docker run --rm --network host \
            -v "$PWD":/work -w /work/frontend/mcm-app \
            -e E2E_TIER=gate \
            -e E2E_BFF_TARGET=dev-container \
            -e E2E_TEST_USER -e E2E_TEST_PASSWORD -e CI=1 \
            -e E2E_AGENT_PROVIDER=anthropic -e ANTHROPIC_API_KEY -e TMDB_API_KEY \
            -e E2E_AGENT_PRODUCTION -e E2E_REQUIRE_AGENT_STACK=1 \
            -e KEYCLOAK_SERVICE_CLIENT_SECRET \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            sh -c "corepack enable && pnpm exec playwright test"

      # The MODEL tier. Non-blocking, and NOT absent — nothing leaves the gate without a tier that
      # runs it (051 SC-001, 054 FR-017); a tier nobody runs is quarantine wearing a schedule.
      #
      # Skipped on `pull_request` so a PR pays only for the deterministic gate. It still runs on every
      # push to main and every workflow_dispatch, which is also what makes staleness impossible without
      # a cron: if it stopped running, the next merge to main would say so.
      #
      # `continue-on-error` is the whole point — its counts are published and read, but model drift
      # cannot block a merge.
      - name: Web E2E (Playwright container) — MODEL tier, non-blocking
        if: ${{ always() && github.event_name != 'pull_request' }}
        continue-on-error: true
        run: |
          bash scripts/ci-log-step.sh web-e2e-model \
            docker run --rm --network host \
            -v "$PWD":/work -w /work/frontend/mcm-app \
            -e E2E_TIER=model \
            -e E2E_BFF_TARGET=dev-container \
            -e E2E_TEST_USER -e E2E_TEST_PASSWORD -e CI=1 \
            -e E2E_AGENT_PROVIDER=anthropic -e ANTHROPIC_API_KEY -e TMDB_API_KEY \
            -e E2E_AGENT_PRODUCTION -e E2E_REQUIRE_AGENT_STACK=1 \
            -e KEYCLOAK_SERVICE_CLIENT_SECRET \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            sh -c "corepack enable && pnpm exec playwright test"

      # ── Result gate: a GREEN app-e2e must mean nothing was hidden (051 SC-001) ──────────────────
      #
      # Playwright exits 0 with tests SKIPPED, the forge API exposes no job logs, and the failure
      # digest publishes only on failure. Put together, a passing run's counts could not be read by
      # anyone, anywhere — so "green" carried no information about how many tests actually ran.
      #
      # That is not hypothetical here. Feature 040's final validation reported success with 33 specs
      # skipped; the five stale agent specs that hid behind it were found three weeks later
      # (item #150), and only because feature 051 forwarded the env var that had been un-skipping
      # them all along. The gate reads the counts the web E2E just printed and fails on a skip, on a
      # test that never ran, or on a log with no summary at all — because "no counts" must never be
      # read as "good counts". It deliberately does not re-fail on `failed > 0`; the step above
      # already did that.
      #
      # `always()` so it still reports when the web E2E failed, and it reads that step's own captured
      # log (ci-log-step.sh mirrors every wrapped step to
      # $HOME/mcm-ci-step-logs/$GITHUB_RUN_ID/$GITHUB_JOB — per-JOB since item #180, because app-e2e
      # and dast share this runner's $HOME and were reading each other's captures).
      # Parsing lives in scripts/e2e-failure-set.mjs, which is unit-tested including the skip,
      # did-not-run, and missing-summary cases.
      - name: E2E result gate (no skips, nothing left unrun)
        if: ${{ always() }}
        run: |
          bash scripts/ci-log-step.sh e2e-result-gate \
            node scripts/e2e-failure-set.mjs gate "$HOME/mcm-ci-step-logs/$GITHUB_RUN_ID/$GITHUB_JOB/web-e2e.log"

      # The model tier's counts are ASSERTED and published, not merely printed — an unread count is
      # not a report, and a tier that quietly stopped reporting would read as one that is passing.
      # Non-blocking like the tier itself: this reports on it, it does not gate on it. Absent on a PR
      # (where the tier does not run), which is why it tolerates a missing log rather than failing.
      - name: E2E result gate — MODEL tier (reports; never blocks)
        if: ${{ always() && github.event_name != 'pull_request' }}
        continue-on-error: true
        run: |
          bash scripts/ci-log-step.sh e2e-result-gate-model \
            node scripts/e2e-failure-set.mjs gate "$HOME/mcm-ci-step-logs/$GITHUB_RUN_ID/$GITHUB_JOB/web-e2e-model.log"

      # ── Contention tally (feature 052 US2, FR-005..FR-007) ──────────────────────────────────────
      # Eight Playwright workers share ONE E2E_TEST_USER and one storageState session. Whether that
      # shared identity is actually being evicted by the concurrent-session cap, or rejected by the
      # per-session refresh bucket (2 per 30 s), had been argued twice from configuration alone —
      # never measured, because both code paths were silent. The BFF now logs them; this step is how
      # the counts get OUT.
      #
      # It has to be its own step rather than a line in the collect-logs step below, for two reasons
      # that each produce a wrong answer rather than an obvious break:
      #   * that step is gated on `failure()`, and a PASSING run's counts are precisely what proves
      #     the contention is gone (SC-007);
      #   * it must precede `Tear down CI stacks`, which removes the container the counts are read
      #     from — afterwards every count reads `unavailable` for a structural reason.
      # Placed immediately after the web E2E so the window it measures is the web suite's, not the
      # emulator half's.
      #
      # Routed through ci-log-step.sh so the output lands as a `step:` source, which the failure
      # digest ranks 0 — above every container log. The script always exits 0 (a diagnostic must not
      # fail the job it diagnoses); scripts/__tests__/e2e-contention-tally.test.mjs pins that, along
      # with the `grep -c`-exits-1-on-zero trap and the 0-vs-unavailable distinction.
      # `--gate`, and NO `continue-on-error` (052 SC-007). The tally used to be advisory, which was
      # unreadable in the one case that matters: the failure digest publishes only on failure, so a
      # GREEN run leaves no bundle and nobody can read `refresh_429` at all (measured — runs 1622/1623
      # passed and bundles 1623/1624--app-e2e do not exist). A partial return of the contention would
      # be absorbed by `retries: 1`, keep the job green, and stay invisible. So the check runs where
      # it cannot be forgotten. It stays silent on `unavailable`, which only happens when bring-up
      # already failed — see the script.
      - name: Contention gate (no rate-limited refreshes, no session evictions during the web E2E)
        if: ${{ always() }}
        run: bash scripts/ci-log-step.sh e2e-contention-tally bash scripts/e2e-contention-tally.sh --gate

      # ── Run-health verdict (feature 054 US3, FR-009) ───────────────────────────────────────────
      # Roughly one run in seven COLLAPSES: every agent/dock spec fails at once, flaky=0, and the
      # gateway receives ~a quarter of its usual traffic while answering everything it gets with 200.
      # Turns are not being SENT (item #173). From the outside that is indistinguishable from "some
      # tests failed" — telling them apart meant downloading the bundle and counting
      # `POST /agent/movie-assistant` by hand, which nobody does, so the reflex became "re-run it".
      # That reflex hid five stale specs for three weeks, and once caused a sound fix to be reverted
      # because two consecutive samples of a 1-in-7 event were read as causation.
      #
      # It LABELS; it does NOT gate — deliberately, and unlike the contention gate above. A collapsed
      # run already fails on its test failures; failing it twice adds nothing and buys a new
      # false-failure mode. So there is no `--gate` here and there should not be one.
      #
      # POSITION IS LOAD-BEARING IN BOTH DIRECTIONS, and each produces a wrong answer rather than an
      # obvious break:
      #   * AFTER `E2E result gate` — that step's log is where the executed-test denominator comes
      #     from. Earlier, there is nothing to divide by and every run reads `indeterminate`.
      #   * BEFORE `Tear down CI stacks` — which removes the gateway container the POSTs are counted
      #     from. Later, every run reports zeros for a structural reason and looks clean.
      # scripts/__tests__/e2e-turn-tally.test.mjs asserts both orderings against this file.
      - name: Run-health verdict (did this run COLLAPSE, or did tests merely fail?)
        if: ${{ always() }}
        env:
          # On a pull_request only the GATE tier runs, and the gate keeps 19 of the 41 agent tests —
          # several of which drive no model turn at all. The healthy floor was calibrated on the full
          # suite, so judging a gate-only run against it labels a green run `collapsed`. Measured on
          # PR #181: failed=0 flaky=1 passed=154, verdict collapsed. The tally abstains instead, and
          # says why. Explicit rather than inferred from an absent model log — a LOCAL full-suite run
          # has none either, and must keep its verdict.
          E2E_TURN_TIER: ${{ github.event_name == 'pull_request' && 'gate' || '' }}
        run: bash scripts/ci-log-step.sh e2e-turn-tally bash scripts/e2e-turn-tally.sh

      # ── Build the standalone (Metro-less) release APK ───────────────────────────────────────────
      - name: Build embedded-bundle E2E APK (release variant = embedded JS)
        # MOBILE GATE (see the `mobile` filter in `changes`). Runs when: this is a push to main, OR
        # the PR touches app/agent source, OR the PR carries the `mobile-e2e` label as an override.
        # A PR that changes none of those skips the ~35-min emulator half and still gets the web
        # E2E + integration tiers from this same job.
        #
        # ACCEPTED TRADE-OFF: a mobile regression caused by a NON-mobile change is not caught at PR
        # time. Every push to main still runs the full set, `main` is protected, and cd-deploy
        # self-reverts on a failed health probe — so it is detected before it reaches users, just
        # later than it used to be.
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.mobile == 'true' || contains(github.event.pull_request.labels.*.name, 'mobile-e2e') }}
        working-directory: frontend/mcm-app
        env:
          APK_VARIANT: release   # release embeds the JS bundle -> standalone, no Metro
          APK_ABI: x86_64        # emulator ABI only -> faster build
          # Disable the Gradle daemon: on a persistent runner a reused daemon keeps the EXPO_PUBLIC_*
          # env it STARTED with and spawns the Metro bundler with that stale env, baking an old URL
          # (e.g. 10.0.2.2 instead of localhost) into the JS bundle. No daemon → current env each run.
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-log-step.sh" app-e2e-build-embedded-bundle-e2e bash -e /dev/stdin <<'CI_LOG_STEP'
          echo "Baking EXPO_PUBLIC_BFF_NATIVE_URL=$EXPO_PUBLIC_BFF_NATIVE_URL EXPO_PUBLIC_KEYCLOAK_NATIVE_URL=$EXPO_PUBLIC_KEYCLOAK_NATIVE_URL"
          pnpm nx run mcm-app:build-apk
          # Absolute path: this step runs in frontend/mcm-app, but the emulator-runner's script runs
          # from the repo root, so a relative APK path wouldn't resolve there.
          apk="$(pwd)/$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -f "$apk" || { echo "::error::release APK not found under frontend/mcm-app/android/app/build/outputs/apk/release"; exit 1; }
          # Guard: the bundle must INLINE EXPO_PUBLIC_BFF_NATIVE_URL (localhost:8082) — that string is
          # NOT a source literal anywhere, so its presence proves the env was re-inlined this build. A
          # stale Metro transform cache on the persistent runner silently kept baking the 10.0.2.2:8081
          # fallback (mobile login then hit a dead port → never reached the BFF). Fail HERE, fast, not
          # after the ~10-min emulator step. build-apk.mjs now wipes that cache for release builds.
          # grep -ac (count, reads whole stream) avoids a SIGPIPE-141 from `-q` early-exit under pipefail.
          hits="$(unzip -p "$apk" assets/index.android.bundle | grep -ac 'localhost:8082' || true)"
          [ "${hits:-0}" -ge 1 ] \
            || { echo "::error::release APK did not bake EXPO_PUBLIC_BFF_NATIVE_URL=localhost:8082 (stale Metro cache or env not inlined)"; exit 1; }
          echo "APK bundle baked localhost:8082 ($hits hit(s)) — EXPO_PUBLIC_* inlined OK"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"
          CI_LOG_STEP

      # ── Emulator + Maestro agent flows (FR-009) ─────────────────────────────────────────────────
      - name: Install Maestro
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.mobile == 'true' || contains(github.event.pull_request.labels.*.name, 'mobile-e2e') }}
        run: |
          bash scripts/ci-log-step.sh app-e2e-install-maestro bash -e /dev/stdin <<'CI_LOG_STEP'
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          CI_LOG_STEP

      # NOTE: do NOT clear the web-seeded agent config here. The mobile `assistant-config-gating`
      # flow (like enable-anthropic/disable) expects the test user to START with the runnable config
      # the web E2E seeded (T050) — it reaches the not-runnable state by toggling OFF + saving, then
      # asserts the dock is gone. Clearing it left the user disabled-from-the-start, which broke that
      # flow. (BFF Mongo: bff_db.user_agent_config.)
      - name: Run agent E2E flows on emulator
        # MOBILE GATE — see the note on the APK build step above.
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.mobile == 'true' || contains(github.event.pull_request.labels.*.name, 'mobile-e2e') }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          # google_apis_playstore ships Chrome — a Custom-Tabs (CustomTabsService) provider. The
          # default/AOSP image has only the WebView shell, which is NOT a CCT provider: expo-web-browser
          # then falls back to a plain WebView that DROPS Keycloak's 302 to the mcm-app:// custom scheme
          # (no Intent dispatched → native-auth-callback never mounts → login never completes; confirmed
          # via full logcat, run f68632e). Chrome's CCT hands the custom-scheme redirect to the OS, which
          # launches the app's deep-link handler — completing the real OAuth flow. (feature 023 root cause.)
          target: google_apis_playstore
          force-avd-creation: true
          # Give Chrome headroom: the OAuth Custom Tab renderer was crashing mid-load on the default
          # AVD RAM (logcat: CustomTabActivity "WIN DEATH ... app died") — a flaky login. More guest
          # RAM + cores stabilises the Chrome process that drives the SSO flow.
          ram-size: 4096M
          heap-size: 576M
          cores: 3
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096
          disable-animations: true
          # The android-emulator-runner executes this `script:` LINE-BY-LINE in separate shells, so a
          # multi-line for loop breaks ("end of file unexpected"). Keep it to single-line commands and
          # put the per-file Maestro loop in scripts/ci-mobile-agent-flows.sh (gating → enable-anthropic
          # → 4 agent flows → disable; anthropic provider, no local Ollama). cwd is the repo root.
          script: |
            adb reverse tcp:8082 tcp:8082
            adb reverse tcp:8099 tcp:8099
            adb install -r "$APK_PATH"
            bash scripts/ci-log-step.sh maestro-agent-flows bash scripts/ci-mobile-agent-flows.sh

      # ── Diagnostics on failure (FR-010) ─────────────────────────────────────────────────────────
      - name: Upload Maestro artifacts (screenshots + hierarchy) on failure
        # Only meaningful when the mobile half actually ran (see the MOBILE GATE above).
        if: ${{ failure() && (github.event_name != 'pull_request' || needs.changes.outputs.mobile == 'true' || contains(github.event.pull_request.labels.*.name, 'mobile-e2e')) }}
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: maestro-debug
          path: ~/.maestro/tests/**
          if-no-files-found: ignore

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: playwright-report
          path: frontend/mcm-app/playwright-report/**
          if-no-files-found: ignore

      # Full, timestamped per-service logs written to FILES and uploaded as an artifact — not just the
      # truncated `--tail=200` job-stdout dump, which the Forgejo API does not expose and which scrolls
      # away. An intermittent agent-flow failure (e.g. agent-disambiguation's empty dock panel on
      # 2026-07-09 run #539) is only diagnosable with the server side of the `/run` turn: the BFF +
      # gateway show whether `/run` returned 200 with a completed AG-UI stream while the client rendered
      # nothing (dropped-response signature), and movie-mcp + mc-service show whether the title-resolve
      # that feeds disambiguation timed out. `-t` timestamps let us line these up with the Maestro
      # 150 s assertion window. This `failure()` step runs BEFORE the `always()` teardown, so the
      # containers still exist here.
      - name: Collect container logs + health on failure
        if: failure()
        run: |
          bash scripts/ci-log-step.sh app-e2e-collect-container-logs bash -e /dev/stdin <<'CI_LOG_STEP'
          mkdir -p container-logs
          # App AND data-tier containers. The data-tier set (mongo/postgres/redis) was previously MISSING,
          # so a bring-up failure like "mc-service-store-mongo is unhealthy" only landed in the compose
          # catch-all with no dedicated log or health dump — hard to diagnose out-of-band.
          for c in movie-assistant-gateway movie-assistant-mcp-movie movie-assistant-mcp-webapi \
                   movie-assistant-mcp-spreadsheet mcm-bff-service-nonsecure mc-service keycloak-service \
                   keycloak-store-postgres mc-service-store-mongo mc-service-store-mongo-rs-init \
                   mcm-bff-store-mongo mcm-bff-cache-redis movie-assistant-store-postgres; do
            docker logs -t "$c" > "container-logs/$c.log" 2>&1 || echo "container absent: $c" > "container-logs/$c.log"
            # The healthcheck's own output is THE reason a container reports "unhealthy" — capture it.
            docker inspect --format '{{json .State.Health}}' "$c" > "container-logs/$c.health.json" 2>/dev/null || true
          done
          # One-glance status/health table for EVERY container (which is unhealthy/exited + why).
          docker ps -a --format 'table {{.Names}}\t{{.Status}}' > container-logs/_ps.txt 2>&1 || true
          # 054 US3: the BROWSER's view of a failing test — console, page errors, and every agent
          # request that did (or did not) leave the client. This is the one channel item #173 never
          # had; every server-side one above was already exhausted without finding the collapse.
          # Underscore-prefixed so the digest ranks it above ordinary container logs, and `|| true`
          # because a run whose tests all passed the capture threshold writes nothing.
          for f in frontend/mcm-app/client-evidence/*.log; do
            [ -e "$f" ] && cp "$f" "container-logs/_$(basename "$f")" || true
          done
          # 062: the DEVICE's view of a failed mobile flow — Maestro's view hierarchy + screenshots
          # and the emulator logcat (ReactNativeJS exceptions). Captured inside the emulator script,
          # because the android-emulator-runner terminates the emulator before this step runs, and
          # because this Forgejo build exposes no artifacts API to fetch the uploaded copy with.
          # Underscore-prefixed so the digest ranks it above ordinary container logs.
          [ -d mobile-diagnostics ] && cp -r mobile-diagnostics container-logs/_mobile-diagnostics || true
          # Compose-level captures too (any service not named above, plus restart churn).
          docker compose -p mcm -f infrastructure-as-code/docker/stacks/mcm.compose.yaml --profile app --profile bff-nonsecure logs -t --no-color > container-logs/_mcm-stack.log 2>&1 || true
          docker compose -p auth -f infrastructure-as-code/docker/stacks/auth.compose.yaml logs -t --no-color > container-logs/_auth-stack.log 2>&1 || true
          # Persist to a STABLE host path that survives workspace reuse AND the always() `compose down -v`,
          # so a failure is inspectable out-of-band (ssh ci@runner: ~/mcm-ci-last-failure) even after
          # teardown. Only the latest failure is kept. This is the durable debug trail (the Forgejo API
          # exposes no step logs/artifacts).
          rm -rf "$HOME/mcm-ci-last-failure" && cp -r container-logs "$HOME/mcm-ci-last-failure" 2>/dev/null || true
          # Quick-glance to the job log (visible inline, no artifact download needed).
          echo "::group::container status + health"; cat container-logs/_ps.txt 2>/dev/null || true; \
            for h in container-logs/*.health.json; do [ -s "$h" ] && { echo "-- $h --"; cat "$h"; echo; }; done; echo "::endgroup::"
          echo "::group::mc-service-store-mongo (tail 200)"; tail -n 200 container-logs/mc-service-store-mongo.log 2>/dev/null || true; echo "::endgroup::"
          echo "::group::gateway (tail 200)"; tail -n 200 container-logs/movie-assistant-gateway.log 2>/dev/null || true; echo "::endgroup::"
          echo "::group::bff-nonsecure (tail 200)"; tail -n 200 container-logs/mcm-bff-service-nonsecure.log 2>/dev/null || true; echo "::endgroup::"
          CI_LOG_STEP

      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: agent-e2e-container-logs
          path: container-logs/**
          if-no-files-found: ignore

      # feature 029 (FR-011): a leftover CI app-e2e stack held prod's 8099 for 6h and blocked every
      # prod-auth redeploy (2026-07-06 outage — CI + prod share one host's port space). Tear down every
      # stack this job started — on success, FAILURE, AND cancel — so no CI stack can ever hold a host
      # port against a prod deploy. Mirrors the "Bring up …" invocations exactly. `|| true` per stack so
      # one teardown failure doesn't skip the others. (Prod ports now live in the 19000–19099 reserved
      # range, so this is defense-in-depth, not the sole guard — check-prod-ci-port-collision.mjs is.)
      - name: Tear down CI stacks (always)
        if: ${{ always() }}
        run: |
          bash scripts/ci-log-step.sh app-e2e-tear-down-ci-stacks bash -e /dev/stdin <<'CI_LOG_STEP'
          docker compose -p auth \
            -f infrastructure-as-code/docker/stacks/auth.compose.yaml \
            -f infrastructure-as-code/docker/keycloak/compose.ci.yaml down -v --remove-orphans || true
          docker compose -p mcm -f infrastructure-as-code/docker/stacks/mcm.compose.yaml \
            --profile app --profile bff-nonsecure down -v --remove-orphans || true
          pnpm nx down-agents-prod infrastructure-as-code || true
          CI_LOG_STEP
      # Feature 042 — publish an agent-readable failure digest. The forge API exposes no log or
      # artifact endpoint, so each job PUSHES a distilled, redacted digest into a channel the API can
      # already read (a PR comment, or a commit status on push).
      # `always()` + `continue-on-error` + an unconditional exit 0 inside the script: a broken digest
      # must NEVER mask, replace or delay the real job result (FR-009). `job.status` carries
      # `cancelled` for a superseded run, which the script suppresses rather than publishing as a
      # failure for a commit that was never broken (FR-001a).
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          # US4 fallback: when the secret above is empty (an AGit-headed run has NO secrets), the
          # digest publishes a commit status with this run-provisioned token instead. Without this
          # line the fallback is DEAD CODE — it reads GITHUB_TOKEN from the step env, and nothing
          # else puts it there. Proven live in guardrails run #1628.
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs

  # ── DAST security scan (feature 031) ──────────────────────────────────────────────────────────
  # OWASP ZAP FULL (active BFF + mc-service, passive gateway) against the ephemeral throwaway stack.
  # Independent of app-e2e (own pass/fail + own artifact). Path-gated on changes.app (docs/Komodo-only
  # PRs skip — SC-007). Brings up auth + mcm(app+bff-nonsecure) + the agent stack (so the gateway target
  # exists — C1), runs the scan attached to backend-network (no new host ports — FR-016), scans the
  # reports for secret leakage BEFORE upload (SC-008), publishes the report artifact always, then gates
  # on any un-allowlisted High (FR-009). Contract: specs/031-dast-zap-scanning/contracts/ci-integration-contract.md.
  dast:
    needs: [changes]
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: kvm
    timeout-minutes: 45
    env:
      DOCKER_HOST: unix:///run/user/1001/docker.sock
      MODEL_PROVIDER: ${{ github.event.inputs.provider || vars.MODEL_PROVIDER || 'anthropic' }}
      # up-agents-prod (agent-stack.mjs) refuses to start the gateway with MODEL_PROVIDER=anthropic and
      # no key. The gateway is scanned PASSIVE-only (spider won't POST /run), so no real inference is
      # triggered — the key only lets the server boot. Mirrors app-e2e. Guarded in the leak check + scrub.
      # Per-surface model credential (048 US4) — distinct from app-e2e's so DAST spend is separable.
      # Variable name unchanged (FR-015); only the secret behind it differs.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_CI_DAST }}
      E2E_TEST_USER: ${{ secrets.E2E_TEST_USER }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      # ROPC client used by bearer-auth.js (mcm-bff-test). The secret is minted per-run below and pinned
      # into the realm import; it is re-exported to the scan step via $GITHUB_ENV so both agree.
      E2E_ROPC_CLIENT_ID: mcm-bff-test
      # DAST_ALLOW_ACTIVE unlocks --mode full ONLY in this disposable-stack job (D8 guard, FR-017).
      DAST_ALLOW_ACTIVE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker CLI (job talks to the runner's daemon socket)
        run: |
          bash scripts/ci-log-step.sh dast-set-up-docker-cli bash -e /dev/stdin <<'CI_LOG_STEP'
          if ! command -v docker >/dev/null 2>&1; then
            curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz \
              | tar xz -C /usr/local/bin --strip-components=1 docker/docker
          fi
          docker info >/dev/null 2>&1 || { echo "::error::Docker daemon not reachable"; exit 1; }
          CI_LOG_STEP

      - name: Free daemon disk space
        run: bash scripts/ci-log-step.sh dast-free-daemon-disk-space docker image prune -af || true

      - name: Install latest Docker Compose plugin
        run: |
          bash scripts/ci-log-step.sh dast-install-latest-docker bash -e /dev/stdin <<'CI_LOG_STEP'
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
            -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version
          CI_LOG_STEP

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      # Node >= 22.13 required by pnpm 11; matches the BFF runtime image + cd-deploy (see `affected`).
        with: { node-version: 24.19.0, cache: pnpm }
      # up-agents-prod (agent-stack.mjs) shells to `uv` to fetch the gateway client secret from Keycloak.
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # uv's VERSION, item #307. The action is digest-pinned; without this input the uv it
          # installs is whatever is newest at run time — and uv is the generator for the uv.lock
          # files the weekly lockFileMaintenance channel merges. One version across every site.
          version: '0.12.10' # uv-version
          github-token: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}

      - name: Install dependencies
        run: bash scripts/ci-log-step.sh dast-install-dependencies pnpm install --frozen-lockfile

      # Persistent runner: reset stateful data so the realm import picks up ci-realm.json each run.
      - name: Reset stateful CI data
        run: |
          bash scripts/ci-log-step.sh dast-reset-stateful-ci-data bash -e /dev/stdin <<'CI_LOG_STEP'
          docker rm -f keycloak-service keycloak-store-postgres keycloak-mailpit \
            mc-service mc-service-store-mongo mc-service-store-mongo-rs-init \
            mcm-bff-service-nonsecure mcm-bff-cache-redis mcm-bff-store-mongo \
            movie-assistant-gateway movie-assistant-mcp-movie movie-assistant-mcp-webapi \
            movie-assistant-mcp-spreadsheet movie-assistant-store-postgres 2>/dev/null || true
          docker volume rm keycloak-store-postgres-data mc-service-store-mongo-data \
            mcm-bff-store-mongo-data movie-assistant-store-postgres-data 2>/dev/null || true
          CI_LOG_STEP

      - name: First-time docker setup (networks + volumes)
        run: |
          bash scripts/ci-log-step.sh dast-first-time-docker-setup bash -e /dev/stdin <<'CI_LOG_STEP'
          for n in backend-network keycloak-network movie-assistant-mcp-network; do docker network create "$n" || true; done
          for v in mc-service-store-mongo-data keycloak-store-postgres-data mcm-bff-cache-redis-data \
                   mcm-bff-store-mongo-data movie-assistant-store-postgres-data; do docker volume create "$v" || true; done
          CI_LOG_STEP

      - name: Mint per-stack secrets (stacks/*.env)
        run: bash scripts/ci-log-step.sh dast-mint-per-stack-secrets node scripts/gen-dev-secrets.mjs

      - name: Write CI env/secret files (.env.docker)
        env:
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          KEYCLOAK_SERVICE_CLIENT_SECRET: ${{ secrets.KEYCLOAK_SERVICE_CLIENT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          AGENT_SUBJECT_TOKEN_CLIENT_SECRET: ${{ secrets.AGENT_SUBJECT_TOKEN_CLIENT_SECRET }}
          AGENT_CONFIG_ENC_KEY: ${{ secrets.AGENT_CONFIG_ENC_KEY }}
        run: bash scripts/ci-log-step.sh dast-write-ci-env-secret-files node scripts/gen-ci-env.mjs

      - name: Bring up auth + mcm (app + dev BFF) stacks
        env:
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          KEYCLOAK_SERVICE_CLIENT_SECRET: ${{ secrets.KEYCLOAK_SERVICE_CLIENT_SECRET }}
          AGENT_SUBJECT_TOKEN_CLIENT_SECRET: ${{ secrets.AGENT_SUBJECT_TOKEN_CLIENT_SECRET }}
        run: |
          bash scripts/ci-log-step.sh dast-bring-up-auth-mcm bash -e /dev/stdin <<'CI_LOG_STEP'
          export AGENT_GATEWAY_CLIENT_SECRET="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          export MC_SERVICE_CLIENT_SECRET="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          # The ROPC client secret must be identical at realm-import AND at scan time (bearer-auth.js).
          export E2E_ROPC_CLIENT_SECRET="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "E2E_ROPC_CLIENT_SECRET=$E2E_ROPC_CLIENT_SECRET" >> "$GITHUB_ENV"
          export CI_REALM_FILE="$PWD/infrastructure-as-code/docker/keycloak/ci-realm.json"
          test -f "$CI_REALM_FILE" || { echo "::error::ci-realm.json missing"; exit 1; }
          docker compose -p auth \
            -f infrastructure-as-code/docker/stacks/auth.compose.yaml \
            -f infrastructure-as-code/docker/keycloak/compose.ci.yaml up -d --wait
          pnpm nx build mc-service
          pnpm nx docker-build mcm-app
          docker compose -p mcm -f infrastructure-as-code/docker/stacks/mcm.compose.yaml \
            --profile app --profile bff-nonsecure up -d --wait
          CI_LOG_STEP

      - name: Bring up containerized agent gateway + MCP (gateway scan target — C1)
        env:
          KEYCLOAK_SERVICE_CLIENT_SECRET: ${{ secrets.KEYCLOAK_SERVICE_CLIENT_SECRET }}
        run: bash scripts/ci-log-step.sh dast-bring-up-containerized-agent env MODEL_PROVIDER="$MODEL_PROVIDER" pnpm nx up-agents-prod infrastructure-as-code

      # ── Run the FULL (active) scan (D8-guarded by DAST_ALLOW_ACTIVE + --target ci) ────────────────
      - name: DAST full scan (ZAP on backend-network)
        run: bash scripts/ci-log-step.sh dast-zap-scan node scripts/zap-scan.mjs --target ci --mode full

      # ── Secret-leak check BEFORE upload (SC-008 / C4): fail if the test password or a token leaks ──
      # Body extracted to scripts/dast-leak-scan.sh by 048 T034. It was inline shell with no local
      # entry point, so it could not be run, tested, or deliberately broken — which is how it stayed
      # FAIL-OPEN unnoticed: each per-secret scan is guarded by `[ -n "$VAR" ]`, so an empty variable
      # skipped that scan and the step still exited 0, reporting "no leaks" having looked for
      # nothing. Measured 2026-08-07: 3 of 3 guarded secrets blank → 3 of 3 exit 0.
      #
      # The script now fails closed on an unexpectedly-empty secret and on an absent/empty reports
      # directory, while keeping the documented non-Anthropic provider override working (the
      # ANTHROPIC_API_KEY requirement is conditional on MODEL_PROVIDER — FR-019). Proven by canary,
      # not by inspection: scripts/__tests__/dast-leak-scan.test.sh plants a value matching each
      # guarded secret and asserts publication is blocked, 3 of 3, plus a negative control so the
      # suite cannot be satisfied by a script that always fails.
      #
      # Secrets reach the script through the ENVIRONMENT, never as arguments — argv is world-visible
      # in `ps`. E2E_TEST_PASSWORD / ANTHROPIC_API_KEY / MODEL_PROVIDER come from the job env;
      # E2E_ROPC_CLIENT_SECRET was minted at bring-up and exported via $GITHUB_ENV.
      - name: Scan reports for secret leakage
        run: bash scripts/ci-log-step.sh dast-scan-reports-secret-leakage bash scripts/dast-leak-scan.sh security/zap/reports

      - name: Upload DAST report (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: dast-report
          path: security/zap/reports/**
          if-no-files-found: ignore

      - name: Gate on un-allowlisted High findings
        run: bash scripts/ci-log-step.sh dast-gate-un-allowlisted-high node scripts/check-dast-findings.mjs --report security/zap/reports/report.json --allowlist security/zap/allowlist.yaml

      - name: Dump container logs on failure
        if: failure()
        run: |
          bash scripts/ci-log-step.sh dast-dump-container-logs-failure bash -e /dev/stdin <<'CI_LOG_STEP'
          docker compose -p auth -f infrastructure-as-code/docker/stacks/auth.compose.yaml \
            -f infrastructure-as-code/docker/keycloak/compose.ci.yaml logs --tail=150 || true
          docker compose -p mcm -f infrastructure-as-code/docker/stacks/mcm.compose.yaml \
            --profile app --profile bff-nonsecure logs --tail=150 || true
          docker logs movie-assistant-gateway --tail=100 || true
          CI_LOG_STEP

      - name: Tear down CI stacks (always)
        if: ${{ always() }}
        run: |
          bash scripts/ci-log-step.sh dast-tear-down-ci-stacks bash -e /dev/stdin <<'CI_LOG_STEP'
          docker compose -p auth \
            -f infrastructure-as-code/docker/stacks/auth.compose.yaml \
            -f infrastructure-as-code/docker/keycloak/compose.ci.yaml down -v --remove-orphans || true
          docker compose -p mcm -f infrastructure-as-code/docker/stacks/mcm.compose.yaml \
            --profile app --profile bff-nonsecure down -v --remove-orphans || true
          pnpm nx down-agents-prod infrastructure-as-code || true
          CI_LOG_STEP
      # Feature 042 — publish an agent-readable failure digest. The forge API exposes no log or
      # artifact endpoint, so each job PUSHES a distilled, redacted digest into a channel the API can
      # already read (a PR comment, or a commit status on push).
      # `always()` + `continue-on-error` + an unconditional exit 0 inside the script: a broken digest
      # must NEVER mask, replace or delay the real job result (FR-009). `job.status` carries
      # `cancelled` for a superseded run, which the script suppresses rather than publishing as a
      # failure for a commit that was never broken (FR-001a).
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          # US4 fallback: when the secret above is empty (an AGit-headed run has NO secrets), the
          # digest publishes a commit status with this run-provisioned token instead. Without this
          # line the fallback is DEAD CODE — it reads GITHUB_TOKEN from the step env, and nothing
          # else puts it there. Proven live in guardrails run #1628.
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs

  # ── Trigger CD once CI is green on main (CD hardening Option 2, 2026-07-03) ────────────────────
  # Replaces cd-deploy's old POLLING ci-gate (which raced an 80-min wall clock against app-e2e queued on
  # the single kvm runner → false timeout). Ordering is now a dependency EDGE: this job `needs:` the CI
  # jobs, so it only runs AFTER they succeed — then it dispatches cd-deploy (deploy=true). cd-deploy has
  # no push trigger, so this is the ONLY automatic deploy path. Runs only on a push to main (a merge);
  # skipped on PRs/other branches (so opening/merging a PR doesn't deploy from the PR head).
  trigger-cd:
    needs: [affected, mc-service-checks, app-e2e, dast]
    # `always()` so this still evaluates when app-e2e was SKIPPED (path-gated for a config-only change);
    # then gate explicitly: deploy on green main only when affected + mc-service-checks succeeded and
    # app-e2e did not FAIL (success OR skipped). A skipped needs-dependency would otherwise cascade-skip
    # this job, which would leave a legit config change undeployed.
    if: >-
      ${{ always()
          && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && needs.affected.result == 'success'
          && needs.mc-service-checks.result == 'success'
          && (needs.app-e2e.result == 'success' || needs.app-e2e.result == 'skipped')
          && (needs.dast.result == 'success' || needs.dast.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      # FIRST, not last (item #230). The decision below is a repository script, and it diffs against the
      # last deploy's promotion commit — so the checkout AND its full history are prerequisites of the
      # decision, not diagnostics collected afterwards. `fetch-depth: 0` because a shallow clone cannot
      # resolve that base, which would silently disable the redundant-deploy skip on every run.
      #
      # This step used to run LAST and carry `continue-on-error: true`, correctly: it existed only for
      # the digest script, it ran after the dispatch had already fired, and a transient checkout failure
      # would otherwise have reported "deploy trigger failed" for a deploy that actually went out. That
      # reasoning inverts once the gate depends on it — nothing may decide whether to deploy without the
      # code that decides — so the guard is gone and a failed checkout now fails the job, before any
      # dispatch. Moving it here is also what retires the job's ci-log-step exemption: the exemption's
      # stated reason was that instrumenting would mean moving the checkout ahead of the dispatch.
      - name: Checkout (the gate script, and history back to the last deploy)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Defense-in-depth: app-ci is green by construction (this job `needs:` its jobs), but cd-deploy is
      # meant to gate on guardrails too. guardrails is a separate, fast workflow that has long since
      # reported by the time app-e2e (a `needs` of this job) finishes — so a SINGLE status read confirms
      # it (no polling loop, no wall clock).
      #
      # The read used to be an inline `node -e` comparing raw statuses to "success". A CANCELLED run
      # reports its contexts as `failure`, so that form read a superseded-but-unbroken commit as broken
      # and skipped its deploy — item #230. The decision now lives in scripts/cd-dispatch-gate.mjs,
      # which reuses ci-status.mjs's classification (superseded vs failed vs path-gated-skipped) instead
      # of re-deriving it, decides on the TIP rather than on this commit, and publishes a
      # `cd-dispatch / trigger-cd` commit status so a decision NOT to deploy is visible.
      - name: Decide whether to dispatch cd-deploy
        id: gate
        env:
          GH_TOKEN: ${{ secrets.CD_PUSH_TOKEN }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_BRANCH: main
        run: bash scripts/ci-log-step.sh trigger-cd-gate node scripts/cd-dispatch-gate.mjs

      # `{"ref":"main"}`, NOT this sha — cd-deploy builds whatever the tip is. That is exactly why the
      # gate refuses to dispatch from a superseded commit: doing so would deploy a tree whose CI this
      # job never looked at.
      - name: Dispatch cd-deploy (deploy=true) — CI is green on main
        if: ${{ steps.gate.outputs.dispatch == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CD_PUSH_TOKEN }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          bash scripts/ci-log-step.sh trigger-cd-dispatch bash -e /dev/stdin <<'CI_LOG_STEP'
          set -uo pipefail
          curl -fsSL -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H 'Content-Type: application/json' \
            "${GH_API_URL}/repos/${GH_REPO}/actions/workflows/cd-deploy.yml/dispatches" \
            -d '{"ref":"main","inputs":{"deploy":"true"}}'
          echo "dispatched cd-deploy (deploy=true) on main @ ${GH_SHA}"
          CI_LOG_STEP
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          # US4 fallback: when the secret above is empty (an AGit-headed run has NO secrets), the
          # digest publishes a commit status with this run-provisioned token instead. Without this
          # line the fallback is DEAD CODE — it reads GITHUB_TOKEN from the step env, and nothing
          # else puts it there. Proven live in guardrails run #1628.
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs
