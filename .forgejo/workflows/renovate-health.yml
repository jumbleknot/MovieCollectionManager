# Item #311 — the weekly Renovate health digest.
#
# WHY THIS EXISTS. Renovate's failure mode on this forge is ABSENCE, and absence is unreadable:
# a dead channel is one suppressed WARN line on the dashboard (#218), a stale branch is an empty PR
# and a wasted ~35-minute CI cycle (#290), open PRs silently eat next week's PR budget, and a
# pending stability-days has to be gone-and-looked-at (#298). Each was discovered by incident. This
# job goes and looks, weekly, and comments what it found on item #311.
#
# A VERDICT NEVER TURNS IT RED; THE INSTRUMENT FAILING DOES (item #1123). A finding is a comment —
# a weekly red on a finding trains people to ignore it. But no token, a failed read, or a failed POST
# exits 1 so the failure digest fires: this job used to exit 0 on all of those, and a broken health
# job was then indistinguishable from a healthy one. It also exits 1 when no scheduled Renovate run
# started inside the lockFileMaintenance window this week (item #1124) — an absence only a job that
# runs after the window can see. Its OWN silence is watched by renovate.yml's verdict step, which
# fails when the newest digest on item #311 is older than 8 days.
# CLOSING ITEM #311 IS THE KILL SWITCH — the script no-ops once it is closed.
name: renovate-health

on:
  schedule:
    # Friday 11:00 UTC — after renovate's window run (07:00) has finished, on the shared single
    # runner. A health check that queues behind (or beside) the thing it is checking would read the
    # state before the work happened.
    - cron: '0 11 * * 5'
  # Dispatchable so the check can be PROVEN working now rather than discovered broken on a Friday.
  # No dryRun input needed at the workflow level — the script's own --dry-run covers local proving,
  # and a dispatched run posting one extra comment to #311 is harmless by design.
  workflow_dispatch:

concurrency:
  group: renovate-health
  cancel-in-progress: false

jobs:
  renovate-health:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0, unlike the other comment-only jobs — the stale-branch classification runs
      # `git merge-base --is-ancestor origin/renovate/* origin/main`, and on a shallow single-ref
      # checkout that question is unanswerable (the script reports those branches as `unknown`
      # rather than dropping them, but a digest full of unknowns answers nothing).
      - name: Checkout (full history + all refs, for ancestry checks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.1
      - name: Post the weekly Renovate health digest
        env:
          # write:issue — the same purpose-scoped secret the failure digest uses. The script reads
          # the forge with it too.
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
        run: bash scripts/ci-log-step.sh renovate-health node scripts/renovate-health.mjs
      # Feature 042 — every job publishes a guarded failure digest. Since item #1123 this job DOES go
      # red when it cannot produce a digest, and the forge exposes no log endpoint, so this is the
      # channel that says why.
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs
