# Renovate — scheduled dependency-update bot (DRAFT 2026-07-05).
#
# Runs nightly on the self-hosted Forgejo act_runner, scans jumbleknot/mcm, and opens PRs bumping
# upstream deps (Docker base images, Cargo, Python, non-RN npm, CI actions) per renovate.json. Those
# PRs go through guardrails + app-ci like any other; cd-deploy only fires on merge to main, so nothing
# auto-deploys. React Native / Expo are excluded in renovate.json (Expo upgrades go through the expo
# upgrade skill, not raw bumps).
#
# OPERATOR PREREQUISITE (one-time, NOT in git — same pattern as CD_PUSH_TOKEN / REGISTRY_TOKEN):
#   Create a Forgejo PAT `renovate` and add it as the Forgejo Actions secret RENOVATE_TOKEN. Scopes
#     (all six — Renovate needs each; a missing one surfaces as a 403 for that specific call):
#       read:user          — GET /user at init to identify the bot account
#       read:organization  — org/preset lookups
#       read:repository + write:repository — read repo + open PR branches
#       read:issue + write:issue           — manage the Dependency Dashboard issue (and PRs, which
#                                            Forgejo models as issues)
#   OPTIONAL: add a read-only github.com PAT (no scopes needed) as secret RENOVATE_GITHUB_COM_TOKEN so
#   Renovate can look up github-actions versions + changelogs without hitting api.github.com's anon rate
#   limit. NB the secret is named with the RENOVATE_ prefix (NOT GITHUB_): Forgejo reserves the GITHUB_/
#   GITEA_/FORGEJO_ prefixes for secret+env names, and Renovate reads RENOVATE_GITHUB_COM_TOKEN natively.
#   The env line below is already wired — it's an empty no-op until the secret exists.
#   NOTE: Renovate logs "Detected Forgejo instance, please use 'forgejo' platform" — the `gitea`
#   platform works (Forgejo is API-compatible); switching to `forgejo` later is a nicety, not required.
#   (No endpoint var needed: the API base is derived from ${{ github.server_url }} — the same forge
#   URL the runner uses for actions/checkout — so it's reachable by construction and never a host
#   literal in git. If your Forgejo populates github.server_url without /api, the line below appends it.)
#
# VALIDATE BEFORE TRUSTING: trigger manually with dryRun=true (RENOVATE_DRY_RUN=full) and read the log —
# it lists the PRs it WOULD open without creating them. Then flip to a real run.
name: renovate

on:
  schedule:
    # TWO triggers, doing two different jobs. Actions cron is UTC-only and does NOT observe DST.
    #
    # The nightly run is OUTSIDE renovate.json's permitted window, and that is deliberate: security
    # PRs are schedule-EXEMPT (`vulnerabilityAlerts` inherits an empty schedule from its preset), so
    # they land promptly from this trigger while routine updates correctly defer.
    - cron: '0 3 * * *' # nightly 03:00 UTC — schedule-EXEMPT security PRs only; routine updates defer here
    # The window run. This is the one that was missing: until 2026-08-13 the nightly cron above
    # carried the comment "matches the renovate.json schedule window", which was false — 03:00 UTC is
    # 23:00 THURSDAY in New York, and the window is Friday. The two sets never intersected, so every
    # routine update deferred forever across four silent Friday windows (#153). 07:00 UTC is 03:00 EDT
    # and 02:00 EST; renovate.json's window is widened to `* 2-4 * * 5` so this lands inside it in
    # both halves of the year. `renovate-workflow.guard.test.mjs` is what now holds this true.
    - cron: '0 7 * * 5' # Friday 07:00 UTC = 03:00 EDT / 02:00 EST — inside the renovate.json window
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run (log the PRs it would open, create nothing)'
        type: boolean
        # DEFAULTS TO TRUE, and that default has already produced a wrong conclusion. Item #184
        # recorded "the schedule beats a dashboard unlimit tick" from run 5963 (2026-08-14T09:34Z)
        # running, succeeding and creating nothing. It created nothing because it was a DRY RUN.
        # Keep the default TRUE: a dispatch that creates PRs by accident is the worse failure.
        #
        # HOW TO READ A DISPATCHED RUN'S MODE — item #268. Three introspective routes are DEAD on
        # this forge (measured, run 2161): step names render their ${{ }} raw, /actions/runs/{id}/jobs
        # is 404, and there is no log endpoint. event_payload.inputs echoes what you SENT, not what
        # the expression resolved to. The comment that stood here claiming otherwise was false.
        # The 'Publish dispatch mode' step below therefore posts the RESOLVED mode as a commit
        # status (`renovate/mode` on the dispatched sha) BEFORE Renovate runs — built only from
        # proven parts: env-var resolution in `run:` (used everywhere) and the statuses endpoint
        # (measured writable with github.token, guardrails #1627). The empirical fallback stays
        # authoritative: a live run moves branch heads and consumes dashboard ticks; a dry run
        # cannot (docs/runbooks/renovate.md §3).
        default: true

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    env:
      # THE ONE ASSIGNMENT OF THE RUN'S MODE — job-level so the 'Publish dispatch mode' step and the
      # Renovate step read the SAME resolved value; a per-step copy of this expression could drift
      # and the status would then report a mode the run does not have (the half-bump shape, for
      # config). Under GitHub expression semantics a non-empty STRING "false" would be truthy and
      # select 'full' (a dry run); it resolves correctly here only because Forgejo coerces the value
      # against the input's declared `type: boolean` — a property of this forge build, which is why
      # the empirical heads-and-ticks check in the runbook stays mandatory rather than advisory.
      RENOVATE_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dryRun) && 'full' || '' }}
    # Run Renovate via npx INSIDE the runner's default node:22-bookworm container (which is how the
    # act_runner containerizes `ubuntu-latest` jobs). We deliberately do NOT use a job-level
    # `container: renovate/renovate` — none of the other workflows do, and container-on-container on
    # the rootless daemon fails at setup (the first draft did exactly that).
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Node 24.14.1, NOT the container's bundled v22.23.2. renovate@44.14.12 raised `engines.node`
      # to ^24.11.0 INSIDE the pinned major, so from 2026-08-09 every run logged
      # `npm warn EBADENGINE` and then `ERROR: Unsupported node environment detected`, and exited 1
      # (run 1704, 2026-08-13). This was the only workflow in the repository with no `setup-node`,
      # which is exactly why it inherited a runtime nobody had chosen. 24.14.1 is the version every
      # other job here already runs on — proven, not new.
      #
      # This step MUST stay BEFORE `corepack enable`: corepack is provisioned from whichever Node is
      # on PATH, so installing Node after it would leave corepack bound to the container's Node 22
      # even once Node 24 exists. `renovate-workflow.guard.test.mjs` asserts both the pin and this
      # ordering; `check-toolchain-consistency.mjs` validates the version against `engines.node`.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      # Renovate runs the manifest bump AND regenerates the lockfile ("artifacts" step) as child
      # processes using tools on PATH (binarySource=global for an npx install). The bare node:22-bookworm
      # runner has neither pnpm nor cargo, so lockfile regen failed → `renovate/artifacts` red and PRs
      # shipped with a STALE lockfile. Since app-ci enforces `pnpm install --frozen-lockfile`, a stale
      # pnpm-lock.yaml then cascades every downstream job (that was the react-monorepo PR breakage).
      # Provide both toolchains here — mirroring guardrails.yml (pnpm via corepack) and app-ci's
      # mc-service-checks (rustup minimal) — so Renovate can refresh pnpm-lock.yaml AND Cargo.lock.
      - name: Enable pnpm (corepack, version from package.json packageManager)
        run: bash scripts/ci-log-step.sh renovate-enable-pnpm corepack enable
      - name: Install Rust (cargo, for Cargo.lock maintenance)
        run: |
          bash scripts/ci-log-step.sh renovate-install-rust bash -e /dev/stdin <<'CI_LOG_STEP'
          # `--default-toolchain none` + rust-toolchain.toml (item #307): the toolchain that
          # regenerates Cargo.lock every Friday is a chosen version, not `stable` on the day.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          CI_LOG_STEP
      # uv, for the pep621 lockFileMaintenance channel — item #218. WITHOUT THIS THE CHANNEL IS NOT
      # SLOW, IT IS DEAD, and dead silently: Renovate shells out to the package manager through execa,
      # a missing binary rejects, and the rejection is SUPPRESSED to a repo-level
      # "WARN: execa promise rejection suppressed" on the Dependency Dashboard. The channel simply
      # never appears. No PR, no error, nothing to notice.
      #
      # MEASURED 2026-08-28, run 2191: a dispatch with `unschedule-branch=renovate/lock-file-maintenance-
      # python-deps` ticked — schedule AND budget both taken out of the picture — created no branch at
      # all, while the dashboard grew that warning. The two channels WITH a toolchain on PATH (pnpm via
      # corepack, cargo via rustup above) both produce PRs; the one without never has.
      #
      # It is not "nothing to refresh": `uv lock --upgrade --dry-run` in agents/movie-assistant offers
      # substantial work (uvicorn 0.49.0 -> 0.52.4, websockets 15 -> 16, wrapt 1 -> 2, and more) across
      # four lockfiles — agents/movie-assistant and the three mcp-servers.
      #
      # This is the third toolchain on this job for the same reason the comment above gives for the
      # first two. The failure mode generalises: any Renovate channel whose lockfile needs a binary
      # this runner lacks goes silently missing, so a new manager means a new toolchain here.
      - name: Set up uv (for pep621 / uv.lock maintenance)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # uv's VERSION, item #307. The action is digest-pinned; without this input the uv it
          # installs is whatever is newest at run time — and uv is the generator for the uv.lock
          # files the weekly lockFileMaintenance channel merges. One version across every site.
          version: '0.12.9' # uv-version
          # Authenticate the GitHub API call that resolves uv "latest" — the Forgejo runner has no GitHub
          # token, so the anonymous call hits the 60/hr rate limit and fails ("Set up uv", cd-deploy 2026-07-06).
          # Same pin and same reasoning as app-ci.yml and cd-deploy.yml.
          github-token: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
      # Item #268 — make a dispatched run's mode READABLE, before the run finishes. Scoped to
      # workflow_dispatch only: a scheduled run is always live by construction, and posting a status
      # on main's tip every night would be pure noise. Read it back with
      #   GET /repos/{owner}/{repo}/commits/{sha}/status   → context `renovate/mode`.
      # Posted BEFORE Renovate runs so a LIVE dispatch can be distinguished (and abandoned) early.
      - name: Publish dispatch mode (item #268)
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci-log-step.sh renovate-publish-mode bash -e /dev/stdin <<'CI_LOG_STEP'
          if [ -n "$RENOVATE_DRY_RUN" ]; then mode="DRY RUN (creates nothing)"; else mode="LIVE"; fi
          echo "resolved mode: $mode (RENOVATE_DRY_RUN='$RENOVATE_DRY_RUN')"
          curl -fsS -X POST -H "Authorization: token $GITHUB_TOKEN" -H 'Content-Type: application/json' \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"context\":\"renovate/mode\",\"state\":\"success\",\"description\":\"$mode\"}" >/dev/null
          CI_LOG_STEP
      # Item #309, the half the PR gate cannot cover. `guardrails / renovate-config` validates an
      # EDIT to renovate.json before it merges. It cannot see a semantic change that arrives with a
      # renovate@44 MINOR — nothing in the repository changed, so no PR runs — and that is the #160
      # shape in its config edition: the major pin below is entirely about config SEMANTICS, and a
      # release inside the pinned major can still deprecate or rename a key we use. Validating here,
      # with the SAME major that is about to run, is what catches it, at most a week later.
      #
      # BLOCKING on purpose. A config this Renovate would reject is a Renovate that is already
      # silently mismanaging the repository, so stopping the run is strictly better than letting it
      # act on a config half of which it ignores — and it fails visibly, with a failure digest,
      # rather than as the absence this whole file's comments keep warning about.
      #
      # Near-free: this is the FIRST renovate@44 pull of the job, and the `Run Renovate` step below
      # then resolves from the same ~/.npm/_npx cache inside this container rather than pulling
      # again — so the cost is the validation itself, not a second download. The flags are the
      # measured ones; see the `renovate-config` job in guardrails.yml for what each one holds up.
      - name: Validate renovate.json before acting on it (item #309)
        run: bash scripts/ci-log-step.sh renovate-validate-config npx --yes --package renovate@44 -- renovate-config-validator --strict --no-global renovate.json
      - name: Run Renovate
        env:
          # Non-interactive corepack provisioning (avoid the first-use download prompt hanging the job).
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
          # Forgejo is Gitea-API-compatible; the `gitea` platform is the most battle-tested path.
          RENOVATE_PLATFORM: gitea
          # API base derived from the runner-injected instance URL (the same host actions/checkout uses)
          # → reachable by construction, no host literal in git, no operator var to set.
          RENOVATE_ENDPOINT: ${{ github.server_url }}/api/v1/
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_REPOSITORIES: jumbleknot/mcm
          RENOVATE_AUTODISCOVER: 'false'
          # Read-only github.com PAT for changelog + github-actions version lookups (anti-rate-limit).
          # RENOVATE_-prefixed to dodge Forgejo's reserved GITHUB_ prefix; empty no-op until the secret exists.
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
          # RENOVATE_DRY_RUN comes from the JOB env above — one assignment, two consumers (item #268).
          LOG_LEVEL: info
          # Docker Hub's anonymous tag API (/v2/repositories/<repo>/tags, page_size 100) answers 403
          # FROM PAGE 11 — a 1000-tag cap, measured 2026-09-05 from the dev container the day
          # hub.docker.com was allowlisted. Renovate's default `dockerMaxPages` is 20; `library/node`
          # has 9080 tags; so on a cold cache (every run here) Renovate asks for page 11, gets 403, and
          # `_getDockerHubTags` returns null — the WHOLE timestamped result for that image is thrown
          # away and the registry tag list, which has no timestamps, is used instead. Under
          # renovate@44's `minimumReleaseAgeBehaviour=timestamp-required` default that marks every
          # Docker Hub tag and digest pending FOR EVER, which is why `docker base images` and
          # `docker digest pins` sat permanently in Pending Status Checks looking like a 3-day
          # cooldown. Ten pages of newest-first tags reached back to 2025-11 for node, so every live
          # candidate carries a timestamp; with this set, the same lookup logged zero
          # "no releaseTimestamp" markings and pending became temporal (curl 8.22.0 and opa 1.20.2,
          # both pushed inside the last three days). `dockerMaxPages` is globalOnly — it cannot live
          # in renovate.json — so this env var is the only place; renovate-workflow.guard.test.mjs
          # asserts it stays at or below 10. docs/runbooks/renovate.md §5 has the measurement.
          RENOVATE_DOCKER_MAX_PAGES: '10'
        # npx pulls the renovate package into the node runner. PINNED to a major (2026-08-08): it was
        # `npx --yes renovate`, i.e. always-latest, so a Renovate major could land in CI unannounced
        # and change config semantics under us. That is not hypothetical — v41 renamed customManagers'
        # `fileMatch` to `managerFilePatterns`, and a config using the wrong key does not fail loudly,
        # it silently manages nothing. Matches how every other CI tool here is treated (sast-scan.mjs
        # pins SEMGREP_PIN = '1.169.0').
        #
        # A MAJOR pin, not exact: Renovate ships several releases a week, and nothing in this repo can
        # bump this string automatically (it is shell text in a `run:`, invisible to Renovate's own
        # managers). Major is the reproducibility/maintenance balance the original TODO here asked for.
        # Raising 44 -> 45 is a DELIBERATE, reviewed act: read the major's breaking changes and re-run
        # `npx --yes --package renovate@<new> -- renovate-config-validator` against renovate.json first.
        #
        # RESIDUAL RISK THE MAJOR PIN DOES NOT COVER — and this one has already fired. The reasoning
        # above is entirely about CONFIG SEMANTICS: a major could change how renovate.json is read.
        # It says nothing about the RUNTIME, and a minor/patch INSIDE the pinned major can raise
        # `engines`. That is precisely what happened: 44.14.12 moved `engines.node` to ^24.11.0, well
        # inside `renovate@44`, and the pin let it through because the pin was never about that. The
        # job then ran on the container's Node 22 and exited 1 on every run for four days before
        # anyone read the nightly red (#160).
        #
        # What covers it is the `actions/setup-node` step above, not this pin. So when raising the
        # major, check the new major's `engines.node` against that step's `node-version` as well as
        # the config changes — a pin bump and a runtime bump are two separate reviews.
        run: bash scripts/ci-log-step.sh renovate npx --yes renovate@44
      # Feature 042 — publish an agent-readable failure digest. The forge API exposes no log or
      # artifact endpoint, so each job PUSHES a distilled, redacted digest into a channel the API can
      # already read (a PR comment, or a commit status on push).
      # `always()` + `continue-on-error` + an unconditional exit 0 inside the script: a broken digest
      # must NEVER mask, replace or delay the real job result (FR-009). `job.status` carries
      # `cancelled` for a superseded run, which the script suppresses rather than publishing as a
      # failure for a commit that was never broken (FR-001a).
      - name: Publish failure digest
        if: always()
        continue-on-error: true
        env:
          CI_DIGEST_TOKEN: ${{ secrets.CI_DIGEST_TOKEN }}
          # US4 fallback: when the secret above is empty (an AGit-headed run has NO secrets), the
          # digest publishes a commit status with this run-provisioned token instead. Without this
          # line the fallback is DEAD CODE — it reads GITHUB_TOKEN from the step env, and nothing
          # else puts it there. Proven live in guardrails run #1628.
          GITHUB_TOKEN: ${{ github.token }}
          CI_DIGEST_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-failure-digest.mjs
