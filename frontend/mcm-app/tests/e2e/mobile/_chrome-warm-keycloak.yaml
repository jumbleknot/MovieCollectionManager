appId: com.android.chrome
tags:
  - helper
---
# CI-only helper (item #986): load the Keycloak login page ONCE in Chrome itself, right after
# scripts/ci-mobile-lib.sh's reset_chrome_sso has `pm clear`ed Chrome and skipped its First Run
# Experience — so the first OAuth Custom Tab of the batch does not open on a cold Chrome.
#
# WHY. In the full mobile suite the only attempts that ever failed at login were the FIRST Custom Tab
# after a Chrome reset: auth-guard (always the first flow) on runs 7119 (attempt 1) and 7296 (both
# attempts, each straight after a reset); the ~66 blocking attempts on runs 7119/7268/7296 that did
# not follow a reset all passed first time. Both 7296 attempts ended on the app's bare login-screen
# with no error banner — the Custom Tab session ended WITHOUT delivering the redirect — and attempt 2
# never even showed the Keycloak form.
#
# The page is the account console's authorization request: it renders the same Keycloak login form
# the app's Custom Tab will, and its redirect_uri is Keycloak's own account page, so nothing here can
# deep-link into the app or create a session. The PKCE challenge is a fixed, throwaway value — the
# code is never redeemed.
#
# Best-effort: optional wait, invoked with `|| true`. It warms; it does not gate.
- openLink: "http://localhost:8099/realms/grumpyrobot/protocol/openid-connect/auth?client_id=account-console&redirect_uri=http%3A%2F%2Flocalhost%3A8099%2Frealms%2Fgrumpyrobot%2Faccount%2F&response_type=code&scope=openid&code_challenge_method=S256&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM"
- extendedWaitUntil:
    visible:
      text: "Username or email"
    timeout: 60000
    optional: true
