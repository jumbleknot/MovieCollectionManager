appId: com.grumpyrobot.mcmapp
---
# Helper: wait for the assistant to ANSWER this turn — without asserting which branch it took.
# The mobile mirror of tests/e2e/web/setup/assistant-turn.ts (064 US3, item #337).
#
# ## Why this file exists at all
#
# `openwiki/invariants/testing-tiers.md` says an assertion may gate a merge only if the same code
# and the same prompt cannot produce a different verdict on a re-run. Waiting for
# `selection-options` / `disambiguation-options` breaks that: those elements render only when the
# turn was routed to a node that offers a choice. The testid is perfectly stable — what varies is
# WHICH BRANCH was taken.
#
# The web suite could have retired such waits to `@model-decision`. The mobile suite has NO tier
# split, so that escape does not exist here — which is precisely what made item #337 a design task
# rather than a relabelling. And the cost of getting it wrong is worse on this surface:
# `ci-mobile-agent-flows.sh` retries each flow 3x with 150 s waits, so ONE unluckily-branched turn
# costs ~7.5 minutes. Measured 2026-09-02: `maestro-agent-flows` burned 45 minutes on exactly this
# before item #326's step ceiling killed it and named it.
#
# ## Why the count comes from the app
#
# Maestro cannot count elements, so the count is rendered INTO the tree: the dock emits
# `assistant-turn-<n>`, where n is the number of assistant replies on screen (assistant-dock.tsx).
# Playwright reads the same marker as a locator. One mechanism, two runners — if each surface
# invented its own, they would drift into waiting for different things.
#
# ## Usage
#
#   - runFlow:
#       file: "_await-turn.yaml"
#       env:
#         TURN: "1"        # the number of assistant replies expected AFTER this turn
#
# Flows start from `launchApp: clearState: true`, so the dock opens with zero replies and TURN is
# simply how many turns have been sent. Count sent turns, not screen elements.
#
# 150 s matches the web helper's TURN_TIMEOUT: a cold gateway graph build plus a multi-tool turn
# against a live provider. What is being waited for is different from the old branch waits, though —
# a reply that MUST arrive, rather than a branch that may not be taken. So a timeout here is a real
# failure (no answer at all), not a coin flip.
#
# When this times out, read the gateway's `turn routed: intent=… node=… thread=…` line (064 US2).
# No line for the turn means no turn arrived — the dropped-client-send defect item #337 found. A
# line with an unexpected `intent=` means the supervisor classified the utterance differently.

# ## Why a branch check straight after this is not racing the render
#
# A caller typically does `runFlow: _await-turn.yaml` and then immediately asks whether
# `selection-options` / `disambiguation-options` is visible. That looks like it could read the
# tree in a gap between the text bubble mounting and the tool-call row mounting — but there is no
# such gap. Both come from ONE `buildDockItems(agent.messages)` array rendered by ONE FlatList in
# one commit, and the marker's count is computed from that same array (assistant-dock.tsx). The
# gateway nodes emit the text and the tool call on a SINGLE AIMessage — `curator._reply`,
# `search._selection`, the navigator's `_clarify`, the import node's `_ask` — so the marker cannot
# rise before the affordance exists.

- extendedWaitUntil:
    visible:
      id: "assistant-turn-${TURN}"
    timeout: 150000
