appId: com.grumpyrobot.mcmapp
---
# T037 (mobile, 013 US4): ambiguous look-up candidates render as selectable BUTTONS; tapping one
# proceeds with that match. Mirror of tests/e2e/web/agent-disambiguation.spec.ts.
# "look up Avatar" → the curator offers ambiguous matches + emits render_disambiguation → the client
# renders one button per candidate → tapping the non-first button (by POSITION, not by name —
# the list is live TMDB data and drifts) posts the canonical "<title> (<year>)" pick → the curator
# resolves it → that film's card.
#
# Enrich-only (no write/approval). Drives the full live stack: CopilotKit dock → BFF /run → gateway
# → Ollama classify/extract → curator enrich (ambiguous) → render_disambiguation → button tap →
# curator resolve_option → render_movie_card.
#
# Requires: full agent stack; the app uses Metro's BFF (:8081 → AGENT_GATEWAY_URL 127.0.0.1:8123).
# Publish the containerized gateway on :8123 with a socat proxy (see agent-navigate-movie.yaml).
# adb reverse tcp:8081 + tcp:8099. Logged-out start. Env: E2E_TEST_USER, E2E_TEST_PASSWORD.
# NOTE: a live emulator run is gated by the _login-helper SSO-timing flake (see assistant-disambiguate.yaml).

# Independent state (CLAUDE.md): clear + stop so each flow starts logged-OUT and _login-helper
# (which requires the login screen) works in the back-to-back CI suite. The per-user agent config
# lives server-side, so it survives clearState — the dock is still runnable after re-login.
- launchApp:
    stopApp: true
    clearState: true
- runFlow: "_login-helper.yaml"
- extendedWaitUntil:
    visible:
      id: "home-screen-create-button"
    timeout: 20000

- tapOn:
    id: "assistant-dock-toggle"
- extendedWaitUntil:
    visible:
      id: "assistant-dock-panel"
    timeout: 10000

# Turn 1: ambiguous title → the curator offers selectable option buttons.
- tapOn:
    id: "assistant-dock-input"
- inputText: "tell me about Avatar"
- pressKey: Back
- tapOn:
    id: "assistant-dock-send"
# WAIT FOR THE TURN, NOT FOR A BRANCH (064 US3, item #337).
#
# `disambiguation-options` renders only when the curator found the title AMBIGUOUS — that is a
# genuine model decision (it depends on what TMDB returned and how the curator scored it), unlike
# the navigator/search/import cases where the branch is pure code. The mobile suite has no tier
# split, so it cannot be retired to `@model-decision`; what it can do is stop spending 150 s x 3
# retries discovering that the other branch was taken.
- runFlow: "_await-turn.yaml"

# Tap the NON-FIRST candidate BY POSITION (testID), never by name.
#
# This block previously matched the button by its label text, which stacked four problems — three
# fixed in #539, the fourth fatal on 2026-07-20:
#
# 1. `text:` is a REGEX (`textRegex` in the Maestro log), so "Avatar: The Way of Water (2022)"
#    treated "(2022)" as a capture GROUP and could never match the real label.
# 2. Maestro's text selector has NO scoping, so a bare title regex also matched the assistant
#    BUBBLE, which lists every candidate in one sentence. Hence the "Choose …" accessibilityLabel.
# 3. The list is live TMDB data ranked by popularity and it DRIFTS, so the target sank below the
#    fold — hence scrollUntilVisible and the optional "show more" tap.
# 4. On 2026-07-20 the target left the offered set ENTIRELY ("Avatar: Fire and Ash" and
#    "Avatar Aang: The Last Airbender" now outrank it). `disambig-more` was absent — proving the
#    list was NOT truncated — so no amount of scrolling could have found it. 3/3 attempts failed.
#
# Selecting by testID removes all four at once: no regex, no scoping ambiguity, no drift dependency,
# and slot 1 is always on screen so no scrolling is needed. What US4-AC2 actually asserts is that
# tapping a NON-FIRST candidate resolves to THAT candidate — which does not depend on which films
# TMDB returns today.
#
# The web mirror additionally reads the label and asserts the card matches it. Maestro cannot do that
# safely: interpolating a captured label back into a `text:` selector would reintroduce trap 1, since
# the label contains "(YYYY)". So mobile asserts structurally — a card rendered and the options
# collapsed — and the semantic check lives in agent-disambiguation.spec.ts.
# ADAPTIVE (candidate COUNT is live-model non-deterministic too): the model usually offers ≥2
# candidates for an ambiguous title, but occasionally resolves to a single one. On 2026-07-22 it
# offered ONE candidate and a hard `assertVisible: disambig-option-1` failed 3/3. Prefer the
# non-first candidate when it exists (the stronger US4-AC2 check), else fall back to the first —
# the render→select→resolve path is exercised either way. (`disambig-option-0` is asserted at the
# top of the same block, so at least one candidate is guaranteed present by the time these run.)
# ★ ORDER IS LOAD-BEARING — the FALLBACK block must come first.
#
# Maestro re-evaluates each `when:` at the moment that block is reached, NOT up front, so two
# sibling blocks with complementary guards are NOT mutually exclusive: the first block's tap
# collapses the option list, which then SATISFIES the second block's guard and fires it too.
# With the primary first, the happy path self-sabotaged (measured, run 1191, 3/3 attempts):
#
#   Run flow when id: disambig-option-1 is visible...
#     Tap on id: disambig-option-1... COMPLETED     ← picked, list collapses
#   Run flow when id: disambig-option-1 is not visible...
#     Tap on id: disambig-option-0... FAILED        ← fires BECAUSE the pick succeeded
#
# i.e. it failed precisely when there WERE multiple candidates — the case it exists to cover. It
# only passed while the list happened to still be on screen when the second guard was read, so this
# was always a latent race, not a TMDB drift like the two before it (see 9b02392).
#
# Fallback-first makes the guards genuinely exclusive: after tapping option-0, `visible: option-1`
# is still false (it never existed), so the primary is correctly skipped. Reverse the order and the
# race returns. The web mirror avoids this differently — it captures the choice ONCE
# (`pickTarget`, agent-disambiguation.spec.ts) — which Maestro has no equivalent for.
# The turn's TEXT streams BEFORE its TOOL CALL, so a `when: visible` guard evaluated the instant the
# bubble appears races the affordance render — the same trap `_login-helper.yaml` documents ("the
# instant `when visible` check used to race the load and SKIP credential entry"). MEASURED on CI run
# 2570: the fallback fired because neither element was on screen yet, and the flow then failed
# waiting for a card the other branch was never going to render.
#
# `optional: true` is the repo's idiom for this: wait up to the timeout, and fall THROUGH rather than
# fail when the element never comes — which is exactly the semantics a branch check needs.
- extendedWaitUntil:
    visible:
      id: "disambiguation-options"
    timeout: 30000
    optional: true

# ── Continue into whatever the turn produced ───────────────────────────────────────────────────
#
# ★ ORDER IS LOAD-BEARING, AT BOTH LEVELS — the FALLBACK block comes FIRST. See the long note above:
# Maestro re-evaluates each `when:` when the block is REACHED, so the primary block's tap can
# satisfy the fallback's guard and fire it too. The outer pair guards on
# `disambiguation-options` (which the inner tap collapses), so the same rule applies to it.
#
# The outer fallback is item #337's acceptance criterion 3: the curator resolving the title DIRECTLY
# is a legitimate answer, not a defect, and this flow must not fail on it. Both branches end at the
# same assertion — a rendered card with a real title — which is what T037 exists to prove.
- runFlow:
    when:
      notVisible:
        id: "disambiguation-options"
    commands:
      # Resolved directly: one candidate was confident enough to skip the offer. The
      # render-a-card path is still proven end-to-end; the non-first-candidate check (US4-AC2)
      # simply has no candidates to exercise on this run, and the web mirror carries it.
      - extendedWaitUntil:
          visible:
            id: "render-movie-card"
          timeout: 15000
- runFlow:
    when:
      visible:
        id: "disambiguation-options"
    commands:
      # The container alone is NOT proof — it renders even with zero buttons, so asserting only on
      # it let a broken pick masquerade as an "empty dock panel" (#539). Assert a real button
      # exists, mirroring the web spec's `disambig-option-0` check.
      - assertVisible:
          id: "disambig-option-0"
      - assertNotVisible:
          id: "approval-request"
      - runFlow:
          when:
            notVisible:
              id: "disambig-option-1"
          commands:
            - tapOn:
                id: "disambig-option-0"
      - runFlow:
          when:
            visible:
              id: "disambig-option-1"
          commands:
            - tapOn:
                id: "disambig-option-1"
      # The curator resolves the tapped pick — a second turn. Deliberately NOT `_await-turn.yaml`:
      # that helper asserts "an assistant reply exists", which is already true from turn 1, and
      # Maestro cannot count to two. The card is the affordance this second turn produces and the
      # end state both outer branches reach, so waiting for it directly is both correct and the
      # thing the test is actually about. A full turn budget, since a live turn is being awaited.
      - extendedWaitUntil:
          visible:
            id: "render-movie-card"
          timeout: 150000
      # The options collapse once resolved — proof the tap drove the resolution rather than the
      # card happening to appear.
      - assertNotVisible:
          id: "disambiguation-options"

# A card with a real title — not an empty shell. Which film it is depends on live TMDB ranking, so
# it is deliberately not asserted here (see the note above); the web mirror covers that.
- assertVisible:
    id: "render-movie-card-title"
- assertNotVisible:
    id: "approval-request"
