appId: com.grumpyrobot.mcmapp
---
# Admin settings area — mobile (feature 062; renamed from admin-card.yaml).
# An mc-admin opens Settings, sees the Admin entry in the sub-navigation, and taps through to the
# admin settings screen. Feature 040 US3 built the screen but wired no affordance; a Profile card
# was the follow-on, and feature 062 replaces that card with this sub-navigation entry.
#
# The direct-URL refusal half of US2-AC3 is N/A on mobile — Maestro drives the app UI and has no
# address bar, and there is no in-app affordance to a route the user cannot see. Web covers it; the
# guard is platform-agnostic React (ProtectedRoute → AuthGuard). See the Platform Parity Table.
#
# NOTE: this flow is invoked BY NAME from scripts/ci-mobile-agent-flows.sh — renaming the file
# without updating that script makes CI burn three emulator retries on a path that does not exist.
#
# Requires: Keycloak (with the seeded e2e-admin-user, roles mc-user + mc-admin) + BFF running.
# Run: scripts/maestro-run.sh tests/e2e/mobile/admin-settings-access.yaml
- launchApp:
    stopApp: false
    clearState: true
- runFlow: "_login-admin-helper.yaml"

# Open the Settings destination; it lands on the Profile area.
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "navigation-bar"
- tapOn:
    id: "nav-settings"
- extendedWaitUntil:
    visible:
      id: "settings-profile-screen"
    timeout: 10000

# Scroll the Admin entry into view, then tap by id (NOT bare text — feature 040 tapOn gotcha: bare
# text can match a node behind the floating dock overlay). The sub-navigation is horizontally
# scrollable, so five entries at phone width may put Admin off-screen.
- scrollUntilVisible:
    element:
      id: "settings-nav-admin"
    direction: RIGHT
    timeout: 10000
- tapOn:
    id: "settings-nav-admin"

# Landed on the admin settings screen — the plain-View testID is the reliable landing proof (the DS
# Switch toggle-self-registration does not reliably forward its testID, so we don't assert on it here).
- extendedWaitUntil:
    visible:
      id: "admin-settings-screen"
    timeout: 15000
