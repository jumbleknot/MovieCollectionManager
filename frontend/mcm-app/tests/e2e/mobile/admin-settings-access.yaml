appId: com.grumpyrobot.mcmapp
---
# Admin settings area — mobile (feature 062; renamed from admin-card.yaml).
# An mc-admin opens Settings, sees the Admin entry in the sub-navigation, and taps through to the
# admin settings screen. Feature 040 US3 built the screen but wired no affordance; a Profile card
# was the follow-on, and feature 062 replaces that card with this sub-navigation entry.
#
# The direct-URL refusal half of US2-AC3 is N/A on mobile — Maestro drives the app UI and has no
# address bar, and there is no in-app affordance to a route the user cannot see. Web covers it; the
# guard is platform-agnostic React (ProtectedRoute → AuthGuard). See the Platform Parity Table.
#
# NOTE: this flow is invoked BY NAME from scripts/ci-mobile-agent-flows.sh — renaming the file
# without updating that script makes CI burn three emulator retries on a path that does not exist.
#
# Requires: Keycloak (with the seeded e2e-admin-user, roles mc-user + mc-admin) + BFF running.
# Run: scripts/maestro-run.sh tests/e2e/mobile/admin-settings-access.yaml
- launchApp:
    stopApp: false
    clearState: true
- runFlow: "_login-admin-helper.yaml"

# Open the Settings destination; it lands on the Profile area.
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "navigation-bar"
- tapOn:
    id: "nav-settings"
- extendedWaitUntil:
    visible:
      id: "settings-profile-screen"
    timeout: 10000

# Bring the Admin entry into view, then tap by id (NOT bare text — feature 040 tapOn gotcha: bare
# text can match a node behind the floating dock overlay). The sub-navigation is horizontally
# scrollable, so four entries at phone width put Admin off-screen.
#
# SWIPE FROM `settings-nav`, NOT `scrollUntilVisible`. This was measured on the device, not guessed
# (CI run 2049, mobile-diagnostics). `scrollUntilVisible: direction: RIGHT` is implemented as
# `Maestro.swipeFromCenter: Swiping LEFT from center` — it swipes the middle of the SCREEN. On a
# 320x640 emulator the centre (~160,320) lands inside `settings-profile-screen`, the VERTICAL
# ScrollView at [0,121][320,640]; the sub-navigation is the 41px-tall HorizontalScrollView at
# [0,80][320,121] and never receives the gesture. It swiped seven times and scrolled nothing.
#
# The entry was rendered and enabled the whole time — the accessibility dump at the failure point
# reads `viewIdResName: settings-nav-admin … boundsInScreen: Rect(361, 80 - 320, 121) … visible:
# false`: laid out starting at x=361 on a 320px-wide screen, so it clips to nothing and Maestro
# reports "Element not found". That is an OFF-SCREEN element, not a missing or role-gated one — the
# same run's screenshot shows `Roles: mc-admin, mc-user`, so `isAdmin(user)` was true.
#
# `from:` targets the swipe at the tab row itself, so it is the HorizontalScrollView that scrolls,
# and it stays correct on any screen size (no hardcoded percentage of screen height).
- swipe:
    from:
      id: "settings-nav"
    direction: LEFT
# Assert it explicitly rather than relying on tapOn's implicit wait: a failure here says "the Admin
# entry never came into view", which is a different defect from "tapping it went nowhere".
- extendedWaitUntil:
    visible:
      id: "settings-nav-admin"
    timeout: 10000
- tapOn:
    id: "settings-nav-admin"

# Landed on the admin settings screen — the plain-View testID is the reliable landing proof (the DS
# Switch toggle-self-registration does not reliably forward its testID, so we don't assert on it here).
- extendedWaitUntil:
    visible:
      id: "admin-settings-screen"
    timeout: 15000
