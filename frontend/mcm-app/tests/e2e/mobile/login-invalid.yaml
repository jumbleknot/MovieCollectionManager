appId: com.grumpyrobot.mcmapp
---
# T-080: Invalid credentials → Keycloak shows its login form (not auto-logged in).
# Setup: Log in with valid credentials then perform a proper MCM logout. The BFF
# logout calls Keycloak's end_session endpoint, which invalidates the SSO session
# server-side. Chrome's SSO cookie becomes stale, so the next auth request shows
# the login form regardless of any cached cookie.
# Requires: Keycloak + BFF running, seeded test user.
# Run: scripts/maestro-run.sh tests/e2e/mobile/login-invalid.yaml
- launchApp:
    stopApp: false
    clearState: false
- runFlow: "_login-helper.yaml"

# Clear the Keycloak SSO session via MCM logout (BFF calls end_session endpoint)
- tapOn:
    id: "nav-settings"
- extendedWaitUntil:
    visible:
      id: "settings-profile-screen"
    timeout: 5000
- tapOn:
    id: "btn-logout"
- extendedWaitUntil:
    visible:
      id: "btn-logout-confirm"
    timeout: 5000
- tapOn:
    id: "btn-logout-confirm"
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 10000

# SSO session is now invalid — Keycloak will show the login form
- tapOn:
    id: "btn-login-with-keycloak"
- extendedWaitUntil:
    visible:
      text: "Username or email"
    timeout: 15000
- runFlow:
    when:
      visible:
        text: "Username or email"
    commands:
      - tapOn:
          text: "Username or email"
      - inputText: "invalid_user"
      # Chrome Custom Tab hides "Password" from the accessibility tree while
      # the username field is focused. Tap by coordinate (47% = y≈1125/2400).
      - tapOn:
          point: "50%,47%"
      - inputText: "wrongpassword"
      # Sign In button also hidden while password field is focused — press Enter.
      - pressKey: Enter
# THE FLOW'S OWN CLAIM: Keycloak REJECTED the credential. Asserted, not assumed — the error text
# is what separates "the bad login was submitted and refused" from "nothing was submitted".
- extendedWaitUntil:
    visible:
      text: "Invalid username or password\\."
    timeout: 15000
# Close the Custom Tab with Chrome's own Close-tab button (item #985). The flow used to press
# `back` twice, on the theory that Chrome's history held exactly the login page and the error
# page. Measured on app-ci run 7296: Keycloak autofocuses the username field on the error page,
# so the FIRST back only dismissed the keyboard and the SECOND went back one page in history —
# the final hierarchy was the PRE-submission form (username restored, no `input-error-username`)
# with the tab still open, so `login-screen` never returned. The button does not depend on how
# many entries the history holds or whether a keyboard is up.
- tapOn:
    id: "com.android.chrome:id/close_button"
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 15000
- assertVisible:
    id: "btn-login-with-keycloak"
