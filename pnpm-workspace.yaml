packages:
  - 'frontend/*'
  - 'packages/*'

# ═════════════════════════════════════════════════════════════════════════════════════════════════
# `allowBuilds` — which dependencies may run install scripts (postinstall = arbitrary code execution
# at install time, so this is a SUPPLY-CHAIN control, not a convenience toggle).
#
# pnpm 11 renamed `onlyBuiltDependencies` (an allow-LIST) to `allowBuilds` (an explicit map) and made
# an un-decided package a HARD ERROR — `ERR_PNPM_IGNORED_BUILDS`, install exits 1. Under pnpm 10 the
# same situation was a warning and the install succeeded, so CI's `pnpm install --frozen-lockfile`
# would have started failing on the bump alone. pnpm helpfully writes a placeholder block with
# "set this to true or false" for EVERY package it saw; blanket-`true` would silently grant install-
# time code execution to five packages that never had it.
#
# The values below reproduce the pre-bump posture exactly: `onlyBuiltDependencies: [nx,
# unrs-resolver]` allowed those two and implicitly denied the rest, so the rest are explicit `false`.
# Only flip one to `true` with a reason — a build script needs to run, and you accept it running.
allowBuilds:
  nx: true # was in onlyBuiltDependencies
  unrs-resolver: true # was in onlyBuiltDependencies
  '@scarf/scarf': false # analytics phone-home; never allowed
  detox: false # denied pre-bump (ignored build under pnpm 10)
  dtrace-provider: false # denied pre-bump
  esbuild: false # denied pre-bump; the prebuilt binary is used, no local compile needed
  msgpackr-extract: false # denied pre-bump
  # react-native-enriched-markdown@1.0.1 ADDED a postinstall that 0.6.0 did not have, which is why a
  # lockfile refresh turned this into a hard install failure rather than a silent skip. The script
  # (`node postinstall.mjs`) DOWNLOADS native assets at install time - tree-sitter grammar C sources
  # and a RaTeX XCFramework for iOS math - from registry.npmjs.org and github.com, and the manifest
  # that gates it IS shipped in the published tarball, so it really takes the download path.
  #
  # Denied, which is the pre-bump posture: it arrives only as a transitive peer of
  # react-native-streamdown, nothing in our source renders enriched markdown, and an install-time
  # fetch of native binaries is what the deny-by-default list above exists to stop - it would also
  # have to succeed from the egress-restricted dev container on every install.
  #
  # Flip to true only if the app starts rendering enriched markdown needing code highlighting or
  # math on NATIVE, and say so here. The package also honours a consumer opt-out (an
  # enriched-markdown block in package.json), which is the lighter lever if it is ever wanted
  # without its downloads.
  react-native-enriched-markdown: false

# Excludes from PNPM 11's OWN release-age policy — the one it applies when it verifies the lockfile
# against supply-chain policies on install. Item #271: this list existing is the proof that policy is
# live, and it was the only signal that contradicted the (now corrected) comment further down claiming
# release age is enforced by Renovate alone. Entries here are SECURITY-FLOOR exceptions: a fix landed
# inside the cooldown and the gate needs it now. Do NOT add a package merely because a fresh
# transitive is blocking a branch — that spends a security mechanism on impatience; wait the ~24h out.
minimumReleaseAgeExclude:
  - brace-expansion@5.0.9
  - fast-uri@3.1.5 # was 3.1.4 — raised 2026-08-13 with the override floor (feature 057)
  - ip-address@10.5.0 # resolved floor for GHSA-mwp4-54f8-5fhr; published 2026-08-10, inside the cooldown
  - nanoid@3.3.18
  - postcss@8.5.23
  - shell-quote@1.10.0

# ═════════════════════════════════════════════════════════════════════════════════════════════════
# `overrides` live HERE too, not in package.json's `pnpm` field.
#
# pnpm 11 STOPPED READING that field — it warns "The 'pnpm' field in package.json is no longer read
# by pnpm. The following keys were ignored: pnpm.onlyBuiltDependencies, pnpm.overrides" and carries
# on. That warning is a SECURITY event, not cosmetics: every override below exists to force a
# vulnerable transitive dependency to a patched version (each was added to clear a specific blocking
# SAST/SCA finding). Silently ignoring them re-admits all of them at once and turns the sast gate red
# — or worse, ships the vulnerable versions if the gate's own view happened to differ. Verified on the
# pnpm 10.33.0 → 11.x bump: leaving the settings in package.json dropped every override.
#
# So if a future pnpm bump warns about ignored keys, MIGRATE them — never dismiss the warning.
# ═════════════════════════════════════════════════════════════════════════════════════════════════

overrides:
  react-dom: 19.2.3
  postcss: '>=8.5.18'
  '@expo/dom-webview': ^56.0.5
  form-data@<4.0.6: '>=4.0.6'
  hono@<4.12.25: '>=4.12.25'
  undici@<6.27.0: '>=6.27.0 <7'
  brace-expansion@<5.0.9: '>=5.0.9'
  js-yaml@>=3.0.0 <3.15.1: '>=3.15.1 <4'
  js-yaml@>=4.0.0 <4.3.1: '>=4.3.1 <5'
  shell-quote@<1.9.0: '>=1.9.0'
  axios@>=1.15.2 <1.18.0: '>=1.18.0 <2'
  # RAISED 2026-08-13 (feature 057) from `fast-uri@<3.1.4: '>=3.1.4 <4'`. GHSA-7p8r-x3mc-p8w7
  # BYPASSES the previous fix, so 3.1.4 is itself vulnerable and the old floor no longer held.
  # BOTH HALVES MOVE TOGETHER — the key names the vulnerable span, the value the patched floor, and
  # raising one without the other yields an override that reads as remediated while no longer
  # excluding the version its own key names. check-override-consistency.mjs enforces that now.
  fast-uri@<3.1.5: '>=3.1.5 <4'
  # ADDED 2026-08-13 (feature 057) for GHSA-mwp4-54f8-5fhr (fix >=10.3.1). This floor also clears the
  # two Medium advisories on the same package (GHSA-4xrf-jv44-h6hh >=10.2.2, GHSA-22jq-vg5j-6vgg
  # >=10.2.1). Replaces a time-boxed acceptance that was 18 days from blocking every branch.
  ip-address@<10.3.1: '>=10.3.1 <11'
  nanoid@>=3.0.0 <3.3.18: '>=3.3.18 <4'

# NOTE (feature 034): a pnpm-level `minimumReleaseAge` cooldown was tried here but BREAKS cold
# `pnpm install --frozen-lockfile` in the BFF/agent Docker builds and CI — on an empty store pnpm
# fetches registry metadata and REJECTS any pinned dependency published younger than the threshold
# (frozen installs cannot re-resolve to an older version, so the build fails). Do not re-add
# minimumReleaseAge/blockExoticSubdeps/trustPolicy here — the `pnpm-*` supply-chain findings stay as
# accepted non-blocking Medium warnings.
#
# CORRECTED 2026-08-28 (item #271). The clause that stood here — "the release-age cooldown is
# therefore owned SOLELY by Renovate, which gates PROPOSALS without touching installs" — was FALSE in
# both halves, and it is the kind of false that costs a triage rather than a nit: it tells a reader
# that an install can never fail on release age, so when one does the error looks impossible.
#
# 1. IT IS NOT OWNED SOLELY BY RENOVATE. We set no cooldown, but pnpm 11 verifies the lockfile against
#    supply-chain policies on install and applies a release-age policy of its own. That is a
#    VERIFY-time check, not the RESOLVE-time rejection this note describes above, which is why
#    removing our setting did not remove it and why the two statements do not actually conflict.
#    `minimumReleaseAgeExclude` at the top of this file is the standing proof it is live.
#
# 2. GATING PROPOSALS IS NOT THE SAME AS GATING WHAT LANDS. renovate.json's catch-all
#    `minimumReleaseAge: 3 days` covers the package Renovate PROPOSES. It does nothing about the
#    TRANSITIVES a lockfile regeneration drags in. MEASURED on PR #263: Renovate proposed
#    `@ag-ui/client 0.0.58 -> 0.0.59`, fully policy-compliant; regenerating the lockfile resolved
#    `zod@4.5.1`, published 1.7 hours earlier, and SIX required contexts went red at `pnpm install` —
#    affected, mc-service-checks, naming, okf, agent-gates, sast. None of them was about the change.
#
# The handling is to WAIT: the offending transitive ages past the ~24h cutoff and a re-run passes.
# DECIDED 2026-08-28 (item #271) — this is ACCEPTED rather than mitigated: it is infrequent, it fails
# loudly and safely (a red gate, never a silent bad merge), and the triage is written down. Do not
# "fix" it by adding the transitive to minimumReleaseAgeExclude above; re-run after the cutoff.
# docs/runbooks/renovate.md carries the triage and the mitigations that were rejected.
