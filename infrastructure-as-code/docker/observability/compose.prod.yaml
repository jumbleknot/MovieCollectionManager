# Production Control-Tower observability stack (prod-observability) — feature 025 (US2).
# Promotes the dev `--profile observability` stack (observability/compose.yaml) to prod as a Komodo
# ResourceSync stack. Upstream images only — no CI build/scan/digest (like prod-auth). Differences
# from the dev compose.yaml are flagged #PROD.
#
# Components: LangFuse v3 (LLM traces) + otel-lgtm (infra telemetry) + OPA (policy) + Unleash (flags),
# all on the shared backend-network the gateway/BFF already reach.
#
# Networking (R10): internal-only, with ONE carve-out — the two operator UIs (LangFuse web + Grafana)
# are published for tailnet access. They bind to 0.0.0.0 (plain HOST:CONTAINER), NOT the tailnet IP:
# the rootless daemon starts before tailscaled at boot, so a `${TS_ADMIN_IP}:host:container` bind
# silently fails (rootlesskit never learns the tailnet IP → empty Ports, nothing listening). Tailnet-only
# exposure is preserved by the host ufw default-deny on all non-tailnet inbound. These are the ONLY
# published ports in the whole feature; every other service is unpublished. (feature 028)
#
# Secrets: every credential is fail-fast ${VAR:?}; real values are masked Komodo Variables written to
# the gitignored .env.prod. No inline literal, no ${VAR:-literal} default. TAILNET_HOST is an existing
# prod-auth Variable (topology, not a secret) reused below. TS_ADMIN_IP is no longer used for the binds
# (feature 028), and komodo/stacks.toml stopped passing it on 2026-10-13 (item #727).
#
# Note on vendor image tags: the pinned-in-plan images carry explicit tags; the vendor-bundle tools
# (otel-lgtm, opa, unleash) mirror the dev-proven tags — digest-pin them on the host once
# validated. opa uses the `-debug` variant so its busybox shell can run the /health wget healthcheck.
name: prod-observability
services:
  # ── LangFuse v3 ───────────────────────────────────────────────────────────────────────────
  langfuse-web:
    image: langfuse/langfuse:4.56.0@sha256:b1948c7c0931f277975b985e30e73536b1bca5822705ddd9a89ba7c1ed79b3ee
    container_name: langfuse-web
    restart: always
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-rustfs:
        condition: service_healthy
    ports:
      # #PROD tailnet-only operator UI (R10) — bound to 0.0.0.0 (not the tailnet IP, which fails the
      # rootless-before-tailscaled boot race); tailnet-only via host ufw default-deny. (feature 028)
      # Host port in the PROD-RESERVED range 19000–19099 (feature 029) so it can't collide with a CI/dev
      # LangFuse on the shared host (old 3030 overlapped CI). Guarded by check-prod-ci-port-collision.mjs.
      - "19030:3000"
    environment: &langfuse-env
      DATABASE_URL: "postgresql://langfuse:${LANGFUSE_PG_PASSWORD:?set in .env.prod}@langfuse-postgres:5432/langfuse"
      SALT: "${LANGFUSE_SALT:?set in .env.prod}"
      ENCRYPTION_KEY: "${LANGFUSE_ENCRYPTION_KEY:?set in .env.prod}"
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD:?set in .env.prod}"
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: "${LANGFUSE_REDIS_PASSWORD:?set in .env.prod}"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-rustfs:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "${LANGFUSE_RUSTFS_SECRET_KEY:?set in .env.prod}"
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-rustfs:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: "${LANGFUSE_RUSTFS_SECRET_KEY:?set in .env.prod}"
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      # #PROD login/callback over the tailnet host, not localhost (operator reaches it via the tailnet).
      NEXTAUTH_URL: "http://${TAILNET_HOST:?set in .env.prod (existing prod-auth Komodo Variable)}:19030"
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET:?set in .env.prod}"
      # Deterministic bootstrap — known org/project + API keys for the gateway consumer (same values).
      LANGFUSE_INIT_ORG_ID: mcm
      LANGFUSE_INIT_ORG_NAME: MCM
      LANGFUSE_INIT_PROJECT_ID: movie-assistant
      LANGFUSE_INIT_PROJECT_NAME: movie-assistant
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?set in .env.prod}"
      LANGFUSE_INIT_PROJECT_SECRET_KEY: "${LANGFUSE_INIT_PROJECT_SECRET_KEY:?set in .env.prod}"
      LANGFUSE_INIT_USER_EMAIL: dev@example.com
      LANGFUSE_INIT_USER_NAME: MCM Admin
      LANGFUSE_INIT_USER_PASSWORD: "${LANGFUSE_INIT_USER_PASSWORD:?set in .env.prod}"
    networks:
      - backend-network
    logging: &obs-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  langfuse-worker:
    image: langfuse/langfuse-worker:4.56.0@sha256:3f7571ff3a725ebdcdf4c35e06bdf8c3f8325770691c673793ad61b328265e13
    container_name: langfuse-worker
    restart: always
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-rustfs:
        condition: service_healthy
      langfuse-rustfs-init:
        condition: service_healthy   # #PROD healthy = bucket created (ready-marker); init now stays alive
    environment: *langfuse-env
    networks:
      - backend-network
    logging: *obs-logging

  langfuse-postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: langfuse-postgres
    restart: always
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: "${LANGFUSE_PG_PASSWORD:?set in .env.prod}"
      POSTGRES_DB: langfuse
    volumes:
      # postgres 18 moved PGDATA to /var/lib/postgresql/18/docker → mount the PARENT. A mount at the pre-18
      # /data path makes the 18 entrypoint exit 1, even on an EMPTY volume (measured, spec 081 US8b).
      - langfuse-pg-data:/var/lib/postgresql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *obs-logging

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:26.6@sha256:2c870d77ea76e955fb1c8dad536ad40a1236b6093db0c4966e22d21d4428982b
    container_name: langfuse-clickhouse
    restart: always
    # #PROD hard memory cap (R5) — ClickHouse is the biggest RAM consumer; 24.3 is cgroup-aware, so a
    # container mem_limit bounds its internal max_server_memory_usage (default 0.9 ratio of the limit).
    mem_limit: 4g
    # No swap beyond the cap (Docker's default memswap is 2x mem_limit), and a CPU ceiling: prod
    # observability shares the physical host with CI, and on 2026-10-02 this container at ~725% CPU
    # with swap full slowed every CI job 2-3x. Observability may run slow; it may not starve the host.
    memswap_limit: 4g
    cpus: 2
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD:?set in .env.prod}"
    user: "101:101"
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
      # Bounds ClickHouse's OWN diagnostic tables (trace_log/text_log off, 3-day TTL on the rest) —
      # unbounded, they reached 160 GiB in prod and starved the shared host (ops hotfix 2026-10-03).
      - ../../clickhouse/config.d/mcm-system-logs.xml:/etc/clickhouse-server/config.d/mcm-system-logs.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *obs-logging

  langfuse-redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    container_name: langfuse-redis
    restart: always
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD:?set in .env.prod}"]
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_PASSWORD:?set in .env.prod}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *obs-logging

  # Langfuse's event/media object store: RustFS (feature 080), pulled upstream by digest — it
  # replaced the from-source build of features 069/070 when that upstream stopped releasing (item
  # #560). No `user:` key: the image runs as its own uid 10001 (contracts/object-store-service.md
  # S2), and a fresh volume inherits /data owned by it — any other uid fails at startup.
  langfuse-rustfs:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    container_name: langfuse-rustfs
    restart: always
    environment:
      RUSTFS_ACCESS_KEY: langfuse
      RUSTFS_SECRET_KEY: "${LANGFUSE_RUSTFS_SECRET_KEY:?set in .env.prod}"
      # stdout, not the image's default log FILE that `docker logs` never sees.
      RUSTFS_OBS_LOG_DIRECTORY: ""
      # Console defaults to ON with CORS `*`; nothing uses it, and `false` closes :9001.
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - langfuse-rustfs-data:/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *obs-logging

  # Create the `langfuse` bucket (LangFuse v3 does NOT auto-create it), then STAY ALIVE idling so Komodo's
  # stack-health doesn't count an exited container as unhealthy (same as agent-audit-init in prod-audit).
  # #PROD it touches a ready-marker AFTER the bucket exists and its healthcheck gates on that marker, so
  # langfuse-worker can depend on `service_healthy` (below) instead of `service_completed_successfully`
  # (which a never-exiting container would never satisfy). Same pinned image (it ships curl and sleep);
  # PUT of an existing bucket answers 200. The secret is referenced as `$$S3_SECRET_KEY` from the
  # container's environment and fed to curl on stdin — never interpolated into argv.
  langfuse-rustfs-init:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    container_name: langfuse-rustfs-init
    restart: always
    depends_on:
      langfuse-rustfs:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: langfuse
      S3_SECRET_KEY: "${LANGFUSE_RUSTFS_SECRET_KEY:?set in .env.prod}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        printf 'user = "%s:%s"\n' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" \
          | curl -fsS -K - --aws-sigv4 "aws:amz:us-east-1:s3" -o /dev/null -X PUT http://langfuse-rustfs:9000/langfuse
        touch /tmp/ready
        echo 'langfuse bucket ready'
        exec sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend-network
    logging: *obs-logging

  # ── OpenTelemetry backend (Tempo + Prometheus + Loki + Grafana, single container) ──────────
  otel-lgtm:
    image: grafana/otel-lgtm:0.37.0@sha256:57b5ab1ca6619beb180174e2fccce04762470750669d043f544b4726d0582d07
    container_name: otel-lgtm
    restart: always
    ports:
      # #PROD tailnet-only Grafana UI (R10) — bound to 0.0.0.0 (not the tailnet IP, which fails the
      # rootless-before-tailscaled boot race); tailnet-only via host ufw default-deny. The OTLP
      # :4317/:4318 ports stay UNpublished — the gateway reaches them by internal DNS (otel-lgtm:4318).
      # Grafana is the only exposed port here. (feature 028) Host port in the PROD-RESERVED range
      # 19000–19099 (feature 029) so it can't collide with a CI/dev Grafana on the shared host (old 3002
      # overlapped CI). Guarded by check-prod-ci-port-collision.mjs.
      - "19002:3000"
    volumes:
      - otel-lgtm-data:/data
    networks:
      - backend-network
    healthcheck:
      # #PROD otel-lgtm is ubuntu-based (has bash but /bin/sh is dash → invoke bash for /dev/tcp).
      # A TCP open on Grafana :3000 is the readiness signal.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/3000' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *obs-logging

  # ── Open Policy Agent — agent authorization decisions (token-exchange + UI-action) ──────────
  opa-service:
    # #PROD `-debug` variant: distroless `opa` has no shell; -debug adds busybox so the /health
    # healthcheck (and Komodo status) works. Policies already `import rego.v1` (OPA 1.x compatible).
    image: openpolicyagent/opa:1.21.3-debug@sha256:9ddaf23fbe4c8bf72b4c05ffc833cd4a68aebf33a86883b4a1f510df1f1d878f
    container_name: opa-service
    restart: always
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "--watch"
      - "/policies"
    volumes:
      - ../../opa/policies:/policies:ro
    networks:
      - backend-network
    healthcheck:
      # The -debug image's busybox has NO wget (nor curl/nc), so the previous `wget …` check failed every
      # run — "unhealthy" since ~2026-09-10 (FailingStreak 130247 on 2026-10-03) while OPA itself served
      # fine. The opa binary makes the request itself via http.send; exec form, so no shell is needed.
      # Measured on this digest: healthy when serving, exit 1 when nothing listens on 8181.
      test: ["CMD", "/opa", "eval", "--fail", "--format=raw", "http.send({\"method\": \"get\", \"url\": \"http://localhost:8181/health\", \"timeout\": \"3s\"}).status_code == 200"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *obs-logging

  # ── Unleash — agent feature flags / kill-switch ─────────────────────────────────────────────
  unleash-service:
    image: unleashorg/unleash-server:8.2.0@sha256:5020013b7a9a93c8ed3686d36b5025399714020b3fb5ef41afd84ba37a88c050
    container_name: unleash-service
    restart: always
    depends_on:
      unleash-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://unleash:${UNLEASH_PG_PASSWORD:?set in .env.prod}@unleash-postgres:5432/unleash"
      DATABASE_SSL: "false"
      INIT_ADMIN_API_TOKENS: "${UNLEASH_ADMIN_TOKEN:?set in .env.prod}"
      INIT_CLIENT_API_TOKENS: "${UNLEASH_CLIENT_TOKEN:?set in .env.prod}"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4242/health"]
      interval: 10s
      timeout: 5s
      retries: 15
    logging: *obs-logging

  unleash-postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: unleash-postgres
    restart: always
    environment:
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: "${UNLEASH_PG_PASSWORD:?set in .env.prod}"
      POSTGRES_DB: unleash
    volumes:
      # postgres 18 moved PGDATA to /var/lib/postgresql/18/docker → mount the PARENT. A mount at the pre-18
      # /data path makes the 18 entrypoint exit 1, even on an EMPTY volume (measured, spec 081 US8b).
      - unleash-pg-data:/var/lib/postgresql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash -d unleash"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *obs-logging

  # Seed 3 default-off flags, then STAY ALIVE idling (nothing depends on it) so Komodo's stack-health
  # doesn't count an exited container as unhealthy (same pattern as langfuse-rustfs-init / agent-audit-init).
  unleash-seed:
    image: curlimages/curl:8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
    container_name: unleash-seed
    restart: always
    depends_on:
      unleash-service:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        for f in mcm.agent.kill-switch mcm.agent.frontier-escalation mcm.agent.degrade; do
          curl -s -X POST http://unleash-service:4242/api/admin/projects/default/features \
            -H "Authorization: ${UNLEASH_ADMIN_TOKEN:?set in .env.prod}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$$f\",\"type\":\"kill-switch\"}" || true
        done
        echo "unleash flags seeded (default-off)"
        exec sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - backend-network
    logging: *obs-logging

volumes:
  # Spec 081 US8b — the two postgres-18 volumes are NEW external volumes (`-v18-data`); the operator
  # creates them and restores the Unleash dump into its one BEFORE the merge that deploys this file
  # (docs/runbooks/prod-control-tower.md). The pre-18 `-postgres-data` volumes are left untouched as the
  # rollback. A missing external volume fails the deploy before any container is recreated.
  langfuse-pg-data:
    external: true
    name: observability-langfuse-postgres-v18-data
  langfuse-clickhouse-data:
    external: true
    name: observability-langfuse-clickhouse-data
  langfuse-clickhouse-logs:
    external: true
    name: observability-langfuse-clickhouse-logs
  langfuse-rustfs-data:
    external: true
    name: observability-langfuse-rustfs-data
  otel-lgtm-data:
    external: true
    name: observability-otel-lgtm-data
  unleash-pg-data:
    external: true
    name: observability-unleash-postgres-v18-data

networks:
  backend-network:
    external: true
