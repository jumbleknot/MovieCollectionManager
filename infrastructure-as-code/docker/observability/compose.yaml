name: observability

# Control-Tower observability stack for the AI Agents layer (feature 012, T030/T030a/T030b/SC-008).
# OPT-IN — everything here is gated behind `--profile observability`; nothing starts on the
# default `docker compose up`, so the normal app/agent stack is unaffected (SC-005 additive).
#
#   docker compose --profile observability up -d
#
# Components (constitution §AI Agent Technology Stack):
#   - LangFuse v3 (LLM traces / per-turn cost / latency)  → web :3030, worker, + postgres /
#     clickhouse / redis / minio (v3 ingestion pipeline). Bootstrapped with deterministic
#     LANGFUSE_INIT_* keys so the gateway + the SC-008 verify test authenticate with no UI setup.
#   - grafana/otel-lgtm (OpenTelemetry → Tempo traces + Prometheus metrics + Loki logs + Grafana)
#     → OTLP gRPC :4317 / HTTP :4318, Grafana UI :3001.
#   - HashiCorp Vault (dev mode) → :8200 (runtime LLM/MCP secret injection, T030a).
#
# Dev-only credentials are inlined below (matching agent-db's POSTGRES_PASSWORD=***REMOVED*** pattern);
# these are NOT production secrets. Volumes are plain named (mcm_*-prefixed, transient) so no
# `docker volume create` is needed for this opt-in dev stack.

services:
  # ── LangFuse v3 ───────────────────────────────────────────────────────────────────────────
  langfuse-web:
    image: langfuse/langfuse:3@sha256:a27fe525f52984fa6d36fd34e8b8c6e5ae4af43f34134cafc833b467fa9580ae
    container_name: langfuse-web
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:3030:3000"
    environment: &langfuse-env
      DATABASE_URL: "postgresql://langfuse:${LANGFUSE_PG_PASSWORD:?set in stacks/observability.env}@langfuse-postgres:5432/langfuse"
      SALT: "${LANGFUSE_SALT:?set in stacks/observability.env (run: node scripts/gen-dev-secrets.mjs)}"
      ENCRYPTION_KEY: "${LANGFUSE_ENCRYPTION_KEY:?set in stacks/observability.env (run: node scripts/gen-dev-secrets.mjs)}"
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD:?set in stacks/observability.env}"
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: "${LANGFUSE_REDIS_PASSWORD:?set in stacks/observability.env}"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "${LANGFUSE_MINIO_ROOT_PASSWORD:?set in stacks/observability.env}"
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: "${LANGFUSE_MINIO_ROOT_PASSWORD:?set in stacks/observability.env}"
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      NEXTAUTH_URL: http://localhost:3030
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET:?set in stacks/observability.env (run: node scripts/gen-dev-secrets.mjs)}"
      # Deterministic bootstrap — known org/project + API keys for the gateway + verify test.
      LANGFUSE_INIT_ORG_ID: mcm
      LANGFUSE_INIT_ORG_NAME: MCM
      LANGFUSE_INIT_PROJECT_ID: movie-assistant
      LANGFUSE_INIT_PROJECT_NAME: movie-assistant
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?set in stacks/observability.env}"
      LANGFUSE_INIT_PROJECT_SECRET_KEY: "${LANGFUSE_INIT_PROJECT_SECRET_KEY:?set in stacks/observability.env}"
      LANGFUSE_INIT_USER_EMAIL: dev@example.com
      LANGFUSE_INIT_USER_NAME: MCM Dev
      LANGFUSE_INIT_USER_PASSWORD: "${LANGFUSE_INIT_USER_PASSWORD:?set in stacks/observability.env}"
    networks:
      - backend-network
    logging: &obs-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  langfuse-worker:
    image: langfuse/langfuse-worker:3@sha256:93207bd67d2e789ea55fa3d47eeba065dd6b1869187127ab24201784c52b96bc
    container_name: langfuse-worker
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
    environment: *langfuse-env
    networks:
      - backend-network
    logging: *obs-logging

  langfuse-postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: langfuse-postgres
    profiles: [observability]
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: "${LANGFUSE_PG_PASSWORD:?set in stacks/observability.env}"
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-pg-data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *obs-logging

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: langfuse-clickhouse
    profiles: [observability]
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD:?set in stacks/observability.env}"
    user: "101:101"
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *obs-logging

  langfuse-redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: langfuse-redis
    profiles: [observability]
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD:?set in stacks/observability.env}"]
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_PASSWORD:?set in stacks/observability.env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *obs-logging

  langfuse-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: langfuse-minio
    profiles: [observability]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: "${LANGFUSE_MINIO_ROOT_PASSWORD:?set in stacks/observability.env}"
    volumes:
      - langfuse-minio-data:/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *obs-logging

  # One-shot: create the `langfuse` bucket (LangFuse v3 does NOT auto-create it; without it
  # ingestion fails with "Failed to upload JSON to S3"). langfuse-web/worker wait for this.
  langfuse-minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: langfuse-minio-init
    profiles: [observability]
    depends_on:
      langfuse-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://langfuse-minio:9000 minio ${LANGFUSE_MINIO_ROOT_PASSWORD:?set in stacks/observability.env} &&
      mc mb --ignore-existing local/langfuse &&
      echo 'langfuse bucket ready'"
    networks:
      - backend-network
    logging: *obs-logging

  # ── OpenTelemetry backend (Tempo + Prometheus + Loki + Grafana, single container) ──────────
  otel-lgtm:
    image: grafana/otel-lgtm:0.32.0@sha256:d6b20e35890ef2f91d13944805939acdaf1e5d3ffbf9f9aed08586312826c815
    container_name: otel-lgtm
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"   # Grafana UI
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    volumes:
      - otel-lgtm-data:/data
    networks:
      - backend-network
    logging: *obs-logging

  # NOTE (feature 020): HashiCorp Vault relocated to the `auth` stack
  # (infrastructure-as-code/docker/vault/compose.yaml, `vault` profile). Vault is a
  # secrets/identity concern, not observability.

  # ── Open Policy Agent — agent authorization decisions (token-exchange + UI-action, R16) ──────
  opa-service:
    image: openpolicyagent/opa:1.20.1@sha256:39daf255ae7f25d81103f03a0c18308a50b7b5bb67907bed6166f70e24a970ff
    container_name: opa-service
    profiles: [observability]
    restart: unless-stopped
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "--watch"
      - "/policies"
    volumes:
      - ../../opa/policies:/policies:ro
    ports:
      - "127.0.0.1:8181:8181"
    networks:
      - backend-network
    logging: *obs-logging

  # ── Unleash — agent feature flags / kill-switch (config-gated layer, R16) ───────────────────
  unleash-service:
    image: unleashorg/unleash-server:8.1.0@sha256:16f3ffb914880e7d0f23629a0c1b77aebea3aa619b0305f76eb50b3fb75998a9
    container_name: unleash-service
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      unleash-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://unleash:${UNLEASH_PG_PASSWORD:?set in stacks/observability.env}@unleash-postgres:5432/unleash"
      DATABASE_SSL: "false"
      INIT_ADMIN_API_TOKENS: "${UNLEASH_ADMIN_TOKEN:?set in stacks/observability.env}"
      INIT_CLIENT_API_TOKENS: "${UNLEASH_CLIENT_TOKEN:?set in stacks/observability.env}"
    ports:
      - "127.0.0.1:4242:4242"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4242/health"]
      interval: 10s
      timeout: 5s
      retries: 15
    logging: *obs-logging

  unleash-postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: unleash-postgres
    profiles: [observability]
    restart: unless-stopped
    environment:
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: "${UNLEASH_PG_PASSWORD:?set in stacks/observability.env}"
      POSTGRES_DB: unleash
    volumes:
      - unleash-pg-data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash -d unleash"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *obs-logging

  unleash-seed:
    image: curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
    container_name: unleash-seed
    profiles: [observability]
    depends_on:
      unleash-service:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        for f in mcm.agent.kill-switch mcm.agent.frontier-escalation mcm.agent.degrade; do
          curl -s -X POST http://unleash-service:4242/api/admin/projects/default/features \
            -H "Authorization: ${UNLEASH_ADMIN_TOKEN:?set in stacks/observability.env}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$$f\",\"type\":\"kill-switch\"}" || true
        done
        echo "unleash flags seeded (default-off)"
    networks:
      - backend-network
    logging: *obs-logging

volumes:
  langfuse-pg-data:
    name: observability-langfuse-postgres-data
  langfuse-clickhouse-data:
    name: observability-langfuse-clickhouse-data
  langfuse-clickhouse-logs:
    name: observability-langfuse-clickhouse-logs
  langfuse-minio-data:
    name: observability-langfuse-minio-data
  otel-lgtm-data:
    name: observability-otel-lgtm-data
  unleash-pg-data:
    name: observability-unleash-postgres-data

networks:
  backend-network:
    external: true
