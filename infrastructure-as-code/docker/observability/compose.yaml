name: observability

# Control-Tower observability stack for the AI Agents layer (feature 012, T030/T030a/T030b/SC-008).
# OPT-IN — everything here is gated behind `--profile observability`; nothing starts on the
# default `docker compose up`, so the normal app/agent stack is unaffected (SC-005 additive).
#
#   docker compose --profile observability up -d
#
# Components (constitution §AI Agent Technology Stack):
#   - LangFuse v3 (LLM traces / per-turn cost / latency)  → web :3030, worker, + postgres /
#     clickhouse / redis / rustfs (v3 ingestion pipeline). Bootstrapped with deterministic
#     LANGFUSE_INIT_* keys so the gateway + the SC-008 verify test authenticate with no UI setup.
#   - grafana/otel-lgtm (OpenTelemetry → Tempo traces + Prometheus metrics + Loki logs + Grafana)
#     → OTLP gRPC :4317 / HTTP :4318, Grafana UI :3001.
#   - HashiCorp Vault (dev mode) → :8200 (runtime LLM/MCP secret injection, T030a).
#
# Dev-only credentials are inlined below (matching agent-db's POSTGRES_PASSWORD=***REMOVED*** pattern);
# these are NOT production secrets. Volumes are plain named (mcm_*-prefixed, transient) so no
# `docker volume create` is needed for this opt-in dev stack.

services:
  # ── LangFuse v3 ───────────────────────────────────────────────────────────────────────────
  langfuse-web:
    image: langfuse/langfuse:4.56.0@sha256:b1948c7c0931f277975b985e30e73536b1bca5822705ddd9a89ba7c1ed79b3ee
    container_name: langfuse-web
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-rustfs:
        condition: service_healthy
    ports:
      - "127.0.0.1:3030:3000"
    environment: &langfuse-env
      DATABASE_URL: "postgresql://langfuse:${LANGFUSE_PG_PASSWORD:?set in stacks/observability.env}@langfuse-postgres:5432/langfuse"
      SALT: "${LANGFUSE_SALT:?set in stacks/observability.env (run: node scripts/gen-dev-secrets.mjs)}"
      ENCRYPTION_KEY: "${LANGFUSE_ENCRYPTION_KEY:?set in stacks/observability.env (run: node scripts/gen-dev-secrets.mjs)}"
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD:?set in stacks/observability.env}"
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: "${LANGFUSE_REDIS_PASSWORD:?set in stacks/observability.env}"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-rustfs:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "${LANGFUSE_RUSTFS_SECRET_KEY:?set in stacks/observability.env}"
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-rustfs:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: "${LANGFUSE_RUSTFS_SECRET_KEY:?set in stacks/observability.env}"
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      NEXTAUTH_URL: http://localhost:3030
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET:?set in stacks/observability.env (run: node scripts/gen-dev-secrets.mjs)}"
      # Deterministic bootstrap — known org/project + API keys for the gateway + verify test.
      LANGFUSE_INIT_ORG_ID: mcm
      LANGFUSE_INIT_ORG_NAME: MCM
      LANGFUSE_INIT_PROJECT_ID: movie-assistant
      LANGFUSE_INIT_PROJECT_NAME: movie-assistant
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?set in stacks/observability.env}"
      LANGFUSE_INIT_PROJECT_SECRET_KEY: "${LANGFUSE_INIT_PROJECT_SECRET_KEY:?set in stacks/observability.env}"
      LANGFUSE_INIT_USER_EMAIL: dev@example.com
      LANGFUSE_INIT_USER_NAME: MCM Dev
      LANGFUSE_INIT_USER_PASSWORD: "${LANGFUSE_INIT_USER_PASSWORD:?set in stacks/observability.env}"
    networks:
      - backend-network
    logging: &obs-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  langfuse-worker:
    image: langfuse/langfuse-worker:4.56.0@sha256:3f7571ff3a725ebdcdf4c35e06bdf8c3f8325770691c673793ad61b328265e13
    container_name: langfuse-worker
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-rustfs:
        condition: service_healthy
      langfuse-rustfs-init:
        condition: service_completed_successfully
    environment: *langfuse-env
    networks:
      - backend-network
    logging: *obs-logging

  langfuse-postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: langfuse-postgres
    profiles: [observability]
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: "${LANGFUSE_PG_PASSWORD:?set in stacks/observability.env}"
      POSTGRES_DB: langfuse
    volumes:
      # postgres 18 moved PGDATA to /var/lib/postgresql/18/docker → mount the PARENT. A mount at the pre-18
      # /data path makes the 18 entrypoint exit 1, even on an EMPTY volume (measured, spec 081 US8b).
      - langfuse-pg-data:/var/lib/postgresql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *obs-logging

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:26.6@sha256:2c870d77ea76e955fb1c8dad536ad40a1236b6093db0c4966e22d21d4428982b
    container_name: langfuse-clickhouse
    profiles: [observability]
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD:?set in stacks/observability.env}"
    user: "101:101"
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
      # Bounds ClickHouse's OWN diagnostic tables (trace_log/text_log off, 3-day TTL on the rest) —
      # unbounded, they reached 160 GiB in prod and starved the shared host (ops hotfix 2026-10-03).
      - ../../clickhouse/config.d/mcm-system-logs.xml:/etc/clickhouse-server/config.d/mcm-system-logs.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *obs-logging

  langfuse-redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    container_name: langfuse-redis
    profiles: [observability]
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD:?set in stacks/observability.env}"]
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_PASSWORD:?set in stacks/observability.env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *obs-logging

  # Langfuse's event/media object store: RustFS (feature 080), pulled upstream by digest — it
  # replaced the from-source build of features 069/070 when that upstream stopped releasing (item
  # #560). No `user:` key: the image runs as its own uid 10001 (contracts/object-store-service.md
  # S2), and a fresh volume inherits /data owned by it — any other uid fails at startup.
  langfuse-rustfs:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    container_name: langfuse-rustfs
    profiles: [observability]
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: langfuse
      RUSTFS_SECRET_KEY: "${LANGFUSE_RUSTFS_SECRET_KEY:?set in stacks/observability.env}"
      # stdout, not the image's default log FILE that `docker logs` never sees.
      RUSTFS_OBS_LOG_DIRECTORY: ""
      # Console defaults to ON with CORS `*`; nothing uses it, and `false` closes :9001.
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - langfuse-rustfs-data:/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *obs-logging

  # One-shot: create the `langfuse` bucket (LangFuse v3 does NOT auto-create it; without it
  # ingestion fails with "Failed to upload JSON to S3"). langfuse-worker waits for this. Same pinned
  # image (it ships curl); PUT of an existing bucket answers 200, so a restart is a no-op. The
  # secret is referenced as `$$S3_SECRET_KEY` from the container's environment and fed to curl on
  # stdin — never interpolated into argv, where `docker inspect` and `ps` would show it.
  langfuse-rustfs-init:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    container_name: langfuse-rustfs-init
    profiles: [observability]
    depends_on:
      langfuse-rustfs:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: langfuse
      S3_SECRET_KEY: "${LANGFUSE_RUSTFS_SECRET_KEY:?set in stacks/observability.env}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        printf 'user = "%s:%s"\n' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" \
          | curl -fsS -K - --aws-sigv4 "aws:amz:us-east-1:s3" -o /dev/null -X PUT http://langfuse-rustfs:9000/langfuse
        echo 'langfuse bucket ready'
    networks:
      - backend-network
    logging: *obs-logging

  # ── OpenTelemetry backend (Tempo + Prometheus + Loki + Grafana, single container) ──────────
  otel-lgtm:
    image: grafana/otel-lgtm:0.37.0@sha256:57b5ab1ca6619beb180174e2fccce04762470750669d043f544b4726d0582d07
    container_name: otel-lgtm
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"   # Grafana UI
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    volumes:
      - otel-lgtm-data:/data
    networks:
      - backend-network
    logging: *obs-logging

  # NOTE (feature 020): HashiCorp Vault relocated to the `auth` stack
  # (infrastructure-as-code/docker/vault/compose.yaml, `vault` profile). Vault is a
  # secrets/identity concern, not observability.

  # ── Open Policy Agent — agent authorization decisions (token-exchange + UI-action, R16) ──────
  opa-service:
    image: openpolicyagent/opa:1.21.3@sha256:22a9db16423b94d2acbd4a94da3bebeb79583ed6a52ac15cad459d3de2dbbc4d
    container_name: opa-service
    profiles: [observability]
    restart: unless-stopped
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "--watch"
      - "/policies"
    volumes:
      - ../../opa/policies:/policies:ro
    ports:
      - "127.0.0.1:8181:8181"
    networks:
      - backend-network
    logging: *obs-logging

  # ── Unleash — agent feature flags / kill-switch (config-gated layer, R16) ───────────────────
  unleash-service:
    image: unleashorg/unleash-server:8.2.0@sha256:5020013b7a9a93c8ed3686d36b5025399714020b3fb5ef41afd84ba37a88c050
    container_name: unleash-service
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      unleash-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://unleash:${UNLEASH_PG_PASSWORD:?set in stacks/observability.env}@unleash-postgres:5432/unleash"
      DATABASE_SSL: "false"
      INIT_ADMIN_API_TOKENS: "${UNLEASH_ADMIN_TOKEN:?set in stacks/observability.env}"
      INIT_CLIENT_API_TOKENS: "${UNLEASH_CLIENT_TOKEN:?set in stacks/observability.env}"
    ports:
      - "127.0.0.1:4242:4242"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4242/health"]
      interval: 10s
      timeout: 5s
      retries: 15
    logging: *obs-logging

  unleash-postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: unleash-postgres
    profiles: [observability]
    restart: unless-stopped
    environment:
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: "${UNLEASH_PG_PASSWORD:?set in stacks/observability.env}"
      POSTGRES_DB: unleash
    volumes:
      # postgres 18 moved PGDATA to /var/lib/postgresql/18/docker → mount the PARENT. A mount at the pre-18
      # /data path makes the 18 entrypoint exit 1, even on an EMPTY volume (measured, spec 081 US8b).
      - unleash-pg-data:/var/lib/postgresql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash -d unleash"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *obs-logging

  unleash-seed:
    image: curlimages/curl:8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
    container_name: unleash-seed
    profiles: [observability]
    depends_on:
      unleash-service:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        for f in mcm.agent.kill-switch mcm.agent.frontier-escalation mcm.agent.degrade; do
          curl -s -X POST http://unleash-service:4242/api/admin/projects/default/features \
            -H "Authorization: ${UNLEASH_ADMIN_TOKEN:?set in stacks/observability.env}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$$f\",\"type\":\"kill-switch\"}" || true
        done
        echo "unleash flags seeded (default-off)"
    networks:
      - backend-network
    logging: *obs-logging

volumes:
  langfuse-pg-data:
    name: observability-langfuse-postgres-v18-data
  langfuse-clickhouse-data:
    name: observability-langfuse-clickhouse-data
  langfuse-clickhouse-logs:
    name: observability-langfuse-clickhouse-logs
  langfuse-rustfs-data:
    name: observability-langfuse-rustfs-data
  otel-lgtm-data:
    name: observability-otel-lgtm-data
  unleash-pg-data:
    name: observability-unleash-postgres-v18-data

networks:
  backend-network:
    external: true
