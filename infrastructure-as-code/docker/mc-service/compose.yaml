name: mc-service

services:
  mc-service-store-mongo:
    image: mongodb/mongodb-community-server:8.0.8-ubi9@sha256:784dd73b701c3fb846876394c8137a9b42c35791ed1c8a931d8efa2cb0c8dd81
    container_name: mc-service-store-mongo
    restart: unless-stopped
    # --replSet rs0: enables single-member replica set required for multi-document transactions.
    # --bind_ip_all: accepts connections from all network interfaces inside Docker.
    #
    # --wiredTigerCacheSizeGB 1 (item #468): WiredTiger's DEFAULT cache is max(0.5 * (RAM - 1 GB),
    # 256 MB) — on this 16 GB dev box that is ~7.9 GB, so mongod alone is entitled to half the
    # machine while ~20 other containers and a 20-thread `cargo test` share the rest. There is NO
    # SWAP. MEASURED 2026-09-16: during `cargo test --test movies_test` at default parallelism
    # mongod's RSS climbed 1.4 GB → 6.2 GB, free memory fell to 3.3 GB, and the container was
    # killed and restarted mid-run (RestartCount 5 → 6 at 09:09:28, then again earlier at
    # 09:03:46). Every symptom in item #468 is downstream of that ~45 s outage: `Connection
    # refused` for new connections, `unexpected end of file` / `Connection reset by peer` for
    # in-flight ones, and `Server selection timeout … Topology: Unknown` for the rest — which is
    # why a failing run takes 60-85 s (two 30 s server-selection timeouts) instead of 6 s.
    #
    # Note the symptom string is IDENTICAL to the nofile crash-loop the `ulimits` block below
    # fixed on 2026-07-27. Same symptom, different resource: that one was file descriptors (and
    # is still fixed — mongod holds 64000 and peaked at ~180 connections here), this one is
    # memory. "unexpected end of file" from this stack means THE CONTAINER DIED; the open
    # question is only which resource ran out.
    #
    # 1 GB is generous for the dev dataset (a personal collection, plus ~180 tiny `mc_test_*`
    # databases per integration run). Dev-only: compose.prod.yaml carries its own `command`.
    # Same reasoning as OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g in the opensearch stack.
    #
    # --setParameter wiredTigerFileHandleClose* (item #468): the cache pin alone was NOT enough,
    # and the reason is worth stating because it is counter-intuitive. MEASURED over 11 runs with
    # only the pin in place: mongod's heap still grew 1.42 GB → 3.63 GB (~0.29 GB/run) while the
    # WiredTiger cache sat at 0.31 GB of its 1.07 GB ceiling — so the growth was never the cache.
    # serverStatus() named it exactly:
    #
    #   wiredTiger["data-handle"]  active = 65844,  swept = 0
    #   catalogStats               collections = 2
    #
    # 65 844 open data handles for 2 live collections. The integration suite mints a database per
    # test (`common::test_db()` → `mc_test_<uuid>`) and drops it in `cleanup_db` — ~180 databases,
    # ~3 400 WiredTiger idents, per run. The DATABASES go away; their dhandles do not, because
    # MongoDB raises WiredTiger's sweeper thresholds to `closeIdleTime=600 s` / `closeMinimum=2000`
    # — sensible for a server whose namespace set is stable, wrong for a box that churns thousands
    # of namespaces a minute. Nothing was ever eligible for sweeping, so `swept` stayed at 0 and
    # the heap climbed until the box (16 GB, NO SWAP, ~20 containers) killed mongod.
    #
    # These two values restore WiredTiger's OWN defaults (30 s / 250), which is what a namespace-
    # churning workload wants. Startup-only — `setParameter` at runtime is refused.
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "1"
      - --setParameter
      - wiredTigerFileHandleCloseIdleTime=30
      - --setParameter
      - wiredTigerFileHandleCloseMinimum=250
    # MongoDB requires nofile >= 64000. The dev container's Docker-in-Docker daemon hands containers
    # a default soft limit of 1024, which mongod survives while idle and then exhausts under a real
    # integration-test run — the listener starts logging "Error accepting new connection ... Too many
    # open files", the replica set can no longer reach itself on localhost:27017, every test fails
    # with "index creation failed: I/O error: unexpected end of file", and the container crash-loops
    # (observed 2026-07-27 at 153 restarts). Setting it explicitly here makes the stack independent of
    # whatever default the host or nested daemon supplies.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    environment:
      - MONGODB_INITDB_DATABASE=mc_db
    volumes:
      - mc-service-store-mongo-data:/data/db
    # Expose to host so integration tests (cargo test) can connect at localhost:27017
    ports:
      - "27017:27017"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot service that initialises the replica set on first start.
  # Idempotent: if rs0 is already initiated it exits cleanly.
  # mc-service waits for this to complete before starting.
  mc-service-store-mongo-rs-init:
    image: mongodb/mongodb-community-server:8.0.8-ubi9@sha256:784dd73b701c3fb846876394c8137a9b42c35791ed1c8a931d8efa2cb0c8dd81
    container_name: mc-service-store-mongo-rs-init
    restart: "no"
    depends_on:
      mc-service-store-mongo:
        condition: service_healthy
    networks:
      - backend-network
    entrypoint: >
      mongosh --host mc-service-store-mongo:27017 --quiet --eval "
        try {
          const status = rs.status();
          print('Replica set already initiated, ok=' + status.ok);
        } catch(e) {
          print('Initiating replica set rs0...');
          rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]});
          print('Waiting for PRIMARY election...');
          let tries = 0;
          while (!db.adminCommand('ismaster').ismaster && tries < 30) {
            sleep(1000);
            tries++;
          }
          if (!db.adminCommand('ismaster').ismaster) {
            throw new Error('PRIMARY election timed out after 30s');
          }
          print('PRIMARY ready.');
        }
      "

  mc-service:
    image: mc-service:latest
    container_name: mc-service
    # Profile lives HERE (feature 039 Workstream B), not re-declared in stacks/mcm.compose.yaml, so the
    # stack parses on any conformant Compose (no include-override merge). Standalone consumers that want
    # mc-service (e.g. `nx deploy mc-service`) pass `--profile app`.
    profiles: [app]
    restart: unless-stopped
    environment:
      # directConnection=true: connect directly to the mongo store without chasing the rs member
      # announcement (which advertises localhost:27017 for host-side test compatibility).
      # Transactions still work: mc-service-store-mongo is always the single-member primary.
      - MC_DB_URL=mongodb://mc-service-store-mongo:27017/mc_db?replicaSet=rs0&directConnection=true
      - KEYCLOAK_URL=http://keycloak-service:8080
      - KEYCLOAK_REALM=grumpyrobot
      - KEYCLOAK_CLIENT_ID=movie-collection-manager
      - MC_SERVICE_PORT=3001
      - RUST_LOG=info
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      mc-service-store-mongo:
        condition: service_healthy
      mc-service-store-mongo-rs-init:
        condition: service_completed_successfully
    networks:
      - backend-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"

volumes:
  mc-service-store-mongo-data:
    external: true
    name: mc-service-store-mongo-data  # volume owned by this compose; declared external so the stack include: preserves the name

networks:
  backend-network:
    external: true
