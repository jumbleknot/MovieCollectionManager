name: opensearch

# Append-only agent-audit sink (feature 012, T076a / research R16).
# OPT-IN — gated behind `--profile audit`; nothing here starts on a normal `docker compose up`
# or under any other profile (app, keycloak, agents, observability).
#
#   docker compose --profile audit up -d
#
# First-time setup (run once):
#   docker volume create agent-audit-opensearch-v3-data
#   docker volume create agent-audit-opensearch-snapshots
#   (then CHOWN the snapshot volume to the node's uid — a fresh volume at /mnt/snapshots is
#    root-owned and OpenSearch does not run as root; see docs/runbooks/prod-control-tower.md)
#   (backend-network must already exist — created by the standard first-time setup)
#
# Credentials (dev-only, externalized — feature 021):
#   admin:         OPENSEARCH_INITIAL_ADMIN_PASSWORD in stacks/audit.env (full admin, setup / health checks)
#   agent-audit:   write-only account (index/bulk on BOTH `mcm-agent-audit` and `mcm-agent-audit-*`;
#                  NO read/search/delete) — the LIVE index is the exact name, no date suffix, so a
#                  check written against the wildcard alone matches nothing and passes vacuously —
#                  provisioned at runtime, not a compose env var.
#
# Heap is pinned to 1 GB (OPENSEARCH_JAVA_OPTS) — without this OpenSearch defaults to ~4 GB
# and risks OOM-ing the dev machine, which already runs a large multi-service stack.
#
# Port 9200 is loopback-bound (127.0.0.1) — not reachable from outside the host.

services:
  agent-audit-opensearch:
    image: opensearchproject/opensearch:3@sha256:bcc1797519726ceb6d651d4a3e60b7c30da91793914a8dfe75fd441d4f641509
    container_name: agent-audit-opensearch
    profiles: [audit]
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      # Snapshot repository root (feature 071 / item #439). A STATIC setting: OpenSearch will not
      # register a filesystem repository unless the node was STARTED with the path configured — which is
      # exactly why the snapshot deploy is separate from the upgrade deploy. Passed as a setting-named env
      # var in the same style as `discovery.type` above.
      - path.repo=/mnt/snapshots
      - bootstrap.memory_lock=true
      # Hard heap cap (R16): without this OpenSearch defaults to ~4 GB and risks OOM-ing the dev box.
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set in stacks/audit.env (run: node scripts/gen-dev-secrets.mjs)}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - agent-audit-opensearch-v3-data:/usr/share/opensearch/data
      # SEPARATE volume, deliberately: the upgrade replaces the DATA volume, and a repository living
      # inside it would be destroyed at the exact moment it is the only copy (FR-016).
      - agent-audit-opensearch-snapshots:/mnt/snapshots
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set in stacks/audit.env} https://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Feature 071 / item #439 — a NEW, EMPTY volume for OpenSearch 3. The 2.x volume
  # (`agent-audit-opensearch-data`) is deliberately NOT reused and NOT deleted: it is the
  # rollback, and keeping it means two independent copies exist throughout the upgrade.
  # The history is carried across by snapshot/restore, not by sharing a directory —
  # upstream does not support opening a 2.x data directory with a 3.x node.
  agent-audit-opensearch-v3-data:
    external: true
    name: agent-audit-opensearch-v3-data
  # Created by hand on the host BEFORE the deploy (external volumes are never auto-created), and
  # chowned to the node's uid — a fresh volume mounted at a path the image does not contain is
  # root-owned, and OpenSearch does not run as root. See docs/runbooks/prod-control-tower.md.
  agent-audit-opensearch-snapshots:
    external: true
    name: agent-audit-opensearch-snapshots

networks:
  backend-network:
    external: true
