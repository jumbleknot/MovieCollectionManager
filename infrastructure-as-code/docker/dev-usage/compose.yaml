# Feature 105 — the Claude Code usage store, LOCAL / INTEGRATION form (the production stack is
# compose.prod.yaml beside this file). Brought up only by `pnpm nx dev-usage-integration
# infrastructure-as-code` (tests/run-integration.mjs), which mints every secret below per run and
# removes everything with `down -v` afterwards. Nothing here is persistent.
#
# It runs the same services and the same pinned images as production — Postgres, the run-once
# schema-init and JWKS-init containers, PostgREST — plus its OWN throwaway Keycloak importing the
# committed ci-realm.json, so the test proves a token for client `dev-usage-capture` from that realm
# file is accepted. A separate Keycloak rather than the auth stack's: the auth stack uses fixed,
# external volume and container names, which a local run on a shared Docker daemon would collide with.
#
# The schema and the realm reach the containers through two project volumes the runner SEEDS with
# `docker cp` (`schema`, `realm`), not bind mounts: in the Docker Sandbox a worktree path arrives
# empty inside a container. Production bind-mounts the same files from the Komodo checkout.
name: dev-usage-it

services:
  dev-usage-keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${DEV_USAGE_IT_KC_ADMIN_PASSWORD:?minted by tests/run-integration.mjs}"
      KC_HEALTH_ENABLED: "true"
      # The realm's other service-account client, used as the "token for a different client" case.
      AGENT_GATEWAY_CLIENT_SECRET: "${DEV_USAGE_IT_OTHER_CLIENT_SECRET:?minted by tests/run-integration.mjs}"
    volumes:
      - realm:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1::8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60

  dev-usage-postgres:
    image: postgres:18.6-alpine3.23@sha256:f1031bf693d8d60b0a0380c51a3510607c7a93c7c1d18bf7af94a3a8dbeb40b8
    environment:
      POSTGRES_USER: dev_usage
      POSTGRES_DB: dev_usage
      POSTGRES_PASSWORD: "${DEV_USAGE_PG_PASSWORD:?minted by tests/run-integration.mjs}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_usage -d dev_usage"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies every schema file in name order (each is idempotent, research R19), then tells PostgREST
  # to reload its schema cache. The same command runs on every production deploy.
  dev-usage-schema-init:
    image: postgres:18.6-alpine3.23@sha256:f1031bf693d8d60b0a0380c51a3510607c7a93c7c1d18bf7af94a3a8dbeb40b8
    depends_on:
      dev-usage-postgres: { condition: service_healthy }
    environment:
      PGHOST: dev-usage-postgres
      PGUSER: dev_usage
      PGDATABASE: dev_usage
      PGPASSWORD: "${DEV_USAGE_PG_PASSWORD:?minted by tests/run-integration.mjs}"
      AUTHENTICATOR_PASSWORD: "${DEV_USAGE_AUTHENTICATOR_PASSWORD:?minted by tests/run-integration.mjs}"
      READER_PASSWORD: "${DEV_USAGE_READER_PASSWORD:?minted by tests/run-integration.mjs}"
    volumes:
      - schema:/schema:ro
    entrypoint: ["sh", "-ec"]
    command:
      - |
        for f in /schema/*.sql; do
          echo "applying $${f##*/}"
          psql -v ON_ERROR_STOP=1 -q -v authenticator_password="$$AUTHENTICATOR_PASSWORD" -v reader_password="$$READER_PASSWORD" -f "$$f"
        done
        psql -v ON_ERROR_STOP=1 -q -c "NOTIFY pgrst, 'reload schema'"
    restart: "no"

  # PostgREST cannot fetch signing keys from a URL, so this fetches the realm's JWKS into a volume
  # before PostgREST starts (research R18). Retries: in production Keycloak lives in another stack.
  dev-usage-jwks-init:
    image: postgres:18.6-alpine3.23@sha256:f1031bf693d8d60b0a0380c51a3510607c7a93c7c1d18bf7af94a3a8dbeb40b8
    depends_on:
      dev-usage-keycloak: { condition: service_healthy }
    environment:
      JWKS_URL: http://dev-usage-keycloak:8080/realms/grumpyrobot/protocol/openid-connect/certs
    volumes:
      - jwks:/jwks
    entrypoint: ["sh", "-ec"]
    command:
      - |
        for i in $$(seq 1 60); do
          if wget -qO /jwks/jwks.json.tmp "$$JWKS_URL" && grep -q '"keys"' /jwks/jwks.json.tmp; then
            mv /jwks/jwks.json.tmp /jwks/jwks.json && echo "jwks fetched" && exit 0
          fi
          sleep 5
        done
        echo "jwks fetch failed" >&2
        exit 1
    restart: "no"

  dev-usage-postgrest:
    image: postgrest/postgrest:v16.5@sha256:1347d7552b88f17832912c06afbf7c43209af6eeeb60834b04aae12c9bd9d5cc
    depends_on:
      dev-usage-schema-init: { condition: service_completed_successfully }
      dev-usage-jwks-init: { condition: service_completed_successfully }
    environment:
      PGRST_DB_URI: "postgres://authenticator:${DEV_USAGE_AUTHENTICATOR_PASSWORD:?minted by tests/run-integration.mjs}@dev-usage-postgres:5432/dev_usage"
      PGRST_DB_SCHEMAS: usage
      PGRST_JWT_SECRET: "@/jwks/jwks.json"
      PGRST_JWT_AUD: dev-usage
      PGRST_JWT_ROLE_CLAIM_KEY: "$$.role"       # PostgREST 16 JSONPath ($$ escapes compose interpolation)
      PGRST_ADMIN_SERVER_PORT: "3001"
      # An explicit address: `postgrest --ready` (the health check) refuses the default `!4` and `*`.
      PGRST_SERVER_HOST: "0.0.0.0"
    volumes:
      - jwks:/jwks:ro
    ports:
      - "127.0.0.1::3000"
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  realm:
  schema:
  jwks:
